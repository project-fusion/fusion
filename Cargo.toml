[workspace]
resolver = "2"
members = [
	"cortex/core",
	"cortex/trace",
	"cortex/engram",
	"fusion/cli",
	"helix/cli",
	"helix/theme",
]

# Shared dependency versions live here once (lockstep policy). Crates reference
# them with `dep.workspace = true` and layer per-crate feature sets on top.
[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
# **One dependency, not two.** `ratatui` re-exports the `crossterm` it was built
# against, so depending on both would be two versions to keep in step and a
# terminal backend that disagrees with the widgets drawing into it.
ratatui = "0.30"
# Component rules read TypeScript and CSS as text, the way the scripts they came
# from do. A parser would be the better tool and the wrong trade: the rules ask
# narrow questions about declarations, and a syntax tree is a dependency and a
# grammar to keep current for answers a pattern already gives.
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "json", "macros", "runtime-tokio", "uuid"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4", "v7"] }

# Internal crates. Path deps are relative: same-domain is `../<role>`.
fusion-cortex-core = { path = "cortex/core" }
fusion-cortex-engram = { path = "cortex/engram" }
fusion-cortex-trace = { path = "cortex/trace" }
fusion-helix-theme = { path = "helix/theme" }

# **No `version` here, and its absence is the point.**
#
# Everything else in this table is a fact about the workspace: the edition, the
# license, the toolchain floor. A version is a fact about a *domain*, and this
# workspace is about to hold two. `version = "0.0.0-dev"` inherited by every
# crate was the Cortex version only because every crate was Cortex, and the day
# `fusion-helix-theme` lands with `version.workspace = true` the two domains are back
# in full lockstep with nothing saying so: `release.yml` matrices over `helix`
# and `cortex` and computes each from its own tags, so they would compute two
# numbers and stamp them into one shared field.
#
# So each crate carries its own, which is three identical lines today and is
# what makes them able to differ tomorrow. The value is the placeholder every
# manifest in this repository holds; the release stamps the real number seconds
# before packing and the tag is the record. `check:pkg:publishable` fails on a crate
# that inherits one, so this cannot quietly come back.
[workspace.package]
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.90"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = true
