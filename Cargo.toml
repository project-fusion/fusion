[workspace]
resolver = "2"
members = [
	"cortex/core",
	"cortex/trace",
	"cortex/engram",
]

# Shared dependency versions live here once (lockstep policy). Crates reference
# them with `dep.workspace = true` and layer per-crate feature sets on top.
[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "json", "macros", "runtime-tokio", "uuid"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4", "v7"] }

# Internal crates. Path deps are relative: same-domain is `../<role>`.
cortex-core = { path = "cortex/core" }
cortex-engram = { path = "cortex/engram" }
cortex-trace = { path = "cortex/trace" }

[workspace.package]
edition = "2021"
license = "UNLICENSED"
publish = false
rust-version = "1.90"
version = "0.0.0-dev"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = true
