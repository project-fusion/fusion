[workspace]
resolver = "2"
# **Built for `wasm32-unknown-unknown` and for nothing else.** A member is built
# for the host by every `cargo test`, and the example plugin generates bindings
# that only exist there.
exclude = [
	"fusion/plugins/example",
	"fusion/plugins/tool-example",
	"fusion/plugins/tracker-example",
]
members = [
	"cortex/cli",
	"cortex/core",
	"cortex/trace",
	"cortex/engram",
	"cortex/extract",
	"cortex/provider",
	"cortex/recall",
	"fusion/cli",
	"fusion/plugins/host",
	"fusion/plugins/rules",
	"fusion/plugins/sources",
	"fusion/plugins/tools",
	"fusion/plugins/tracker",
	"fusion/rules",
	"helix/cli",
	"helix/native",
	"helix/theme",
	"helix/visual",
]

# Shared dependency versions live here once (lockstep policy). Crates reference
# them with `dep.workspace = true` and layer per-crate feature sets on top.
[workspace.dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
# **Typed extraction's validator.** No default features: they resolve a `$ref`
# over HTTP and from files, and an extraction schema is one document that names
# nothing outside itself.
jsonschema = { version = "0.60", default-features = false }
# **One dependency, not two.** `ratatui` re-exports the `crossterm` it was built
# against, so depending on both would be two versions to keep in step and a
# terminal backend that disagrees with the widgets drawing into it.
ratatui = "0.30"
# Component rules read TypeScript and CSS as text, the way the scripts they came
# from do. A parser would be the better tool and the wrong trade: the rules ask
# narrow questions about declarations, and a syntax tree is a dependency and a
# grammar to keep current for answers a pattern already gives.
regex = "1"
# Typed extraction derives the schema it asks a model for from the Rust type the
# reply becomes, so the two cannot disagree.
schemars = "1"
# The plugin host's address guard resolves through it, and so does the `http`
# transport under Cortex's model clients. No default features: `charset`
# decodes bodies these APIs only ever send as UTF-8, and `rustls` is named so
# the TLS backend is a choice written down here.
reqwest = { version = "0.13", default-features = false, features = ["http2", "rustls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# **The Cortex stores' database layer.** `cortex/CONVENTIONS.md` commits to
# SQLite and Postgres behind one trait, and both take this. No database feature
# is chosen here, because the crate that picks one is the crate that has to
# justify it. No `macros` either: the stores write their queries at runtime,
# since the macros check each query against a live database or a prepared
# cache that every schema change must regenerate.
sqlx = { version = "0.9", default-features = false, features = ["chrono", "json", "runtime-tokio", "uuid"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["serde", "v4", "v7"] }
# **The runtime, with a compiler and the interpreter rather than a JIT backend.**
# `cranelift` translates a component once per run and `pulley` executes the
# result without generating native code, which is the trade a plugin wants: a
# rule runs for milliseconds, so compiling to native buys nothing a portable
# interpreter does not already give, and the artifact stays the same on every
# platform.
wasmtime = { version = "50", default-features = false, features = [
  "component-model",
  "cranelift",
  "pulley",
  "runtime",
  "std",
] }
# Encodes a core module into a component, which is what a plugin author's
# toolchain does for them. The plugin tests build each example the long way
# round so the path an author takes is the path that is measured.
#
# **At the wasm-tools release `wasmtime` is built on**, which is 0.261 for
# `wasmtime` 50, so the tests and the host compile one `wasmparser` and one
# `wasm-encoder`. A newer one here builds a second copy of each. It moves with
# `wasmtime`, and `.github/dependabot.yml` leaves it to that bump.
wit-component = "0.261"

# Internal crates. Path deps are relative: same-domain is `../<role>`.
fusion-cortex-core = { path = "cortex/core", default-features = false }
fusion-cortex-engram = { path = "cortex/engram", default-features = false }
fusion-cortex-extract = { path = "cortex/extract" }
fusion-cortex-provider = { path = "cortex/provider", default-features = false }
fusion-cortex-recall = { path = "cortex/recall" }
fusion-cortex-trace = { path = "cortex/trace", default-features = false }
fusion-helix-theme = { path = "helix/theme" }
# **Fusion Plugin Host: one loader, and a crate per world.** Both command
# lines take the rules world, and other products embed the rest. The loader
# crate's features are `loader` for the worlds and `net` for the address guard,
# and each member names the ones it takes.
fusion-plugin-host = { path = "fusion/plugins/host", default-features = false }
fusion-plugin-rules = { path = "fusion/plugins/rules" }
fusion-plugin-sources = { path = "fusion/plugins/sources" }
fusion-plugin-tools = { path = "fusion/plugins/tools" }
fusion-plugin-tracker = { path = "fusion/plugins/tracker" }
# **The one crate both command lines take, and it belongs to neither product.**
# It knows what a rule is and not what a component or a workspace is, which is
# what keeps the helix and fusion domains free of each other: see its `lib.rs`.
fusion-rules = { path = "fusion/rules" }

# **No `version` here, and its absence is the point.**
#
# Everything else in this table is a fact about the workspace: the edition, the
# license, the toolchain floor. A version is a fact about a *domain*, and this
# workspace is about to hold two. `version = "0.0.0-dev"` inherited by every
# crate was the Cortex version only because every crate was Cortex, and the day
# `fusion-helix-theme` lands with `version.workspace = true` the two domains are back
# in full lockstep with nothing saying so: `release.yml` matrices over `helix`
# and `cortex` and computes each from its own tags, so they would compute two
# numbers and stamp them into one shared field.
#
# So each crate carries its own, which is three identical lines today and is
# what makes them able to differ tomorrow. The value is the placeholder every
# manifest in this repository holds; the release stamps the real number seconds
# before packing and the tag is the record. `fusion x workspace`'s `publishable` fails on a crate
# that inherits one, so this cannot quietly come back.
[workspace.package]
edition = "2021"
license = "MIT"
publish = false
# **1.97, because the manifest generator's parser asks for it.** `oxc` 0.110
# was the last release building on 1.90, and the forty after it are where its
# fixes are; 0.150 needs 1.96 and 0.153 needs 1.97. Every crate here is
# `publish = false` and the CLI ships as a binary, so this floor is for whoever
# builds from a checkout. CI builds at the floor rather than at stable, so a
# crate reaching past it fails there first.
rust-version = "1.97"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

# **Dependencies optimized in a debug build, and the workspace left as it is.**
# The tests run wasmtime, oxc and regex compiled without optimization, and so
# does every debug `helix` the npm shim builds: the three plugin suites took 10
# to 12.5 seconds each on run 38063746510, one after the other, for what an
# optimized wasmtime does in under one. Measured on a laptop on 10 Oct 2026,
# `cargo test --workspace` took 24 seconds and takes 12, the host's plugin
# suite 17 and 0.4. A dependency compiles once into the cache, and an edit to a
# crate here recompiles that crate unoptimized, as it did.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = true
