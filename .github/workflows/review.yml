# An adversarial reader on every pull request.
#
# **Two passes, because one pass posts everything it thought of.** The first
# looks for problems; the second tries to refute each one and only survivors are
# posted. A reviewer that comments on everything is muted within a week, and on
# a repository with one maintainer a muted reviewer is worse than no reviewer,
# because it looks like coverage.
#
# **Sonnet, and the reason is what a review costs against what it returns.**
# Measured on 32, a sixteen file diff: Opus took 27 turns and seven minutes for
# $1.86 and returned four real defects, two of them in the rule that pull
# request was adding. The findings were worth having and the price was not
# repeatable across every push, which is what running on `synchronize` makes
# this. Sonnet reads the same two passes.
#
# **It runs on every push now, and reviews only what arrived.** It used to run
# once, at `opened`, on the argument that a finished diff is worth one careful
# read. Measured against six pull requests, three of them carried a second
# commit and the check went with the head it was attached to: the review was
# orphaned and those three read as green while having no review at all. Green
# for want of a reviewer is worse than red.
#
# **So the diff is the increment and the runs are capped.** The range starts at
# the head of the last run that actually reviewed something, so a push is read
# against what came before it rather than against the base, and `ROUNDS` is the
# ceiling on how many times one pull request may spend. Past it, the `review`
# label is the way to ask for one more, which is the same escape hatch the
# manual re-request already used.
#
# **Advisory, never required.** `continue-on-error`, and it must stay off the
# list of checks branch protection requires. A non-deterministic gate that can
# block a merge at two in the morning is a liability, and the deterministic
# gates already exist: `verify` runs twenty-odd `check:*` scripts.
#
# **Which is where its findings are supposed to end up.** This repository's
# invariants live in scripts, one per invariant, each with the incident that
# caused it written at the top. So the prompt below asks for a `check:*` script
# whenever a finding could have been caught by one. The proper output of an AI
# reviewer here is not a comment, it is the next check.
#
# Vercel Agent covers `fusion/site/**` and is configured in the Vercel dashboard rather
# than here, so the two do not both review the same diff. Nothing in this file
# turns it on or off.
#
# Forks are skipped rather than failed, and since the move to federated auth the
# reason is authentication rather than an absent secret. See the guard's own
# comment on the job: the federated subject carries nothing about who opened the
# pull request, so the `if:` is what scopes the workspace's budget to this
# repository's own branches. It is not dead weight left over from a key that no
# longer exists.
name: review

# **Not `synchronize`, because that reviewed every push.** Measured 30 Aug 2026:
# twenty-eight runs in a day at about seven and a half minutes of Opus each,
# where eight pull requests were opened. `ci-green` was reviewed six times and
# `visual-baselines` five, almost all of it re-reading a diff already reviewed
# after a one-line fix-up. The workspace limit ran out at 15:00 and every review
# after that failed at startup, which `continue-on-error` then hid.
#
# None of the findings worth having came from a re-review. They came from the
# first read of a finished diff, which is what this now does.
#
# `labeled` is how a diff that has genuinely changed gets read again: add
# `review` and it runs. Deliberate, and cheap next to a review nobody asked for.
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  adversarial:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && (github.event.action != 'labeled' || github.event.label.name == 'review')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # **A diff of only generated files has nothing to review.** Every one of
      # them is written by a generator this repository already holds to its
      # source with a `check:`, so a reviewer reading them is reading the
      # generator's output and arguing with a script that already passed.
      # Baselines are pictures and the manifests are megabytes; both cost a full
      # read and neither can carry a defect a human wrote.
      #
      # Fails open, which is the direction `verify`'s own scope step argues for:
      # a path nobody thought about is not on this list, so it counts as source
      # and the review runs.
      - id: scope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCED: ${{ github.event.action == 'labeled' }}
          NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          # How many times one pull request may spend before it has to ask.
          ROUNDS=4

          # Every earlier run of this workflow on this pull request, oldest
          # first, and the head each one read.
          # One line, because a `--jq` filter carrying newlines is passed to gh
          # with the YAML block's indentation inside it: the filter failed, gh
          # printed part of the response *and* exited non-zero, so the `|| echo`
          # appended a second document and `jq length` answered twice.
          filter="[.workflow_runs[] | select(.id != $RUN_ID) | select(any(.pull_requests[]?; .number == $NUMBER)) | {sha: .head_sha, at: .run_started_at}] | sort_by(.at)"
          previous=$(gh api "repos/$REPO/actions/workflows/review.yml/runs?event=pull_request&per_page=100" --jq "$filter" 2>/dev/null) || previous='[]'
          [ -n "$previous" ] || previous='[]'

          spent=$(jq 'length' <<<"$previous")
          if [ "$FORCED" != 'true' ] && [ "$spent" -ge "$ROUNDS" ]; then
            {
              echo "### Reviewed $spent times already"
              echo
              echo "\`ROUNDS\` is $ROUNDS. Add the \`review\` label to ask for another."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "source=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Read from the last head anything was read at, so a push is judged
          # against what came before it. Falling back to the merge base is what
          # makes the first run, and a forced one, read the whole pull request.
          since=$(jq -r 'last.sha // empty' <<<"$previous")
          base=$(git merge-base "${{ github.event.pull_request.base.sha }}" HEAD)
          if [ -z "$since" ] || [ "$FORCED" = 'true' ] || ! git cat-file -e "$since^{commit}" 2>/dev/null; then
            since=$base
          fi

          if [ "$since" = "$(git rev-parse HEAD)" ]; then
            echo "review: nothing new since the last read." >> "$GITHUB_STEP_SUMMARY"
            echo "source=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          source=$(git diff --name-only "$since" HEAD | grep -vE \
            '(\.generated\.[a-z]+$|custom-elements\.json$|/(jsx|vue|svelte)\.d\.ts$|\.png$|^fusion/docs/references/|helix/styles/src/tokens\.css$|helix/docs/content/metrics\.mdx$|questions\.json$|published\.json$)' \
            || true)
          if [ -z "$source" ]; then
            echo "review: the diff is generated files only, so there is nothing to read." >> "$GITHUB_STEP_SUMMARY"
            echo "source=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "source=true" >> "$GITHUB_OUTPUT"
          echo "since=$since" >> "$GITHUB_OUTPUT"
          {
            echo "### Reading $(git rev-list --count "$since"..HEAD) commit(s)"
            echo
            echo "Round $((spent + 1)) of $ROUNDS, ending at \`$(git rev-parse --short HEAD)\`."
          } >> "$GITHUB_STEP_SUMMARY"

      # **There is no API key, and the four identifiers below are not secrets.**
      # Workload identity federation exchanges the run's own GitHub OIDC token
      # for an Anthropic token that lives ten minutes, so the reviewer
      # authenticates without this repository storing a credential that could
      # leak or need rotating. `id-token: write` above is what permits the
      # exchange; the action fetches the token itself. This is the same
      # mechanism npm trusted publishing uses to publish, which leaves the
      # repository with no long-lived credential of any kind.
      #
      # **Which makes the fork guard on this job load-bearing for auth, not
      # just for cost.** Measured off a live run rather than assumed, the
      # subject is
      # `repo:project-fusion@50857512/fusion@1345601099:pull_request`: GitHub
      # issues the immutable form, embedding the owner and repository ids, and
      # three rules written against the documented `repo:owner/repo:` shape
      # were denied before anyone read the token. It carries nothing about who
      # opened the pull request. Without `head.repo.full_name == github.repository` above,
      # anyone who can open one against this repository could spend the
      # workspace's budget. The workspace carries a limit for the same reason,
      # `continue-on-error` meaning an overrun here fails invisibly.
      # **`classify_inline_comments` is what anchors them, not a call.** The
      # first attempt at this told the reviewer to post with `gh api`, and
      # `ALLOWED_TOOLS` is `Glob,Grep,LS,Read` and four git commands: there is
      # no `gh` and no shell, so the job failed on every pull request it ran on
      # and posted nothing at all. The action already does this, reading a
      # `file:line` out of the finding and anchoring it. What the prompt owes it
      # is the reference in a form it can find, which is all it asks for now.
      #
      # **The findings go on the lines they are about, not in one comment.**
      # A summary makes the reader carry a file and a line number back to the
      # diff for every finding, and the ones that get skipped are the ones that
      # read as prose rather than as a defect. Anchored, a finding is next to
      # the code and GitHub resolves it when the line changes, which a comment
      # cannot do: the reviews on 16, 17 and 19 each carried findings that were
      # still open days later with nothing marking them.
      #
      # **The sticky comment stays** and holds what has no line: progress while
      # the job runs, the count when it finishes, and the one line that says
      # nothing survived, which is the common case and wants somewhere to go
      # that is not five inline comments saying nothing is wrong.
      - if: steps.scope.outputs.source != 'false'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_federation_rule_id: fdrl_01QpMYFZydwuKsUrQ2YFZtjV
          anthropic_organization_id: d8035737-e5ec-42ee-903b-e24fe72de4d7
          anthropic_service_account_id: svac_01KZ8JktTjLUiuDVoF3Aq837
          anthropic_workspace_id: wrkspc_017UiVfcccArL54cKMJ4khbA
          github_token: ${{ secrets.GITHUB_TOKEN }}
          track_progress: true
          use_sticky_comment: true
          claude_args: --model claude-sonnet-5
          prompt: |
            Review `${{ steps.scope.outputs.since }}..HEAD` against the standards
            this repository has written down for itself. Read AGENTS.md and every
            file in .claude/rules/ first. Those are the standard. Your own taste
            is not.

            **That range is what arrived since this was last read, not the whole
            pull request.** On the first run it is the whole of it; after a push
            it is the push. Read the rest of the branch for context where you
            need it, and only report on what is in the range: a finding about a
            line an earlier round already saw is one the author has read and
            either fixed or decided about, and repeating it is the noise that
            gets a reviewer muted.

            Work in two passes.

            Pass one, find. The `check:*` scripts and the `helix component` and
            `fusion prose` rules already run on this diff, so repeating them is
            worth nothing. Look for what they cannot see, in this order:

            - **A defect.** Wrong result, throw, race, leak, or a path that
              claims to act and does nothing. Name the input or state that
              reaches it. A guard that makes a documented case unreachable is
              this, and so is behavior the diff changed with no test over it.
            - **A break for somebody downstream.** Packaging, exports,
              registration, hydration, an API a consumer already calls, a
              dependency on something unpublished. These fail on a machine that
              is not ours, which is why no local run catches them.
            - **The standard, refused.** ARIA and the accessibility tree, form
              participation, focus, keyboard, the DOM's own event semantics.
              A component library is judged here and browsers are the authority,
              so cite the spec or the engine behavior rather than a preference.
            - **Cost paid on every render.** Work in a hot path, a listener or
              observer never released, an await serializing what could overlap,
              bytes a consumer cannot shake. Say what it costs, measured or
              measurable.
            - **The platform's answer, hand-rolled.** Something the DOM, the
              language, or an imported dependency already does correctly, where
              the difference is a bug the platform does not have.
            - **Two spellings of one idea.** A raw value where a token exists, a
              token invented rather than used, a name against the family's
              vocabulary, a lifecycle hook its siblings do not use. Consistency
              is what lets a reader predict the next file.
            - **A fix at the consumer when the cause is deeper.** AGENTS.md:
              a patch at the consumer masks an architectural gap.
            - **Prose the diff made false.** Comments here carry measurements
              and incidents, so a stale one is a defect rather than untidiness.
              A claim stated where measuring was possible is the same fault
              caught earlier. A softened stage label is this too: Active ships
              with users, Building is real work with nothing shipped, Declared
              is direction with no work started.

            Pass two, refute. For each candidate, argue against yourself as hard
            as you can. Is it actually wrong, or merely different from how you
            would have written it? Would it really fail, and under exactly what
            input or state? Does a rule in AGENTS.md or .claude/rules/ genuinely
            say this, or are you paraphrasing something adjacent? Is it already
            caught by an existing `check:*` script? Drop everything that does not
            survive. Default to dropping.

            Then post, as one review with each finding on the line it is
            about. At most five, most serious first. You have `Read`, `Grep`,
            `Glob` and `LS` and nothing else: there is no `gh` and no shell to
            post with, so the finding as you write it is the review. Every one must give either
            the rule it breaks or the concrete way it fails: inputs, state, and
            what goes wrong. No summary of the pull request, no praise, no
            restating the diff.

            Give each one its file and its line, on their own line and in that
            form, `path/to/file.ts:123`, before the sentence that says what is
            wrong. That is what gets it onto the line: the action reads them and
            anchors what it can, and there is no call for you to make.

            A finding whose subject is a line the diff did not touch cannot be
            anchored, which the stale-prose ones often are. Name the file and
            line the same way and say what it is about; it lands in the review
            body, which is the right place for it.

            If a finding could have been caught deterministically, say so and
            propose the `check:*` script that would catch it, including the
            invariant in one sentence. That is worth more than the finding.

            Your own final message is not the review. Say how many findings you
            posted and stop: it lands in the sticky comment above the diff, and
            repeating there what is already on the lines is the summary this
            asks you to stop writing.

            If nothing survives pass two, post no review and reply with exactly
            one line saying so. Silence is the correct output most of the time
            and is not a failure to be useful.
