# An adversarial reader on every pull request.
#
# **Two passes, because one pass posts everything it thought of.** The first
# looks for problems; the second tries to refute each one and only survivors are
# posted. A reviewer that comments on everything is muted within a week, and on
# a repository with one maintainer a muted reviewer is worse than no reviewer,
# because it looks like coverage.
#
# **Advisory, never required.** `continue-on-error`, and it must stay off the
# list of checks branch protection requires. A non-deterministic gate that can
# block a merge at two in the morning is a liability, and the deterministic
# gates already exist: `verify` runs twenty-odd `check:*` scripts.
#
# **Which is where its findings are supposed to end up.** This repository's
# invariants live in scripts, one per invariant, each with the incident that
# caused it written at the top. So the prompt below asks for a `check:*` script
# whenever a finding could have been caught by one. The proper output of an AI
# reviewer here is not a comment, it is the next check.
#
# Vercel Agent covers `site/**` and is configured in the Vercel dashboard rather
# than here, so the two do not both review the same diff. Nothing in this file
# turns it on or off.
#
# Forks are skipped rather than failed: a `pull_request` run from a fork gets no
# secrets, so the action would error on a missing key and report as a broken
# review instead of an absent one.
name: review

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  adversarial:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # TEMPORARY, remove once the federation rule is confirmed. Prints the
      # claims this run actually presents so the rule is written against a
      # measured subject rather than a guessed one. The token itself is never
      # printed; these claims are public facts about the run.
      - name: Report the OIDC subject
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('https://api.anthropic.com')
            const claims = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString(),
            )
            for (const key of [
              'aud',
              'event_name',
              'ref',
              'repository',
              'repository_id',
              'repository_owner',
              'repository_owner_id',
              'sub',
            ]) {
              core.info(`${key} = ${claims[key]}`)
            }

      # **There is no API key, and the four identifiers below are not secrets.**
      # Workload identity federation exchanges the run's own GitHub OIDC token
      # for an Anthropic token that lives ten minutes, so the reviewer
      # authenticates without this repository storing a credential that could
      # leak or need rotating. `id-token: write` above is what permits the
      # exchange; the action fetches the token itself. This is the same
      # mechanism npm trusted publishing uses to publish, which leaves the
      # repository with no long-lived credential of any kind.
      #
      # **Which makes the fork guard on this job load-bearing for auth, not
      # just for cost.** The federation rule matches
      # `repo:project-fusion/fusion:pull_request`, the subject a pull request
      # run presents, and that subject says nothing about who opened the pull
      # request. Without `head.repo.full_name == github.repository` above,
      # anyone who can open one against this repository could spend the
      # workspace's budget. The workspace carries a limit for the same reason,
      # `continue-on-error` meaning an overrun here fails invisibly.
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_federation_rule_id: fdrl_01QpMYFZydwuKsUrQ2YFZtjV
          anthropic_organization_id: d8035737-e5ec-42ee-903b-e24fe72de4d7
          anthropic_service_account_id: svac_01KZ8JktTjLUiuDVoF3Aq837
          anthropic_workspace_id: wrkspc_017UiVfcccArL54cKMJ4khbA
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # TEMPORARY with the subject step above. The action hides the
          # SDK's output, so a failed token exchange and a failed API call
          # look identical from the log: one turn, zero cost, no model
          # usage. This prints what actually came back.
          show_full_output: true
          track_progress: true
          use_sticky_comment: true
          claude_args: --model claude-opus-5
          prompt: |
            Review this pull request against the standards this repository has
            written down for itself. Read CLAUDE.md and every file in
            .claude/rules/ first. Those are the standard. Your own taste is not.

            Work in two passes.

            Pass one, find. Look for problems, and weight your attention toward
            what a script cannot see, because twenty-odd `check:*` scripts
            already run on this diff and there is no value in you repeating
            them. In particular:

            - A fix applied at the consumer level when the cause is deeper.
              CLAUDE.md calls this out: a patch at the consumer masks an
              architectural gap, and the fix goes where the cause is.
            - A raw value where a semantic token exists, or a token invented
              rather than used.
            - A stage label softened. Active ships with users, Building is real
              work with nothing shipped, Declared is committed direction with no
              work started. These are honest by policy.
            - Prose that no longer matches the code it describes. This repo's
              comments carry measurements and incidents; a comment asserting
              something the diff just made false is a real defect here.
            - A claim stated rather than measured, where measuring was possible.
            - Anything that would only fail on a consumer's machine: packaging,
              exports, registration, a dependency on something unpublished.

            Pass two, refute. For each candidate, argue against yourself as hard
            as you can. Is it actually wrong, or merely different from how you
            would have written it? Would it really fail, and under exactly what
            input or state? Does a rule in CLAUDE.md or .claude/rules/ genuinely
            say this, or are you paraphrasing something adjacent? Is it already
            caught by an existing `check:*` script? Drop everything that does not
            survive. Default to dropping.

            Then post. At most five findings, most serious first. Every one must
            name a file and line, and give either the rule it breaks or the
            concrete way it fails: inputs, state, and what goes wrong. No
            summary of the pull request, no praise, no restating the diff.

            If a finding could have been caught deterministically, say so and
            propose the `check:*` script that would catch it, including the
            invariant in one sentence. That is worth more than the finding.

            If nothing survives pass two, reply with exactly one line saying so.
            Silence is the correct output most of the time and is not a failure
            to be useful.
