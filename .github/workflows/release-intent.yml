# What a merge of this pull request would release, read off its commit subjects.
#
# Fails on a subject that is not conventional, and checks the title as one
# because a squash merge makes it one. The incident that produced this check is
# in [RELEASING.md](../RELEASING.md).

name: release-intent

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NUMBER: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
    steps:
      - name: Read the bump off the commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: .github/scripts/report-intent.sh
