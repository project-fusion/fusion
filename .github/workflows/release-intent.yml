# What a merge of this pull request would release, read off its commits.
#
# **The bump comes from the subject line.** It used to be a label this workflow
# proposed and a reviewer could raise, on the argument that Conventional Commits
# would cost the history its sentences. The repository went the other way: the
# subjects are conventional now, so a second machine-readable channel is a
# second place for the same fact to be wrong, and the one that is not in the
# commit is the one that drifts.
#
# **So this proposes nothing and writes no labels.** It reads what the commits
# already say, reports the bump each domain would take, and fails when a subject
# is not conventional, which is what makes the convention a rule rather than a
# habit. A reviewer who wants a different bump changes the commit, which is the
# same edit they would have made to the label and leaves the reason in the
# history rather than beside it.
#
# **The scope names the domain, and only `helix` and `cortex` publish.** A scope
# of `helix/cli` releases Helix; `fusion/site` and `turbo` release nothing,
# being the site and the tooling. A subject with no scope releases nothing,
# which is the honest reading: a commit that does not say what it touches has
# not asked for a version.
#
# **`pull_request_target`, deliberately, and with no checkout**, unchanged from
# when this wrote labels: a fork's `pull_request` run gets a read-only token and
# could not report, and nothing here checks out or executes the pull request's
# code. It reads the commits from the API.
name: release-intent

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NUMBER: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
    steps:
      - name: Read the bump off the commits
        run: |
          set -euo pipefail

          subjects=$(gh api "repos/$REPO/pulls/$NUMBER/commits" --paginate \
            --jq '.[].commit.message | split("\n")[0]')

          # `type(scope)!: description`, anchored, because a subject that merely
          # contains one of these words is prose rather than a conventional one.
          pattern='^(feat|fix|perf|refactor|docs|test|ci|build|chore|style|revert)(\([a-z0-9/._-]+\))?!?: .+'

          bad=0
          while IFS= read -r subject; do
            [ -n "$subject" ] || continue
            grep -qE "$pattern" <<<"$subject" && continue
            echo "::error::Not a conventional subject: $subject"
            bad=1
          done <<<"$subjects"

          if [ "$bad" -ne 0 ]; then
            {
              echo "### Not every subject is conventional"
              echo
              echo 'Each one wants `<type>(<scope>): <description>`, where the scope'
              echo 'names the domain it touches. The bump is read from here, so a'
              echo 'subject that does not parse is a release nobody can predict.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # Piped rather than walked, because this job has no checkout and must
          # keep it that way: `pull_request_target` carries a writable token, so
          # the commits are read as data through the API and never executed.
          # `bump.mjs` comes from the base branch, fetched on its own.
          #
          # Through `gh api` and not `raw.githubusercontent.com`: this
          # repository is private, so the raw host answers an unauthenticated
          # request with 404 and `curl -f` exits 22. The contents endpoint takes
          # the job's token and returns the file base64 encoded.
          gh api "repos/$REPO/contents/fusion/scripts/bump.mjs?ref=${{ github.event.pull_request.base.sha }}" \
            --jq '.content' | base64 -d > /tmp/bump.mjs

          resolved=$(gh api "repos/$REPO/pulls/$NUMBER/commits" --paginate \
            --jq '.[].commit.message' \
            | while IFS= read -r line; do printf '%s\0' "$line"; done \
            | node /tmp/bump.mjs --stdin)

          {
            echo "### What merging this would release"
            echo
            if [ "$resolved" = '[]' ]; then
              echo 'Nothing. No subject carries a `helix` or `cortex` scope with a releasing type.'
            else
              jq -r '.[] | "- `\(.domain)`: **\(.level)**"' <<<"$resolved"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
