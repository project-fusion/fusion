# What a merge of this pull request would release, read off its commit subjects.
#
# Fails on a subject that is not conventional, and checks the title as one
# because a squash merge makes it one. The incident that produced this check is
# in [RELEASING.md](../RELEASING.md).

name: release-intent

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NUMBER: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
    steps:
      # **Only for the script below.** This job reads the commits through the
      # API rather than from a clone, and `bump.mjs` comes from the base branch
      # for the same reason: what merging does is decided by the base's copy,
      # not by whatever this branch changed it to. What a checkout gives is
      # `.github/scripts/`, and without one the step exits 127 on a file that
      # was inline until 2 Sep 2026.
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Read the bump off the commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: .github/scripts/report-intent.sh
