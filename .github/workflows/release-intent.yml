# What a merge of this pull request would release, read off its commit subjects.
#
# Fails on a subject that is not conventional, and checks the title as one
# because a squash merge makes it one. The incident that produced this check is
# in [RELEASING.md](../RELEASING.md).

name: release-intent

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NUMBER: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
    steps:
      # **The base, never the head, because this is `pull_request_target`.**
      # That event runs with a writable token, so checking out the pull
      # request's own code would run a contributor's script with it. What is
      # wanted here is only `.github/scripts/`, and the base's copy is the one
      # that decides what merging does anyway, exactly as `bump.mjs` is fetched
      # from the base inside that script.
      #
      # Without a checkout the step exits 127: it was inline until 2 Sep 2026,
      # and `pull_request_target` takes the workflow file from the base branch,
      # so a fix to it only takes effect once merged.
      - name: Check out the base
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Read the bump off the commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: .github/scripts/report-intent.sh
