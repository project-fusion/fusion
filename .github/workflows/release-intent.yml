# What a merge of this pull request would release, read off its commit subjects.
#
# Fails on a subject that is not conventional, and checks the title as one
# because a squash merge makes it one. The incident that produced this check is
# in [RELEASING.md](../RELEASING.md).
#
# **It also carries the one check that cannot live in `verify`**, and the reason
# is this workflow's event. GitHub reads the skip markers off the head commit
# for `push` and `pull_request` and not for `pull_request_target`, so a check
# hosted anywhere else is suppressed by the very message it exists to catch.
# That is not hypothetical: it happened on 2 Sep 2026 and looked like broken
# infrastructure for an hour.

name: release-intent

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

# **The pull request number, not `github.ref`.** Under `pull_request_target`
# the ref is the base branch, so every open pull request shared one group and
# a new event on any of them canceled another's run: the subject check then
# never reported for the one that lost.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  # Write, for the sticky comment. Safe under `pull_request_target` only because
  # the checkout below takes the base and never the head, so no contributor code
  # runs against this token.
  pull-requests: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NUMBER: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
    steps:
      # **The base, never the head, because this is `pull_request_target`.**
      # That event runs with a writable token, so checking out the pull
      # request's own code would run a contributor's script with it. What is
      # wanted here is only `.github/scripts/`, and the base's copy is the one
      # that decides what merging does anyway, exactly as `bump.mjs` is fetched
      # from the base inside that script.
      #
      # Without a checkout the step exits 127: it was inline until 2 Sep 2026,
      # and `pull_request_target` takes the workflow file from the base branch,
      # so a fix to it only takes effect once merged.
      - name: Check out the base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.base.sha }}

      # The runtime and nothing else: `report-intent.sh` runs `bump.mjs`, which
      # imports only what Node ships, so no install.
      - name: Set up bun
        uses: ./.github/actions/setup
        with:
          dependencies: false

      - name: Read the bump off the commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # The commit GitHub reads the skip markers off, which is what the
          # first check in the script looks at.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/report-intent.sh
