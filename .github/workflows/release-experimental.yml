# An installable build of a pull request, published for the people who own it.
#
# Label it `release:experimental` and, if the author is on the team, it
# publishes under `exp-<number>`. Why the author and not an approval, and why
# the label stays, are in [RELEASING.md](../RELEASING.md).

name: release-experimental

on:
  pull_request:
    types: [labeled, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  # Trusted publishing authenticates by OIDC, so no npm credential is stored.
  id-token: write
  pull-requests: write

# Held once. `engines.node` is the consumer floor; this is what CI runs on.
env:
  NODE_VERSION: "22.20.0"

jobs:
  # The version each domain would publish at, worked out once for the binaries,
  # which report it and are built before `publish` stamps the same numbers from
  # the same tags. `publish.mjs` checks the two agree.
  plan:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'release:experimental')
      && contains(fromJSON('["experimental", "on"]'), vars.PUBLISHING)
      && !github.event.pull_request.head.repo.fork
      && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
                  github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      cortex: ${{ steps.plan.outputs.cortex }}
      helix: ${{ steps.plan.outputs.helix }}
    env:
      NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch the tags, which carry the version
        run: git fetch --tags --force

      - name: Set up bun and the dependencies
        uses: ./.github/actions/setup

      # A domain under `held` in `fusion.json` is left out, so it gets no
      # binaries and no preview: [RELEASING.md](../RELEASING.md#a-held-domain).
      - name: Work out the versions
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          .github/scripts/stamp-experimental.sh
          echo "cortex=$(awk '$1 == "cortex" { print $2 }' /tmp/released)" >> "$GITHUB_OUTPUT"
          echo "helix=$(awk '$1 == "helix" { print $2 }' /tmp/released)" >> "$GITHUB_OUTPUT"

  helix-binaries:
    needs: plan
    if: needs.plan.outputs.helix != ''
    uses: ./.github/workflows/binaries.yml
    with:
      domain: helix
      version: ${{ needs.plan.outputs.helix }}

  cortex-binaries:
    needs: plan
    if: needs.plan.outputs.cortex != ''
    uses: ./.github/workflows/binaries.yml
    with:
      domain: cortex
      version: ${{ needs.plan.outputs.cortex }}

  # Written out, since the default skips a job whose dependency was skipped and
  # a binaries job is whenever nothing touches its domain.
  publish:
    needs: [plan, cortex-binaries, helix-binaries]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.plan.outputs.helix == '' || needs.helix-binaries.result == 'success') && (needs.plan.outputs.cortex == '' || needs.cortex-binaries.result == 'success') }}  # dialect:quoted, GitHub's function
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: experimental
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NUMBER: ${{ github.event.pull_request.number }}
    steps:
      # `fetch-depth: 0` and the tags, because the version is computed from
      # them. A shallow clone reports no tags and every release looks like the
      # first one.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch the tags, which carry the version
        run: git fetch --tags --force

      - name: Set up bun and the dependencies
        uses: ./.github/actions/setup

      # **Node is here for npm and for nothing else**, every script in this
      # workflow being invoked with `bun`. Trusted publishing needs npm 11.5.1+
      # on Node 22.14+, and npm is a Node program.
      # **Never add `registry-url`.** Given one, `setup-node` writes an `.npmrc`
      # carrying its own `NODE_AUTH_TOKEN`, which nothing sets, so npm reads
      # itself as configured, skips the OIDC exchange and publishes as nobody.
      # The registry refuses that write and reports it as a 404 naming the
      # package, so it does not look like an auth failure. `release.yml` carries
      # the same note on the same step.
      #
      # The default registry is already npmjs.org, so the line bought nothing
      # even when it worked.
      - name: Install Node, which npm runs on
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Node 22.20.0 ships npm 10.9.x, so the floor above is not what
      # `setup-node` leaves behind. Same pin as `release.yml`, same reasoning.
      - name: Install an npm that can do trusted publishing
        run: npm install -g npm@11.18.0

      - name: Stamp the experimental version into every domain this touches
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: .github/scripts/stamp-experimental.sh
      # Not `--frozen-lockfile`: the versions just changed, and `bun pm pack`
      # reads a sibling's version from `bun.lock` rather than from its manifest.
      # Packing without this pins every sibling at the previous release.
      - name: Install dependencies, lockfile free, so the stamped versions resolve
        run: bun install

      # **The single-thread Moonshine build is fetched here, so the build carries
      # no token.** `@fusion.dev/helix-speech`'s build downloads it where it is
      # missing, and a private repository's release asset needs one.
      - name: Fetch the single-thread Moonshine build
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release download "$(jq -r .release helix/speech/single-thread.json)"
          --dir helix/speech/vendor/single-thread --clobber

      - name: Build
        run: bun run build

      # **`analyze` is on the critical path of packing, and only since the
      # manifests stopped being tracked.** `files` names `custom-elements.json`
      # and the three framework typings, and `build` does not produce them:
      # turbo has `analyze` depending on `build`, not the other way round, so a
      # build alone leaves them absent and the tarball ships without files its
      # own manifest promises.
      - name: Write the manifests and framework typings
        run: bun run analyze

      - name: Fetch the Helix binaries
        if: needs.plan.outputs.helix != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: helix-cli-*
          path: ${{ runner.temp }}/binaries

      - name: Put each Helix binary in its platform package
        if: needs.plan.outputs.helix != ''
        run: .github/scripts/place-binaries.sh helix "$RUNNER_TEMP/binaries"

      - name: Fetch the Cortex binaries
        if: needs.plan.outputs.cortex != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cortex-cli-*
          path: ${{ runner.temp }}/binaries

      - name: Put each Cortex binary in its platform package
        if: needs.plan.outputs.cortex != ''
        run: .github/scripts/place-binaries.sh cortex "$RUNNER_TEMP/binaries"

      # Against the tarballs, from outside the workspace, before anything is
      # published. A version can be deprecated but never taken back.
      - name: Install a template out of the pack
        run: bun run smoke:template

      - name: Publish under the pull request's own tag
        run: |
          set -euo pipefail
          [ -s /tmp/released ] || exit 0
          while read -r domain version; do
            bun fusion/scripts/publish.mjs --domain "$domain" --tag "exp-$NUMBER"
          done < /tmp/released

      - name: Say how to install it
        run: .github/scripts/comment-install.sh
