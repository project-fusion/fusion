# The `helix` binary, built for every platform package.
#
# Called by `release.yml` and `release-experimental.yml` before they pack, with
# the version they are about to publish. Each binary lands as an artifact named
# for its platform package, the release puts it where that package's `files`
# says, and `publish.mjs` refuses a platform package without it:
# [RELEASING.md](../RELEASING.md#the-binary).
#
# **And on a pull request that could break one**, at the placeholder and
# uploading nothing. A platform that stops compiling would otherwise be found
# by the release, which then ships no Helix at all until somebody fixes it.

name: binaries

on:
  workflow_call:
    inputs:
      version:
        description: What the binary reports, which is the version being published.
        required: true
        type: string
  pull_request:
    paths:
      - .github/workflows/binaries.yml
      - Cargo.lock
      - Cargo.toml
      - helix/cli/**
      - helix/theme/**

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.platform }})
    strategy:
      # A platform with no binary is a release that installs a command running
      # nothing there, so the first failure is the answer.
      fail-fast: true
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-14
            target: aarch64-apple-darwin
            runs: true
          # Cross-compiled on Apple silicon, which builds it and cannot be
          # relied on to run it.
          - platform: darwin-x64
            runner: macos-14
            target: x86_64-apple-darwin
            runs: false
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            runs: true
          - platform: linux-x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            runs: true
          - platform: win32-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            runs: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      BINARY: target/${{ matrix.target }}/release/helix${{ startsWith(matrix.platform, 'win32') && '.exe' || '' }}
      # A pull request has no version to give it, so it stamps one the crate
      # does not carry. Stamping the placeholder the file already held passed
      # while writing nothing, and the first release found that on Windows.
      VERSION: ${{ inputs.version || '0.0.0-check' }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Statically linked, so one binary runs on a glibc distribution and on
      # Alpine alike, which is why the Linux packages declare no `libc`.
      - name: Install musl
        if: startsWith(matrix.platform, 'linux-')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 14 Sep 2026
        with:
          targets: ${{ matrix.target }}

      - name: Restore the Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      # The crate's own line, which is what `--version` prints and what
      # `publish.mjs` holds the binary to. `version.mjs` writes the same line on
      # the release's runner; this one has no workspace installed to run it, and
      # the first `version` at the start of a line is the package's.
      #
      # **A carriage return is allowed before the end of the line**, because a
      # Windows runner checks text out with CRLF: `$` sits before the `\n` and not
      # before the `\r`, so the pattern matched nothing there and the check below
      # refused the build, which was the release of 14 Sep 2026.
      - name: Stamp the version into the crate
        shell: bash
        run: |
          set -euo pipefail
          perl -0pi.bak -e 's/^version = "[^"]*"(\r?)$/version = "$ENV{VERSION}"$1/m' helix/cli/Cargo.toml
          rm helix/cli/Cargo.toml.bak
          grep -q "^version = \"$VERSION\"" helix/cli/Cargo.toml

      # Not `--locked`: `Cargo.lock` still names the crate at the placeholder.
      - name: Build
        run: cargo build --release -p fusion-helix-cli --target ${{ matrix.target }}

      - name: Prove it reports the version
        if: matrix.runs
        shell: bash
        run: |
          set -euo pipefail
          said=$("$BINARY" --version)
          [ "$said" = "helix $VERSION" ] || { echo "::error::$BINARY says '$said', not 'helix $VERSION'"; exit 1; }

      - name: Upload
        if: inputs.version != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: helix-cli-${{ matrix.platform }}
          path: ${{ env.BINARY }}
