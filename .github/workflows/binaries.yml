# The `helix` binary, built for every platform package.
#
# Called by `release.yml` and `release-experimental.yml` before they pack, with
# the version they are about to publish. Each binary lands as an artifact named
# for its platform package, the release puts it where that package's `files`
# says, and `publish.mjs` refuses a platform package without it:
# [RELEASING.md](../RELEASING.md#the-binary).
#
# **And on a pull request that could break one**, at the placeholder and
# uploading nothing. A platform that stops compiling would otherwise be found
# by the release, which then ships no Helix at all until somebody fixes it.
#
# **One build serves many releases.** The binary reads its version from the
# package installed beside it rather than compiling one in, so the cache below
# is keyed on the Rust alone and a release that changes none downloads what an
# earlier run built. `fusion/rules/src/version.rs` carries the reasoning.

name: binaries

on:
  workflow_call:
    inputs:
      version:
        description: The version being published, which each binary is proved to report once installed.
        required: true
        type: string
  pull_request:
    paths:
      - .github/workflows/binaries.yml
      - Cargo.lock
      - Cargo.toml
      # The two crates the binary is built from, beside its own.
      - fusion/rules/**
      - helix/cli/**
      - helix/theme/**

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.platform }})
    strategy:
      # A platform with no binary is a release that installs a command running
      # nothing there, so the first failure is the answer.
      fail-fast: true
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-14
            target: aarch64-apple-darwin
            runs: true
          # Cross-compiled on Apple silicon, which builds it and cannot be
          # relied on to run it.
          - platform: darwin-x64
            runner: macos-14
            target: x86_64-apple-darwin
            runs: false
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            runs: true
          - platform: linux-x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            runs: true
          - platform: win32-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            runs: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      BINARY: target/${{ matrix.target }}/release/helix${{ startsWith(matrix.platform, 'win32') && '.exe' || '' }}
      # What the proof below holds the binary to. A pull request has no release
      # to be about, and the placeholder is deliberately not the `0.0.0-dev` the
      # crate compiles at: the check is that the binary read the manifest beside
      # it, so a value it could have printed from memory proves nothing.
      VERSION: ${{ inputs.version || '0.0.0-check' }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # **The binary these sources already built**, and everything that would
      # build it skipped. Keyed on what the binary is compiled from and on this
      # file, which holds the toolchain, the target and the flags.
      #
      # **The version is not in the key, and that is the point.** It used to be,
      # because it was compiled in, so a release was always at a new number and
      # always missed: five platforms rebuilt for every release, two of them
      # macOS at about ten times the Linux rate, on the releases that change no
      # Rust at all. The binary reads it at run time now, from the package
      # installed beside it, so the same file serves every number and a release
      # reuses what an earlier one built. `fusion/rules/src/version.rs` carries
      # the reasoning.
      #
      # **Narrower than this workflow's `pull_request` filter, on purpose.**
      # That filter says what could break a build and this says what changes
      # one. `helix/cli/**` covered the npm manifests, which the release stamps
      # on every publish, and `helix/theme/**` covers that package's TypeScript,
      # which the crate does not read: hashing either meant a key that moved
      # when the binary did not. The crate's sources are `helix/theme/rust`.
      - name: Restore a binary built from these sources
        id: built
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: >-
            helix-cli-${{ matrix.target }}-${{ hashFiles(
            '.github/workflows/binaries.yml', 'Cargo.lock', 'Cargo.toml',
            'fusion/rules/Cargo.toml', 'fusion/rules/src/**',
            'helix/cli/Cargo.toml', 'helix/cli/src/**',
            'helix/theme/Cargo.toml', 'helix/theme/rust/**') }}
          path: ${{ env.BINARY }}

      # Statically linked, so one binary runs on a glibc distribution and on
      # Alpine alike, which is why the Linux packages declare no `libc`.
      - name: Install musl
        if: startsWith(matrix.platform, 'linux-') && steps.built.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust
        if: steps.built.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 14 Sep 2026
        with:
          targets: ${{ matrix.target }}

      - name: Restore the Cargo cache
        if: steps.built.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      # **`--locked` now, because nothing rewrites a manifest before this.** The
      # version was stamped into `helix/cli/Cargo.toml` here, which is what left
      # `Cargo.lock` naming a version the tree no longer had.
      - name: Build
        if: steps.built.outputs.cache-hit != 'true'
        run: cargo build --release --locked -p fusion-helix-cli --target ${{ matrix.target }}

      # **The version a consumer would see, which is the binary with its package
      # beside it.** That manifest is what the binary reads, so the check has to
      # put one there: asking the bare file proves only what it was compiled at,
      # which is the placeholder and the same answer for every release.
      # `publish.mjs` asks the same question of the real platform package, whose
      # manifest the release has stamped, before anything publishes.
      #
      # A restored binary as well as a built one, so a key that matched the
      # wrong binary is caught here rather than by `publish.mjs`.
      - name: Prove it reports the version it ships as
        if: matrix.runs
        shell: bash
        run: |
          set -euo pipefail
          # In the workspace rather than `mktemp -d`, which wants a template on
          # a BSD userland, and rather than `RUNNER_TEMP`, which is a Windows
          # path on that runner and not one this shell can join onto.
          installed=.proof
          rm -rf "$installed"
          mkdir -p "$installed"
          name=$(basename "$BINARY")
          cp "$BINARY" "$installed/$name"
          printf '{ "name": "@fusion.dev/helix-cli-%s", "version": "%s" }\n' \
            "$PLATFORM" "$VERSION" >"$installed/package.json"
          said=$("./$installed/$name" --version)
          [ "$said" = "helix $VERSION" ] || { echo "::error::$BINARY says '$said', not 'helix $VERSION'"; exit 1; }
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Upload
        if: inputs.version != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: helix-cli-${{ matrix.platform }}
          path: ${{ env.BINARY }}
