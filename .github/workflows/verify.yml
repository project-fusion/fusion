# `verify` split across jobs, with the list of checks derived from `verify`.
#
# **This file argued against a matrix until 25 Aug 2026, and the objection was
# right about the thing it was protecting.** It said: "Not a matrix of steps
# mirroring what `verify` already does: that is a second definition of correct
# to keep in step with the first, and the two drift the first time someone adds
# a check to one of them." That is exactly the fault `.claude/rules/helix.md`
# records elsewhere, a rule and its enforcement in different files with nothing
# holding them together.
#
# What changed is not the argument but the mechanism. `run-checks.mjs` reads the
# `verify` script and shards it, so the list is not mirrored here: adding a
# check to `verify` puts it in CI with no second edit, and a step that is
# neither a check nor one of the dedicated jobs below fails the run rather than
# being skipped. The drift the comment feared is now impossible rather than
# merely discouraged.
#
# **The reason worth the change is not speed.** `verify` is `a && b && c`, so it
# reports one failure and stops. Four CI runs went to finding four stale
# artifacts on 25 Aug 2026, one per run, because each fix revealed the next. A
# shard runs every check it owns and reports all of them together.
#
# `verify` still never writes: `biome ci` rather than `biome check --write`, and
# every shard ends by asserting the tree is unchanged.
name: verify

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first. A run against a commit
# nobody will merge is compute spent to learn nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# **Turborepo's remote cache, and it is what makes the split affordable.** Every
# task here declares `dependsOn: ^build`, so each job would otherwise rebuild
# the workspace from cold: `bun run build` alone measured 76 seconds. Shared,
# the build becomes a restore and the shards stop paying for it once each.
#
# Absent the token turbo falls back to its local cache and everything still
# runs, so this is inert until the secret exists rather than broken without it.
# **Both the slug and the id, because they are different variables.**
# `TURBO_TEAM` takes the team's slug and `TURBO_TEAMID` takes its `team_`
# identifier, and only the first was set. The runner reported "Insufficient
# permissions to write to remote cache" with 19 misses and no hits, which reads
# like a token problem and was not one: the token was scoped to the team and
# Remote Cache was enabled for it. What settled it was the local link file,
# which holds `{"teamId":"team_..."}` and no slug at all, and works.
env:
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TEAMID: ${{ vars.TURBO_TEAMID }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  # The shard count lives in one place and the matrix is built from it, so a
  # matrix of six against `--of 8` cannot silently drop a third of the checks.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      browser: ${{ steps.scope.outputs.browser }}
      of: ${{ steps.shards.outputs.of }}
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      # Full history, because `scope` below diffs against the base and a
      # depth-1 checkout has nothing to diff against. Same reason `browser`
      # already takes it for `parity`.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # **The count comes from the sharder, because it is a fact about the
      # list.** It was written here and defaulted separately in
      # `run-checks.mjs`, and the two disagreed: a matrix of ten shards each
      # dividing the checks into a different number leaves the tail running
      # nothing, and every check they would have owned is skipped by a run
      # reporting ten green jobs. Read from `--count` and passed to `checks` as
      # an output, there is one number and nothing to keep in step.
      - id: shards
        run: |
          set -euo pipefail
          of=$(node fusion/scripts/run-checks.mjs --count)
          echo "of=$of" >> "$GITHUB_OUTPUT"
          echo "shards=$(node fusion/scripts/run-checks.mjs --list --of "$of")" >> "$GITHUB_OUTPUT"

      # **Which jobs this diff can possibly fail.** The browser matrix is six
      # jobs that each want a build, a browser and three minutes, and a change
      # to a `docs/` page cannot move a pixel in any of them.
      #
      # **An allowlist of what is skippable, not a denylist of what is not.**
      # The set below is the paths that reach no component and no page:
      # `docs/` is the repository's own writing, `cortex/` is Rust and MDX with
      # nothing rendered, and `.claude/` is tooling for the agent. Everything
      # else runs the browser jobs, `tooling/` included, because
      # `build-frame.mjs` and `build-styles.mjs` live there and both are read by
      # every example. A path nobody thought about lands outside the list and
      # runs, which is the direction this has to fail in.
      #
      # **An unresolvable base assumes everything**, which is the default
      # `check:visual-parity` already takes for the same question. A force push
      # leaves `github.event.before` naming a commit this checkout does not
      # have, and a first push to a branch names all zeroes.
      #
      # **Counted rather than tested with `grep -qv`, because that answer is not
      # portable.** The obvious spelling is one `grep -qvE` asking whether any
      # changed file falls outside the list. GNU grep, which is what a runner
      # has, answers correctly. `ugrep`, which is a drop-in replacement common
      # enough to be on a contributor's `PATH`, exits 1 on the same input where
      # it exits 0 without `-q`, so the condition inverts and the browser jobs
      # are skipped for a change to `helix/styled`. Comparing two counts asks
      # nothing of `-v` and means the same thing to every grep. Found by running
      # the classifier on seven inputs before it was committed, which is the
      # only reason it is written this way.
      - id: scope
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo 'browser=true' >> "$GITHUB_OUTPUT"
            echo "Base ${BASE} is unresolvable, so every job runs." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" "$HEAD")
          total=$(printf '%s\n' "$changed" | grep -c . || true)
          skippable=$(printf '%s\n' "$changed" | grep -cE '^(docs/|cortex/|\.claude/)' || true)
          if [ "$total" -gt 0 ] && [ "$total" -eq "$skippable" ]; then
            echo 'browser=false' >> "$GITHUB_OUTPUT"
            echo "All $total changed files are outside the browser's reach, so those jobs are skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'browser=true' >> "$GITHUB_OUTPUT"
          fi

  # **One build, before the sixteen jobs that would each do their own.**
  #
  # Every check shard runs `build`, `analyze` and `catalog` as prerequisites and
  # every browser job runs `build`, so with a warm remote cache they all cost a
  # restore. The gap this job fills is that the cache is warm *across* runs and
  # cold *within* one: sixteen jobs start at the same second on a commit that
  # invalidates the build, none of them can restore what none of them has
  # written yet, and all sixteen pay for it.
  #
  # **Only `checks` and `browser` wait on it**, which is the whole of the trade.
  # `lint` reads files and builds nothing. `types` and `tests` do pay a cold
  # build, and at 1m19s and 2m14s they are inside the budget already, so gating
  # them would buy a faster job nobody is waiting on and cost every run the
  # stage. They run beside this one instead, which is also what keeps the added
  # stage from being wall clock spent idle.
  #
  # Measured across three runs on 26 Aug 2026. Run 32992956211 restored
  # everything and its slowest job was 2m56s; runs 32999811605 and 32963727401
  # each missed on three tasks and ran 3m17s to 3m42s, the difference being a
  # 52 second build paid ten times over. This job pays it once.
  #
  # **It costs a stage the wall clock did not have**, about 40 seconds on a run
  # that restores and 85 on one that does not. That is the trade: the ceiling
  # on any single job comes down, and the floor under every run goes up. It is
  # the right way round here because a job that overruns is the thing being
  # fixed, and because ten cold builds is ten times the compute for the same
  # wall clock, which is the case the `browser` comment below already makes.
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.43
      - uses: actions/setup-node@v7
        with:
          node-version: '22.20.0'
      - run: bun install --frozen-lockfile

      # The three `PREREQUISITES` in `run-checks.mjs`, in its order. They are
      # named here rather than derived because this job exists to fill a cache
      # and a wrong guess costs a restore, not a wrong answer: a task this
      # misses is one the shard builds itself, exactly as it does today.
      - run: bun run build
      - run: bun run analyze
      # `bunx`, because `turbo` is a workspace binary and a `run:` step does not
      # get the PATH `bun run` arranges: bare `turbo` here is exit 127, which is
      # the same fault `run-checks.mjs` carries a comment about after spawning
      # it eleven times without one. `bunx biome` below is the existing shape.
      #
      # And `turbo run catalog` rather than `bun run catalog`, which is not a
      # script: the rename moved every generator behind `turbo`, and this job
      # was written before it. It is the spelling `run-checks.mjs` already lists
      # as one of its three prerequisites.
      - run: bunx turbo run catalog

  # **Ten shards rather than six, because `warm` changed what a shard costs.**
  # A shard was 31 seconds of setup, a build it paid alone, and its share of the
  # checks; the build is a restore now, so the share is most of what is left and
  # splitting it is what moves the number. Measured 26 Aug 2026: the worst shard
  # was 3m42s at six.
  checks:
    needs: [plan, warm]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # **Never fail fast.** A shard that fails while five are canceled is the
      # serial chain again, one failure at a time, which is the whole thing this
      # split exists to stop.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7

      # Pinned to the version in `packageManager`. A lockfile pins every
      # dependency and nothing pinned the runtime resolving it.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.43

      # Pinned for the same reason bun is, and it is not decoration: `cem
      # analyze` is a Node CLI, so `bun run analyze` hands it to whatever Node
      # is on `PATH`, and its config is TypeScript. Below 22.18 that config
      # cannot load, the analyzer falls back to a default one and writes a
      # manifest with every Helix plugin missing, and says it succeeded.
      # Every shard runs `analyze`, so every shard needs this floor.
      - uses: actions/setup-node@v7
        with:
          node-version: '22.20.0'

      # `--frozen-lockfile` so a lockfile that does not match `package.json`
      # fails here rather than being quietly updated in CI and not on the
      # machine that pushed.
      - run: bun install --frozen-lockfile

      - run: node fusion/scripts/run-checks.mjs --shard ${{ matrix.shard }} --of ${{ needs.plan.outputs.of }}

      # `verify` is meant not to write, and `analyze` is the one step that can:
      # it regenerates the manifests. A tracked manifest that no longer matches
      # its source is a real fault and an invisible one, because everything
      # downstream reads the file rather than the code. This is what makes the
      # "never writes" rule checkable instead of stated.
      - name: The tree is unchanged by verifying it
        run: git diff --exit-code

  # **Its own job because it runs every other check.** In the shard pool it made
  # whichever shard drew it run the whole suite serially, so a six-way split had
  # a single shard doing all of it and finished no sooner than that shard did.
  #
  # Same prerequisites as a shard, for the same reason: the checks it runs read
  # what `build` and `analyze` write.
  floors:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.43

      - uses: actions/setup-node@v7
        with:
          node-version: '22.20.0'

      - run: bun install --frozen-lockfile

      - run: bun run build

      - run: bun run check:spec:floors

      - name: The tree is unchanged by verifying it
        run: git diff --exit-code

  # Its own job because it reads every file regardless of who owns it, so
  # sharding it would mean a pass over the same tree per shard.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.43
      - run: bun install --frozen-lockfile
      - run: bunx biome ci .

  types:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.43
      - uses: actions/setup-node@v7
        with:
          node-version: '22.20.0'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  # **One job for all three, because `bun run test` is partly Rust.**
  # `@fusion.dev/helix-theme`'s `test` script is `cargo test -p fusion-helix-theme`, so
  # `turbo run test` needs a toolchain: split out on its own it failed with
  # cargo's exit 101. Run beside `rs:check` and `rs:test` they share one cargo
  # cache and one compile, where two jobs would each pay for their own.
  #
  # Every one of them is invoked through `bun run`, so bun is needed even for
  # the cargo steps. Omitted once, and `rs:check` failed with `bun: command not
  # found` in ten seconds.
  #
  # No `wasm32` target and no `wasm-bindgen-cli`: 261 added them because
  # `helix/theme` compiled against a gitignored artifact, 273 tracked the
  # artifact and made it an input, and the install then cost 133 seconds a run
  # to build a binary nothing asks for. `clippy` because `rs:check` runs it;
  # `rustfmt` is not needed, since `cargo fmt` writes and `verify` does not
  # call it.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.43
      - uses: actions/setup-node@v7
        with:
          node-version: '22.20.0'
      - run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: bun run test
      # **`check:cli` is here rather than in the shard pool**, because it is the
      # only check that runs a binary: a shard has bun and node and no cargo, so
      # the npm shim would build one from cold on whichever of the six drew it,
      # while the other five paid for a toolchain they never used. Here the
      # cache is warm and `rs:build` is the same compile `rs:check` and
      # `rs:test` were going to do anyway.
      #
      # It reads source rather than `dist`, so it does not want the shard's
      # `build` prerequisite. The one thing `dist` buys is naming the exact
      # subpath in a barrel finding, and without it that advice degrades to
      # `dependency/<part>` in words rather than silently.
      - run: bun run rs:build
      - run: bun run check:cli
      # Beside `check:cli` because they are the same binary. A shard that runs
      # one compiles Rust to do it, and six doing that at once took the runner's
      # memory: exit 137 on one shard, SIGTERM on another, a third canceled
      # behind them. Here the cargo cache is warm and the binary already built.
      #
      # **The build is what `references` reads.** That rule asks whether a path a
      # comment names is on disk, and several of them name generated files:
      # `fusion/site/public/sandbox/frame.css` is written by the site build and
      # is gitignored. A shard had it because the shards build first; this job
      # did not, so moving the check here turned seven true references into
      # findings. Cached, so it is a restore rather than a build.
      - run: bun run build
      - run: bun run check:css:seeds
      - run: bun run check:prose
      - run: bun run fusion spec check
      - run: bun run rs:check
      - run: bun run rs:test

  # Six jobs, because they need a browser and `verify` deliberately does not:
  # everything in `verify` runs anywhere bun runs. These are the checks behind
  # `hasLayout()`, which happy-dom skips because it has no boxes, and they are
  # the ones worth most: a component can render perfect markup in the wrong
  # place and no DOM without layout will ever say so.
  #
  # **Split because they were 390 seconds in a row behind one build.** Measured
  # 25 Aug 2026: contrast 87, specs 80, build 78, smoke 75, playwright 26,
  # visual 15. Nothing here needs anything another one produces, so the only
  # thing the sequence bought was one build instead of four. In parallel the
  # wall clock is the build plus the slowest of them.
  #
  # **Which is the case for the remote cache rather than against the split.**
  # Four cold builds cost four times the compute for the same wall clock; four
  # restores cost almost nothing.
  #
  # **The cache has write access now, and that was not sufficient on its own.**
  # This paragraph used to end by saying the split traded compute for latency
  # until `TURBO_TOKEN` could write, which it can: run 32999811605 logged
  # `Remote caching enabled` and `17 cached, 20 total`. The three that missed
  # were correct misses, the commit having changed `helix/styled/src` and
  # `helix/headless/src`, and every job missed them together because they all
  # start at once. A cache nothing has written to yet is cold however warm the
  # credentials are, which is what `warm` above is for.
  #
  # The matrix is written out rather than derived, unlike `checks`: these six
  # are not in `verify` and there is no list to read. Adding a browser check
  # means adding it here, which is the drift `run-checks.mjs` exists to avoid
  # and is unavoidable for a set that lives nowhere else.
  #
  # **The count in this comment is part of that drift and had already slipped.**
  # It read "four" against a matrix of five when `parity` was added, `diagnostics`
  # having arrived without it. A number kept by hand beside a list is the thing
  # the paragraph above is warning about, so if it is wrong again, trust the
  # matrix.
  browser:
    # `plan` decides whether this matrix can fail at all for the diff in hand,
    # and `warm` means the build below is a restore. Skipped is neither a
    # failure nor a cancellation, so the `verify` gate at the bottom passes a
    # run where this never reported, which is the property that lets the
    # required check stay exactly as it is.
    needs: [plan, warm]
    # **`!= 'false'`, so the unknown case runs rather than skips.** `scope`
    # states the required direction: a path nobody thought about lands outside
    # the list and runs, which is the direction this has to fail in. `== 'true'`
    # is the opposite. Rename the step, rename the output, or take a path out of
    # that shell block that never writes `browser=`, and the expression reads
    # empty: `plan` succeeds, six browser jobs report skipped, the gate below
    # counts skipped as neither failure nor cancellation, and a pull request
    # touching `helix/styled/src` merges with contrast, specs, smoke, visual,
    # parity and diagnostics never having run. Nothing in the run says so.
    #
    # A failed or skipped `plan` still skips this through `needs`, and `plan`'s
    # own failure is what the gate catches, so the safe case is unchanged.
    if: needs.plan.outputs.browser != 'false'
    runs-on: ubuntu-latest
    # Forty-five because `parity` needs it and the others are billed for what
    # they use rather than for the ceiling. Measured 28 Aug 2026: the check
    # compares 610 examples in 701 seconds on an M-series Mac, and the 20 it
    # used to share left it about ten after checkout, install, build and
    # `playwright install`. It never once finished: three runs, three
    # `cancelled` conclusions, which report as neither pass nor fail and read  # dialect:quoted, GitHub spells this conclusion value so
    # in the summary as a job that simply did not object. That is the fault
    # `check:spec:floors` exists to catch, one level up, in the workflow rather than
    # in the script.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every ink, measured against the ground it is really painted on. The
          # stylesheets can only be read for the eleven rules that set an ink
          # and a ground together; the rest inherit theirs from a host, a part
          # above them or the page, and only a laid-out document knows. Both
          # color modes, because the half not on screen is the half that fails.
          - task: contrast
            run: bun run check:css:contrast
          # The token reference's hex column, against what the browser paints.
          # The column is arithmetic in Node, because that file is committed and
          # `verify` checks it in a job with no browser; this is the other half
          # of that trade and it belongs here, where one is already installed.
          - task: hexes
            run: bun run check:css:hexes
          # The specs themselves.
          - task: specs
            run: bun run specs:browser
          # Every example, rendered. `helix component`'s `examples` reads them and can tell
          # you an attribute no component declares; only running one can tell
          # you it throws on upgrade, names an element registered nowhere, or
          # lays out to nothing.
          - task: smoke
            run: bun run smoke:examples
          # Every example in both tiers, pixel for pixel against a committed
          # baseline. This is the one fault class the rest of `verify` cannot
          # reach: everything else reads source or asserts a fact somebody
          # thought to assert, and a chevron drawn at 233 pixels breaks nothing
          # anybody wrote down. Here rather than in `verify` because it wants a
          # browser and a baseline taken on this runner: the comparison never
          # crosses platforms, so on a contributor's Mac it says so and exits
          # clean.
          - task: visual
            run: bun run check:spec:visual
          # Every example rendered twice, from its HTML and from its TSX, and
          # the two compared. Both are authored now, neither derived from the
          # other, which is the right arrangement and costs exactly one thing:
          # nothing else notices them drifting. `helix component`'s `examples-paired` holds
          # the two files to each other; only a picture can hold the two
          # renders.
          #
          # Here rather than in `verify` for the reason `visual` is, and for one
          # more: it wants a `frame.js` newer than the components, which
          # `bun run build` produces above and a contributor's tree may not
          # have. Unlike `visual` it needs no baseline, so it does not care
          # which platform it runs on: it compares two renders taken seconds
          # apart in one browser.
          - task: parity
            # Scoped to what the push or the pull request actually changed, and
            # to whatever composes it. A change under `helix/styles`, `core`,
            # `icons`, `theme` or either `shared/` is read by every example, so
            # the script recognizes those and compares the whole corpus anyway.
            # The run says which families it skipped, in the same line as its
            # verdict: a subset that reports like a full pass is the failure
            # this whole check exists to prevent.
            run: >-
              bun run check:spec:visual-parity --changed
              "${{ github.event_name == 'pull_request'
              && github.event.pull_request.base.sha
              || github.event.before }}"
          # The collector in `@fusion.dev/helix-diagnostics`, against real components.
          # Here and not in `verify` because the DOM `verify` runs under drops a
          # `::part()` rule on the floor: happy-dom parses
          # `helix-button::part(button) { }` to zero rules, so every spec for the
          # part rules runs on hand-built objects, and the collector's central
          # assumption, that CSSOM hands back what it reads, is asserted nowhere
          # else.
          - task: diagnostics
            run: bun run check:spec:diagnostics
    steps:
      # **Full history, because `parity` scopes itself by diffing against the
      # base and a depth-1 checkout has nothing to diff against.** The script
      # treats an unresolvable range as "assume everything", which is the right
      # default and would also have made the scoping silently never happen: it
      # would have compared all 610 examples on every run while reporting that
      # it had scoped. The other tasks in this matrix do not read history and
      # are not harmed by having it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.43

      - uses: actions/setup-node@v7
        with:
          node-version: '22.20.0'

      - run: bun install --frozen-lockfile

      # The browser is a 130MB download that changes only when Playwright does,
      # so it is keyed on the lockfile. `--with-deps` still runs: the apt
      # packages are not in this cache, and a headless browser in CI fails on a
      # missing `libnss3` far more often than on anything to do with the tests.
      - uses: actions/cache@v6
        with:
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          path: ~/.cache/ms-playwright

      # No Rust: since 273 the wasm is tracked and `helix/theme`'s build is
      # `tsc` alone, so `turbo run build` never touches cargo here.
      - run: bun run build

      - run: bunx playwright install --with-deps chromium

      - name: ${{ matrix.task }}
        run: ${{ matrix.run }}

      # **The pictures, when it fails, because nothing else can show them.**
      # `check:spec:visual` marks the changed pixels into `preview.diff.png` beside
      # each baseline and those files die with the runner, so a reviewer got a
      # pixel count and no way to see what moved. `if-no-files-found: ignore`
      # because only the visual shard ever writes one.
      #
      # **Four globs, and it was one for longer than it was correct.** A diff
      # lands beside the baseline it belongs to, so the tier decides the package
      # and the width decides the name: `preview.diff.png` at 640 and
      # `preview.narrow.diff.png` at 390. Naming only the wide headless one
      # collected a quarter of what a failing run can write, and silently, since
      # `if-no-files-found: ignore` is exactly the setting that cannot say a
      # glob matched nothing.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: ignore
          name: visual-diffs-${{ matrix.task }}
          path: |
            helix/headless/src/*/.examples/preview.diff.png
            helix/headless/src/*/.examples/preview.narrow.diff.png
            helix/styled/src/*/.examples/preview.diff.png
            helix/styled/src/*/.examples/preview.narrow.diff.png
            helix/headless/src/*/.examples/*.parity.png
            helix/styled/src/*/.examples/*.parity.png

  # **One context to require, because the job names are not stable enough to
  # require directly.** A branch protection rule matches a job name, and this
  # workflow's are `checks (0)` through `checks (9)` and
  # `browser (smoke, bun run smoke:examples)`: the shard count is an argument and the
  # matrix label carries the command, so renaming a script or changing the count
  # silently un-requires whatever was named. Naming this one job instead means
  # the rule keeps holding, and a job added to `needs` is covered without anyone
  # touching the branch settings.
  #
  # It also makes `.github/CODEOWNERS` true rather than editing it. That file
  # says to require `verify` and `browser-specs`, which were the job names
  # before 274 sharded this workflow and are now neither of them; requiring
  # either would have blocked every pull request on a check that never reports.
  #
  # **`needs` alone is not enough.** A needed job that fails skips this one, and
  # a skipped required check is not a failing one, so the rule would pass on a
  # red run. `always()` makes it run regardless and the result expression is
  # what fails it.
  # **`skipped` is now two different things and this rule is right about both.**
  # A job skipped because `plan` scoped it out is a job that could not have
  # failed, and a job skipped because the thing it needed failed sits beside a
  # `failure` that this expression reads. So neither case needs a clause: the
  # first passes because nothing was wrong, the second fails on the upstream
  # result rather than on the skip.
  verify:
    if: always()
    needs: [plan, warm, checks, floors, lint, types, tests, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')  # dialect:quoted, GitHub's own job result spelled its way
        run: |
          echo "::error::A job in this workflow did not pass."
          exit 1
      - run: echo "Every job in this workflow passed."
