# `verify` split across jobs, with the list of checks derived from `verify`
# itself rather than mirrored here. The shape, why the browser matrix is
# skippable for some diffs, how its jobs are counted, and why there is no Node
# on the runner are in [VERIFYING.md](../VERIFYING.md).

name: verify

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first. A run against a commit
# nobody will merge is compute spent to learn nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# **The remote cache is what makes the split affordable.** Every task declares
# `dependsOn: ^build`, so each job would otherwise rebuild the workspace from
# cold. Absent the token turbo falls back to its local cache, so this is inert
# rather than broken.
#
# **Both the slug and the id are needed.** `TURBO_TEAM` takes the slug and
# `TURBO_TEAMID` the `team_` identifier. With only the slug set, the runner
# reports "Insufficient permissions to write to remote cache", which reads like a
# token problem and is not one.
env:
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TEAMID: ${{ vars.TURBO_TEAMID }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  # A push to `main` whose tree a pull request's run already verified runs
  # nothing again: [VERIFYING.md](../VERIFYING.md#a-tree-is-verified-once).
  # Every job below that starts the work waits on this one and skips on `true`.
  #
  # **It runs on a pull request too, where it has nothing to look up, and that
  # is not a spare ten seconds.** It was `if: github.event_name == 'push'`, and
  # a skipped job skips every job under it, through jobs that ran: the skip
  # reaches `types`, `tests`, `rust`, `packaging` and the browser matrix, all of
  # which wait on a `warm` that succeeded, and a plain `if:` does not stop it.
  # Only the four status functions do, which is why the jobs that carry
  # `!cancelled()` survived and the ones with a plain condition did not.  # dialect:quoted, GitHub's own function
  # Run 35039620254 passed the `verify` gate on a pull request having run
  # `lint` and three builds and nothing else, green, because a skipped job is
  # neither a failure nor a cancellation. `proven.sh` answers `false` to an
  # empty `TREE`, which is what a pull request has, so the cost of never
  # skipping it is the job's own ten seconds and the certainty that nothing
  # below it is skipped by accident.
  proven:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # **`contents` as well, because a job's block replaces the workflow's
    # rather than adding to it.** With `actions: read` alone the checkout below
    # gets no `contents` at all and dies with `remote: Repository not found`,
    # which reads like a deleted repository and is a token that cannot see one.
    # It was invisible while this job ran only on `main`.
    permissions:
      actions: read
      contents: read
    outputs:
      proven: ${{ steps.look.outputs.proven }}
      run: ${{ steps.look.outputs.run }}
    steps:
      - name: Check out the script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
      - name: Look for a pull request that verified this tree
        id: look
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TREE: ${{ github.event.head_commit.tree_id }}
        run: .github/scripts/proven.sh

  # When `proven` skipped the run, the caches this workflow reads still want
  # writing where every pull request can read them. A cache a pull request saves
  # is its own, so with `main` running nothing a new lockfile or a new
  # Playwright would be fetched afresh by every pull request after it. Each is
  # looked up first and fetched only when missing, so a hit costs the lookup.
  # Not in the gate's `needs`: it checks nothing, and a cache it could not write
  # is no reason to call a verified tree unverified.
  #
  # **The helix binary as well**, built with optimizations, and with it the
  # Cargo cache every job that builds one shares. A pull request that changes
  # the CLI then compiles its own crates and none of their dependencies.
  seed:
    needs: proven
    if: needs.proven.outputs.proven == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the Playwright version off the lockfile, and the runner image
        id: version
        run: |
          echo "version=$(grep -oE '"playwright-core@[^"]+"' bun.lock | head -1 | tr -d '"' | cut -d@ -f2)" >> "$GITHUB_OUTPUT"
          echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Key the dependencies as `.github/actions/setup` keys them
        id: key
        run: echo "key=$(.github/scripts/bun-cache-key.sh)" >> "$GITHUB_OUTPUT"
      - name: Look up the dependencies
        id: dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
          path: ~/.bun/install/cache
      - name: Look up the browser
        id: browser
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: playwright-${{ runner.os }}-${{ steps.version.outputs.version }}
          lookup-only: true
          path: ~/.cache/ms-playwright
      # The browser's system packages, keyed as `.github/actions/browser` keys
      # them. A new runner image is a new key, so this misses once for each image.
      - name: Look up the browser's system packages
        id: packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: playwright-deps-${{ steps.version.outputs.image }}-${{ steps.version.outputs.version }}
          lookup-only: true
          path: ~/.cache/playwright-deps
      # Saves the dependencies on its way out when they missed.
      - name: Set up bun and the dependencies
        if: steps.dependencies.outputs.cache-hit != 'true' || steps.browser.outputs.cache-hit != 'true' || steps.packages.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup
        with:
          # It reads the lockfile and builds nothing.
          helix: false
      # Saves the browser and its system packages on its way out, each when it
      # missed.
      - name: Install Chromium
        if: steps.browser.outputs.cache-hit != 'true' || steps.packages.outputs.cache-hit != 'true'
        uses: ./.github/actions/browser
      # A hit is one restore of the binary; a miss builds and saves it.
      - name: Put the helix binary on disk
        uses: ./.github/actions/helix

  # The shard counts live in one place each and the matrices are built from
  # them, so a matrix of six against `--of 8` cannot silently drop a third of
  # the checks.
  plan:
    needs: proven
    if: ${{ !cancelled() && needs.proven.outputs.proven != 'true' }}  # dialect:quoted, GitHub's function
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      browser: ${{ steps.scope.outputs.browser }}
      matrix: ${{ steps.browser.outputs.matrix }}
      of: ${{ steps.shards.outputs.of }}
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      # Full history, because `scope` below diffs against the base and a
      # depth-1 checkout has nothing to diff against. Without the blobs, which
      # a diff of names never reads and a partial clone fetches for the
      # checkout alone: the history was twelve seconds of every job that took
      # it.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      # **This job needs bun installed and the jobs below did not tell it so.**
      # It ran `node` until 2 Sep 2026, and a runner has node already; bun is
      # not on one. The step that reads the shard count died with
      # `bun: command not found` and took every job that needs `plan` with it.
      - name: Set up bun
        uses: ./.github/actions/setup
        with:
          dependencies: false

      # **The count comes from the sharder, because it is a fact about the
      # list.** It was written here and defaulted separately in
      # `run-checks.mjs`, and the two disagreed: a matrix of ten shards each
      # dividing the checks into a different number leaves the tail running
      # nothing, and every check they would have owned is skipped by a run
      # reporting ten green jobs. Read from `--count` and passed to `checks` as
      # an output, there is one number and nothing to keep in step.
      - name: Decide the shard count
        id: shards
        run: |
          set -euo pipefail
          of=$(bun fusion/scripts/run-checks.mjs --count)
          echo "of=$of" >> "$GITHUB_OUTPUT"
          echo "shards=$(bun fusion/scripts/run-checks.mjs --list --of "$of")" >> "$GITHUB_OUTPUT"

      # An allowlist of what is skippable, never a denylist of what is not, and
      # an unresolvable base runs everything:
      # [VERIFYING.md](../VERIFYING.md#which-jobs-a-diff-can-possibly-fail).
      - name: Decide what this push touched
        id: scope
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: .github/scripts/touched.sh

      # How many jobs each browser check takes, from how much of the corpus the
      # change reaches: [VERIFYING.md](../VERIFYING.md#how-many-browser-jobs).
      #
      # **The value goes out under a delimiter, not as `matrix=$matrix`.** The
      # one-line form is rejected outright for anything with a newline in it,
      # with `Unable to process file command 'output' successfully`, and the
      # script had put a second line on stdout. That is fixed where it belongs,
      # in the script, and the delimiter is the half of it that holds whatever
      # the script prints next: a matrix that grows past one line is then a
      # bigger value and not a dead run.
      - name: Plan the browser jobs
        id: browser
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          matrix=$(bun fusion/scripts/plan-browser.mjs --changed "$BASE" 2> "$RUNNER_TEMP/plan.log")
          cat "$RUNNER_TEMP/plan.log"
          { echo '```'; cat "$RUNNER_TEMP/plan.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          { echo 'matrix<<PLAN_MATRIX'; echo "$matrix"; echo PLAN_MATRIX; } >> "$GITHUB_OUTPUT"

      # The tree this run checks out, named where `proven` on `main` can find
      # it. On a pull request that is the merge into the base, which is the tree
      # a rebase of an up-to-date branch lands. Nothing is in the file; the
      # name is the record, and `proven` reads whether this run went on to pass.
      - name: Record the tree this run verifies
        if: github.event_name == 'pull_request'
        id: tree
        run: |
          set -euo pipefail
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "$tree" > "$RUNNER_TEMP/tree"
      - name: Upload the record
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-tree-${{ steps.tree.outputs.tree }}
          path: ${{ runner.temp }}/tree
          retention-days: 14

  # One build, before the jobs that would each do their own: the remote cache
  # is warm across runs and cold within one.
  # [VERIFYING.md](../VERIFYING.md#one-build-before-the-jobs-that-would-each-do-their-own)
  #
  # **The build every later job reads, which leaves out `next build`.** No job
  # after this one reads `.next`, and `next build` was about 55 seconds at the
  # end of this job that every later job waited for. `build-for-checks.sh` is
  # the same build in every job that restores it, so the hashes agree, and
  # `packaging` builds the site. A second turbo invocation once rebuilt
  # fourteen tasks here because `analyze` hashed the files the first had
  # generated; `analyze` no longer reads them, which `VERIFYING.md` explains.
  #
  # **The runner is a repository variable, `WARM_RUNNER`, and `ubuntu-latest`
  # without one.** On a change that rebuilds the components, `warm` is about
  # four minutes on two cores. Most of it is `analyze` formatting the framework
  # typings, which runs on one core, and `metrics` compressing the bundles it
  # has not measured before, which uses every core it gets. A larger x64 runner named in
  # the variable takes that time down with no change here. It has to be x64:
  # `RUNNER_ARCH` is in every turbo key, so an Arm runner's build is one no
  # other job here can restore.
  warm:
    needs: proven
    if: ${{ !cancelled() && needs.proven.outputs.proven != 'true' }}  # dialect:quoted, GitHub's function
    runs-on: ${{ vars.WARM_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up bun and the dependencies
        uses: ./.github/actions/setup
      # **The bundle sizes the last run measured.** `metrics` looks each bundle
      # up here before it compresses one, and `build-metrics.mjs` says why a
      # stored size cannot be stale. A turbo miss restores no outputs, so
      # without this cache a change to one family compressed every family
      # again. The key never matches exactly. The prefix finds the newest entry
      # that this branch or `main` saved.
      - name: Restore the measured bundle sizes
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: metrics-sizes-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          path: .local/metrics/sizes.json
          restore-keys: metrics-sizes-${{ runner.os }}-${{ runner.arch }}-
      # `bunx`, because `turbo` is a workspace binary and a `run:` step does not
      # get the PATH `bun run` arranges: bare `turbo` here is exit 127.
      #
      # The three `PREREQUISITES` in `run-checks.mjs`. The site's tasks,
      # `catalog` among them, come from the script, and `analyze` is named
      # here. A task this job misses costs a later job a build of its own and
      # changes no answer.
      - name: Build, and write the manifests and the catalog
        run: .github/scripts/build-for-checks.sh analyze
      # Saved from every branch. The file is about 40 KB, and the next push to
      # the same pull request is the run most likely to find its bundles in
      # it. It holds the sizes of one page, so it does not grow.
      - name: Look for the measured bundle sizes
        id: sizes
        run: if [ -f .local/metrics/sizes.json ]; then echo "found=true" >> "$GITHUB_OUTPUT"; fi
      - name: Save the measured bundle sizes
        if: steps.sizes.outputs.found == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: metrics-sizes-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/metrics/sizes.json

  # **The part of the build the browser jobs render, on its own.** They read the
  # frame and the spec bundles and nothing else of the site, and those wait for
  # the components and not for the docs, so this finishes while `warm` is still
  # measuring bundle sizes, and every browser job starts that much sooner. The
  # two jobs build the components side by side, which is a minute of compute
  # bought for the same minute off every run.
  warm-browser:
    needs: proven
    if: ${{ !cancelled() && needs.proven.outputs.proven != 'true' }}  # dialect:quoted, GitHub's function
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up bun and the dependencies
        uses: ./.github/actions/setup
      - name: Build the frame and the spec bundles
        run: bunx turbo run frame specs

  # **Three shards, because they are off the critical path.** Every check here
  # is seconds of work behind a job's setup, so ten shards finished no sooner
  # than the browser jobs beside them and were billed a minute apiece.
  checks:
    needs: [plan, warm]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # **Never fail fast.** A shard that fails while five are canceled is the
      # serial chain again, one failure at a time, which is the whole thing this
      # split exists to stop.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned to the version in `packageManager`. A lockfile pins every
      # dependency and nothing pinned the runtime resolving it.
      - name: Set up bun and the dependencies
        uses: ./.github/actions/setup

      - name: Checks, shard ${{ matrix.shard }}
        run: bun fusion/scripts/run-checks.mjs --shard ${{ matrix.shard }} --of ${{ needs.plan.outputs.of }}

      # `verify` is meant not to write, and `analyze` is the one step that can:
      # it regenerates the manifests. A tracked manifest that no longer matches
      # its source is a real fault and an invisible one, because everything
      # downstream reads the file rather than the code. This is what makes the
      # "never writes" rule checkable instead of stated.
      - name: The tree is unchanged by verifying it
        run: git diff --exit-code

  # **Its own job because it runs every other check.** In the shard pool it made
  # whichever shard drew it run the whole suite serially, so a six-way split had
  # a single shard doing all of it and finished no sooner than that shard did.
  #
  # Same prerequisites as a shard, for the same reason: the checks it runs read
  # what `build` writes. After `warm`, so the build is a restore: it built its
  # own beside `warm` for 139 seconds, measured 15 Sep 2026.
  floors:
    needs: warm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up bun and the dependencies
        uses: ./.github/actions/setup

      - name: Build
        run: .github/scripts/build-for-checks.sh

      - name: Every rule counts something
        run: bun run check:spec:floors

      # **The specs that `tests` leaves out, because they read what `metrics`
      # writes.** The `helix-docs` specs import the generated docs modules, and
      # `docs` waits on `metrics`, which `warm` builds. The site has no specs
      # today. Its node in the graph reaches the `helix-docs` build, and it is
      # named here so a spec it gains runs in one of the two jobs. Together
      # with the filter in `tests`, the two runs cover `turbo run test` once.
      - name: The specs that read the docs build
        run: bunx turbo run test --filter=@fusion.dev/helix-docs --filter=@fusion.dev/site

      - name: The tree is unchanged by verifying it
        run: git diff --exit-code

  # **What we publish, installed from outside the workspace.** `smoke:template`
  # packs every publishable package, installs the tarballs into a scratch
  # project that is a workspace of nothing, and typechecks an import of every
  # exported subpath. Nothing else here asks whether the tarballs are usable.
  #
  # **It ran nowhere on a pull request until now.** `release.yml` runs it, but
  # against the registry and only after a version has been allocated and ten
  # packages published, so a packaging fault could not be found without spending
  # a number on it. 75 added a `bin`-only package and 0.3.0 was the cost of
  # discovering that two of the checks here could not describe one.
  #
  # From disk rather than the registry, so it needs no token and no publish.
  #
  # `analyze` is not optional: `files` names `custom-elements.json` and the
  # three framework typings, and `build` does not produce them, so without it
  # the tarballs ship without files their own manifests promise. After `warm`,
  # so both are a restore rather than the 214 seconds they were.
  #
  # **`next build` runs here, inside `smoke:template`.** `warm` leaves it out
  # because no job after `warm` reads `.next` (see `build-for-checks.sh`), and
  # `smoke:template` builds the whole workspace, the site included. So this is
  # the job where `next build` and `check-highlight.mjs` run, and where either
  # fails.
  #
  # **`smoke:template` builds them itself, so the job does not build first.**
  # Turbo hashes a task's inputs when a run starts, and some of those inputs
  # are files the build writes: `specs` reads the generated events module and
  # `site#build` the generated faces. A second run in the same job hashed a
  # tree the first had filled, missed `specs`, `themed-page`, `catalog` and
  # `site#build`, and ran `next build` again: 37 of the step's 43 seconds on
  # run 37566910950. One run is the same graph `warm` ran, so it restores.
  packaging:
    needs: warm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up bun and the dependencies
        uses: ./.github/actions/setup

      - name: Install a template out of the pack
        run: bun run smoke:template

  # Its own job because it reads every file regardless of who owns it, so
  # sharding it would mean a pass over the same tree per shard.
  lint:
    needs: proven
    if: ${{ !cancelled() && needs.proven.outputs.proven != 'true' }}  # dialect:quoted, GitHub's function
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The whole history, which the withheld step below needs to list a pull
      # request's own commits. The repository is small enough that this costs
      # seconds.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up bun and the dependencies
        uses: ./.github/actions/setup
        with:
          # It lints what is checked in and builds nothing.
          helix: false
      - name: Format and lint
        run: bunx biome ci .
      # **The messages and addresses of the commits a pull request brings**,
      # which the check in the shards cannot see: it reads files, and a removal
      # by path never reaches a commit message. From the base the pull request
      # was opened against, so nothing already on `main` is judged again.
      - name: Withheld names in the pull request's commits
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bun fusion/scripts/check-withheld.mjs --commits "$BASE..$HEAD"

  # After `warm`, because `typecheck` reads nearly everything `build` writes:
  # the site's types import the catalog, the frame and the spec bundles.
  types:
    needs: warm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up bun and the dependencies
        uses: ./.github/actions/setup
      - name: Typecheck
        run: bun run typecheck

  # **The JavaScript specs, apart from the Rust**, which they do not need: the
  # shim specs put their own `PATH` in front of every binary they run, cargo
  # included. Together the two took 321 seconds on 15 Sep 2026, one after the
  # other, with most of the Rust job's toolchain idle through the specs.
  #
  # **They start after `warm-browser`, which builds what they read.** Every
  # spec outside `helix-docs` reads the components and the testing harness.
  # `warm-browser` builds both about two minutes before `warm` finishes
  # writing the docs and measuring bundles, and the rest of the graph is a
  # few small compiles. `helix-docs` and the site wait on `metrics` through
  # `docs`, so the filter leaves them out here and `floors` runs them after
  # `warm`. Together the two runs cover `turbo run test` once.
  tests:
    needs: warm-browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up bun and the dependencies
        uses: ./.github/actions/setup
      - name: Run the specs
        run: bunx turbo run test --filter=!@fusion.dev/helix-docs --filter=!@fusion.dev/site

  # **Cargo, from the first second of the run.** It was one job holding every
  # step that touches Rust, and `needs: warm` put the toolchain install, the
  # cache restore and the compile behind a build none of them reads: cargo does
  # not know what `turbo run build` writes. Measured on run 35041878434, `warm`
  # ended at 155 seconds and this ended at 262, of which the compile was most.
  # Nothing here reads the workspace build, so nothing here waits for it.
  #
  # **The checks that do read it are `cli` below**, and the two compile the same
  # workspace twice. That is the trade: a second compile of a cached workspace is
  # seconds, and the alternative is either this job waiting for `warm` again or
  # the binary crossing between jobs as an artifact, which buys nothing once the
  # cache is warm and adds a dependency that makes `cli` wait on clippy.
  rust:
    needs: proven
    if: ${{ !cancelled() && needs.proven.outputs.proven != 'true' }}  # dialect:quoted, GitHub's function
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The specs shell out to `bun` and read the lockfile the repository holds,
      # so the runtime and the dependencies are wanted here as everywhere else.
      - name: Set up bun and the dependencies
        uses: ./.github/actions/setup
        with:
          # It compiles the workspace itself, two steps below.
          helix: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 14 Sep 2026
        with:
          components: clippy
          # **WebAssembly, for the example plugin the host's tests build.** They
          # compile it the way its author would rather than reading a committed
          # artifact, so the target is a dependency of the tests and not of the
          # workspace: nothing here is shipped as WASM by this job.
          targets: wasm32-unknown-unknown
          # The floor rather than stable, so `rust-version` in `Cargo.toml` is
          # exercised by the jobs that compile: a crate reaching past it fails
          # here rather than on the first machine that is behind.
          toolchain: 1.96
      # **A cache per job, which is what leaving the key alone gives.** The
      # action keys on the job name, so this one and `cli`'s hold what each of
      # them actually built: clippy writes metadata where `cargo build` writes a
      # binary, and one entry shared between them would be whichever job saved
      # first and a recompile in the other.
      #
      # **The example plugin's target directories as well.** Three test binaries
      # build it for WebAssembly into directories of its own, outside the
      # workspace target, so nothing kept them: each test binary compiled the
      # plugin's dependencies from cold and ran 42 to 54 seconds, one after the
      # other, on run 37556830567. `key` gives the entry a new name, because an
      # exact hit on the old one is never saved again.
      #
      # **Keyed on the toolchain this job installs, and not on the runner's
      # own.** The action hashes every `rustc` it finds, and the image ships a
      # stable one of its own: 1.99.0 on one image and 1.98.1 on the one before
      # it. While GitHub rolled the new image out, runs alternated between two
      # keys, and a run that drew the other one compiled from cold: 535 seconds
      # on run 37569580156 against 176 on the run before. `1.96` in the prefix
      # is the toolchain below, said again because a key cannot read a step's
      # input.
      - name: Restore the Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          add-rust-environment-hash-key: false
          cache-directories: |
            fusion/plugins/example/target
            fusion/plugins/example/target-past
            fusion/plugins/example/target-escape
          key: example-plugin
          prefix-key: v0-rust-1.96
      - name: Clippy
        run: bun run rs:check
      - name: Rust tests
        run: bun run rs:test

  # The checks that run a Rust binary over what the workspace build wrote, which
  # is why they wait for `warm` and the job above does not.
  #
  # **The build is what `references` reads.** That rule asks whether a path a
  # comment names is on disk, and several of them name generated files:
  # `fusion/site/public/sandbox/frame.css` is written by the site build and is
  # gitignored. A shard had it because the shards build first; the Rust job did
  # not, so moving the check there turned seven true references into findings.
  # After `warm`, so it is a restore rather than a build.
  #
  # **These are here rather than in the shard pool** because they are the checks
  # that run a binary: a shard has bun and no cargo, so the npm shim would build
  # one from cold on whichever of the six drew it, while the other five paid for
  # a toolchain they never used. Six of them compiling at once also took the
  # runner's memory: exit 137 on one shard, SIGTERM on another, a third canceled
  # behind them.
  #
  # `check:cli` reads source rather than `dist`. The one thing `dist` buys is
  # naming the exact subpath in a barrel finding, and without it that advice
  # degrades to `dependency/<part>` in words rather than silently.
  cli:
    needs: warm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up bun and the dependencies
        uses: ./.github/actions/setup
        with:
          # It compiles the workspace itself, two steps below.
          helix: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 14 Sep 2026
        with:
          toolchain: 1.96
      # Keyed on the toolchain as the Rust job's cache is, for the reason given
      # there.
      - name: Restore the Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          add-rust-environment-hash-key: false
          prefix-key: v0-rust-1.96
      - name: Build
        run: .github/scripts/build-for-checks.sh
      # Ahead of the checks rather than left to the npm shim, so one compile
      # serves all four and a failure to build is reported as one.
      - name: Build the Rust workspace
        run: bun run rs:build
      - name: The rules that ship
        run: bun run check:cli
      - name: Seed tokens
        run: bun run check:css:seeds
      - name: Prose
        run: bun run check:prose
      - name: Spec rules
        run: bun run fusion x spec check

  # Every example rendered, pictured and measured, in a browser, because
  # `verify` deliberately does not have one: everything in `verify` runs
  # anywhere bun runs. These are the checks behind `hasLayout()`, which
  # happy-dom skips because it has no boxes, and a component can render perfect
  # markup in the wrong place with no DOM saying so.
  #
  # **One job per shard of a check, and `plan` decides how many.** A check
  # whose share of the corpus would take longer than a job's worth is split by
  # family, so the longest of these is a shard and not the whole corpus: parity
  # and hydration were each ten minutes of one job. What each check is, and why
  # it wants a browser, is in the file that runs it.
  browser:
    name: browser (${{ matrix.label }})
    # `plan` decides whether this matrix can fail at all for the diff in hand,
    # and how it splits, and `warm-browser` means the build is a restore.
    # Skipped is neither a failure nor a cancellation, so the `verify` gate at
    # the bottom passes a run where this never reported, which is the property
    # that lets the required check stay exactly as it is.
    needs: [plan, warm-browser]
    # **`!= 'false'`, so the unknown case runs rather than skips.** `scope`
    # states the required direction: a path nobody thought about lands outside
    # the list and runs, which is the direction this has to fail in. `== 'true'`
    # is the opposite. Rename the step, rename the output, or take a path out of
    # that shell block that never writes `browser=`, and the expression reads
    # empty: `plan` succeeds, every browser job reports skipped, the gate below
    # counts skipped as neither failure nor cancellation, and a pull request
    # touching `helix/styled/src` merges with contrast, specs, smoke, visual,
    # parity and diagnostics never having run. Nothing in the run says so.
    #
    # A failed or skipped `plan` still skips this through `needs`, and `plan`'s
    # own failure is what the gate catches, so the safe case is unchanged.
    if: needs.plan.outputs.browser != 'false'
    runs-on: ubuntu-latest
    # A shard is sized to about a minute of work, so this is five times that
    # and room for a slow runner. Too low and the job is `cancelled`, which  # dialect:quoted, GitHub spells this conclusion value so
    # reports as neither pass nor fail and reads in the summary as a job that
    # did not object.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      # What the scoped checks diff against, once for every entry `plan` wrote.
      BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
    steps:
      # **Full history, because parity and hydration scope themselves by
      # diffing against the base and a depth-1 checkout has nothing to diff
      # against.** The scripts treat an unresolvable range as "assume
      # everything", which is the right default and would also have made the
      # scoping silently never happen: they would have compared all 663 examples
      # on every run while reporting that they had scoped. No blobs, for the
      # reason `plan` gives.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Set up bun and the dependencies
        uses: ./.github/actions/setup

      - name: Install Chromium
        uses: ./.github/actions/browser

      # Each check builds what it reads, `turbo run frame` first, which after
      # `warm-browser` is a restore.
      - name: ${{ matrix.label }}
        # **What each family cost, recorded on the machine that packs these
        # shards.** `@fusion.dev/scripts/cost` weighs a family by a measurement
        # and a desk is not a runner and not uniformly: aura is a sixth of
        # contrast on an M2 and a third of it here, which is most of the gap
        # between the shards this plans and the shards that finish together.
        # The file is a shard's own families, so a run's worth of them merged
        # is the corpus. `pool` writes it only when the variable is set, which
        # is here and `measure-browser.mjs`.
        #
        # On the step and not the job, because `runner` is not a context a
        # job's `env` can read: naming it there is not an empty string but a
        # workflow GitHub refuses to load at all, every job of the run
        # reporting nothing.
        env:
          BROWSER_COST: ${{ runner.temp }}/cost/${{ matrix.task }}.json
        run: ${{ matrix.run }}

      # **The pictures, when it fails, because nothing else can show them.**
      # `check:spec:visual` marks the changed pixels into `preview.diff.png` beside
      # each baseline and those files die with the runner, so a reviewer got a
      # pixel count and no way to see what moved. `if-no-files-found: ignore`
      # because only the pixel checks ever write one.
      #
      # **One glob per tier rather than one per picture, because the enumeration
      # rotted twice.** A diff lands beside the baseline it belongs to, so the
      # tier decides the package and the shot decides the name: `preview.diff.png`
      # at 640, `preview.narrow.diff.png` at 390, `preview.dark.diff.png` in the
      # other mode. Naming only the wide headless one collected a quarter of what
      # a failing run can write; naming four of them collected two thirds the day
      # a third shot was added. Silently both times, since `if-no-files-found:
      # ignore` is exactly the setting that cannot say a glob matched nothing.
      # `preview*.diff.png` is every one of them, including the next.
      #
      # **Every path here runs through a dot directory**, `.examples` and the
      # hydration check's `.local`, and `upload-artifact` drops those unless
      # hidden files are asked for. Nothing says so, `ignore` being the setting:
      # on 13 Sep 2026 the repository held no `visual-diffs` artifact at all,
      # and a Linux-only hydration finding arrived as a count with no picture.
      # The examples' diagnostics, which `check:spec:visual` writes beside the
      # pictures, go with them: every run on every example, in the run format
      # the dashboard reads.
      #
      # Refreshed with `measure:browser --from`, which merges a run's worth of
      # these: [VERIFYING.md](../VERIFYING.md#how-many-browser-jobs). A shard
      # that held no family recorded nothing, which `ignore` covers.
      - name: What each family cost
        if: always()  # dialect:quoted, GitHub's own function
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: ignore
          name: browser-cost-${{ matrix.id }}
          path: ${{ runner.temp }}/cost
          retention-days: 14

      # **The examples' diagnostics, kept from every run for the console.**
      # `check:spec:visual` writes a shard's runs to `.local/diagnostics`, and
      # the `telemetry` job sends them once the tree is on `main`: usually from
      # the pull request's run, since `main` runs nothing again for a tree a
      # pull request verified. Only the shards that picture examples write one,
      # which `ignore` covers.
      - name: Keep the examples' diagnostics
        if: always()  # dialect:quoted, GitHub's own function
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: ignore
          include-hidden-files: true
          name: diagnostics-${{ matrix.id }}
          path: .local/diagnostics/examples.json
          retention-days: 14

      - name: Upload the visual diffs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: ignore
          include-hidden-files: true
          name: visual-diffs-${{ matrix.id }}
          path: |
            helix/headless/src/*/.examples/preview*.diff.png
            helix/styled/src/*/.examples/preview*.diff.png
            .helix/parity
            .helix/visual
            .helix/dsd
            .local/diagnostics/*.json

  # **The examples' changes as one summary, when a visual shard failed.** Each
  # shard groups only the shots it pictured, so one change across the corpus
  # arrives as a group in every shard that holds a piece of it. This merges the
  # shards' reports into one set of groups, the largest first, and asks a model
  # about each once, which is where the triage in `visual.config.ts` runs: a
  # shard leaves it to the merge. The groups go to this run's summary page.
  #
  # **Never a failure of the build.** The shards already failed or passed, and
  # a model that is down or a key a fork pull request does not get is no reason
  # to call the run anything else. Only this job gets the key.
  visual-triage:
    needs: [browser]
    if: ${{ always() && needs.browser.result == 'failure' }}  # dialect:quoted, GitHub's own function
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    env:
      BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
    steps:
      # Full history, for the diff a triage reads from `BASE`.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Set up bun and the dependencies
        uses: ./.github/actions/setup

      - name: Fetch the visual shards' reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: reports
          pattern: visual-diffs-visual-*

      - name: Merge them, and ask about each group
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          shopt -s nullglob
          reports=(reports/*/.helix/visual)
          if [ "${#reports[@]}" -eq 0 ]; then
            echo "No visual shard left a report, so there is nothing to merge." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          bun helix/cli/npm/bin.mjs visual report --merge "${reports[@]}" --changed "$BASE" --markdown | tee -a "$GITHUB_STEP_SUMMARY"

  # **The site's pages, pictured by `helix visual`'s own GitHub Action.** Five
  # pages at 1440 and 390 light and 1440 dark, from `next start` over the build
  # `warm` made, compared with the baselines under `fusion/site/baselines`.
  # `fusion/site/visual.config.ts` says why each page is there.
  #
  # **After `warm`, because `next build` is the slow half of it**, and a
  # restore here. It runs beside `tests`, which also waits on `warm`, and
  # finishes inside it, so it adds nothing to the run's wall time.
  #
  # **Every run, the skippable diffs included.** `touched.sh` lets the browser
  # jobs skip a change under `fusion/docs/`, which no example reads; the site
  # renders that writing.
  site:
    needs: [proven, warm]
    if: ${{ !cancelled() && needs.proven.outputs.proven != 'true' && needs.warm.result == 'success' }}  # dialect:quoted, GitHub's function
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up bun and the dependencies
        uses: ./.github/actions/setup
      # `warm` built it, so this is a restore of `.next`.
      - name: Build the site
        run: bunx turbo run build --filter=@fusion.dev/site
      - name: Picture the site
        uses: ./helix/visual/action
        with:
          args: --config fusion/site/visual.config.ts
          helix: bun helix/cli/npm/bin.mjs
          mode: check
          playwright: bunx playwright
          report: fusion/site/.helix/visual

  # **The examples' diagnostics, sent to the console when a tree lands on
  # `main`**, where each finding becomes an issue with a state: stage 8 of the
  # diagnostics plan.
  #
  # **From the run that verified the tree.** A push whose tree a pull request
  # verified runs nothing again, so the runs come from that pull request's
  # artifacts, which `proven` names. Otherwise this push ran the browser jobs
  # itself, and they come from here.
  #
  # **Never a failure of the build.** Not in the gate's `needs`, and
  # `continue-on-error`: a console that is down, or a key that was revoked, is
  # no reason to call a verified tree unverified. Without the
  # `HELIX_TELEMETRY_KEY` secret and the `HELIX_TELEMETRY_URL` variable it
  # sends nothing and says so. The address is a variable because the console is
  # internal, and this repository is public.
  telemetry:
    needs: [proven, browser]
    if: always() && github.event_name == 'push'  # dialect:quoted, GitHub's own function
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      actions: read
      contents: read
    steps:
      - name: Fetch the diagnostics from the pull request's run
        if: needs.proven.outputs.proven == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          path: diagnostics
          pattern: diagnostics-*
          run-id: ${{ needs.proven.outputs.run }}

      - name: Fetch the diagnostics from this run
        if: needs.proven.outputs.proven != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: diagnostics
          pattern: diagnostics-*

      - name: Send them to the console
        env:
          HELIX_TELEMETRY_KEY: ${{ secrets.HELIX_TELEMETRY_KEY }}
          HELIX_TELEMETRY_URL: ${{ vars.HELIX_TELEMETRY_URL }}
        run: |
          if [ -z "$HELIX_TELEMETRY_KEY" ] || [ -z "$HELIX_TELEMETRY_URL" ]; then
            echo "No HELIX_TELEMETRY_KEY secret or HELIX_TELEMETRY_URL variable, so no diagnostics were sent." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          shopt -s nullglob
          files=(diagnostics/*/examples.json)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No shard pictured an example, so there were no diagnostics to send." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Every file is sent whatever the one before it did, and the step
          # fails at the end where any was refused, so a refusal shows.
          failed=0
          for file in "${files[@]}"; do
            if ! answer=$(curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $HELIX_TELEMETRY_KEY" \
              --header 'Content-Type: application/json' \
              --data-binary "@$file" \
              "$HELIX_TELEMETRY_URL" 2>&1); then
              failed=1
            fi
            echo "$file: $answer" >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$failed"

  # The one required context, because the shard counts are arguments and the
  # job names move with them. `always()` is load-bearing:
  # [VERIFYING.md](../VERIFYING.md#one-context-to-require)
  verify:
    if: always()
    needs:
      [proven, plan, warm, warm-browser, checks, cli, floors, packaging, lint, types, tests, rust, browser, site]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: A job did not pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')  # dialect:quoted, GitHub's own job result spelled its way
        run: |
          echo "::error::A job in this workflow did not pass."
          exit 1
      # **A run where the checks were skipped and nothing said they could be.**
      # Skipped is neither a failure nor a cancellation, which is what lets the
      # browser matrix stay out of a diff it cannot fail and what let a run in
      # which nothing ran at all report green. Two things may skip the work:
      # `proven` finding a run that verified this tree, and nothing else. So the
      # jobs every check hangs from have to have run, or `proven` has to say
      # why they did not.
      - name: Nothing verified this tree
        if: needs.proven.outputs.proven != 'true' && (needs.warm.result != 'success' || needs.checks.result != 'success')  # dialect:quoted, GitHub's own job result spelled its way
        run: |
          echo "::error::No job verified this tree and no earlier run had."
          exit 1
      - name: All jobs passed
        run: echo "Every job in this workflow passed."
