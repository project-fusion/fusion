# Retakes the visual baselines, on the one platform allowed to take them.
#
# **A baseline is a Linux artifact and development is darwin.** No headless
# example sets `font-family`, so the default stack, the rasterizer and subpixel
# antialiasing all differ, and a baseline taken on a contributor's Mac fails on
# `ubuntu-latest` at nearly every glyph. `check:spec:visual` refuses to compare across
# platforms for that reason rather than widening a threshold until real faults
# fit under it.
#
# **Both tiers since 25 Aug 2026, which is what doubled the corpus.** The styled
# families are pictured beside the headless ones, at the same two widths, so a
# run takes 342 pictures rather than 166 and a blank `family` retakes all of
# them. The check's own header carries the measurement that reopened the styled
# tier and the one that says it needs `frame.css` to be pictured truthfully.
#
# **So refreshing one was a person standing up a container by hand**, running
# `bun run visual:update` and committing what it took, which is the step most
# likely to be skipped on the day a diff looks obviously fine. That is the day it
# matters.
#
# **`workflow_dispatch` rather than a trigger, and that is the whole design.** A
# baseline that refreshes itself on push is a check that agrees with whatever
# just landed and reports success forever, which is the failure `check:spec:visual`
# already had to be taught not to have: a missing baseline used to be written
# rather than refused. A person asks for this, looks at the diff in the pull
# request it opens, and approves it.
#
# **A pull request rather than a push to `main`.** This is the only workflow here
# with `contents: write`, and the reason `release.yml` refuses a bot push that
# outranks branch protection applies with more force to a picture: a baseline is
# what every future run is judged against, so it is exactly the artifact that
# should not arrive unreviewed.
name: Visual baselines

on:
  workflow_dispatch:
    inputs:
      family:
        description: A single family to retake in both tiers, or blank for all of them
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  retake:
    runs-on: ubuntu-latest
    # Thirty rather than twenty, because the styled tier doubled the number of
    # pictures and a timeout that kills a retake halfway leaves a branch holding
    # some of a set that is only meaningful whole.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.43

      - run: bun install --frozen-lockfile

      # Built first, for the reason the browser job in `verify.yml` builds
      # first: `specs` bundles from source, and source imports the generated
      # `.css.ts` files and the other packages' `dist`, neither of which is
      # tracked.
      #
      # **It is also what writes the frame, and the styled tier cannot be
      # pictured without it.** `fusion/site`'s own build is
      # `catalog && frame && specs && next build`, and `frame` is
      # `fusion/site/scripts/build-frame.mjs`, which empties
      # `fusion/site/public/sandbox` and writes `frame.js`, `frame.css` and
      # `frame.html` together. The whole directory is gitignored, so a checkout
      # has none of it and this step is the only thing that supplies it.
      # `check:spec:visual` hard-fails naming `bun run gen:frame` when either the bundle
      # or the stylesheet is missing, rather than taking eighty-eight styled
      # pictures in which no token resolved.
      - run: bun run build

      - run: bunx playwright install --with-deps chromium

      # A blank input appends nothing and retakes every picture in both tiers.
      # The script reads the family as the first argument that is not a flag,
      # which is what it was taught after `visual:update accordion` once rewrote
      # every baseline. A family that exists in one tier only is reported and
      # retaken in the tier that has it.
      - run: bun run visual:update ${{ inputs.family }}

      - uses: peter-evans/create-pull-request@v8
        with:
          branch: visual-baselines
          title: Retake the visual baselines
          commit-message: |
            Retake the visual baselines

            Generated by the Visual baselines workflow on ubuntu-latest, which
            is the platform check:spec:visual compares on. Look at the diff images
            before approving: a baseline is what every future run is judged
            against, so an unreviewed one turns a regression into the new truth.
          body: |
            Taken by the `Visual baselines` workflow.

            **Look at each changed picture before approving.** A baseline is the
            thing every future run is compared to, so approving a regression
            here makes it the expected result and `check:spec:visual` will defend it.
