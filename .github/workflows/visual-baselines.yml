# Retakes the visual baselines, on the one platform allowed to take them.
#
# **A baseline is a Linux artifact and development is darwin.** No headless
# example sets `font-family`, so the font stack, rasterizer and antialiasing all
# differ and a baseline taken on a Mac fails on `ubuntu-latest` at nearly every
# glyph. `check:spec:visual` refuses to compare across platforms rather than
# widening a threshold until real faults fit under it.
#
# **`workflow_dispatch`, never a trigger.** A baseline that refreshes itself on
# push agrees with whatever just landed and reports success forever. A person
# asks for this and reviews the diff.
#
# **A pull request, never a push to `main`.** This is the only workflow here with
# `contents: write`, and a baseline is what every future run is judged against,
# so it is the artifact that most needs review.
name: Visual baselines

# **Queued rather than canceled**, for the reason the timeout below gives: a
# retake killed halfway leaves the `visual-baselines` branch holding part of a
# set that is only meaningful whole. Two dispatches would otherwise both push to
# that one branch and the pull request would carry a mix of the two.
concurrency:
  cancel-in-progress: false
  group: ${{ github.workflow }}

on:
  workflow_dispatch:
    inputs:
      family:
        description: A single family to retake in both tiers, or blank for all of them
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  retake:
    runs-on: ubuntu-latest
    # A timeout that kills a retake halfway leaves a branch holding part of a
    # set that is only meaningful whole.
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up bun and the dependencies
        uses: ./.github/actions/setup

      # Built first: `specs` bundles from source, which imports the generated
      # `.css.ts` files and the other packages' `dist`, and neither is tracked.
      #
      # It also writes the frame, without which the styled tier cannot be
      # pictured at all. `fusion/site/public/sandbox` is gitignored, so a
      # checkout has none of it and this step is the only thing that supplies
      # it.
      - name: Build
        run: bun run build

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      # A blank input retakes every picture in both tiers. A family present in
      # one tier only is retaken there and reported.
      - name: Retake the baselines
        run: bun run visual:update ${{ inputs.family }}

      # **An App token, because `GITHUB_TOKEN` opens a pull request nothing
      # will check.** GitHub does not run `pull_request` workflows for events
      # that token creates, which [RELEASING.md](../RELEASING.md#the-app-that-writes-to-main)
      # states for the release. The `main` ruleset requires the `verify`
      # context, so a pull request opened with the default token sat blocked
      # with no run to wait for. The same App the release stamps with, minted
      # for the one step that writes.
      - name: Mint a token whose pull request gets verified
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.STAMP_APP_ID }}
          private-key: ${{ secrets.STAMP_APP_PRIVATE_KEY }}

      - name: Open the pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app.outputs.token }}
          branch: visual-baselines
          # **Conventional, because `resolve` reads these.** `report-intent.sh`
          # checks every subject on a pull request *and its title*, and reads
          # the release bump off them. A generated subject that does not parse
          # fails that check, which is invisible while baselines land straight
          # on `main` and blocks the moment they land on a feature branch: a
          # new family has no baseline, so its first pictures have to be taken
          # against the branch that adds it.
          #
          # `test(visual)` and not a `chore`: `bump.mjs` maps `chore` to
          # `patch`, so a baseline carrying a `helix` scope would ask for a
          # release of Helix. Only `test` and `ci` release nothing, which is
          # what a picture of an example should do.
          title: "test(visual): retake the baselines"
          commit-message: |
            test(visual): retake the baselines

            Generated by the Visual baselines workflow on ubuntu-latest, which
            is the platform check:spec:visual compares on. Look at the diff images
            before approving: a baseline is what every future run is judged
            against, so an unreviewed one turns a regression into the new truth.
          body: |
            Taken by the `Visual baselines` workflow.

            **Look at each changed picture before approving.** A baseline is the
            thing every future run is compared to, so approving a regression
            here makes it the expected result and `check:spec:visual` will defend it.
