# Retakes the visual baselines, on the one platform allowed to take them.
#
# **A baseline is a Linux artifact and development is darwin.** No headless
# example sets `font-family`, so the font stack, rasterizer and antialiasing all
# differ and a baseline taken on a Mac fails on `ubuntu-latest` at nearly every
# glyph. Fusion Locus, which `check:spec:visual` runs, refuses to compare across
# platforms rather than widening a threshold until real faults fit under it, and
# records the environment the baselines were taken in beside them, in
# `locus.fingerprint.json`.
#
# **`workflow_dispatch`, never a trigger.** A baseline that refreshes itself on
# push agrees with whatever just landed and reports success forever. A person
# asks for this and reviews the diff.
#
# **A pull request, never a push to `main`.** This is the only workflow here with
# `contents: write`, and a baseline is what every future run is judged against,
# so it is the artifact that most needs review.
name: Visual baselines

# **Queued rather than canceled**, for the reason the timeout below gives: a
# retake killed halfway leaves its baselines branch holding part of a set that
# is only meaningful whole. Two dispatches on one ref would otherwise both push
# to that ref's branch and the pull request would carry a mix of the two.
#
# **One group and one branch per ref.** Every retake shared the one
# `visual-baselines` branch, so a dispatch on one feature branch reset the
# branch under another's open pull request, which then showed the second set.
concurrency:
  cancel-in-progress: false
  group: ${{ github.workflow }}-${{ github.ref }}

on:
  workflow_dispatch:
    inputs:
      family:
        description: A single entry to retake, an example family in both tiers or a site page, or blank for every one
        required: false
        type: string
      suite:
        description: The Helix examples, or the site's pages
        default: examples
        options: [examples, site]
        type: choice

permissions:
  contents: write
  pull-requests: write

jobs:
  retake:
    runs-on: ubuntu-latest
    # A timeout that kills a retake halfway leaves a branch holding part of a
    # set that is only meaningful whole.
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up bun and the dependencies
        uses: ./.github/actions/setup

      # Built first: `specs` bundles from source, which imports the generated
      # `.css.ts` files and the other packages' `dist`, and neither is tracked.
      #
      # It also writes the frame, without which the styled tier cannot be
      # pictured at all. `fusion/site/public/sandbox` is gitignored, so a
      # checkout has none of it and this step is the only thing that supplies
      # it.
      - name: Build
        run: bun run build

      - name: Put the locus binary on disk
        uses: ./.github/actions/locus

      # **An App token, because `GITHUB_TOKEN` opens a pull request nothing
      # will check.** GitHub does not run `pull_request` workflows for events
      # that token creates, which [RELEASING.md](../RELEASING.md#the-app-that-writes-to-main)
      # states for the release. The `main` ruleset requires the `verify`
      # context, so a pull request opened with the default token sat blocked
      # with no run to wait for. The same App the release stamps with, minted
      # for the one step that writes.
      - name: Mint a token whose pull request gets verified
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.STAMP_APP_ID }}
          private-key: ${{ secrets.STAMP_APP_PRIVATE_KEY }}

      # **Fusion Locus's own Action**, so the retake mode a consumer uses is the
      # one these baselines are taken with. It installs the browser and its
      # system packages from the cache `verify` reads: the packages carry the
      # fonts, and the fingerprint holds the fonts, so a retake installed
      # another way would record an environment the browser jobs do not run in.
      #
      # A blank `family` retakes every entry and writes the fingerprint.
      #
      # **`test(visual)`, because `resolve` reads it.** `report-intent.sh` reads
      # the release bump off every subject on a pull request and its title, and
      # `bump.mjs` maps `chore` to `patch`, so a baseline carrying a `helix`
      # scope would ask for a release. Only `test` and `ci` release nothing.
      - name: Retake the baselines
        uses: ./locus/action
        with:
          args: ${{ inputs.suite == 'site' && '--config fusion/site/locus.config.ts' || '' }} ${{ inputs.family }}
          branch: ${{ inputs.suite == 'site' && 'visual-baselines-site-' || 'visual-baselines-' }}${{ github.ref_name }}
          commit-message: 'test(visual): retake the baselines'
          mode: retake
          playwright: bunx playwright
          locus: bun locus/cli/npm/bin.mjs
          token: ${{ steps.app.outputs.token }}
