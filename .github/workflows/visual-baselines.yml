# Retakes the visual baselines, on the one platform allowed to take them, or
# accepts the captures a failed check took there.
#
# **A baseline is a Linux artifact and development is darwin.** No headless
# example sets `font-family`, so the font stack, rasterizer and antialiasing all
# differ and a baseline taken on a Mac fails on `ubuntu-latest` at nearly every
# glyph. `helix visual`, which `check:spec:visual` runs, refuses to compare
# across platforms rather than widening a threshold until real faults fit under
# it, and records the environment the baselines were taken in beside them, in
# `visual.fingerprint.json`.
#
# **`workflow_dispatch`, never a trigger.** A baseline that refreshes itself on
# push agrees with whatever just landed and reports success forever. A person
# asks for this and reviews the diff.
#
# **Onto the branch it ran on, and never a push to `main`.** This is the only
# workflow here with `contents: write`, and a baseline is what every future run
# is judged against, so it is the artifact that most needs review. A feature
# branch has a pull request of its own, which shows each changed picture and
# runs `verify` again on the push, so the Action commits onto it. A second pull
# request into the branch cost a `verify` run, a merge, and a pull of the merge
# into every checkout of the branch, and reviewed nothing the branch's own pull
# request does not. On `main` the Action opens a pull request.
#
# **`run` accepts the captures of a check.** A failed check
# uploads each failed shot's capture with its report, taken on this platform,
# so `helix visual accept` writes those into the baselines with no browser and
# no build. The baseline is then the picture the check showed. It refuses a run
# of a commit other than the branch's, because those captures show other code.
name: Visual baselines

# **Queued rather than canceled**, for the reason the timeout below gives: a
# retake killed halfway leaves its baselines branch holding part of a set that
# is only meaningful whole. Two dispatches on one ref would otherwise both push
# to that ref's branch and the pull request would carry a mix of the two.
#
# **One group and one branch per ref.** Every retake shared the one
# `visual-baselines` branch, so a dispatch on one feature branch reset the
# branch under another's open pull request, which then showed the second set.
concurrency:
  cancel-in-progress: false
  group: ${{ github.workflow }}-${{ github.ref }}

on:
  workflow_dispatch:
    inputs:
      # Writes the element boxes into each matching baseline that has none, so a
      # later change is traced to what it happened to and how far it moved.
      # Only the chunk is added: the pixels and the rest of each file stay.
      boxes:
        default: false
        description: Also write the element boxes into each matching baseline that has none
        type: boolean
      family:
        description: The entries to retake, separated by spaces, each an example family in both tiers or a site page, or blank for every one
        required: false
        type: string
      run:
        description: A verify run whose captures to accept, by its ID, in place of a retake. The examples and the site pages it failed on are both accepted
        required: false
        type: string
      suite:
        description: The Helix examples, or the site's pages
        default: examples
        options: [examples, site]
        type: choice

permissions:
  # The artifacts of the run an accept reads.
  actions: read
  contents: write
  pull-requests: write

jobs:
  retake:
    runs-on: ubuntu-latest
    # A timeout that kills a retake halfway leaves a branch holding part of a
    # set that is only meaningful whole.
    timeout-minutes: 30
    steps:
      # **The branch as it is when the run starts.** `/retake` dispatches the
      # examples and the site as two runs that queue on one branch. The second
      # has to start from the first one's commit, or its push is refused.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Set up bun and the dependencies
        if: inputs.run == ''
        uses: ./.github/actions/setup

      # An accept reads reports and writes files, so it needs the `helix`
      # binary and nothing the build makes.
      - name: Set up bun and the helix binary
        if: inputs.run != ''
        uses: ./.github/actions/setup
        with:
          dependencies: 'false'

      # Built first: `specs` bundles from source, which imports the generated
      # `.css.ts` files and the other packages' `dist`, and neither is tracked.
      #
      # It also writes the frame, without which the styled tier cannot be
      # pictured at all. `fusion/site/public/sandbox` is gitignored, so a
      # checkout has none of it and this step is the only thing that supplies
      # it.
      - name: Build
        if: inputs.run == ''
        run: bun run build

      # **An App token, because `GITHUB_TOKEN` opens a pull request nothing
      # will check.** GitHub does not run `pull_request` workflows for events
      # that token creates, which [RELEASING.md](../RELEASING.md#the-app-that-writes-to-main)
      # states for the release. The `main` ruleset requires the `verify`
      # context, so a pull request opened with the default token sat blocked
      # with no run to wait for. The same App the release stamps with, minted
      # for the one step that writes.
      - name: Mint a token whose pull request gets verified
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.STAMP_APP_ID }}
          private-key: ${{ secrets.STAMP_APP_PRIVATE_KEY }}

      # **`helix visual`'s own Action**, so the retake mode a consumer uses is the
      # one these baselines are taken with. It installs the browser and its
      # system packages from the cache `verify` reads: the packages carry the
      # fonts, and the fingerprint holds the fonts, so a retake installed
      # another way would record an environment the browser jobs do not run in.
      #
      # A blank `family` retakes every entry and writes the fingerprint.
      #
      # **`test(visual)`, because `resolve` reads it.** `report-intent.sh` reads
      # the release bump off every subject on a pull request and its title, and
      # `bump.mjs` maps `chore` to `patch`, so a baseline carrying a `helix`
      # scope would ask for a release. Only `test` and `ci` release nothing.
      - name: Retake the baselines
        if: inputs.run == ''
        uses: ./helix/visual/action
        with:
          args: ${{ inputs.suite == 'site' && '--config fusion/site/visual.config.ts' || '' }} ${{ inputs.boxes && '--boxes' || '' }} ${{ inputs.family }}
          branch: ${{ inputs.suite == 'site' && 'visual-baselines-site-' || 'visual-baselines-' }}${{ github.ref_name }}
          commit-message: 'test(visual): retake the baselines'
          helix: bun helix/cli/npm/bin.mjs
          mode: retake
          playwright: bunx playwright
          push: 'true'
          token: ${{ steps.app.outputs.token }}

      - name: Accept the captures of the check
        if: inputs.run != ''
        uses: ./helix/visual/action
        with:
          branch: visual-baselines-${{ github.ref_name }}
          commit-message: 'test(visual): accept the captures of verify run ${{ inputs.run }}'
          helix: bun helix/cli/npm/bin.mjs
          mode: accept
          push: 'true'
          run: ${{ inputs.run }}
          token: ${{ steps.app.outputs.token }}
