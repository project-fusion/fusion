# **A closed pull request takes its pictures with it.** `verify` pushes the
# captures of a failed visual check to `visual-preview/<number>` for a
# reviewer to look at, and removes the branch when the pictures pass. A pull
# request that closes or merges before they do leaves the branch, and this
# deletes it and the link to it.
#
# **Only for a branch of this repository**: a fork's pull request gets no
# preview branch, and its token cannot delete one.
name: Visual preview cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  remove:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The script alone, from the default branch, where it is kept.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts

      - name: Remove the pictures
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: .github/scripts/visual-preview.sh remove
