# Merge to main, publish to staging, prove it, promote it.
#
# **Staging is a dist-tag, not a version string.** Packages publish at their
# real version under `next`; the template tests then install *that*, from the
# registry, from outside the workspace; and promotion is
# `npm dist-tag add pkg@1.4.0 latest`, which moves a pointer and builds nothing.
#
# The alternative keeps being proposed and is worth writing down as refused:
# publish `0.0.1-staging`, test it, then publish `0.0.1`. That second publish is
# a second build, so the bytes users install are bytes no smoke test ever ran,
# and it cannot be undone, because a version is permanent while a tag moves back.
#
# **Nothing here pushes to `main`.** The version is not committed: every
# manifest holds `0.0.0-dev`, the tag is the record, and the real number is
# stamped in this job seconds before packing. A release bot with write access
# that outranks branch protection would be a standing hole in the same place the
# governance gate is meant to be strongest, and it would buy a number `git tag`
# already holds. Tags are pushed. Branches are not.
#
# Domains release independently, which is what per-domain lockstep means: a
# Cortex fix must not bump the Helix docs to a version in which nothing about
# Helix changed.
#
# **Two tag prefixes, and they mean different things.** `helix-attempt-v1.4.0`
# is pushed before publishing and says a number was spent. `helix-v1.4.0` is
# pushed after promotion and says a release happened. Version computation reads
# both, so a number is never handed out twice; everything else reads only the
# second.
# **`vars.PUBLISHING` has four states, and they are ordered by how much they
# permit.** `off` and unset both publish nothing. `experimental`, previews and
# staging publish but nothing is ever promoted, so a version exists at a dist-tag
# a consumer has to ask for by name and `latest` does not move. `on`, the whole
# pipeline runs and `latest` follows main.
#
# A single ordered variable rather than one flag per workflow, because two flags
# can disagree and somebody has to remember which of the four combinations is
# meant. These have one meaning each and a reader can hold them in order.
#
# **`off` exists because absent is ambiguous.** Unset means the same thing, and it
# also means "nobody has set this yet" and "somebody deleted it": moving the
# repository in Aug 2026 emptied every variable, and nothing distinguished a
# pipeline deliberately held from one whose switch had been lost. `off` is the
# state that says a person decided.
#
# **Publishing is switched off, deliberately, and this is the switch.**
#
# `vars.PUBLISHING` is a repository variable. Unset, it is the empty string, so
# every publishing job below is skipped and a merge to `main` releases nothing.
# Set it to `on` in Settings, Secrets and variables, Actions, Variables, and the
# pipeline resumes exactly as written. Nothing else has to change and no commit
# is needed to flip it back.
#
# A variable rather than a commented-out trigger, because the rest of this
# workflow has to keep running to be worth anything: `intent` still resolves the
# domains, `verify` still runs, and the first real release is then a switch
# rather than a re-derivation of a pipeline nobody has exercised in months.
#
# **What it does not gate is version allocation**, because nothing is allocated
# until the job runs at all. A skipped job burns no number and pushes no tag.

name: release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Which domains this merge releases, and by how much, read off the subjects it
  # brought. `release-intent` reported the same reading while the pull request
  # was open, from the same commits, so by here it is confirmed rather than
  # guessed.
  #
  # **It used to be a label.** The argument was that Conventional Commits would
  # cost the history its sentences, so the machine-readable part went beside the
  # commit rather than in it. The repository took the other side, and a second
  # channel for one fact is a second place for it to be wrong: the label was the
  # copy that could drift from what was actually merged, and nothing compared
  # them.
  #
  # **`fetch-depth: 0`, because the range is the point.** A merge commit's second
  # parent is what the pull request brought, and a shallow clone has neither
  # parent to walk.
  intent:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      domains: ${{ steps.resolve.outputs.domains }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: resolve
        run: |
          set -euo pipefail

          # A merge commit's second parent is what the pull request brought, so
          # the range is everything on it the first parent did not already have.
          # A direct push to `main` is its own range.
          if git rev-parse -q --verify "${{ github.sha }}^2" >/dev/null; then
            range="${{ github.sha }}^1..${{ github.sha }}^2"
          else
            range="${{ github.sha }}^..${{ github.sha }}"
          fi

          resolved=$(node fusion/scripts/bump.mjs "$range")
          echo "domains=$resolved" >> "$GITHUB_OUTPUT"

          if [ "$resolved" = '[]' ]; then
            echo "No subject in this merge carries a releasing type and a published scope." >> "$GITHUB_STEP_SUMMARY"
          else
            jq -r '.[] | "- `\(.domain)`: \(.level)"' <<<"$resolved" >> "$GITHUB_STEP_SUMMARY"
          fi

  release:
    needs: intent
    if: >-
      needs.intent.outputs.domains != '[]'
      && contains(fromJSON('["experimental", "on"]'), vars.PUBLISHING)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      # One domain must not take the other down with it, and two domains must
      # not race to move the same tag.
      fail-fast: false
      max-parallel: 1
      matrix:
        target: ${{ fromJson(needs.intent.outputs.domains) }}
    environment: production
    permissions:
      # `id-token` is the whole authentication story: npm trusted publishing
      # exchanges a short-lived OIDC token for publish rights, so there is no
      # npm credential in this repository at all. `contents` is for the tag and
      # for the branch the stamp-back opens from, `pull-requests` for the pull
      # request itself: writing the version back needs no access that outranks
      # branch protection, which is the whole reason it is a pull request.
      contents: write
      id-token: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The version is computed from tags, and a checkout that has none reports
      # every release as the first one.
      - run: git fetch --tags --force

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.43

      # bun runs the repo; npm does the publishing, and trusted publishing needs
      # npm 11.5.1 or later on Node 22.14 or later.
      # **No `registry-url`, and that is the whole of the authentication.**
      # `setup-node` writes an `.npmrc` when given one, carrying
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`, which is
      # `setup-node`'s own variable and not the `NPM_TOKEN` the steps below
      # read. Nothing sets it, so that line resolves to an empty string and
      # npm reads itself as configured with a credential: it stops before the
      # OIDC exchange, publishes as nobody, and the registry refuses the write.
      #
      # **A refused write is reported as a 404**, so this arrived as
      # `404 Not Found - PUT .../@fusion.dev%2fhelix-core` and read like a
      # missing package on a package that exists and had a trusted publisher
      # registered against exactly this workflow and environment. Measured
      # 31 Aug 2026 on the first release job that ever ran.
      #
      # The default registry is already npmjs.org, so the line bought nothing
      # even when it worked.
      - uses: actions/setup-node@v7
        with:
          node-version: '22.20.0'

      # The pin above meets half that floor and `setup-node` undoes the other
      # half: it installs whatever npm ships with the Node it pins, and 22.20.0
      # ships npm 10.9.x, which predates trusted publishing entirely. The floor
      # was written above for months with nothing enforcing it, and a run that
      # finds out reports an authentication failure rather than naming a
      # version, so it reads as a registry problem and not a runner one.
      #
      # Pinned rather than floated to `^11.5.1`: 11.18.0 is the npm the packages
      # were bootstrapped with by hand, so CI authenticates the way the registry
      # has already accepted, and a bad npm release cannot reach a publish job
      # on its own.
      - run: npm install -g npm@11.18.0

      - run: bun install --frozen-lockfile

      - id: version
        run: |
          node fusion/scripts/version.mjs \
            --domain "${{ matrix.target.domain }}" --bump "${{ matrix.target.level }}" --write

      # Before anything is published, and deliberately so. A version that has
      # been handed out must never be handed out again, whatever happens next:
      # npm refuses to publish over a version that exists, so a run that
      # publishes to `next` and then fails its template tests would otherwise
      # leave the same number to be computed again by the following merge, and
      # by every merge after that, until someone unpublished it by hand.
      #
      # Resuming onto the existing version instead would be worse. It would
      # promote the artifact that failed its tests, which is the single outcome
      # the tests exist to prevent.
      #
      # So the number is burned here and the release moves on to the next one.
      # `attempt` and not `v`: this tag says a number was used, while
      # `<domain>-v<version>` still means a release that actually promoted, and
      # only the second is what a changelog or a consumer should read.
      - name: Allocate the version before spending it
        run: |
          set -euo pipefail
          tag="${{ matrix.target.domain }}-attempt-v${{ steps.version.outputs.version }}"
          git tag "$tag" "${{ github.sha }}"
          git push origin "$tag"

      # Not `--frozen-lockfile`, and not optional. `bun pm pack` reads a
      # sibling's version from `bun.lock` rather than from that sibling's
      # manifest, so packing straight after stamping ships every package pinned
      # to the previous release. `publish.mjs` refuses when it sees it; this is
      # what stops it happening.
      - run: bun install

      - run: bun run build

      # **`analyze` is on the critical path of packing, and only since the
      # manifests stopped being tracked.** `files` names `custom-elements.json`
      # and the three framework typings, and `build` does not produce them:
      # turbo has `analyze` depending on `build`, not the other way round, so a
      # build alone leaves them absent and the tarball ships without files its
      # own manifest promises.
      - run: bun run analyze

      - name: Publish to staging
        run: node fusion/scripts/publish.mjs --domain "${{ matrix.target.domain }}" --tag next

      # The smoke test, against what was actually published rather than against
      # a rebuild of it: installed from the registry, from outside the
      # workspace, the way a consumer gets it.
      # **One token, on the two steps that need one and nowhere else.** These
      # packages are restricted, so an unauthenticated install 404s exactly as a
      # missing package would, and this is the only step that installs as a
      # consumer rather than publishing as the workflow.
      #
      # **It is the same secret the promote step takes**, and it is read-write
      # because promotion has to be. Splitting it into a read-only twin was
      # considered and is not worth a second secret to rotate: both steps run in
      # the same job on the same runner, so anything that could read one could
      # read the other.
      #
      # **It must not reach the publish step.** That authenticates by OIDC and
      # has to find no credential at all: `registry-url` on `setup-node` used to
      # leave an empty `_authToken` behind, npm read itself as configured, never
      # exchanged the token, and the registry refused the write as a 404. A
      # token in the job's environment would do the same thing on purpose, which
      # is why this sits on the step rather than on the job.
      #
      # `run-template-test.mjs` writes the `.npmrc` into the scratch project
      # itself when it sees this, so nothing outside that directory is
      # authenticated either.
      - name: Prove the staged release installs
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun run smoke:template --domain "${{ matrix.target.domain }}" --registry-tag next

      # **Only at `on`.** At `experimental` the version is published, proved and
      # left at the `next` dist-tag: it exists, a consumer can install it by
      # asking for it, and `latest` still points at whatever it pointed at
      # before. The number is already burnt by the attempt tag above, so
      # stopping here costs nothing and repeats nothing.
      # **Why this step has a credential at all.** Trusted publishing grants
      # `npm publish` and not `dist-tag add`: npm's publisher page offers
      # `npm publish` and `npm stage publish` and nothing else, and a promote by
      # OIDC came back `401` on the dist-tags endpoint. So moving a tag is not a
      # permission that exists there rather than one nobody granted.
      #
      # `publish.mjs` writes it to a temporary config it passes on the command
      # line, so it never reaches `~/.npmrc` or any other step.
      - name: Promote to production
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        if: vars.PUBLISHING == 'on'
        run: |
          node fusion/scripts/publish.mjs \
            --domain "${{ matrix.target.domain }}" \
            --promote latest \
            --version "${{ steps.version.outputs.version }}"

      # Last, because the tag is the record of a release that happened. Written
      # before promotion it would name one that might not have, which is exactly
      # what `experimental` does on purpose: a `helix-v*` tag means promoted, so
      # a run that stops at staging leaves only its `attempt` tag behind.
      # **The notes are built here rather than by `--generate-notes`, which is
      # wrong for this repository in two ways that no flag fixes.**
      #
      # It walks back to the most recent prior release rather than the most
      # recent release *of this domain*. With `helix-v*` and `cortex-v*`
      # interleaved, a Helix release that follows a Cortex one takes the Cortex
      # tag as its start, so the range is wrong every time both domains are
      # active. `--notes-start-tag` would fix that much.
      #
      # What it cannot do at all is filter by path. It lists every pull request
      # in the range whatever the change touched, so the Helix notes would carry
      # Cortex work. That is the thing per-domain lockstep exists to prevent,
      # and it is why the range is walked here instead.
      #
      # **One line per pull request, and the number is on the merge commit.**
      # The subjects are conventional now, so a note carries its `type(scope):`
      # into the changelog. That is the trade the move made and it is worth
      # naming: a reader loses two words at the front of every line and gains a
      # bump nothing can disagree with, because the thing that decides the
      # version is the thing that is read here rather than a label beside it.
      #
      # **This said the subjects already were the notes, and measured they are
      # not.** That reasoning assumed a squashed history, where each subject
      # ends in the `(#N)` GitHub links. Six of 1,910 subjects carry one and all
      # six are bot pull requests: every human one this repository has merged is
      # a merge commit. So `--no-merges` dropped the one commit carrying the
      # number and listed the branch's intermediate commits in its place, which
      # for #20 was ten lines, three of them fixes to fixes inside the branch.
      #
      # `--first-parent` is one line per merge. The number is in the merge
      # subject and the pull request title is the merge body, which is GitHub's
      # own format, so the two are recombined below into the line the paragraph
      # above promises. A commit pushed straight to `main` has no body and keeps
      # its subject, which is what it is.
      #
      # **The setting is the real invariant and it is not in this tree.** Flip
      # the repository to squash-only and every subject carries its own number;
      # flip it back and this reconstruction is what holds the notes together.
      # Worth a guard reading `gh api repos/{owner}/{repo}` for the merge
      # settings, which is not written here because it wants its own argument.
      - name: Record the release
        if: vars.PUBLISHING == 'on'
        run: |
          set -euo pipefail
          domain="${{ matrix.target.domain }}"
          tag="$domain-v${{ steps.version.outputs.version }}"

          # `helix-attempt-v*` does not match `helix-v*`, so a burnt number is
          # not mistaken for the last release. That is the same distinction
          # version computation reads, taken from the other side.
          prev=$(git tag --list "$domain-v*" --sort=-v:refname | head -1)

          # **The first release states its size rather than listing it.** With
          # no previous tag the range is the whole history, which is 1,202
          # commits under `helix/` as of 28 Aug 2026: a release body no one
          # reads and close enough to GitHub's size limit to fail on its own
          # one day. Naming the count says what is not listed, where a `head -n`
          # would have read as a complete list that happened to be short.
          # A merge commit's subject carries the number and its body is the
          # pull request title, so the two become one line. Anything else keeps
          # its subject.
          notes() {
            git log --first-parent --format='%H' "$@" | while read -r commit; do
              subject=$(git log -1 --format='%s' "$commit")
              case "$subject" in
                'Merge pull request #'*)
                  number=${subject#Merge pull request #}
                  number=${number%% *}
                  title=$(git log -1 --format='%b' "$commit" | sed -n '/./{p;q;}')
                  printf -- '- %s (#%s)\n' "${title:-$subject}" "$number"
                  ;;
                *) printf -- '- %s\n' "$subject" ;;
              esac
            done
          }

          if [ -n "$prev" ]; then
            notes "$prev..${{ github.sha }}" -- "$domain/" > notes.md
          else
            # **Written only when there is something to count.** Stating a
            # count of zero left a non-empty file, so the guard below could not
            # see it, the release body read `0 commits` as though that were a
            # result, and `${prev:-the first commit}` was unreachable because
            # the only way to an empty file went through the other branch.
            count=$(git log --first-parent --oneline "${{ github.sha }}" -- "$domain/" | wc -l | tr -d ' ')
            if [ "$count" -gt 0 ]; then
              printf 'First release. %s commits under `%s/` to here.\n' "$count" "$domain" > notes.md
            else
              : > notes.md
            fi
          fi

          # **Empty notes warn and do not fail.** This step is last because the
          # tag is the record of a release that happened, so failing it here
          # would leave packages promoted with nothing recording it: the worst
          # state of the three. A release can legitimately carry no commit under
          # `$domain/` when the bump came from a label and the change was in
          # `tooling/` or the root manifest, which belong to no domain path.
          if [ ! -s notes.md ]; then
            echo "::warning::No commit under $domain/ since ${prev:-the first commit}."
            echo "No change under \`$domain/\` in this release." > notes.md
          fi

          if [ -n "$prev" ]; then
            printf '\n[Compare with %s](%s/compare/%s...%s)\n' \
              "$prev" "${{ github.server_url }}/${{ github.repository }}" "$prev" "$tag" >> notes.md
          fi

          git tag "$tag" "${{ github.sha }}"
          git push origin "$tag"
          gh release create "$tag" --title "$tag" --notes-file notes.md

      # **The number goes back into the manifests, through the front door.**
      #
      # `version.mjs` argues the opposite and the reasoning was sound as far as
      # it went: a release commit pushed to `main` by CI needs a bot whose write
      # access outranks branch protection, which is a standing hole in the one
      # place the governance gate has to be strongest. What that argument missed
      # is that a pull request needs no such thing. `visual-baselines.yml`
      # already opens one for the same reason, and 272 worked out the one quirk
      # it has: a run on a branch a token pushed parks at `action_required` and
      # wants a click.
      #
      # **Only here, and only after everything else worked.** This step is last
      # in an official release, so a manifest only claims a number that was
      # staged, installed from the registry and promoted. Preview publishes
      # under `exp-*` stamp nothing back: they are not what a reader means by
      # the version.
      #
      # **The lockfile rides along, and has to.** `bun.lock` records a workspace
      # package's version nineteen times, so a manifest changed without it fails
      # `bun install --frozen-lockfile` on the pull request this very step opens.
      # The non-frozen `bun install` above already refreshed it in this runner,
      # which is why nothing is regenerated here.
      #
      # `chore` is deliberate: `bump.mjs` releases nothing for it, so stamping a
      # version cannot allocate the next one.
      - name: Stamp the version back into the manifests
        if: vars.PUBLISHING == 'on'
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            **/package.json
            bun.lock
          branch: release/stamp-${{ matrix.target.domain }}
          delete-branch: true
          commit-message: |
            chore(${{ matrix.target.domain }}): stamp ${{ steps.version.outputs.version }} into the manifests

            Written by `release.yml` after ${{ matrix.target.domain }}-v${{ steps.version.outputs.version }}
            published, installed from the registry and promoted to `latest`.

            The tag is still the record. This is the manifests agreeing with it,
            so a reader of the source sees the version that shipped rather than
            the resting `0.0.0-dev`.
          title: "chore(${{ matrix.target.domain }}): stamp ${{ steps.version.outputs.version }} into the manifests"
          body: |
            `${{ matrix.target.domain }}-v${{ steps.version.outputs.version }}` published, installed from the registry and promoted to `latest`. This carries the number back into the manifests so the source agrees with the tag.

            Opened as a pull request rather than pushed, so nothing needs write access that outranks branch protection.

            `bun.lock` is included because it records each workspace package's version, and a manifest changed without it fails `bun install --frozen-lockfile`.

            Merging is safe at any time: the next release computes its number from the tags, not from these files.
