# Merge to main, publish to staging, prove it, promote it.
#
# The model, the `vars.PUBLISHING` switch and the two tag prefixes are in
# [RELEASING.md](../RELEASING.md). Anything longer than a few lines is in
# `.github/scripts/`.

name: release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

# Held once. `engines.node` is the consumer floor; this is what CI runs on.
env:
  BUN_VERSION: "1.1.43"
  NODE_VERSION: "22.20.0"

jobs:
  # Which domains this merge releases, and by how much, read off the subjects it
  # brought. Never a label, and the range runs from the domain's last release
  # rather than from this merge: [RELEASING.md](../RELEASING.md#why-the-range-runs-from-the-tag).
  intent:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      domains: ${{ steps.resolve.outputs.domains }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch the tags, which carry the version
        run: git fetch --tags --force

      - name: Resolve the release intent
        id: resolve
        env:
          SHA: ${{ github.sha }}
        run: .github/scripts/resolve-intent.sh

  # The number a Helix release is about to take, for the binaries, which report
  # it and are built before the release job computes the same number from the
  # same tags. The release checks the two agree before anything publishes:
  # [RELEASING.md](../RELEASING.md#the-binary).
  helix-version:
    needs: intent
    if: >-
      contains(needs.intent.outputs.domains, '"helix"')
      && contains(fromJSON('["experimental", "on"]'), vars.PUBLISHING)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch the tags, which carry the version
        run: git fetch --tags --force

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache the installed dependencies
        uses: actions/cache@v6
        with:
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          path: ~/.bun/install/cache
          restore-keys: bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compute the version from the tags
        id: version
        env:
          DOMAINS: ${{ needs.intent.outputs.domains }}
        run: |
          set -euo pipefail
          level=$(jq -r '.[] | select(.domain == "helix") | .level' <<<"$DOMAINS")
          bun fusion/scripts/version.mjs --domain helix --bump "$level"

  binaries:
    needs: helix-version
    uses: ./.github/workflows/binaries.yml
    with:
      version: ${{ needs.helix-version.outputs.version }}

  # **Not held back by the binaries**, which only Helix ships: a Cortex release
  # goes ahead whatever they did, and Helix refuses in its first step. So the
  # condition is written out rather than left to the default, which skips a job
  # whose dependency was skipped, and on one line so it can carry the marker a
  # folded block cannot.
  release:
    needs: [intent, binaries]
    if: ${{ !cancelled() && needs.intent.result == 'success' && needs.intent.outputs.domains != '[]' && contains(fromJSON('["experimental", "on"]'), vars.PUBLISHING) }}  # dialect:quoted, GitHub's function
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      # One domain must not take the other down with it, and two domains must
      # not race to move the same tag.
      fail-fast: false
      max-parallel: 1
      matrix:
        target: ${{ fromJson(needs.intent.outputs.domains) }}
    environment: production
    permissions:
      # `id-token` is how the publish step authenticates: npm trusted
      # publishing exchanges a short-lived OIDC token for publish rights. The
      # one npm token is on the two steps trusted publishing cannot cover, the
      # install proof and the promotion, and never on the job. `contents` is for
      # the tag and the GitHub release that records it. The stamp-back does not
      # use this token at all: `main` requires a pull request, so a direct push
      # from `GITHUB_TOKEN` is declined, and the App installation token it uses
      # instead is minted in the step above and named in the branch rule's
      # bypass list.
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # Before a number is allocated, so a Helix release that cannot ship its
      # binary burns nothing.
      - name: Refuse Helix without its binaries
        if: matrix.target.domain == 'helix' && needs.binaries.result != 'success'
        run: |
          echo "::error::The binaries did not build (${{ needs.binaries.result }}), and every platform package ships one."
          exit 1

      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The version is computed from tags, and a checkout that has none reports
      # every release as the first one.
      - name: Fetch the tags, which carry the version
        run: git fetch --tags --force

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # **Node is here for npm and for nothing else.** Every script this workflow
      # runs is invoked with `bun`, which executes `.mjs` directly; what still
      # needs Node is the `npm` below, since trusted publishing is an npm feature
      # and npm is a Node program.
      #
      # Never add `registry-url` here: it writes an `.npmrc` that stops the OIDC
      # exchange and the refusal reports as a 404.
      # [RELEASING.md](../RELEASING.md#two-traps-in-the-runner-setup)
      - name: Install Node, which npm runs on
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 22.20.0 ships npm 10.9.x, which predates trusted publishing.
      # [RELEASING.md](../RELEASING.md#two-traps-in-the-runner-setup)
      - name: Install an npm that can do trusted publishing
        run: npm install -g npm@11.18.0

      # **Keyed on the lockfile, because that is what decides the answer.**
      # `setup-bun` caches the binary and not what it installs, so without this
      # every job pays a cold resolve of 518 packages.
      - name: Cache the installed dependencies
        uses: actions/cache@v6
        with:
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          path: ~/.bun/install/cache
          restore-keys: bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compute the version from the tags
        id: version
        run: |
          bun fusion/scripts/version.mjs \
            --domain "${{ matrix.target.domain }}" --bump "${{ matrix.target.level }}" --write

      # Before anything is published, and deliberately so. A version that has
      # been handed out must never be handed out again, whatever happens next:
      # npm refuses to publish over a version that exists, so a run that
      # publishes to `next` and then fails its template tests would otherwise
      # leave the same number to be computed again by the following merge, and
      # by every merge after that, until someone unpublished it by hand.
      #
      # Resuming onto the existing version instead would be worse. It would
      # promote the artifact that failed its tests, which is the single outcome
      # the tests exist to prevent.
      #
      # So the number is burned here and the release moves on to the next one.
      # `attempt` and not `v`: this tag says a number was used, while
      # `<domain>-v<version>` still means a release that actually promoted, and
      # only the second is what a changelog or a consumer should read.
      - name: Allocate the version before spending it
        run: |
          set -euo pipefail
          tag="${{ matrix.target.domain }}-attempt-v${{ steps.version.outputs.version }}"
          git tag "$tag" "${{ github.sha }}"
          git push origin "$tag"

      # Not `--frozen-lockfile`, and not optional. `bun pm pack` reads a
      # sibling's version from `bun.lock` rather than from that sibling's
      # manifest, so packing straight after stamping ships every package pinned
      # to the previous release. `publish.mjs` refuses when it sees it; this is
      # what stops it happening.
      - name: Install dependencies, lockfile free, so the stamped versions resolve
        run: bun install

      - name: Build
        run: bun run build

      # `files` names these and `build` does not produce them, turbo having
      # `analyze` depend on `build` rather than the reverse:
      # [RELEASING.md](../RELEASING.md#tokens-and-which-step-gets-one).
      - name: Write the manifests and framework typings
        run: bun run analyze

      - name: Fetch the binaries
        if: matrix.target.domain == 'helix'
        uses: actions/download-artifact@v8
        with:
          pattern: helix-cli-*
          path: ${{ runner.temp }}/binaries

      # `publish.mjs` then refuses one that is missing, is not executable, or
      # says a version other than this one.
      - name: Put each binary in its platform package
        if: matrix.target.domain == 'helix'
        run: .github/scripts/place-binaries.sh "$RUNNER_TEMP/binaries"

      - name: Publish to staging
        run: bun fusion/scripts/publish.mjs --domain "${{ matrix.target.domain }}" --tag next

      # Against what was published rather than a rebuild of it: installed from
      # the registry, from outside the workspace, the way a consumer gets it.
      # The token is on the step and must not reach the publish step, which
      # authenticates by OIDC: [RELEASING.md](../RELEASING.md#tokens-and-which-step-gets-one).
      - name: Prove the staged release installs
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun run smoke:template --domain "${{ matrix.target.domain }}" --registry-tag next

      # Only at `on`: `experimental` leaves the version at `next`, so `latest`
      # does not move. Trusted publishing grants `publish` and not `dist-tag add`,
      # which is why this step has a token:
      # [RELEASING.md](../RELEASING.md#tokens-and-which-step-gets-one).
      - name: Promote to production
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        if: vars.PUBLISHING == 'on'
        run: |
          bun fusion/scripts/publish.mjs \
            --domain "${{ matrix.target.domain }}" \
            --promote latest \
            --version "${{ steps.version.outputs.version }}"

      # Last, because the tag is the record of a release that happened. Written
      # before promotion it would name one that might not have, which is what
      # `experimental` does on purpose.
      #
      # **Not `--generate-notes`, and no flag fixes it.** It walks back to the
      # most recent prior release rather than the most recent one *of this
      # domain*, so an interleaved `cortex-v*` becomes the start of a Helix
      # range; `--notes-start-tag` would fix that much. What it cannot do at all
      # is filter by path, so the Helix notes would carry Cortex work, which is
      # the thing per-domain lockstep exists to prevent.
      #
      # `.github/scripts/record-release.sh` has the rest: why `--first-parent`,
      # and why an empty body warns rather than fails.
      - name: Record the release
        if: vars.PUBLISHING == 'on'
        env:
          DOMAIN: ${{ matrix.target.domain }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: .github/scripts/record-release.sh
      # The one step that writes to a branch. Why an App, why the ruleset rather
      # than the App is what makes it land, and what the bypass costs:
      # [RELEASING.md](../RELEASING.md#the-app-that-writes-to-main).
      - name: Mint a token that may write to `main`
        id: app
        if: vars.PUBLISHING == 'on'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.STAMP_APP_ID }}
          private-key: ${{ secrets.STAMP_APP_PRIVATE_KEY }}

      - name: Stamp the version back into the manifests
        if: vars.PUBLISHING == 'on'
        env:
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          APP_ID: ${{ vars.STAMP_APP_ID }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          DOMAIN: ${{ matrix.target.domain }}
          VERSION: ${{ steps.version.outputs.version }}
        run: .github/scripts/stamp-manifests.sh
