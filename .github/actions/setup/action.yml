# The four steps every job here starts with, held once.
#
# **The bun version comes from `packageManager`**, so the runtime CI runs on is
# the one the lockfile was written by and the one `bun install` refuses to
# disagree with. It was an `env` at the top of four workflow files, "held once"
# in each of them, and the four were the one number a bump had to find.
#
# **No cache of what it installs, because the registry is faster.** Measured
# on 10 Oct 2026, three runs each on the runners here: restoring the 422 MB of
# `~/.bun/install/cache` took 11 to 13 seconds and the install after it 1 to
# 2, where `bun install` from the registry with nothing restored took 5 to 9.
# The cache was one `tar` unpacking every file on one core, and bun fetches and
# unpacks in parallel. Every job pays this once, and the run's longest chain
# pays it twice. The entries it saved on `main` held 422 MB of the
# repository's 10 GB, which the Cargo caches now have.
#
# `--frozen-lockfile` so a lockfile that does not match `package.json` fails
# here rather than being quietly updated in CI and not on the machine that
# pushed.
#
# **`checkout` is not here and cannot be**: a local action is read from the
# checkout, so the step that fetches it has to run first.
name: Set up bun and the dependencies
description: Installs the bun `packageManager` names, then the workspace.

inputs:
  dependencies:
    description: Whether to run `bun install`. A job that only reads a script wants the runtime and nothing else.
    default: 'true'
    required: false
  helix:
    description: Whether to put the `helix` binary on disk, which `analyze` runs. A job that compiles the workspace itself, or builds nothing, turns it off.
    default: 'true'
    required: false

runs:
  using: composite
  steps:
    - name: Read the bun version off `packageManager`
      id: bun
      shell: bash
      run: |
        set -euo pipefail
        version=$(jq -r '.packageManager' package.json | cut -d@ -f2)
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Install bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ steps.bun.outputs.version }}

    - name: Install dependencies
      if: inputs.dependencies == 'true'
      shell: bash
      run: bun install --frozen-lockfile

    # After the install, because a job without the workspace installed cannot
    # run `analyze` and so has no use for the binary either.
    - name: Put the helix binary on disk
      if: inputs.dependencies == 'true' && inputs.helix == 'true'
      uses: ./.github/actions/helix
