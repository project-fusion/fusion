# The `helix` binary, on disk and named by `HELIX_BIN`, in any job that installs
# the workspace.
#
# **Every package's `analyze` runs it now.** The manifests used to come from
# `@custom-elements-manifest/analyzer`, which was JavaScript and ran anywhere bun
# did; they come from `helix manifest build`, which is Rust, and most jobs here
# have no toolchain and should not need one. `warm`, `packaging`, `floors`, the
# check shards, the browser shards and three release workflows all reach
# `analyze`, through `build` if not directly.
#
# **Restored from `actions/cache` rather than handed over by turbo**, though
# turbo's remote cache would restore it just as well. A Dependabot pull request
# gets no secrets and so no `TURBO_TOKEN`, and every job in it starts cold; this
# cache is the repository's own and reaches it anyway.
#
# **Keyed on what the binary is compiled from, and nothing else.** The crate, the
# two it depends on in this workspace, the lockfile and the toolchain. On a pull
# request that touches none of them this is one restore of a 27 MB file and no
# Rust at all; the first job to miss builds it and saves it for the rest, which
# in `verify` is `warm`, the job everything else waits on.
#
# `HELIX_BIN` is what `helix/cli/npm/bin.mjs` reads first, ahead of cargo, so a
# job that also has a toolchain runs this binary rather than compiling a second
# one from the same sources. Turbo passes it to the tasks it runs only because
# `turbo.json` names it in `globalPassThroughEnv`.
#
# **Built with optimizations, because `analyze` runs it three times in a row.**
# The core, headless and styled manifests each wait for the one before, and the
# debug binary took 20 seconds over the styled tier on a laptop where the
# optimized one took 3, for byte-identical output. On a runner the debug chain
# was about two minutes of `warm` and `warm-browser`, the two jobs every other
# job waits for. Link-time optimization stays off: it is for the binaries we
# ship, and here it would only make a rebuild slower.
#
# **One Cargo cache for every job that builds it**, `shared-key` below, so the
# optimized dependencies compiled once serve every job and every pull request.
# `seed` in `verify.yml` builds it on `main` when it is missing there, which is
# where a pull request reads it from.
name: Put the helix binary on disk
description: Restores the `helix` binary built from this tree, or builds and saves it, and points `HELIX_BIN` at it.

runs:
  using: composite
  steps:
    - name: Restore the helix binary
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        # `1.96` is the toolchain below, said again because a key cannot read a
        # step's input. A bump there without one here would restore a binary
        # the new toolchain did not build.
        key: helix-${{ runner.os }}-${{ runner.arch }}-1.96-release-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'helix/cli/Cargo.toml', 'helix/cli/src/**', 'helix/theme/Cargo.toml', 'helix/theme/src/**', 'helix/visual/Cargo.toml', 'helix/visual/src/**', 'fusion/rules/Cargo.toml', 'fusion/rules/src/**') }}
        path: target/ci/helix

    - name: Install Rust
      if: steps.restore.outputs.cache-hit != 'true'
      uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 14 Sep 2026
      with:
        toolchain: 1.96

    # A miss is a change to the Rust, so most of the dependency tree is as it
    # was: restoring it is what makes this seconds rather than minutes.
    - name: Restore the Cargo cache
      if: steps.restore.outputs.cache-hit != 'true'
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        # Keyed on the toolchain installed above, without the runner's own
        # `rustc`, for the reason the Rust job in `verify.yml` gives.
        add-rust-environment-hash-key: false
        prefix-key: v0-rust-1.96
        shared-key: helix-release

    - name: Build the helix binary
      if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      env:
        CARGO_PROFILE_RELEASE_LTO: 'false'
      run: |
        set -euo pipefail
        cargo build -p fusion-helix-cli --locked --release
        mkdir -p target/ci
        cp target/release/helix target/ci/helix

    - name: Save the helix binary
      if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.restore.outputs.cache-primary-key }}
        path: target/ci/helix

    - name: Point the shim at it
      shell: bash
      run: echo "HELIX_BIN=$GITHUB_WORKSPACE/target/ci/helix" >> "$GITHUB_ENV"
