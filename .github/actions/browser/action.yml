# Chromium and the system packages it links against, restored when they can be.
#
# **Fusion Locus's browser install, with Fusion's two facts.** The version is
# read off `bun.lock`, which every job has before it installs anything, and
# Playwright runs through `bunx`, since no job here installs Node. The cache
# keys are the ones `seed` in `verify.yml` looks up, so `main` keeps filling
# the caches every pull request reads. The reasoning for each step is in
# `locus/action/browser/action.yml`.
name: Install Chromium
description: Restores the Playwright browser for the version the lockfile holds, and its system packages for the runner image, and installs both.

runs:
  using: composite
  steps:
    - name: Read the Playwright version off the lockfile
      id: version
      shell: bash
      run: |
        set -euo pipefail
        version=$(grep -oE '"playwright-core@[^"]+"' bun.lock | head -1 | tr -d '"' | cut -d@ -f2)
        [ -n "$version" ] || { echo "::error::bun.lock names no playwright-core"; exit 1; }
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Install Chromium
      uses: ./locus/action/browser
      with:
        playwright: bunx playwright
        version: ${{ steps.version.outputs.version }}
