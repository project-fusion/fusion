# What gets watched, and the grouping is the point.
#
# **Ungrouped, this repository is a pull request per package per week.** The
# workspace publishes a package per tier with the site on top of them, so a
# Biome bump arrives once for the root and once for anything pinning it. A group
# is one pull request whose `verify` run either passes or does not, which is the
# only question being asked.
#
# **`github-actions` is the one that matters most and is easiest to forget.**
# `release.yml` and `release-experimental.yml` decide what is published and
# under whose authority, and a stale action there is a supply chain question
# rather than a maintenance one.
#
# **`@types/node` majors are ignored, and the reason is already a rule.**
# `fusion/cli/src/rules/node.rs` holds the type package to `engines.node`,
# because the types declare what the standard library has: a major ahead of the
# floor type-checks code using APIs added after the oldest Node this repository
# supports, nothing fails here, and the consumer on the floor gets a `TypeError`
# at run time for a call TypeScript approved. That rule's own comment says a
# dependency bot proposes this every time Node ships a major, and is right about
# the version and wrong about this repository.
#
# It was proposed anyway on 1 Sep 2026, `^22.10.0` to `^26.4.0` against a floor
# of 22.18, and the rule refused it. The rule caught it and the pull request came
# regardless, which is the judgment-per-pull-request the rule exists to end.
# Ignoring the major closes that loop; minors and patches still arrive.
#
# **Raising the floor is what unblocks it**, in that order, and that is a
# decision about who can install this rather than a maintenance chore.
#
# **The templates carry the same ignore, and for a sharper reason.** What they
# pin ships to every `helix new` project, so a major ahead of the floor
# type-checks a consumer's call to an API their Node does not have. The root's
# ignore never reached them, each being its own entry, and the same bump came
# through one of them on 1 Sep 2026 as #101.
#
# **luma.gl stays on 9.3 while cosmos.gl asks for it.** cosmos.gl 3.5.1 takes
# luma.gl as a peer at `~9.3.0`, and the production group of 12 Oct 2026
# proposed 9.4 beside it. Lift the ignore when cosmos.gl's range moves.
#
# **The root is `bun`, the ecosystem that reads `bun.lock`.** Under `npm`, every
# weekly run from 22 Sep 2026 on stopped at the lockfile: the `npm` updater
# cannot write `bun.lock`, and Dependabot's own error named `bun` as the fix.
#
# **The templates ignore Helix's own packages**, which each one pins as
# `^__HELIX_VERSION__` for `helix new` to fill in with the version it ships
# with. Dependabot read the placeholder as a broken requirement, and every
# template's run failed on those three packages.
# **Bun, Cargo, and the templates share one pull request a month.** A group
# cannot span ecosystems, so `groups` alone left one pull request each for
# production, development, Cargo, and every template. Each entry in the
# multi-ecosystem group needs its own `patterns`, and the group holds the
# schedule. Security updates do not wait for it.
#
# **`github-actions` keeps its own pull request, weekly**, for the reason above:
# it is the one that decides what is published, so it is read by itself.
version: 2
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: monthly
updates:
  - directory: /
    ignore:
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      - dependency-name: '@luma.gl/*'
        versions: ['>=9.4.0']
    multi-ecosystem-group: dependencies
    package-ecosystem: bun
    patterns: ['*']
  # The consumer templates are not workspace members, so the root entry never
  # sees them, and what they pin ships to every `helix new` project. Angular's
  # compiler, `vue-tsc`, and `svelte-check` each name the TypeScript they
  # take, so a TypeScript major is theirs to adopt first.
  - directory: /helix/templates/templates/angular
    ignore:
      - dependency-name: '@fusion.dev/*'
      - dependency-name: 'typescript'
        update-types: [version-update:semver-major]
    multi-ecosystem-group: dependencies
    package-ecosystem: npm
    patterns: ['*']
  - directory: /helix/templates/templates/react-nextjs
    ignore:
      - dependency-name: '@fusion.dev/*'
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    multi-ecosystem-group: dependencies
    package-ecosystem: npm
    patterns: ['*']
  - directory: /helix/templates/templates/react-vite
    ignore:
      - dependency-name: '@fusion.dev/*'
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    multi-ecosystem-group: dependencies
    package-ecosystem: npm
    patterns: ['*']
  - directory: /helix/templates/templates/solid-vite
    ignore:
      - dependency-name: '@fusion.dev/*'
    multi-ecosystem-group: dependencies
    package-ecosystem: npm
    patterns: ['*']
  - directory: /helix/templates/templates/svelte-vite
    ignore:
      - dependency-name: '@fusion.dev/*'
      - dependency-name: 'typescript'
        update-types: [version-update:semver-major]
    multi-ecosystem-group: dependencies
    package-ecosystem: npm
    patterns: ['*']
  - directory: /helix/templates/templates/vue-vite
    ignore:
      - dependency-name: '@fusion.dev/*'
      - dependency-name: 'typescript'
        update-types: [version-update:semver-major]
    multi-ecosystem-group: dependencies
    package-ecosystem: npm
    patterns: ['*']
  # **`wit-component` moves with `wasmtime`, so it is ignored here.** The tests
  # take it at the wasm-tools release `wasmtime` is built on, and a newer one
  # compiles a second `wasmparser` and `wasm-encoder`: 0.258 beside 0.260 until
  # October 16, 2026. The root `Cargo.toml` says so where it is pinned.
  - directory: /
    ignore:
      - dependency-name: 'wit-component'
    multi-ecosystem-group: dependencies
    package-ecosystem: cargo
    patterns: ['*']
  - directory: /
    groups:
      actions:
        patterns: ['*']
    package-ecosystem: github-actions
    schedule:
      interval: weekly
