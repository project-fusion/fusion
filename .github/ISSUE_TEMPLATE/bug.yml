body:
  - attributes:
      value:
        Before filing, check `fusion/docs/19-queue.md`. It is the outstanding work,
        with the reasoning, and it is a file rather than an issue list.
    type: markdown
  - attributes:
      description: What you did, what you expected, and what happened instead.
      placeholder:
        Set `shape="pill"` on `helix-button` and the corners stayed square.
      label: What happened
    id: what
    type: textarea
    validations:
      required: true
  - attributes:
      description:
        The smallest thing that shows it. A repository, a StackBlitz, or the
        markup and the CSS custom properties you set.
      label: How to reproduce it
    id: reproduce
    type: textarea
    validations:
      required: true
  - attributes:
      description: Which packages, and at what versions. `bun pm ls` prints them.
      placeholder: "@fusion.dev/helix 1.4.0, bun 1.1.43, Chrome 141"
      label: Versions
    id: versions
    type: textarea
    validations:
      required: true
  - attributes:
      description:
        Anything you tried that did not work, or the point at which you stopped
        being sure. This is more useful than it feels.
      label: What you already ruled out
    id: ruled-out
    type: textarea
    validations:
      required: false
description: Something does not work the way it is documented to work.
labels: [bug]
name: Bug
title: "[bug] "
