[package]
name = "fusion-cli"
description = "The Fusion command line: rules a workspace can be held to."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
# Its own, never `workspace = true`. See the note in the root manifest.
version = "0.0.0-dev"

# The binary drops the suffix, per the naming rule: the crate is `fusion-cli` and
# the command is `fusion`.
[[bin]]
name = "fusion"
path = "src/main.rs"

[dependencies]
# **What a rule is, and the runner that measures a set of them.** Shared with
# `fusion-helix-cli` and owned by neither product, so `helix` taking it is not a
# dependency on this domain: the crate's `lib.rs` carries the argument.
fusion-plugins = { workspace = true }
fusion-rules = { workspace = true }
clap = { version = "4", features = ["derive"] }
regex = { workspace = true }
# Every rule reads manifests, and `--json` is a contract on every verb.
serde = { workspace = true }
# `preserve_order` is not optional. Without it `serde_json::Map` is a `BTreeMap`,
# so `exports` conditions come back with `default` ahead of `types`, which is the
# precise fault the `order` rule exists to prevent.
serde_json = { workspace = true, features = ["preserve_order"] }

[dev-dependencies]
# Encodes the example plugin into a component, the way a plugin author's
# toolchain does: the end-to-end test takes the path an author takes.
wit-component = "0.260"

[lints]
workspace = true
