  - paragraph: Custom elements, built on Lit. Works in React, Vue, Svelte, or no framework at all.
  - heading "An interface is cheap to start and expensive to keep" [level=2]
  - paragraph: The first screen takes a morning. A second brand, a framework migration, and an accessibility audit take the rest of the year, and none of them is visible on the day you start. Helix is built for that later work.
