  - paragraph: Custom elements, built on Lit. Works in React, Vue, Svelte, or no framework at all.
  - figure:
    - img "What goes into Fusion and what comes out Your brand, your code and your decisions flow into Fusion. Out of it come Helix, which checks every screen, and Cortex, which keeps every decision with its reason.": What you bring your brand your code your decisions What comes out Helix every screen, checked Cortex every decision kept with its reason
  - heading "AI writes a screen in seconds, and every agent writes a different one" [level=2]
  - paragraph: Each agent chooses its own colors, spacing, and components. Your product drifts with every change, and nothing reports it. Helix gives every agent the same components and checks what each one writes.
