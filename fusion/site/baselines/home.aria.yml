  - paragraph: Package size
  - heading "Measured on every release" [level=2]
  - paragraph: From the built packages, compressed with Brotli as a CDN serves them.
  - paragraph: "113"
  - paragraph: Components
  - paragraph: Each has a headless tier with its behavior and a styled tier with its design.
  - paragraph: 2.3 kB
  - paragraph: The token layer, compressed
  - paragraph: 197 semantic tokens. Every Helix page loads this file.
  - paragraph: 127.3 kB
  - paragraph: The derivation engine, compressed
  - paragraph: Most sites run it when they build and ship none of it. A theme switcher downloads all of it.
  - paragraph: 77%
  - paragraph: Of the first component is shared
  - paragraph: Most of the first component is a runtime that every later component reuses.
  - heading "One button, five systems" [level=3]
  - paragraph: Brotli bytes for one button with its runtime, measured the same way on the same day.
  - link "See how we measure":
    - /url: /helix/docs/metrics
  - paragraph: Services
  - heading "One to eight weeks" [level=2]
  - paragraph: Every service runs two days a week, alongside your team.
  - paragraph: AI capability audit
  - paragraph: Up to two weeks to find out which AI work is worth building. It fits around your roadmap and does not commit you to more.
  - paragraph: Design system sprint
  - paragraph: Helix, applied to your product. We build your components in your repository, as working code.
  - paragraph: Conversational build
  - paragraph: We build software with you while the specification is still changing, and agree the next step in each conversation.
  - link "Compare the services":
    - /url: /company/services
  - paragraph: Working with us
  - heading "We build in your codebase" [level=2]
  - paragraph: The system is already built
  - paragraph: Helix already has its token layer, components, framework types, sandbox, and build checks. Your project starts from that.
  - paragraph: The work takes weeks
  - paragraph: A typical engagement is four weeks at two days a week. The same work started from nothing takes months.
  - paragraph: You keep all of it
  - paragraph: The work lands in your repository under your license. We hand it over as we go, so you do not need us on a retainer afterward.
  - paragraph: We tell you what is not done
  - paragraph: Every product shows its stage. Active means it ships to users. Building means work is underway and nothing has shipped. Declared means it is planned.
  - paragraph: Insights
  - heading "How we decide, and why" [level=2]
  - link "Read all articles":
    - /url: /insights
  - link "Design Decision Helix ships as one open tier Every Helix component is free and open source. A paid tier would hide components from the AI agents that write code with Helix.":
    - /url: /insights/helix-ships-as-one-open-tier
    - text: Design Decision
    - heading "Helix ships as one open tier" [level=3]
    - text: Every Helix component is free and open source. A paid tier would hide components from the AI agents that write code with Helix.
  - link "Design Essay A palette from one brand color Helix computes its palette from one brand color. Contrast follows from how the colors are computed, so no one has to review each pair.":
    - /url: /insights/a-palette-from-one-brand-color
    - text: Design Essay
    - heading "A palette from one brand color" [level=3]
    - text: Helix computes its palette from one brand color. Contrast follows from how the colors are computed, so no one has to review each pair.
  - link "Design Essay Why Helix has two tiers Large companies have many brands and frameworks. A team that needs a different look can use the headless tier and keep the same components, parts, and events.":
    - /url: /insights/why-helix-has-two-tiers
    - text: Design Essay
    - heading "Why Helix has two tiers" [level=3]
    - text: Large companies have many brands and frameworks. A team that needs a different look can use the headless tier and keep the same components, parts, and events.
  - link "Engineering Decision Lockstep versioning, one domain at a time The packages in each domain, such as Helix, share one version number, so a Cortex fix does not change the version of the Helix docs.":
    - /url: /insights/lockstep-per-domain
    - text: Engineering Decision
    - heading "Lockstep versioning, one domain at a time" [level=3]
    - text: The packages in each domain, such as Helix, share one version number, so a Cortex fix does not change the version of the Helix docs.
  - heading "Work with us" [level=2]
