- main:
  - text: Helix
  - heading "Interactive maps in your brand’s colors" [level=1]
  - paragraph: Add places, routes, and live positions to a map drawn by MapLibre or Leaflet, styled with your theme.
  - link "Get started":
    - /url: "#get-started"
  - link "Build your theme":
    - /url: /helix/theme?layout=map
  - group "Map of Austin":
    - region "Map"
    - img "Walker":
      - img
    - status: Walking to Rainey Street
    - button "UT Tower, passed"
    - button "Texas Capitol, passed"
    - button "Franklin Barbecue, passed"
