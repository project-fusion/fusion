    - text: helix-button
    - paragraph: Triggers an action, submits a form, or navigates.
    - table "Properties":
      - row "Prop Type Description"
      - text: command string Default "" What to send when the button is activated, and what to send it to.
      - link "Open the Invoker Commands specification":
        - /url: https://html.spec.whatwg.org/multipage/form-elements.html#attr-button-command
      - text: commandFor string Default "" The id of the element the command is sent to.
      - link "Open the Invoker Commands specification":
        - /url: https://html.spec.whatwg.org/multipage/form-elements.html#attr-button-commandfor
      - text: "commandForElement Element|null The element this button's command is sent to, resolved. disabled boolean Default false Whether the control is disabled and cannot be used. emphasis \"ghost\"|\"outlined\"|\"solid\"|\"subtle\" How much fill the control is drawn with. expanded boolean Whether this button is a disclosure trigger, and whether its panel is open. focusable boolean Default true Whether the button holds its group's tab stop. formAction string Default \"\" Where this button's submission goes, overriding the form's own. formEnctype string Default \"\" How the submission is encoded, overriding the form's own. formMethod string Default \"\" Which HTTP method the submission uses, overriding the form's own. formNoValidate boolean Default false Whether this submission skips the form's validation. formTarget string Default \"\" Which browsing context the response lands in, overriding the form's own. label string The button's name, read by screen readers, for a button whose content is not text. name string Default \"\" The name the control's value is submitted under. pending boolean Default false Whether the action the button started is still running. pendingLabel string Default \"Loading\" What a reader hears when the button becomes pending while it has focus. popup \"dialog\"|\"grid\"|\"listbox\"|\"menu\"|\"tree\" What kind of panel this button opens, where it opens one:"
      - code: menu
      - text: for a
      - code: Menu
      - text: . tone "accent"|"danger"|"neutral"|"primary" Which color the control is drawn in, by what it means. type "button"|"submit"|"reset" Default "button" What activating the button does to its form. value string Default "" The value this button submits under its own
      - code: name
      - text: ", as a native submit button does. width \"auto\"|\"full\" How much of the available width the button takes."
    - status
    - table "Read":
      - 'row "Read Read: Read-only. These report something the element worked out, and assigning to one throws, which is why they have no default. Type Description"':
        - text: Read
        - 'button "Read: Read-only. These report something the element worked out, and assigning to one throws, which is why they have no default."'
        - text: Type Description
      - text: form HTMLFormElement|null The form the control belongs to, or
      - code: "null"
      - text: .
      - link "Open the form-associated custom elements specification":
        - /url: https://html.spec.whatwg.org/multipage/custom-elements.html#form-associated-custom-elements
      - text: labels NodeList The labels associated with the control.
      - link "Open the form-associated custom elements specification":
        - /url: https://html.spec.whatwg.org/multipage/custom-elements.html#form-associated-custom-elements
      - text: validationMessage string The message the browser would show for the control, or an empty string. validity ValidityState Whether the control meets its constraints, and why not.
      - link "Open the ElementInternals.validity specification":
        - /url: https://developer.mozilla.org/docs/Web/API/ElementInternals/validity
      - text: whenSettled Promise<void> Resolves a frame after the first update, when transitions are switched on. willValidate boolean Whether the control is checked when its form is submitted.
    - status
    - table "Slot":
      - row "Slot Description"
      - text: (default) The button's label. end Content after the label. start Content before the label, usually an icon.
    - status
    - table "Event":
      - row "Event Type Description"
      - text: helix-press HelixPressEvent Fired when a press acts, with
      - code: detail.pointerType
      - text: saying what pressed the button.
    - status
    - table "Method":
      - row "Method Type Description"
      - text: checkValidity () => boolean Returns whether the control is valid, and fires
      - code: invalid
      - text: "on it when it is not. The control shows no message for it:"
      - code: reportValidity()
      - text: does that. click () => void Presses the button, as
      - code: click()
      - text: "presses a native one: the command is sent, the form submits or resets, and"
      - code: helix-press
      - text: says
      - code: virtual
      - text: ". focus (options: FocusOptions) => void Moves focus to the control, as focusing a native control does. reportValidity () => boolean Returns whether the control is valid, and when it is not, fires"
      - code: invalid
      - text: "and shows the browser's message at the control. setCustomValidity (message: string) => void Marks the control invalid with"
      - code: message
      - text: ", or clears that with an empty string, as on a native control. The form does not submit while it is set."
    - status
    - table "Part":
      - row "Part Description"
      - text: button The inner control. live The live region that says
      - code: pending-label
      - text: when the button becomes pending under focus. It is clipped out of view and still read. spinner The ring a pending button turns over its words, sized and colored by the
      - code: "--button-spinner-*"
      - text: hooks. text The button's words, which the styled button trims to their capitals and baseline so the letters sit at the middle in any font.
    - status
    - table "CSS Property":
      - row "CSS Property Description"
      - text: "--button-background-color Fill behind the button, in every state. --button-background-color-hover Fill behind the button under the pointer. Without it,"
      - code: "--button-background-color"
      - text: also applies on hover. --button-border-color Edge color of an outlined button. The other emphases draw no edge. --button-foreground-color Label and icon color. --button-gap Space between the label and the content on either side of it. --button-inline-size Minimum width. It inherits, so you can set it once on a section for every button inside it. --button-padding-inline Inline padding, for a container with spacing of its own. --button-radius Corner radius of the control. --button-radius-end Trailing corners, which a group flattens. --button-radius-end-end The bottom trailing corner, for a group stacking down. --button-radius-end-start The bottom leading corner, for a group stacking down. --button-radius-start Leading corners, which a group flattens. --button-radius-start-end The top trailing corner, for a group stacking down. --button-radius-start-start The top leading corner, for a group stacking down. --button-size Height of the control, for a row height outside the density steps. --button-spinner-color Color of the ring a pending button turns. It follows the label's color. --button-spinner-duration How long the ring takes to turn once. --button-spinner-size Size of the ring a pending button turns. Defaults to the size of its icons.
    - status
    - table "Custom state":
      - row "Custom state Description"
      - text: "pending The button is pending:"
      - code: pending
      - text: is set. A ring turns over its hidden words. pressed A Button Group in a selection mode has this button pressed. settled Set one frame after the first render. Transitions wait for it, so an element does not animate its own arrival.
    - status
