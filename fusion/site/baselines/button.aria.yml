      - text: The four tones, which mark what an action means.
      - link "Width":
        - /url: /helix/sandbox?e=button.width
      - text: Buttons at their own width, at a standard width set by
      - code: "--button-inline-size"
      - text: ", and at full width with"
      - code: width
      - text: .
      - link "With Slots":
        - /url: /helix/sandbox?e=button.with-slots
      - text: Icons at either end of the label, placed in the
      - code: start
      - text: and
      - code: end
      - text: slots.
