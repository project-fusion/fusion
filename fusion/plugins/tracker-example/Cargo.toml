[package]
name = "fusion-tracker-example"
description = "An example tracker, built the way somebody outside this repository would build one."
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.97"
version = "0.0.0-dev"

# **Its own workspace, which is what detaches it from the one above**, as the
# rule example's is: it compiles for `wasm32-unknown-unknown` and for nothing
# else.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = "0.57"

[profile.release]
opt-level = "s"
strip = true
