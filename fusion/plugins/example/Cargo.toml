[package]
name = "fusion-plugin-example"
description = "An example rule, built the way somebody outside this repository would build one."
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.96"
version = "0.0.0-dev"

# **Its own workspace, which is what detaches it from the one above.** Excluded
# there and standalone here: the two say the same thing and Cargo wants both.
[workspace]

# **Outside the workspace on purpose.** It compiles for `wasm32-unknown-unknown`
# and for nothing else, so a member of the workspace would be built for the host
# by every `cargo test` and fail on the bindings it generates.

[lib]
crate-type = ["cdylib"]

[features]
# **A plugin from the future, for the test that refuses one.** The refusal a
# host owes a module built against a world it does not speak cannot be measured
# without such a module, and a second example crate to hold four lines would be
# a worse way to have one.
future = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = "0.57"

[profile.release]
opt-level = "s"
strip = true
