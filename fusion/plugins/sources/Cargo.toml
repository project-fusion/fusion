[package]
name = "fusion-plugin-sources"
description = "The awp:sources world of the Agent Work Protocol: items read from a service since a cursor, and the suite every source passes."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
# Its own, never `workspace = true`: a version is a fact about a domain and this
# workspace holds two. A crate that inherits one fails the build.
version = "0.0.0-dev"

[dependencies]
fusion-plugin-host = { workspace = true, features = ["loader"] }
# **The item types serialize**, so a host stores what a source handed it as it
# was handed.
serde = { workspace = true }
# **The suite reads a binding's schema**, which is JSON.
serde_json = { workspace = true }

[lints]
workspace = true
