[package]
name = "fusion-plugin-tracker"
description = "The fusion:tracker world of the Fusion Work Protocol: a source that writes back, a reference tracker, and the suite every tracker passes."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
# Its own, never `workspace = true`: a version is a fact about a domain and this
# workspace holds two. A crate that inherits one fails the build.
version = "0.0.0-dev"

[dependencies]
fusion-plugin-host = { workspace = true, features = ["loader"] }
fusion-plugin-sources = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
# Encodes the example tracker into a component, as the rules world's tests do.
wit-component = { workspace = true }

[lints]
workspace = true
