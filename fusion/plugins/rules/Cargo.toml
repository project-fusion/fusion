[package]
name = "fusion-plugin-rules"
description = "The fusion:rules world: a rule written outside the command line that runs it, judging the payload it is handed."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
# Its own, never `workspace = true`: a version is a fact about a domain and this
# workspace holds two. A crate that inherits one fails the build.
version = "0.0.0-dev"

[dependencies]
fusion-plugin-host = { workspace = true, features = ["loader"] }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Encodes a core module into a component, which is what a plugin author's
# toolchain does for them. The tests build the example plugin the long way
# round so the path an author takes is the path that is measured.
wit-component = { workspace = true }

[lints]
workspace = true
