[package]
name = "fusion-plugins"
description = "The WASM host that runs a rule or a tool written outside this repository, and the address guard for what a plugin reaches."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
# Its own, never `workspace = true`: a version is a fact about a domain and this
# workspace holds two. A crate that inherits one fails the build.
version = "0.0.0-dev"

# **`wasm` is the rules and tools host, and `net` the address guard.** The
# desktop shell takes `net` alone, so its release build links no `wasmtime`.
# Cargo unifies features across a workspace build, so `cargo build
# --workspace` still compiles `wasmtime` once for every member.
[features]
default = ["wasm"]
net = ["dep:reqwest", "dep:tokio"]
wasm = [
  "dep:fusion-rules",
  "dep:serde",
  "dep:serde_json",
  "dep:sha2",
  "dep:url",
  "dep:wasmtime",
]

[dependencies]
fusion-rules = { workspace = true, optional = true }
# **The guard's resolver**, which hands the client only the addresses a
# grant lets through, and the lookup it runs.
reqwest = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
# **The digest the register prints.** A hash is a primitive with one right
# answer, and the crate that implements it is reviewed by more people than a
# copy in this file would be.
sha2 = { version = "0.11", optional = true }
# **The guard's lookup**, which resolves each name once.
tokio = { workspace = true, features = ["net"], optional = true }
# **The URL parser the HTTP client uses**, so the host a tool's fetch is
# checked against is the host it reaches.
url = { version = "2", optional = true }
# **The runtime, with a compiler and the interpreter rather than a JIT backend.**
# `cranelift` translates a module once per run and `pulley` executes the result
# without generating native code, which is the trade a check wants: a rule runs
# for milliseconds, so compiling to native buys nothing a portable interpreter
# does not already give, and the artifact stays the same on every platform.
wasmtime = { version = "49", default-features = false, optional = true, features = [
  "component-model",
  "cranelift",
  "pulley",
  "runtime",
  "std",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "net", "rt"] }
# Encodes a core module into a component, which is what a plugin author's
# toolchain does for them. The tests build the example plugin the long way
# round so the path an author takes is the path that is measured.
#
# **At the wasm-tools release `wasmtime` is built on**, which is 0.258 for
# `wasmtime` 49, so the tests and the host compile one `wasmparser` and one
# `wasm-encoder`. A newer one here builds a second copy of each. It moves with
# `wasmtime`, and `.github/dependabot.yml` leaves it to that bump.
wit-component = "0.258"

# The hosts' tests load `.wasm` modules, so they build with `wasm` alone.
[[test]]
name = "hosting"
required-features = ["wasm"]

[[test]]
name = "tools"
required-features = ["wasm"]

[lints]
workspace = true
