<helix-card
  aria-labelledby="profile-name"
  separation="outlined"
>
  <helix-flex
    align-items="center"
    gap="md"
    slot="header"
  >
    <helix-avatar name="Ada Lovelace"></helix-avatar>
    <helix-flex
      direction="column"
      gap="2xs"
    >
      <helix-text
        as="h2"
        id="profile-name"
        scale="subheading"
      >Ada Lovelace</helix-text>
      <helix-text
        emphasis="muted"
        scale="caption"
      >Lead engineer</helix-text>
    </helix-flex>
  </helix-flex>
  <helix-flex
    direction="column"
    gap="md"
  >
    <helix-text>Writes the first programs for engines that do not exist yet.</helix-text>
    <helix-list label="Skills">
      <helix-list-item>Analysis</helix-list-item>
      <helix-list-item>Mathematics</helix-list-item>
      <helix-list-item>Technical writing</helix-list-item>
    </helix-list>
  </helix-flex>
  <helix-button
    emphasis="solid"
    slot="footer"
    tone="primary"
  >Follow</helix-button>
</helix-card>
