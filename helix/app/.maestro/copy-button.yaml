# Copy Button: a press copies the preview's command and shows Copied in its
# tooltip for a moment, then the button is named Copy again; the label
# example draws its words beside the icon and swaps them for the result.
# The events example logs the copied text. Recorded.
# An iOS list row is one label, its name and its description, so a step
# matches a row by a part of its words, on either platform.
appId: dev.fusion.helix.app
name: Copy Button
tags:
  - interactions
---
- runFlow:
    file: open.yaml
    env:
      LINK: helix://copy-button/preview/preview
      SHOWS: Copy
# The first touch on a new screen is lost on the iOS simulator, as
# `button.yaml` says.
- tapOn:
    point: 50%, 90%
    retryTapIfNoChange: false
- startRecording: copy-button
# "Copied" stands 1.2 seconds. Without a limit, Maestro's tap waits for the screen
# to settle before the next step, and Android's clipboard preview rises in that
# time: 6.5 seconds in run 41356179392, whose video shows the check and "Copied"
# come and go inside the tap.
- tapOn:
    text: Copy
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 200
- extendedWaitUntil:
    visible: Copied
    timeout: 5000
- takeScreenshot: copy-button-copied
- extendedWaitUntil:
    notVisible: Copied
    timeout: 5000
- openLink: helix://copy-button/label/preview
- extendedWaitUntil:
    visible: Copy link
    timeout: 15000
- tapOn:
    text: Copy link
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 200
- extendedWaitUntil:
    visible: Copied
    timeout: 5000
- openLink: helix://copy-button/events/preview
- extendedWaitUntil:
    visible: .*No events yet.*
    timeout: 15000
- tapOn: Copy
- extendedWaitUntil:
    visible: .*Copied "bun add @fusion.dev/helix".*
    timeout: 5000
- stopRecording
