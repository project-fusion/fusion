# Drawer: the sheet opens from its button and a swipe down on its title
# takes it out; the list example's sheet, resting half open, opens further
# under a drag up on its list, scrolls its list once whole, and hands its
# drag back to the sheet only once the list stands at its top and has stood
# still. Recorded.
appId: dev.fusion.helix.app
name: Drawer
tags:
  - interactions
---
- runFlow:
    file: open.yaml
    env:
      LINK: helix://drawer/sheet/preview
      SHOWS: Open filters
# The first touch on a new screen is lost on the iOS simulator, as
# `button.yaml` says.
- tapOn:
    point: 50%, 90%
    retryTapIfNoChange: false
- startRecording: drawer
- tapOn: Open filters
- extendedWaitUntil:
    visible: .*Show projects by owner.*
    timeout: 5000
# The sheet rests half open, as the web's does, with its title low on the
# screen. Maestro drags from a title to 90% of the screen, which is too short
# to pass the snap point at a quarter, so this drag names its points, on the
# sheet's header.
- swipe:
    start: 50%, 86%
    end: 50%, 99%
    duration: 300
- extendedWaitUntil:
    notVisible: .*Show projects by owner.*
    timeout: 5000
- openLink: helix://drawer/list/preview
- extendedWaitUntil:
    visible: Open recent files
    timeout: 15000
- tapOn:
    point: 50%, 90%
    retryTapIfNoChange: false
- tapOn: Open recent files
- extendedWaitUntil:
    visible: .*Quarterly report.*
    timeout: 5000
# The sheet is still rising when its words first show, and this wait can end
# inside the rise.
- waitForAnimationToEnd:
    timeout: 3000
# Half open, a drag up on the list opens the sheet to the whole before the list
# scrolls. The whole sheet is 320 points, about a third of the screen. The drag names
# its points, on the first row and shorter than the rise, so nothing is left over to
# scroll the list. The first and the fourth file show together only in the whole
# sheet: half open, the fourth stands past the screen, and a scrolled list has lost
# the first.
- swipe:
    start: 50%, 94%
    end: 50%, 79%
    duration: 600
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: .*Quarterly report.*
- assertVisible: .*Brand guidelines.*
# Whole, a drag up scrolls the list, and it stays the list's after the finger
# leaves the list. This drag runs from the first row to 10% of the screen, past the
# list's top almost at once. It flings, so it can pass the sixth file: the first
# file gone is what it proves.
- swipe:
    from: .*Quarterly report.*
    direction: UP
    duration: 600
- extendedWaitUntil:
    notVisible: .*Quarterly report.*
    timeout: 5000
# Maestro's `scrollUntilVisible` drags from the middle of the screen, which is the
# scrim above this sheet, so these drags name points on the list.
- repeat:
    times: 12
    while:
      notVisible: .*Onboarding checklist.*
    commands:
      - swipe:
          start: 50%, 88%
          end: 50%, 76%
          duration: 300
- assertVisible: .*Onboarding checklist.*
- assertVisible: .*Recent files.*
- takeScreenshot: drawer-list-scrolled
# Back at its top, and still for half a second, a drag down takes the sheet.
- repeat:
    times: 12
    while:
      notVisible: .*Quarterly report.*
    commands:
      - swipe:
          start: 50%, 76%
          end: 50%, 88%
          duration: 300
- waitForAnimationToEnd:
    timeout: 3000
# A fling goes on to the next snap point, as core's `settleSwipe` has it on the web
# as well. This one is shorter than the half, so the sheet rests half open with its
# list still shown. A longer one would pass the half and take the sheet out.
- swipe:
    start: 50%, 78%
    end: 50%, 90%
    duration: 200
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: .*Quarterly report.*
- assertNotVisible: .*Brand guidelines.*
# A second fling from the header, which stands near 85% at half open, takes it out.
- swipe:
    start: 50%, 85%
    end: 50%, 99%
    duration: 200
- extendedWaitUntil:
    notVisible: .*Quarterly report.*
    timeout: 5000
- stopRecording
