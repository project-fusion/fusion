# The proof app, a project dashboard on Expo Router written once for the web
# and a phone: a row opens its project, each tab opens its route, the
# archive button archives, the outline goes to a section, the first crumb
# goes back to the list, and the header opens every project's activity,
# recorded. "Activity" and "Projects" are each a destination in the header
# first, so the tab and the crumb are the second of each.
appId: dev.fusion.helix.app
name: Proof app
tags:
  - interactions
---
- runFlow:
    file: open.yaml
    env:
      LINK: helix://proof
      SHOWS: 3 active, 1 at risk
# The first touch on a screen that has just opened is lost on the iOS
# simulator, as `tabs.yaml` says. A tap on the page's title takes it.
- tapOn:
    text: 3 active, 1 at risk
    retryTapIfNoChange: false
- startRecording: proof
# A row says its avatar, its words, and its status as one label.
- tapOn: .*Website redesign.*
- assertVisible: Progress
- assertVisible: Ada Okonjo
- tapOn:
    text: Activity
    index: 1
- assertVisible: Merged the pricing page
- tapOn: Settings
- assertVisible: Email when a task is overdue
# The outline's link goes to the archive section.
- tapOn: Archive
- scrollUntilVisible:
    element: Archive project
    direction: DOWN
- tapOn: Archive project
- extendedWaitUntil:
    visible: Website redesign is archived
    timeout: 10000
- scrollUntilVisible:
    element: Website redesign
    direction: UP
# That stops as soon as the page's title shows, with the crumbs still under
# the sticky header, where a press lands on the header. To the top of the page.
- swipe:
    start: 50%, 40%
    end: 50%, 85%
    duration: 300
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: Projects
    index: 1
- assertVisible: 3 active, 1 at risk
- tapOn:
    text: Activity
    index: 0
- assertVisible: 8 changes across every project
- stopRecording
