# Toolbar, each example drawn alone: a toolbar of icon buttons across and
# down. One screenshot of each, named by the example, `MODE`, and `SIZE`.
appId: dev.fusion.helix.app
name: "Screens: Toolbar"
---
- retry:
    maxRetries: 1
    commands:
      - openLink: helix://toolbar/preview/preview
- extendedWaitUntil:
    visible: '.*Italic.*'
    timeout: 30000
- takeScreenshot: toolbar-preview-${MODE}-${SIZE}
- openLink: helix://toolbar/vertical/preview
- extendedWaitUntil:
    visible: '.*Delete selection.*'
    timeout: 15000
- takeScreenshot: toolbar-vertical-${MODE}-${SIZE}
