# Scatter Chart, each example drawn alone, one screenshot of each, named by the
# example, `MODE`, and `SIZE`.
#
# The flow waits for the title of each screen, which no example before it draws.
appId: dev.fusion.helix.app
name: "Screens: Scatter Chart"
---
- retry:
    maxRetries: 1
    commands:
      - openLink: helix://scatter-chart/preview/preview
- extendedWaitUntil:
    visible: 'Preview'
    timeout: 30000
- takeScreenshot: scatter-chart-preview-${MODE}-${SIZE}
- openLink: helix://scatter-chart/dense/preview
- extendedWaitUntil:
    visible: 'Dense'
    timeout: 15000
- takeScreenshot: scatter-chart-dense-${MODE}-${SIZE}
- openLink: helix://scatter-chart/several-series/preview
- extendedWaitUntil:
    visible: 'Several Series'
    timeout: 15000
- takeScreenshot: scatter-chart-several-series-${MODE}-${SIZE}
- openLink: helix://scatter-chart/trend/preview
- extendedWaitUntil:
    visible: 'Trend'
    timeout: 15000
- takeScreenshot: scatter-chart-trend-${MODE}-${SIZE}
- openLink: helix://scatter-chart/with-a-legend/preview
- extendedWaitUntil:
    visible: 'With A Legend'
    timeout: 15000
- takeScreenshot: scatter-chart-with-a-legend-${MODE}-${SIZE}
