# Copy Button, each example drawn alone, at rest and with the result of a
# press standing, after the touch the iOS simulator loses on a new screen.
# One screenshot of each, named by the example, `MODE`, and `SIZE`.
appId: dev.fusion.helix.app
name: "Screens: Copy Button"
---
- retry:
    maxRetries: 1
    commands:
      - openLink: helix://copy-button/preview/preview
      - extendedWaitUntil:
          visible: Copy
          timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: copy-button-preview-${MODE}-${SIZE}
- tapOn:
    point: 50%, 90%
    retryTapIfNoChange: false
- tapOn: Copy
- extendedWaitUntil:
    visible: Copied
    timeout: 5000
- takeScreenshot: copy-button-preview-copied-${MODE}-${SIZE}
- openLink: helix://copy-button/label/preview
- extendedWaitUntil:
    visible: Copy link
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: copy-button-label-${MODE}-${SIZE}
