# Copy Button, each example drawn alone, at rest, and the result of a press,
# after the touch the iOS simulator loses on a new screen. "Copied" stands 1.6
# seconds, and in run 41367807734 Maestro's tap on Android outlasted it in every
# pass, so the result is pictured on the check `standing-copy`, which draws the
# same buttons with a confirmation that stands 20 seconds.
# One screenshot of each, named by the example, `MODE`, and `SIZE`.
appId: dev.fusion.helix.app
name: "Screens: Copy Button"
---
- retry:
    maxRetries: 1
    commands:
      - openLink: helix://copy-button/preview/preview
      - extendedWaitUntil:
          visible: Copy
          timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: copy-button-preview-${MODE}-${SIZE}
- openLink: helix://checks/standing-copy
- extendedWaitUntil:
    visible: Copy link
    timeout: 15000
- tapOn:
    point: 50%, 90%
    retryTapIfNoChange: false
- tapOn: Copy
- extendedWaitUntil:
    visible: Copied
    timeout: 5000
- takeScreenshot: copy-button-preview-copied-${MODE}-${SIZE}
- openLink: helix://copy-button/label/preview
- extendedWaitUntil:
    visible: Label
    timeout: 15000
- extendedWaitUntil:
    visible: Copy link
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: copy-button-label-${MODE}-${SIZE}
