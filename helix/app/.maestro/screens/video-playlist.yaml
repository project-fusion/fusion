# Video Playlist, each example drawn alone, one screenshot of each, named by the
# example, `MODE`, and `SIZE`.
#
# The flow waits for the title of each screen, which no example before it draws.
appId: dev.fusion.helix.app
name: "Screens: Video Playlist"
---
- retry:
    maxRetries: 1
    commands:
      - openLink: helix://video-playlist/preview/preview
- extendedWaitUntil:
    visible: 'Preview'
    timeout: 30000
- takeScreenshot: video-playlist-preview-${MODE}-${SIZE}
- openLink: helix://video-playlist/beside-the-player/preview
- extendedWaitUntil:
    visible: 'Beside The Player'
    timeout: 15000
- takeScreenshot: video-playlist-beside-the-player-${MODE}-${SIZE}
- openLink: helix://video-playlist/controlled/preview
- extendedWaitUntil:
    visible: 'Controlled'
    timeout: 15000
- takeScreenshot: video-playlist-controlled-${MODE}-${SIZE}
- openLink: helix://video-playlist/events/preview
- extendedWaitUntil:
    visible: 'Events'
    timeout: 15000
- takeScreenshot: video-playlist-events-${MODE}-${SIZE}
- openLink: helix://video-playlist/in-the-control-bar/preview
- extendedWaitUntil:
    visible: 'In The Control Bar'
    timeout: 15000
- takeScreenshot: video-playlist-in-the-control-bar-${MODE}-${SIZE}
- openLink: helix://video-playlist/placement/preview
- extendedWaitUntil:
    visible: 'Placement'
    timeout: 15000
- takeScreenshot: video-playlist-placement-${MODE}-${SIZE}
- openLink: helix://video-playlist/repeat-and-shuffle/preview
- extendedWaitUntil:
    visible: 'Repeat And Shuffle'
    timeout: 15000
- takeScreenshot: video-playlist-repeat-and-shuffle-${MODE}-${SIZE}
