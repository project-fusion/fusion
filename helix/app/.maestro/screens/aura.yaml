# Aura, each example drawn alone, one screenshot of each, named by the
# example, `MODE`, and `SIZE`.
#
# The flow waits for the title of each screen, which no example before it draws.
appId: dev.fusion.helix.app
name: "Screens: Aura"
---
- retry:
    maxRetries: 1
    commands:
      - openLink: helix://aura/preview/preview
- extendedWaitUntil:
    visible: 'Preview'
    timeout: 30000
- takeScreenshot: aura-preview-${MODE}-${SIZE}
- openLink: helix://aura/aurora/preview
- extendedWaitUntil:
    visible: 'Aurora'
    timeout: 15000
- takeScreenshot: aura-aurora-${MODE}-${SIZE}
