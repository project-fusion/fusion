# Spatial Treemap, each example drawn alone, one screenshot of each,
# named by the example, `MODE`, and `SIZE`.
#
# The flow waits for the title of each screen, which no example before it draws.
appId: dev.fusion.helix.app
name: "Screens: Spatial Treemap"
---
- retry:
    maxRetries: 1
    commands:
      - openLink: helix://spatial-treemap/preview/preview
- extendedWaitUntil:
    visible: 'Preview'
    timeout: 30000
- takeScreenshot: spatial-treemap-preview-${MODE}-${SIZE}
- openLink: helix://spatial-treemap/three/preview
- extendedWaitUntil:
    visible: 'Three'
    timeout: 15000
- takeScreenshot: spatial-treemap-three-${MODE}-${SIZE}
- openLink: helix://spatial-treemap/without-a-box/preview
- extendedWaitUntil:
    visible: 'Without a box'
    timeout: 15000
- takeScreenshot: spatial-treemap-without-a-box-${MODE}-${SIZE}
- openLink: helix://spatial-treemap/without-heights/preview
- extendedWaitUntil:
    visible: 'Without heights'
    timeout: 15000
- takeScreenshot: spatial-treemap-without-heights-${MODE}-${SIZE}
