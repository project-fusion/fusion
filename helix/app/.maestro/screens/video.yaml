# Video, each example drawn alone, one screenshot of each, named by the
# example, `MODE`, and `SIZE`.
#
# The flow waits for the title of each screen, which no example before it draws.
appId: dev.fusion.helix.app
name: "Screens: Video"
---
- retry:
    maxRetries: 1
    commands:
      - openLink: helix://video/preview/preview
- extendedWaitUntil:
    visible: 'Preview'
    timeout: 30000
- takeScreenshot: video-preview-${MODE}-${SIZE}
- openLink: helix://video/captions/preview
- extendedWaitUntil:
    visible: 'Captions'
    timeout: 15000
- takeScreenshot: video-captions-${MODE}-${SIZE}
- openLink: helix://video/events/preview
