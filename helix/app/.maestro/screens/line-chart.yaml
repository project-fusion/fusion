# Line Chart, each example drawn alone, one screenshot of each, named by the
# example, `MODE`, and `SIZE`.
#
# The flow waits for the title of each screen, which no example before it draws.
appId: dev.fusion.helix.app
name: "Screens: Line Chart"
---
- retry:
    maxRetries: 1
    commands:
      - openLink: helix://line-chart/preview/preview
- extendedWaitUntil:
    visible: 'Preview'
    timeout: 30000
- takeScreenshot: line-chart-preview-${MODE}-${SIZE}
- openLink: helix://line-chart/area/preview
- extendedWaitUntil:
    visible: 'Area'
    timeout: 15000
- takeScreenshot: line-chart-area-${MODE}-${SIZE}
- openLink: helix://line-chart/curves/preview
- extendedWaitUntil:
    visible: 'Curves'
    timeout: 15000
- takeScreenshot: line-chart-curves-${MODE}-${SIZE}
- openLink: helix://line-chart/emphasis/preview
