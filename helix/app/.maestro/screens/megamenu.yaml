# Megamenu, its examples drawn alone, closed and then open, after the touch
# the iOS simulator loses on a new screen. One screenshot of each, named by
# the example, `MODE`, and `SIZE`. An open panel is pictured from its top, and
# at the largest text size a flow scrolls it to the group further down.
# A press on Products lands near the word's start: at iOS's largest text size the
# word runs past the bar's clip, its middle stands outside the bar, and a press there
# reaches nothing (run 41381302660: the word at x 269 to 473, the bar ending at 364).
# Each example after the first is waited for by its title in the header first: a
# wait on words the example before also draws passes while the link is still opening,
# and pictures or presses the screen on its way out.
appId: dev.fusion.helix.app
name: "Screens: Megamenu"
---
- retry:
    maxRetries: 1
    commands:
      - openLink: helix://megamenu/preview/preview
      - extendedWaitUntil:
          visible: Products
          timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: megamenu-preview-${MODE}-${SIZE}
- tapOn:
    point: 50%, 90%
    retryTapIfNoChange: false
- tapOn:
    text: Products
    point: 10%, 50%
- extendedWaitUntil:
    visible: .*Plan and track work across teams.*
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: megamenu-preview-open-${MODE}-${SIZE}
- openLink: helix://megamenu/open-on-click/preview
- extendedWaitUntil:
    visible: 'Open On Click'
    timeout: 15000
- extendedWaitUntil:
    notVisible: .*Plan and track work across teams.*
    timeout: 15000
- extendedWaitUntil:
    visible: Products
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: megamenu-open-on-click-${MODE}-${SIZE}
- tapOn:
    point: 50%, 90%
    retryTapIfNoChange: false
- tapOn:
    text: Products
    point: 10%, 50%
- extendedWaitUntil:
    visible: .*Plan and track work across teams.*
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: megamenu-open-on-click-open-${MODE}-${SIZE}
- scrollUntilVisible:
    element: .*Reports.*
    timeout: 60000
    visibilityPercentage: 25
- openLink: helix://megamenu/several/preview
- extendedWaitUntil:
    visible: 'Several'
    timeout: 15000
- extendedWaitUntil:
    visible: Products
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: megamenu-several-${MODE}-${SIZE}
- tapOn:
    point: 50%, 90%
    retryTapIfNoChange: false
# Solutions runs off the bar at iOS's largest text size, and the bar scrolls. On
# iOS a swipe from Products aims at the word's middle, past the bar's clip, and
# moves nothing (run 41391811482: the word at x 269 to 473, the bar ending at 364),
# so the drag is by points on the bar, as a drag on the simulator moved it.
- runFlow:
    when:
      notVisible: Solutions
      platform: iOS
    commands:
      - swipe:
          start: 80%, 21%
          end: 20%, 21%
          duration: 800
- runFlow:
    when:
      notVisible: Solutions
      platform: Android
    commands:
      - swipe:
          from: Products
          direction: LEFT
# Where the bar's drag leaves the word running past the clip, its middle stands outside
# the bar, as Products' does above (run 41489332691: the word from x 269, the bar ending
# at 364), so the press lands near the word's start.
- tapOn:
    text: Solutions
    point: 10%, 50%
- extendedWaitUntil:
    visible: .*Engineering.*
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: megamenu-several-open-${MODE}-${SIZE}
- openLink: helix://megamenu/events/preview
- extendedWaitUntil:
    visible: 'Events'
    timeout: 15000
- extendedWaitUntil:
    visible: .*No events yet.*
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: megamenu-events-${MODE}-${SIZE}
- tapOn:
    point: 50%, 90%
    retryTapIfNoChange: false
- tapOn:
    text: Products
    point: 10%, 50%
- extendedWaitUntil:
    visible: .*helix-before-open.*
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: megamenu-events-open-${MODE}-${SIZE}
- openLink: helix://megamenu/band/preview
- extendedWaitUntil:
    visible: 'Band'
    timeout: 15000
- extendedWaitUntil:
    notVisible: .*helix-before-open.*
    timeout: 15000
- extendedWaitUntil:
    visible: Fusion
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: megamenu-band-${MODE}-${SIZE}
- tapOn:
    point: 50%, 90%
    retryTapIfNoChange: false
- tapOn:
    text: Products
    point: 10%, 50%
- extendedWaitUntil:
    visible: .*Plan and track work across teams.*
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: megamenu-band-open-${MODE}-${SIZE}
- scrollUntilVisible:
    element: .*Connect the tools your team uses.*
    timeout: 60000
    visibilityPercentage: 25
