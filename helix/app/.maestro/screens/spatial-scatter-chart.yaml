# Spatial Scatter Chart, each example drawn alone, one screenshot of each,
# named by the example, `MODE`, and `SIZE`.
#
# The flow waits for the title of each screen, which no example before it draws.
appId: dev.fusion.helix.app
name: "Screens: Spatial Scatter Chart"
---
- retry:
    maxRetries: 1
    commands:
      - openLink: helix://spatial-scatter-chart/preview/preview
- extendedWaitUntil:
    visible: 'Preview'
    timeout: 30000
- takeScreenshot: spatial-scatter-chart-preview-${MODE}-${SIZE}
- openLink: helix://spatial-scatter-chart/three/preview
- extendedWaitUntil:
    visible: 'Three'
    timeout: 15000
- takeScreenshot: spatial-scatter-chart-three-${MODE}-${SIZE}
- openLink: helix://spatial-scatter-chart/with-drop-lines/preview
- extendedWaitUntil:
    visible: 'With drop lines'
    timeout: 15000
- takeScreenshot: spatial-scatter-chart-with-drop-lines-${MODE}-${SIZE}
- openLink: helix://spatial-scatter-chart/without-a-box/preview
- extendedWaitUntil:
    visible: 'Without a box'
    timeout: 15000
- takeScreenshot: spatial-scatter-chart-without-a-box-${MODE}-${SIZE}
