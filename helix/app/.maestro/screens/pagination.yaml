# Pagination, its examples drawn alone, one screenshot of each, named by the
# example, `MODE`, and `SIZE`, and the row again once a gap has moved it.
appId: dev.fusion.helix.app
name: "Screens: Pagination"
---
- retry:
    maxRetries: 1
    commands:
      - openLink: helix://pagination/preview/preview
      - extendedWaitUntil:
          visible: Next page
          timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: pagination-preview-${MODE}-${SIZE}
- tapOn:
    point: 50%, 90%
    retryTapIfNoChange: false
- tapOn: Skip to page 9
- extendedWaitUntil:
    visible: Skip to page 5
    timeout: 5000
- takeScreenshot: pagination-preview-moved-${MODE}-${SIZE}
- openLink: helix://pagination/compact/preview
- extendedWaitUntil:
    visible: Next page
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: pagination-compact-${MODE}-${SIZE}
- openLink: helix://pagination/footer/preview
- extendedWaitUntil:
    visible: .*of 248.*
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: pagination-footer-${MODE}-${SIZE}
