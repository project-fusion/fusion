# Map, each example drawn alone, one screenshot of each, named by the
# example, `MODE`, and `SIZE`.
#
# The flow waits for the title of each screen, which no example before it
# draws, and which the screen draws whether MapLibre Native draws the map
# or the frame draws its still picture, then for the screen to stand still,
# since MapLibre Native draws its style and tiles after the screen is up.
appId: dev.fusion.helix.app
name: "Screens: Map"
---
- retry:
    maxRetries: 1
    commands:
      - openLink: helix://map/preview/preview
- extendedWaitUntil:
    visible: 'Preview'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: map-preview-${MODE}-${SIZE}
- openLink: helix://map/areas/preview
- extendedWaitUntil:
    visible: 'Areas'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: map-areas-${MODE}-${SIZE}
