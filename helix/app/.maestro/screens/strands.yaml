# Strands, each example drawn alone, one screenshot of each, named by the
# example, `MODE`, and `SIZE`.
#
# The flow waits for the title of each screen, which no example before it draws.
appId: dev.fusion.helix.app
name: "Screens: Strands"
---
- retry:
    maxRetries: 1
    commands:
      - openLink: helix://strands/preview/preview
- extendedWaitUntil:
    visible: 'Preview'
    timeout: 30000
- takeScreenshot: strands-preview-${MODE}-${SIZE}
- openLink: helix://strands/at/preview
- extendedWaitUntil:
    visible: 'At'
    timeout: 15000
- takeScreenshot: strands-at-${MODE}-${SIZE}
- openLink: helix://strands/colors/preview
- extendedWaitUntil:
    visible: 'Colors'
    timeout: 15000
- takeScreenshot: strands-colors-${MODE}-${SIZE}
- openLink: helix://strands/density-and-softness/preview
- extendedWaitUntil:
    visible: 'Density and softness'
    timeout: 15000
- takeScreenshot: strands-density-and-softness-${MODE}-${SIZE}
- openLink: helix://strands/depth-and-motion/preview
- extendedWaitUntil:
    visible: 'Depth and motion'
    timeout: 15000
- takeScreenshot: strands-depth-and-motion-${MODE}-${SIZE}
- openLink: helix://strands/travel/preview
- extendedWaitUntil:
    visible: 'Travel'
    timeout: 15000
- takeScreenshot: strands-travel-${MODE}-${SIZE}
- openLink: helix://strands/variants/preview
- extendedWaitUntil:
    visible: 'Variants'
    timeout: 15000
- takeScreenshot: strands-variants-${MODE}-${SIZE}
