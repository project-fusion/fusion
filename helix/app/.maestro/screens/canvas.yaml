# Canvas, each example drawn alone, one screenshot of each, named by the
# example, `MODE`, and `SIZE`.
#
# The flow waits for the title of each screen, which no example before it
# draws.
appId: dev.fusion.helix.app
name: "Screens: Canvas"
---
- retry:
    maxRetries: 1
    commands:
      - openLink: helix://canvas/preview/preview
- extendedWaitUntil:
    visible: 'Preview'
    timeout: 30000
- takeScreenshot: canvas-preview-${MODE}-${SIZE}
- openLink: helix://canvas/controlled/preview
- extendedWaitUntil:
    visible: 'Controlled'
    timeout: 15000
- takeScreenshot: canvas-controlled-${MODE}-${SIZE}
- openLink: helix://canvas/editing/preview
- extendedWaitUntil:
    visible: 'Editing'
    timeout: 15000
- takeScreenshot: canvas-editing-${MODE}-${SIZE}
- openLink: helix://canvas/flowchart/preview
- extendedWaitUntil:
    visible: 'Flowchart'
    timeout: 15000
- takeScreenshot: canvas-flowchart-${MODE}-${SIZE}
- openLink: helix://canvas/minimap/preview
- extendedWaitUntil:
    visible: 'Minimap'
    timeout: 15000
- takeScreenshot: canvas-minimap-${MODE}-${SIZE}
- openLink: helix://canvas/read-only/preview
- extendedWaitUntil:
    visible: 'Read only'
    timeout: 15000
- takeScreenshot: canvas-read-only-${MODE}-${SIZE}
- openLink: helix://canvas/styles/preview
- extendedWaitUntil:
    visible: 'Styles'
    timeout: 15000
- takeScreenshot: canvas-styles-${MODE}-${SIZE}
- openLink: helix://canvas/with-components/preview
- extendedWaitUntil:
    visible: 'With components'
    timeout: 15000
- takeScreenshot: canvas-with-components-${MODE}-${SIZE}
