# Sparkline, each example drawn alone: the three plots, the curves, emphasis,
# a table read by its id, the palette, the plots and weights, and the termini.
# One screenshot of each, named by the example, `MODE`, and `SIZE`.
#
# A sparkline is a drawing a screen reader reaches by its label alone, so the
# flow waits for the title of each screen, which no example before it draws.
appId: dev.fusion.helix.app
name: "Screens: Sparkline"
---
- retry:
    maxRetries: 1
    commands:
      - openLink: helix://sparkline/preview/preview
- extendedWaitUntil:
    visible: 'Preview'
    timeout: 30000
- takeScreenshot: sparkline-preview-${MODE}-${SIZE}
- openLink: helix://sparkline/curves/preview
- extendedWaitUntil:
    visible: 'Curves'
    timeout: 15000
- takeScreenshot: sparkline-curves-${MODE}-${SIZE}
- openLink: helix://sparkline/emphasis/preview
- extendedWaitUntil:
    visible: 'Emphasis'
    timeout: 15000
- takeScreenshot: sparkline-emphasis-${MODE}-${SIZE}
- openLink: helix://sparkline/from-a-table/preview
- extendedWaitUntil:
    visible: 'From A Table'
    timeout: 15000
- takeScreenshot: sparkline-from-a-table-${MODE}-${SIZE}
- openLink: helix://sparkline/palette/preview
- extendedWaitUntil:
    visible: 'Palette'
    timeout: 15000
- takeScreenshot: sparkline-palette-${MODE}-${SIZE}
- openLink: helix://sparkline/plots-and-weights/preview
- extendedWaitUntil:
    visible: 'Plots And Weights'
    timeout: 15000
- takeScreenshot: sparkline-plots-and-weights-${MODE}-${SIZE}
- openLink: helix://sparkline/termini/preview
- extendedWaitUntil:
    visible: 'Termini'
    timeout: 15000
- takeScreenshot: sparkline-termini-${MODE}-${SIZE}
