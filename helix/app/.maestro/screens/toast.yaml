# Toast, its examples drawn alone, each with its messages showing, and the
# preview again once a message is dismissed and the queue once the next
# message shows. One screenshot of each, named by the example, `MODE`, and
# `SIZE`. The stack stands at an edge of the window, so the touch the iOS
# simulator loses on a new screen lands in its middle.
appId: dev.fusion.helix.app
name: "Screens: Toast"
---
- retry:
    maxRetries: 1
    commands:
      - openLink: helix://toast/preview/preview
      - extendedWaitUntil:
          visible: Project saved.
          timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: toast-preview-${MODE}-${SIZE}
- tapOn:
    point: 50%, 40%
    retryTapIfNoChange: false
- tapOn:
    text: Dismiss
    index: 0
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: toast-preview-dismissed-${MODE}-${SIZE}
- openLink: helix://toast/arriving/preview
- extendedWaitUntil:
    visible: Two files were skipped.
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: toast-arriving-${MODE}-${SIZE}
- openLink: helix://toast/auto-dismiss/preview
- extendedWaitUntil:
    visible: Your export is ready to download.
    timeout: 15000
- takeScreenshot: toast-auto-dismiss-${MODE}-${SIZE}
- openLink: helix://toast/color-mode/preview
- extendedWaitUntil:
    visible: Project saved.
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: toast-color-mode-${MODE}-${SIZE}
- openLink: helix://toast/events/preview
- extendedWaitUntil:
    visible: .*No events yet.*
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: toast-events-${MODE}-${SIZE}
- openLink: helix://toast/queue/preview
- extendedWaitUntil:
    visible: Two files were uploaded.
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: toast-queue-${MODE}-${SIZE}
- tapOn:
    point: 50%, 40%
    retryTapIfNoChange: false
- tapOn:
    text: Dismiss
    index: 0
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: toast-queue-next-${MODE}-${SIZE}
# At the largest text size the stack stands taller than the window, with the
# newest message showing, and a drag down reaches the first message.
- openLink: helix://toast/tones/preview
- extendedWaitUntil:
    visible: Could not reach the server.
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: toast-tones-${MODE}-${SIZE}
- swipe:
    start: 50%, 35%
    end: 50%, 90%
    duration: 800
- extendedWaitUntil:
    visible: Export started.
    timeout: 15000
# The check `standing-undo` is the undo example with a message that stands a
# minute, since Maestro's tap on Android can outlast the example's 8 seconds, as
# `toast.yaml` says. iOS reads the row as one label, so its button is a point on
# that row, and Android reads the button by its own words.
- openLink: helix://checks/standing-undo
- extendedWaitUntil:
    visible: Quarterly report.pdf.*
    timeout: 15000
- tapOn:
    point: 50%, 40%
    retryTapIfNoChange: false
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: Quarterly report.pdf.*
          point: 83%, 50%
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          text: Archive
          index: 0
- extendedWaitUntil:
    visible: .*Archived Quarterly report.pdf.*
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: toast-undo-${MODE}-${SIZE}
