# Spatial Ribbon Chart, each example drawn alone, one screenshot of each,
# named by the example, `MODE`, and `SIZE`.
#
# The flow waits for the title of each screen, which no example before it draws.
appId: dev.fusion.helix.app
name: "Screens: Spatial Ribbon Chart"
---
- retry:
    maxRetries: 1
    commands:
      - openLink: helix://spatial-ribbon-chart/preview/preview
- extendedWaitUntil:
    visible: 'Preview'
    timeout: 30000
- takeScreenshot: spatial-ribbon-chart-preview-${MODE}-${SIZE}
- openLink: helix://spatial-ribbon-chart/three/preview
- extendedWaitUntil:
    visible: 'Three'
    timeout: 15000
- takeScreenshot: spatial-ribbon-chart-three-${MODE}-${SIZE}
- openLink: helix://spatial-ribbon-chart/without-a-box/preview
- extendedWaitUntil:
    visible: 'Without a box'
    timeout: 15000
- takeScreenshot: spatial-ribbon-chart-without-a-box-${MODE}-${SIZE}
