# Speed Dial, each example drawn alone, closed and then open, after the
# touch the iOS simulator loses on a new screen. One screenshot of each,
# named by the example, `MODE`, and `SIZE`.
appId: dev.fusion.helix.app
name: "Screens: Speed Dial"
---
- retry:
    maxRetries: 1
    commands:
      - openLink: helix://speed-dial/preview/preview
      - extendedWaitUntil:
          visible: Actions
          timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: speed-dial-preview-${MODE}-${SIZE}
- tapOn:
    point: 50%, 90%
    retryTapIfNoChange: false
- tapOn: Actions
- extendedWaitUntil:
    visible: Duplicate
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: speed-dial-preview-open-${MODE}-${SIZE}
- openLink: helix://speed-dial/placement/preview
- extendedWaitUntil:
    visible: Create
    timeout: 15000
- tapOn:
    point: 50%, 90%
    retryTapIfNoChange: false
- tapOn: Create
- extendedWaitUntil:
    visible: Folder
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: speed-dial-placement-${MODE}-${SIZE}
- openLink: helix://speed-dial/events/preview
- extendedWaitUntil:
    visible: Actions
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: speed-dial-events-${MODE}-${SIZE}
