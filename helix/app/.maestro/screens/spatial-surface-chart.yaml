# Spatial Surface Chart, each example drawn alone, one screenshot of each,
# named by the example, `MODE`, and `SIZE`.
#
# The flow waits for the title of each screen, which no example before it draws.
appId: dev.fusion.helix.app
name: "Screens: Spatial Surface Chart"
---
- retry:
    maxRetries: 1
    commands:
      - openLink: helix://spatial-surface-chart/preview/preview
- extendedWaitUntil:
    visible: 'Preview'
    timeout: 30000
- takeScreenshot: spatial-surface-chart-preview-${MODE}-${SIZE}
- openLink: helix://spatial-surface-chart/three/preview
- extendedWaitUntil:
    visible: 'Three'
    timeout: 15000
- takeScreenshot: spatial-surface-chart-three-${MODE}-${SIZE}
- openLink: helix://spatial-surface-chart/without-a-box/preview
- extendedWaitUntil:
    visible: 'Without a box'
    timeout: 15000
- takeScreenshot: spatial-surface-chart-without-a-box-${MODE}-${SIZE}
- openLink: helix://spatial-surface-chart/with-contours/preview
- extendedWaitUntil:
    visible: 'With contours'
    timeout: 15000
- takeScreenshot: spatial-surface-chart-with-contours-${MODE}-${SIZE}
