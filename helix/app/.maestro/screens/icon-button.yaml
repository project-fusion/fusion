# Icon Button, each example drawn alone: an icon button, each emphasis in
# three tones and a disabled one, and each tone. One screenshot of each, named by the example,
# `MODE`, and `SIZE`.
appId: dev.fusion.helix.app
name: "Screens: Icon Button"
---
- retry:
    maxRetries: 1
    commands:
      - openLink: helix://icon-button/preview/preview
- extendedWaitUntil:
    visible: '.*Settings.*'
    timeout: 30000
- takeScreenshot: icon-button-preview-${MODE}-${SIZE}
- openLink: helix://icon-button/emphasis/preview
- extendedWaitUntil:
    visible: 'Emphasis'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: icon-button-emphasis-${MODE}-${SIZE}
- openLink: helix://icon-button/tone/preview
- extendedWaitUntil:
    visible: 'Tone'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: icon-button-tone-${MODE}-${SIZE}
