# Icon Button, each example drawn alone: an icon button, then each tone and
# emphasis and a disabled one. One screenshot of each, named by the example,
# `MODE`, and `SIZE`.
appId: dev.fusion.helix.app
name: "Screens: Icon Button"
---
- retry:
    maxRetries: 1
    commands:
      - openLink: helix://icon-button/preview/preview
- extendedWaitUntil:
    visible: '.*Settings.*'
    timeout: 30000
- takeScreenshot: icon-button-preview-${MODE}-${SIZE}
- openLink: helix://icon-button/appearances/preview
- extendedWaitUntil:
    visible: '.*Open notes.*'
    timeout: 15000
- takeScreenshot: icon-button-appearances-${MODE}-${SIZE}
