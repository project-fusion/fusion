# Date Input, its examples drawn alone: the field, its segments, the calendar its
# trigger opens on the date it holds, the field after a pick, several dates as tags,
# a range, and a date the bounds refuse. One screenshot of each, named by the
# example, `MODE`, and `SIZE`. A control is named by its words, so each wait
# matches the words inside. Each example is waited for by words only it draws, its
# hint or its feedback: every example has a trigger named "Choose a date", so a wait
# on that passed on the example before while the link was still opening, and the
# press reached the trigger of a screen on its way out.
appId: dev.fusion.helix.app
name: "Screens: Date Input"
---
- retry:
    maxRetries: 1
    commands:
      - openLink: helix://date-input/preview/preview
      - extendedWaitUntil:
          visible: '.*Any weekday works.*'
          timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: date-input-preview-${MODE}-${SIZE}
- openLink: helix://date-input/segmented/preview
- extendedWaitUntil:
    visible: '.*Type the digits.*'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: date-input-segmented-${MODE}-${SIZE}
- tapOn:
    text: '.*Choose a date.*'
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: '.*August 2026.*'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: date-input-segmented-open-${MODE}-${SIZE}
- tapOn:
    text: '.*Tuesday, August 11, 2026.*'
    retryTapIfNoChange: false
- extendedWaitUntil:
    notVisible: '.*Next month.*'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: date-input-segmented-picked-${MODE}-${SIZE}
- openLink: helix://date-input/multiple/preview
- extendedWaitUntil:
    visible: '.*Choose one or more dates.*'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: date-input-multiple-${MODE}-${SIZE}
- openLink: helix://date-input/range/preview
- extendedWaitUntil:
    visible: '.*Choose a start and end date.*'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: date-input-range-${MODE}-${SIZE}
- openLink: helix://date-input/invalid/preview
- extendedWaitUntil:
    visible: '.*(Your plan starts on this date|on or after August 1, 2026).*'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: date-input-invalid-${MODE}-${SIZE}
