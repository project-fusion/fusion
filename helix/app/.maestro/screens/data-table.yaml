# Data Table, its examples drawn alone, one screenshot of each, named by the
# example, `MODE`, and `SIZE`, and the rows again once a press has moved them.
# A cell is named by its column and its words, `Name: archive.tar.gz`, which iOS
# reads in place of the words, and a checkbox's name carries its state on
# Android, `Select every row, mixed`, so each wait matches the words inside.
appId: dev.fusion.helix.app
name: "Screens: Data Table"
---
- retry:
    maxRetries: 1
    commands:
      - openLink: helix://data-table/preview/preview
      - extendedWaitUntil:
          visible: '.*archive\.tar\.gz'
          timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: data-table-preview-${MODE}-${SIZE}
- tapOn:
    text: Next page
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: '.*profile\.bin'
    timeout: 20000
- takeScreenshot: data-table-preview-page-two-${MODE}-${SIZE}
- openLink: helix://data-table/selecting-and-arranging/selecting-and-arranging
- extendedWaitUntil:
    visible: 'Select every row.*'
    timeout: 30000
- takeScreenshot: data-table-selecting-${MODE}-${SIZE}
- openLink: helix://data-table/column-menu/column-menu
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: data-table-column-menu-${MODE}-${SIZE}
# The first touch on a screen that has just opened is lost on the iOS simulator,
# as `button.yaml` says, and a press while a sheet still rises lands on its scrim.
- tapOn:
    point: 50%, 90%
    retryTapIfNoChange: false
- tapOn:
    text: File column menu
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: Sort descending
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: Sort descending
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: '.*asset-018\.webp'
    timeout: 20000
- takeScreenshot: data-table-column-menu-descending-${MODE}-${SIZE}
- openLink: helix://data-table/nested-rows/nested-rows
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: data-table-nested-rows-${MODE}-${SIZE}
