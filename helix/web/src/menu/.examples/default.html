<!-- A submenu replaces the page rather than opening beside it. One panel
     that changes what it holds needs no diagonal path for a pointer to
     travel, does not run off a narrow window, and works on a screen with no
     hover at all. -->
<helix-menu label="View">
  <helix-button slot="trigger">View</helix-button>

  <helix-menu-item value="layout">
    Layout
    <helix-menu-item checkable checked slot="submenu" value="padded">
      Padded
    </helix-menu-item>
    <helix-menu-item checkable slot="submenu" value="centered">
      Centered
    </helix-menu-item>
  </helix-menu-item>

  <helix-divider announced></helix-divider>

  <helix-menu-item checkable checked value="panel">Panel</helix-menu-item>
  <helix-menu-item checkable value="status">Status bar</helix-menu-item>
</helix-menu>
