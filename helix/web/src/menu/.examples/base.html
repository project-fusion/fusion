<!-- @summary The same menu on the headless tier, with every rule written by hand. -->

<link
  href="styles.css"
  rel="stylesheet"
/>

<helix-base-menu label="Menu">
  <helix-base-button slot="trigger">Menu</helix-base-button>

  <helix-base-menu-item value="one">
    Item One
    <helix-base-menu-item
      checkable
      checked
      slot="submenu"
      value="one-a"
    >
      Option One
    </helix-base-menu-item>
    <helix-base-menu-item
      checkable
      slot="submenu"
      value="one-b"
    >
      Option Two
    </helix-base-menu-item>
  </helix-base-menu-item>

  <helix-base-divider announced></helix-base-divider>

  <helix-base-menu-item
    checkable
    checked
    value="two"
  >Item Two</helix-base-menu-item>
  <helix-base-menu-item
    checkable
    value="three"
  >Item Three</helix-base-menu-item>
</helix-base-menu>
