<link
  href="disabled.css"
  rel="stylesheet"
>

<helix-flex
  direction="column"
  gap="lg"
>
  <helix-listbox
    default-value="two"
    disabled
    hint="Hint"
    label="Written off"
    name="a"
  >
    <helix-option value="one">Option One</helix-option>
    <helix-option value="two">Option Two</helix-option>
  </helix-listbox>

  <!-- The same state, arriving from an ancestor fieldset. -->
  <fieldset disabled>
    <helix-listbox
      default-value="one"
      hint="Hint"
      label="Off from the fieldset"
      name="b"
    >
      <helix-option value="one">Option One</helix-option>
      <helix-option value="two">Option Two</helix-option>
    </helix-listbox>
  </fieldset>
</helix-flex>
