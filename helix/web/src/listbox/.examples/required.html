<!-- @summary A list that wants an answer before the form will submit. -->
<!-- Preview frame: the submit is swallowed. -->
<form onsubmit="event.preventDefault()">
  <helix-flex
    direction="column"
    gap="sm"
  >
    <helix-listbox
      hint="What they will be able to do"
      label="Role"
      name="role"
      required
    >
      <helix-option value="viewer">Viewer</helix-option>
      <helix-option value="editor">Editor</helix-option>
    </helix-listbox>
    <helix-button
      appearance="solid"
      tone="primary"
      type="submit"
    >Invite</helix-button>
  </helix-flex>
</form>
