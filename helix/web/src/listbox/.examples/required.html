<!-- `onsubmit` because a form that validates is a form that eventually submits,
     and this one is in a preview frame. -->
<form onsubmit="event.preventDefault()">
  <helix-flex direction="column" gap="sm">
    <helix-listbox hint="What they will be able to do" label="Role" name="role" required>
      <helix-option value="viewer">Viewer</helix-option>
      <helix-option value="editor">Editor</helix-option>
    </helix-listbox>
    <helix-button appearance="primary" type="submit">Invite</helix-button>
  </helix-flex>
</form>
