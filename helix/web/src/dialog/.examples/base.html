<!-- @summary The same dialog on the headless tier, with every rule written by hand. -->

<link
  href="styles.css"
  rel="stylesheet"
/>

<helix-base-button
  command="--show"
  commandfor="base-confirm"
>Delete project</helix-base-button>

<helix-base-dialog
  id="base-confirm"
  label="Delete project"
>
  <h2 slot="header">Delete project</h2>
  <p>This removes the project and everything in it. It cannot be undone.</p>
  <div slot="footer">
    <helix-base-button
      command="--close"
      commandfor="base-confirm"
    >Delete</helix-base-button>
    <helix-base-button
      command="--close"
      commandfor="base-confirm"
    >Cancel</helix-base-button>
  </div>
</helix-base-dialog>
