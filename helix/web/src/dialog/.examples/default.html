<helix-button
  appearance="primary"
  command="--show"
  commandfor="confirm"
>Delete project</helix-button>

<helix-dialog
  id="confirm"
  label="Delete project"
>
  <h2 slot="header">Delete project</h2>
  This removes the project and everything in it. It cannot be undone.
  <helix-flex
    gap="sm"
    slot="footer"
  >
    <helix-button
      appearance="danger"
      command="--close"
      commandfor="confirm"
    >Delete</helix-button>
    <helix-button
      appearance="secondary"
      command="--close"
      commandfor="confirm"
    >Cancel</helix-button>
  </helix-flex>
</helix-dialog>
