<helix-button
  appearance="primary"
  command="--show"
  commandfor="confirm"
>Delete project</helix-button>

<helix-dialog
  id="confirm"
  label="Delete project"
>
  <helix-text
    as="h2"
    slot="header"
  >Delete project</helix-text>
  <helix-text>This removes the project and everything in it. It cannot be undone.</helix-text>
  <helix-flex
    gap="sm"
    slot="footer"
  >
    <helix-button
      appearance="danger"
      command="--close"
      commandfor="confirm"
      fill="standard"
    >Delete</helix-button>
    <helix-button
      appearance="secondary"
      command="--close"
      commandfor="confirm"
      fill="standard"
    >Cancel</helix-button>
  </helix-flex>
</helix-dialog>
