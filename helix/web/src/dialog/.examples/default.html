<helix-button appearance="primary" command="--show" commandfor="confirm">
  Delete project
</helix-button>

<helix-dialog id="confirm" label="Delete project">
  <h2 slot="header">Delete project</h2>
  This removes the project and everything in it. It cannot be undone.
  <helix-flex slot="footer">
    <helix-button appearance="tertiary" fill="standard" command="--close" commandfor="confirm">
      Cancel
    </helix-button>
    <helix-button appearance="danger" fill="standard" command="--close" commandfor="confirm">
      Delete
    </helix-button>
  </helix-flex>
</helix-dialog>
