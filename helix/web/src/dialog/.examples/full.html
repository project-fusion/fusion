<helix-button
  appearance="primary"
  command="--show"
  commandfor="full-dialog"
>Open dialog</helix-button>

<helix-dialog
  id="full-dialog"
  label="Dialog Title"
  size="full"
>
  <h2 slot="header">Dialog Title</h2>
  Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor
  incididunt ut labore et dolore magna aliqua.
  <helix-flex
    gap="sm"
    slot="footer"
  >
    <helix-button
      appearance="primary"
      command="--close"
      commandfor="full-dialog"
    >Save</helix-button>
    <helix-button
      appearance="secondary"
      command="--close"
      commandfor="full-dialog"
    >Cancel</helix-button>
  </helix-flex>
</helix-dialog>
