<helix-flex gap="sm">
  <helix-button appearance="secondary" command="--show" commandfor="compact-dialog">
    Compact
  </helix-button>
  <helix-button appearance="secondary" command="--show" commandfor="wide-dialog">
    Wide
  </helix-button>
</helix-flex>

<helix-dialog appearance="compact" id="compact-dialog" label="Compact">
  <h2 slot="header">Compact</h2>
  Narrow, for a question with one answer.
  <helix-flex slot="footer">
    <helix-button appearance="primary" fill="standard" command="--close" commandfor="compact-dialog">
      Done
    </helix-button>
  </helix-flex>
</helix-dialog>

<helix-dialog appearance="wide" id="wide-dialog" label="Wide">
  <h2 slot="header">Wide</h2>
  Room for a form, a table, or anything that needs the width to be read.
  <helix-flex slot="footer">
    <helix-button appearance="primary" fill="standard" command="--close" commandfor="wide-dialog">
      Done
    </helix-button>
  </helix-flex>
</helix-dialog>
