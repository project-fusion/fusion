<helix-button
  appearance="primary"
  command="--show"
  commandfor="large-dialog"
>Open dialog</helix-button>

<helix-dialog
  id="large-dialog"
  label="Dialog Title"
  size="lg"
>
  <helix-text
    as="h2"
    slot="header"
  >Dialog Title</helix-text>
  <helix-text>Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor
  incididunt ut labore et dolore magna aliqua.</helix-text>
  <helix-flex
    gap="sm"
    slot="footer"
  >
    <helix-button
      appearance="primary"
      command="--close"
      commandfor="large-dialog"
      fill="standard"
    >Save</helix-button>
    <helix-button
      appearance="secondary"
      command="--close"
      commandfor="large-dialog"
      fill="standard"
    >Cancel</helix-button>
  </helix-flex>
</helix-dialog>
