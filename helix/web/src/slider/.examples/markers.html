<!-- A count rather than a flag tied to `step`. A flag reads well until a slider
     from zero to a hundred stepping by one asks for a hundred and one ticks,
     and then it is either noise or a silent refusal to draw.

     Each mark is snapped to a step before it is placed, so a mark is never
     somewhere the thumb cannot go. Where the spacing and the step disagree it
     is the spacing that gives way, which is the honest picture of what is on
     offer. -->
<helix-flex direction="column" gap="xl">
  <helix-slider
    label="Label"
    marker-labels
    markers="5"
    max="100"
    min="0"
    step="25"
    value="50"
  ></helix-slider>

  <helix-slider hint="Hint" label="Label" markers="5" max="100" show-value value="40"></helix-slider>
</helix-flex>
