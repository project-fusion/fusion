<link rel="stylesheet" href="disabled.css">

<helix-flex direction="column" gap="lg">
  <helix-slider disabled hint="Hint" label="Written off" show-value default-value="40"></helix-slider>

  <!-- And the same state arriving from above. A `<fieldset disabled>` switches
       every control inside it off, which the platform reports through
       `formDisabledCallback`: nothing writes an attribute onto anything here. -->
  <fieldset disabled>
    <helix-slider hint="Hint" label="Off from the fieldset" show-value default-value="70"></helix-slider>
  </fieldset>
</helix-flex>
