<helix-flex
  direction="column"
  gap="xl"
>
  <helix-carousel
    indicator-placement="block-start"
    label="Above"
  >
  <helix-callout severity="info">Slide One</helix-callout>
  <helix-callout severity="success">Slide Two</helix-callout>
  <helix-callout severity="warning">Slide Three</helix-callout>
  </helix-carousel>

  <helix-carousel
    indicator-placement="inline-start"
    label="Beside, near"
  >
  <helix-callout severity="info">Slide One</helix-callout>
  <helix-callout severity="success">Slide Two</helix-callout>
  <helix-callout severity="warning">Slide Three</helix-callout>
  </helix-carousel>

  <helix-carousel
    indicator-placement="inline-end"
    label="Beside, far"
  >
  <helix-callout severity="info">Slide One</helix-callout>
  <helix-callout severity="success">Slide Two</helix-callout>
  <helix-callout severity="warning">Slide Three</helix-callout>
  </helix-carousel>
</helix-flex>
