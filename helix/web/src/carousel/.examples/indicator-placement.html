<helix-flex
  direction="column"
  gap="xl"
>
  <helix-carousel
    indicator-placement="start"
    label="Start"
  >
  <helix-callout severity="info">Slide One</helix-callout>
  <helix-callout severity="success">Slide Two</helix-callout>
  <helix-callout severity="warning">Slide Three</helix-callout>
  </helix-carousel>

  <helix-carousel
    indicator-placement="center"
    label="Center"
  >
  <helix-callout severity="info">Slide One</helix-callout>
  <helix-callout severity="success">Slide Two</helix-callout>
  <helix-callout severity="warning">Slide Three</helix-callout>
  </helix-carousel>

  <helix-carousel
    indicator-placement="end"
    label="End"
  >
  <helix-callout severity="info">Slide One</helix-callout>
  <helix-callout severity="success">Slide Two</helix-callout>
  <helix-callout severity="warning">Slide Three</helix-callout>
  </helix-carousel>
</helix-flex>
