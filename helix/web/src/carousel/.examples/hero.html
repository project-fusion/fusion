<!-- The arrows sit on the slides rather than under them, which is what a
     full-bleed carousel wants: the slide is the page and the controls are on
     it. They keep a surface of their own, because an arrow drawn straight onto
     a photograph is legible against about half of one.

     The indicators are below and are real controls: click one, or reach the row
     with Tab and move along it with the arrow keys. -->
<helix-carousel appearance="hero" label="Highlights" loop>
  <div style="aspect-ratio: 16 / 7; background: #4a7fe0"></div>
  <div style="aspect-ratio: 16 / 7; background: #2f9e6b"></div>
  <div style="aspect-ratio: 16 / 7; background: #c0553f"></div>
</helix-carousel>
