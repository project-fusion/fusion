<!-- @summary The same speed dial on the headless tier, with every rule written by hand. -->

<link
  href="styles.css"
  rel="stylesheet"
/>

<link
  href="styles.css"
  rel="stylesheet"
>

<div class="page">
  <helix-base-speed-dial
    data-dock="bottom-end"
    data-dock-within
    label="Actions"
  >
    <helix-base-icon-button
      label="Actions"
      slot="trigger"
    >
      <helix-base-icon name="plus"></helix-base-icon>
    </helix-base-icon-button>

    <helix-base-speed-dial-item value="share">
      Share
      <helix-base-icon
        name="share-network"
        slot="icon"
      ></helix-base-icon>
    </helix-base-speed-dial-item>
    <helix-base-speed-dial-item value="copy">
      Duplicate
      <helix-base-icon
        name="copy"
        slot="icon"
      ></helix-base-icon>
    </helix-base-speed-dial-item>
    <helix-base-speed-dial-item value="delete">
      Delete
      <helix-base-icon
        name="trash"
        slot="icon"
      ></helix-base-icon>
    </helix-base-speed-dial-item>
  </helix-base-speed-dial>
</div>
