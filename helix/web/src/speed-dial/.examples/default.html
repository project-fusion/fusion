<!-- @summary A floating action button, and the few actions it fans out. -->
<link
  href="styles.css"
  rel="stylesheet"
>

<div class="page">
  <helix-speed-dial
    data-dock="bottom-end"
    data-dock-within
    label="Actions"
  >
    <helix-icon-button
      appearance="solid"
      label="Actions"
      raised
      shape="circle"
      slot="trigger"
      tone="primary"
    >
      <helix-icon name="plus"></helix-icon>
    </helix-icon-button>

    <helix-speed-dial-item value="share">
      Share
      <helix-icon
        name="share-network"
        slot="icon"
      ></helix-icon>
    </helix-speed-dial-item>
    <helix-speed-dial-item value="copy">
      Duplicate
      <helix-icon
        name="copy"
        slot="icon"
      ></helix-icon>
    </helix-speed-dial-item>
    <helix-speed-dial-item value="delete">
      Delete
      <helix-icon
        name="trash"
        slot="icon"
      ></helix-icon>
    </helix-speed-dial-item>
  </helix-speed-dial>
</div>
