<link rel="stylesheet" href="described.css">

<div class="row">
  <helix-button id="save" aria-describedby="save-tip">Save</helix-button>
  <helix-tooltip id="save-tip" for="save" content="Writes the file to disk"></helix-tooltip>

  <helix-icon-button id="archive" label="Archive" aria-describedby="archive-tip">
    <helix-icon name="archive"></helix-icon>
  </helix-icon-button>
  <helix-tooltip
    id="archive-tip"
    for="archive"
    content="Moves it out of the inbox"
    placement="bottom"
  ></helix-tooltip>
</div>
