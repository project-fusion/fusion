<!-- An icon is a picture, so it has an optical size rather than a control
     height, and it takes it from `--icon-size`. A custom property crosses the
     shadow boundary on its own, which is why there is no size attribute here
     for one to be set against. -->
<helix-icon class="sm" name="pulse"></helix-icon>
<helix-icon class="md" name="pulse"></helix-icon>
<helix-icon class="lg" name="pulse"></helix-icon>
<helix-icon class="xl" name="pulse"></helix-icon>
