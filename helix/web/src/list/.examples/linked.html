<!-- The link is inside the row, not around it. A wrapper between `role="list"`
     and its `role="listitem"` rows breaks the ownership the roles describe: the
     rows stop being counted and a reader is no longer told "1 of 2". The anchor
     fills the row, so the whole row is still the target. -->
<helix-list label="Label">
  <helix-list-item>
    <helix-icon name="cube" slot="start"></helix-icon>
    <a aria-current="page" data-link="quiet" href="#one">Item One</a>
    <span slot="supporting">Caption</span>
  </helix-list-item>
  <helix-list-item>
    <helix-icon name="cube" slot="start"></helix-icon>
    <a data-link="quiet" href="#two">Item Two</a>
    <span slot="supporting">Caption</span>
  </helix-list-item>
</helix-list>
