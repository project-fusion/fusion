<!-- @summary Three figures, each with the movement under it and only two of them judged. -->

<helix-flex gap="xl">
  <helix-flex
    direction="column"
    gap="2xs"
  >
    <helix-stat>
      $48.2k
      <span slot="label">Revenue</span>
    </helix-stat>
    <helix-trend
      direction="up"
      good="up"
    >
      12.4%
      <span slot="label">month over month</span>
    </helix-trend>
  </helix-flex>
  <helix-flex
    direction="column"
    gap="2xs"
  >
    <helix-stat>
      212
      <span slot="label">p99 latency</span>
      <span slot="unit">ms</span>
    </helix-stat>
    <helix-trend
      direction="up"
      good="down"
    >
      40ms
      <span slot="label">week over week</span>
    </helix-trend>
  </helix-flex>
  <helix-flex
    direction="column"
    gap="2xs"
  >
    <helix-stat>
      3
      <span slot="label">Open incidents</span>
    </helix-stat>
    <helix-trend direction="neutral">
      0
      <span slot="label">since Friday</span>
    </helix-trend>
  </helix-flex>
</helix-flex>
