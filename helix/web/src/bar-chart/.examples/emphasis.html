<!-- @summary A forecast beside three measurements, told apart by its outline rather than by a note. -->
<link
  href="styles.css"
  rel="stylesheet"
>

<table
  data-hidden-visually
  id="barchartemphasis"
>
  <caption>Deploys per quarter</caption>
  <thead>
    <tr>
      <th scope="col">Quarter</th>
      <th scope="col">Gateway</th>
      <th scope="col">Billing</th>
      <th scope="col">Forecast</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <th scope="row">Q1</th>
      <td data-value="34">34</td>
      <td data-value="21">21</td>
      <td data-value="0">0</td>
    </tr>
    <tr>
      <th scope="row">Q2</th>
      <td data-value="47">47</td>
      <td data-value="29">29</td>
      <td data-value="0">0</td>
    </tr>
    <tr>
      <th scope="row">Q3</th>
      <td data-value="41">41</td>
      <td data-value="33">33</td>
      <td data-value="0">0</td>
    </tr>
    <tr>
      <th scope="row">Q4</th>
      <td data-value="0">0</td>
      <td data-value="0">0</td>
      <td data-value="52">52</td>
    </tr>
  </tbody>
</table>

<div class="panel">
  <helix-bar-chart
    for="barchartemphasis"
    gridlines="value"
    outlined="Forecast"
  ></helix-bar-chart>
</div>
