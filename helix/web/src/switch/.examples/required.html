<!-- Preview frame: the submit is swallowed. -->
<form onsubmit="event.preventDefault()">
  <helix-flex
    direction="column"
    gap="sm"
  >
    <helix-switch
      hint="Required before the workspace can be created"
      label="I accept the terms"
      name="terms"
      required
    ></helix-switch>
    <helix-button
      appearance="solid"
      tone="primary"
      type="submit"
    >Create workspace</helix-button>
  </helix-flex>
</form>
