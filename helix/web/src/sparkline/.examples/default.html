<!-- @summary Three figures, each with the shape of the series that produced it. The sparkline sits beside the stat, not inside it. -->

<helix-flex
  gap="xl"
  wrap
>
  <helix-flex
    direction="column"
    gap="2xs"
  >
    <helix-stat>
      1,102
      <span slot="label">Sessions</span>
    </helix-stat>
    <helix-sparkline
      label="Sessions rose from 1,240 to 1,318, then fell to 1,102 over seven days"
      values="1240 1318 1102 1291 1244 1180 1102"
    ></helix-sparkline>
    <helix-trend
      direction="down"
      good="up"
    >
      11%
      <span slot="label">week over week</span>
    </helix-trend>
  </helix-flex>
  <helix-flex
    direction="column"
    gap="2xs"
  >
    <helix-stat>
      99.98
      <span slot="label">Uptime</span>
      <span slot="unit">%</span>
    </helix-stat>
    <helix-sparkline
      label="Uptime held above 99.9 percent every day for seven days"
      values="99.94 99.99 99.91 100 99.97 99.99 99.98"
    ></helix-sparkline>
    <helix-trend
      direction="up"
      good="up"
    >
      0.04pt
      <span slot="label">week over week</span>
    </helix-trend>
  </helix-flex>
  <helix-flex
    direction="column"
    gap="2xs"
  >
    <helix-stat>
      212
      <span slot="label">p99 latency</span>
      <span slot="unit">ms</span>
    </helix-stat>
    <helix-sparkline
      label="Latency climbed from 172ms to 212ms over seven days"
      values="172 168 181 190 186 204 212"
    ></helix-sparkline>
    <helix-trend
      direction="up"
      good="down"
    >
      40ms
      <span slot="label">week over week</span>
    </helix-trend>
  </helix-flex>
</helix-flex>
