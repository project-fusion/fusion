<helix-flex direction="column" gap="sm">
  <helix-callout severity="info">
    <span slot="title">Information</span>
    Something worth knowing, which changes nothing about what you were doing.
  </helix-callout>
  <helix-callout severity="success">
    <span slot="title">Success</span>
    Something finished, and finished the way it was meant to.
  </helix-callout>
  <helix-callout severity="warning">
    <span slot="title">Warning</span>
    Something needs attention before it becomes a problem.
  </helix-callout>
  <helix-callout severity="danger">
    <span slot="title">Error</span>
    Something failed, and it is going to stay failed until it is dealt with.
  </helix-callout>
</helix-flex>
