<!-- @summary A panel anchored to what opened it. -->
<helix-popover
  id="details"
  label="Details"
>
  <helix-button slot="trigger">Details</helix-button>
  <helix-flex
    direction="column"
    gap="xs"
  >
    <helix-text appearance="body">
      Anything can go in here. The panel is in the top layer, so it clears a
      scrolling parent without a z-index.
    </helix-text>
    <helix-button
      appearance="ghost"
      command="--close"
      commandfor="details"
    >
      Close
    </helix-button>
  </helix-flex>
</helix-popover>
