<!-- @summary The same popover on the headless tier, with every rule written by hand. -->

<link
  href="styles.css"
  rel="stylesheet"
/>

<helix-base-popover
  id="details"
  label="Details"
>
  <helix-base-button slot="trigger">Details</helix-base-button>
  <div class="stack">
    <p>
      Anything can go in here. The panel is in the top layer, so it clears a
      scrolling parent without a z-index.
    </p>
    <helix-base-button
      command="--close"
      commandfor="details"
    >
      Close
    </helix-base-button>
  </div>
</helix-base-popover>
