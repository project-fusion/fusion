<!-- @summary A popover opened by a button through the command attributes. -->
<helix-flex gap="sm">
  <helix-button
    appearance="solid"
    command="--toggle"
    commandfor="filters"
    tone="primary"
  >
    Filters
  </helix-button>

  <helix-popover
    id="filters"
    label="Filters"
    placement="bottom-end"
  >
    <helix-checkbox-group label="Status">
      <helix-checkbox
        label="Open"
        name="status"
        value="open"
      ></helix-checkbox>
      <helix-checkbox
        label="Merged"
        name="status"
        value="merged"
      ></helix-checkbox>
    </helix-checkbox-group>
  </helix-popover>
</helix-flex>
