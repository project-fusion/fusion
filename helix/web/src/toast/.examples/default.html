<!-- @summary A message over the page, in the corner it was told to appear. -->
<helix-toast
  label="Notifications"
  placement="bottom-end"
>
  <helix-toast-item
    dismissible
    severity="success"
  >
    Project saved.
  </helix-toast-item>
  <helix-toast-item
    dismissible
    severity="danger"
  >
    Could not reach the server.
    <helix-button slot="actions">Retry</helix-button>
  </helix-toast-item>
</helix-toast>
