<helix-toast label="Notifications" placement="top-center">
  <helix-toast-item duration="8000" dismissible severity="info">
    The bar underneath shows how long is left. Hover it, or put focus in it, and
    the clock stops and the bar stops with it.
    <helix-button appearance="tertiary" slot="actions">Undo</helix-button>
  </helix-toast-item>
</helix-toast>
