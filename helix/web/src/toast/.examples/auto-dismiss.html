<helix-toast label="Notifications" placement="top-center">
  <helix-toast-item duration="8000" dismissible severity="info">
    The border above drains as the clock runs down. Hover it, or put focus in
    it, and the clock stops and the bar stops with it. When it reaches the end
    the message goes on its own, and tells you so you can drop it from your list.
    <helix-button appearance="tertiary" slot="actions">Undo</helix-button>
  </helix-toast-item>
</helix-toast>
