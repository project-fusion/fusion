<link
  href="arriving.css"
  rel="stylesheet"
>

<helix-toast
  class="stack"
  label="Notifications"
  placement="bottom-end"
>
  <helix-toast-item
    dismissible
    severity="success"
  >Project saved.</helix-toast-item>
  <helix-toast-item
    dismissible
    severity="info"
  >Two devices are now signed in.</helix-toast-item>
  <helix-toast-item
    dismissible
    severity="warning"
  >Two files were skipped.</helix-toast-item>
  <helix-toast-item
    dismissible
    severity="danger"
  >
    Could not reach the server.
    <helix-button
      appearance="secondary"
      slot="actions"
    >Retry</helix-button>
  </helix-toast-item>
</helix-toast>
