<helix-empty appearance="outlined">
  <helix-icon
    name="folder-open"
    slot="icon"
  ></helix-icon>
  <span slot="heading">No results</span>
  Try a different search, or clear the filters.
  <helix-button
    fill="standard"
    slot="actions"
  >Clear filters</helix-button>
  <helix-button
    appearance="primary"
    fill="standard"
    slot="actions"
  >New search</helix-button>
</helix-empty>
