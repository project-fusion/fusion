<!-- The framed variant, for an empty view that is the whole of a page or a
     panel. Placed inside a menu, a select or a card, the default brings no
     frame of its own: whatever it sits in is already the frame. -->
<helix-empty appearance="outlined">
  <helix-icon name="folder-open" slot="icon"></helix-icon>
  <span slot="heading">No Items</span>
  Lorem ipsum dolor sit amet, consectetur adipiscing elit.
  <helix-button appearance="primary" slot="actions">Action</helix-button>
</helix-empty>
