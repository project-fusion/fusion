<!-- @summary Every fill against every tone. -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-flex gap="sm">
    <helix-button>Button</helix-button>
    <helix-button tone="primary">Button</helix-button>
    <helix-button tone="danger">Button</helix-button>
  </helix-flex>

  <helix-flex gap="sm">
    <helix-button appearance="solid">Button</helix-button>
    <helix-button
      appearance="solid"
      tone="primary"
    >Button</helix-button>
    <helix-button
      appearance="solid"
      tone="danger"
    >Button</helix-button>
  </helix-flex>

  <helix-flex gap="sm">
    <helix-button appearance="subtle">Button</helix-button>
    <helix-button
      appearance="subtle"
      tone="primary"
    >Button</helix-button>
    <helix-button
      appearance="subtle"
      tone="danger"
    >Button</helix-button>
  </helix-flex>

  <helix-flex gap="sm">
    <helix-button appearance="ghost">Button</helix-button>
    <helix-button
      appearance="ghost"
      tone="primary"
    >Button</helix-button>
    <helix-button
      appearance="ghost"
      tone="danger"
    >Button</helix-button>
  </helix-flex>
</helix-flex>
