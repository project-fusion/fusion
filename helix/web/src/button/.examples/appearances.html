<!-- @summary Every fill against every tone. -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-flex gap="sm">
    <helix-button>Save draft</helix-button>
    <helix-button tone="primary">Save draft</helix-button>
    <helix-button tone="danger">Save draft</helix-button>
  </helix-flex>

  <helix-flex gap="sm">
    <helix-button appearance="solid">Deploy</helix-button>
    <helix-button
      appearance="solid"
      tone="primary"
    >Deploy</helix-button>
    <helix-button
      appearance="solid"
      tone="danger"
    >Delete project</helix-button>
  </helix-flex>

  <helix-flex gap="sm">
    <helix-button appearance="subtle">Duplicate</helix-button>
    <helix-button
      appearance="subtle"
      tone="primary"
    >Duplicate</helix-button>
    <helix-button
      appearance="subtle"
      tone="danger"
    >Duplicate</helix-button>
  </helix-flex>

  <helix-flex gap="sm">
    <helix-button appearance="ghost">Cancel</helix-button>
    <helix-button
      appearance="ghost"
      tone="primary"
    >Cancel</helix-button>
    <helix-button
      appearance="ghost"
      tone="danger"
    >Remove</helix-button>
  </helix-flex>
</helix-flex>
