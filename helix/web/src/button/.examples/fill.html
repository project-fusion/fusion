<helix-flex
  direction="column"
  gap="md"
>
  <helix-flex gap="sm">
    <helix-button appearance="primary">Auto</helix-button>
    <helix-button appearance="secondary">Cancel</helix-button>
  </helix-flex>

  <helix-flex gap="sm">
    <helix-button
      appearance="primary"
      fill="standard"
    >Save</helix-button>
    <helix-button
      appearance="secondary"
      fill="standard"
    >Cancel</helix-button>
  </helix-flex>

  <helix-flex gap="sm">
    <helix-button
      appearance="primary"
      fill="standard"
    >Save</helix-button>
    <a
      data-button="secondary"
      data-button-fill="standard"
      href="#cancel"
    >Cancel</a>
  </helix-flex>

  <helix-button
    appearance="primary"
    fill="full"
  >Full width</helix-button>
</helix-flex>
