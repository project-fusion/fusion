<helix-flex
  direction="column"
  gap="md"
>
  <helix-flex gap="sm">
    <helix-button
      appearance="solid"
      tone="primary"
    >Auto</helix-button>
    <helix-button>Cancel</helix-button>
  </helix-flex>

  <helix-flex gap="sm">
    <helix-button
      appearance="solid"
      fill="standard"
      tone="primary"
    >Save</helix-button>
    <helix-button fill="standard">Cancel</helix-button>
  </helix-flex>

  <helix-flex gap="sm">
    <helix-button
      appearance="solid"
      fill="standard"
      tone="primary"
    >Save</helix-button>
    <a
      data-button=""
      data-button-fill="standard"
      href="#cancel"
    >Cancel</a>
  </helix-flex>

  <helix-button
    appearance="solid"
    fill="full"
    tone="primary"
  >Full width</helix-button>
</helix-flex>
