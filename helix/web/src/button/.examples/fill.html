<!-- @summary A button that takes the width it is given rather than the width of its label. -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-flex gap="sm">
    <helix-button
      emphasis="solid"
      tone="primary"
    >Button</helix-button>
    <helix-button>Button</helix-button>
  </helix-flex>

  <helix-flex gap="sm">
    <helix-button
      emphasis="solid"
      fill="standard"
      tone="primary"
    >Button</helix-button>
    <helix-button fill="standard">Button</helix-button>
  </helix-flex>

  <helix-flex gap="sm">
    <helix-button
      emphasis="solid"
      fill="standard"
      tone="primary"
    >Button</helix-button>
    <a
      data-button=""
      data-button-fill="standard"
      href="#cancel"
    >Button</a>
  </helix-flex>

  <helix-button
    emphasis="solid"
    fill="full"
    tone="primary"
  >Button</helix-button>
</helix-flex>
