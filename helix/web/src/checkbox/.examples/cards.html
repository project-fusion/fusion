<helix-checkbox-group label="Label" name="addons">
  <helix-checkbox appearance="card" default-checked value="backups">
    <helix-flex direction="column" gap="2xs">
      <helix-text appearance="body-strong" as="span">Backups</helix-text>
      <helix-text appearance="caption" as="span" tone="subtle">
        Nightly, kept for thirty days.
      </helix-text>
    </helix-flex>
  </helix-checkbox>
  <helix-checkbox appearance="card" value="audit">
    <helix-flex direction="column" gap="2xs">
      <helix-text appearance="body-strong" as="span">Audit log</helix-text>
      <helix-text appearance="caption" as="span" tone="subtle">
        Every action, with who and when.
      </helix-text>
    </helix-flex>
  </helix-checkbox>
</helix-checkbox-group>
