<!-- The pill in a framed, sunken track, which reads as one control rather than
     as a row of tabs. For a set sitting in a toolbar beside other controls. -->
<helix-tabs appearance="toggle" label="Tiers" value="styled">
  <helix-tabs-tab value="styled">Styled</helix-tabs-tab>
  <helix-tabs-tab value="headless">Headless</helix-tabs-tab>
  <helix-tabs-panel slot="panels" value="styled">
    Tokens, parts and a look. What most applications reach for.
  </helix-tabs-panel>
  <helix-tabs-panel slot="panels" value="headless">
    Structure, ARIA and state, with no CSS at all.
  </helix-tabs-panel>
</helix-tabs>
