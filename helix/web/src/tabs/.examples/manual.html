<!-- @summary Arrow keys move between tabs without opening them, so a reader can look before choosing. -->

<helix-tabs
  default-active="overview"
  manual
>
  <helix-tabs-tab value="overview">Overview</helix-tabs-tab>
  <helix-tabs-tab value="usage">Usage</helix-tabs-tab>
  <helix-tabs-tab value="billing">Billing</helix-tabs-tab>

  <div slot="panels">
    <helix-tabs-panel value="overview">What the account is doing this month.</helix-tabs-panel>
    <helix-tabs-panel value="usage">Requests, storage and egress.</helix-tabs-panel>
    <helix-tabs-panel value="billing">Invoices and the payment method on file.</helix-tabs-panel>
  </div>
</helix-tabs>
