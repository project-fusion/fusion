<!-- @summary A trail that folds its middle below a width, into a menu you wrote. -->
<link
  href="styles.css"
  rel="stylesheet"
>
<helix-breadcrumbs aria-label="Breadcrumb">
  <helix-breadcrumb href="/">Home</helix-breadcrumb>

  <!-- Written where the gap belongs, holding the steps that fold. They are the
       same three steps as the crumbs below, on purpose: both arrangements are
       markup, so the sheet shows one and hides the other rather than anything
       building the second from the first at runtime. -->
  <helix-breadcrumb>
    <helix-menu label="Hidden steps">
      <helix-icon-button
        appearance="ghost"
        label="Show hidden steps"
        slot="trigger"
      >
        <helix-icon name="dots-three"></helix-icon>
      </helix-icon-button>
      <helix-menu-item href="/design">Design</helix-menu-item>
      <helix-menu-item href="/design/components">Components</helix-menu-item>
      <helix-menu-item href="/design/components/navigation">Navigation</helix-menu-item>
    </helix-menu>
  </helix-breadcrumb>

  <helix-breadcrumb href="/design">Design</helix-breadcrumb>
  <helix-breadcrumb href="/design/components">Components</helix-breadcrumb>
  <helix-breadcrumb href="/design/components/navigation">Navigation</helix-breadcrumb>
  <helix-breadcrumb current>Breadcrumbs</helix-breadcrumb>
</helix-breadcrumbs>
