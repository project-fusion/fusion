<!-- @summary A trail that folds its middle below a width, into a menu you wrote. -->
<link
  href="styles.css"
  rel="stylesheet"
>
<helix-breadcrumbs aria-label="Breadcrumb">
  <helix-breadcrumb href="/">Home</helix-breadcrumb>

  <!-- Written where the gap belongs, holding the steps that fold. The crumbs
       and the menu items are both markup, so the container query in the sheet
       decides which of the two a reader sees and nothing has to run first. -->
  <helix-breadcrumb overflow>
    <helix-menu label="Hidden steps">
      <helix-icon-button
        appearance="ghost"
        label="Show hidden steps"
        slot="trigger"
      >
        <helix-icon name="dots-three"></helix-icon>
      </helix-icon-button>
      <helix-menu-item href="/design">Design</helix-menu-item>
      <helix-menu-item href="/design/components">Components</helix-menu-item>
      <helix-menu-item href="/design/components/navigation">Navigation</helix-menu-item>
    </helix-menu>
  </helix-breadcrumb>

  <helix-breadcrumb
    data-folds
    href="/design"
  >Design</helix-breadcrumb>
  <helix-breadcrumb
    data-folds
    href="/design/components"
  >Components</helix-breadcrumb>
  <helix-breadcrumb
    data-folds
    href="/design/components/navigation"
  >Navigation</helix-breadcrumb>
  <helix-breadcrumb current>Breadcrumbs</helix-breadcrumb>
</helix-breadcrumbs>
