<!-- A column declares its heading and its width together, because they are two
     facts about one thing: add a column and the table has another track, remove
     one and it does not. A column with no width shares what is left over. -->
<helix-table label="Deployments">
  <helix-table-column width="12rem">Service</helix-table-column>
  <helix-table-column>Region</helix-table-column>
  <helix-table-column>Status</helix-table-column>

  <helix-table-row>
    <helix-table-cell header>helix-web</helix-table-cell>
    <helix-table-cell>us-east-1</helix-table-cell>
    <helix-table-cell>Healthy</helix-table-cell>
  </helix-table-row>
  <helix-table-row>
    <helix-table-cell header>cortex-core</helix-table-cell>
    <helix-table-cell>eu-west-2</helix-table-cell>
    <helix-table-cell>Healthy</helix-table-cell>
  </helix-table-row>
</helix-table>
