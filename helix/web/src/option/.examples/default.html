<!-- Inside a bare `role="listbox"`, because that is genuinely what an option
     belongs to: `role="option"` requires an owning listbox, and `Listbox` is
     the component that will own them. Written by hand here so the vocabulary
     can be seen before the thing that arranges it exists. -->
<div role="listbox" aria-label="Label" class="listbox">
  <helix-option selected value="one">Option One</helix-option>
  <helix-option data-active value="two">Option Two</helix-option>
  <helix-option value="three">Option Three</helix-option>
  <helix-option disabled value="four">Option Four</helix-option>
</div>
