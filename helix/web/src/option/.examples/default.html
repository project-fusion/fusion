<link
  rel="stylesheet"
  href="styles.css"
/>

<!-- Hand-written owner: `role="option"` requires one. -->
<div
  role="listbox"
  aria-label="Label"
  class="listbox"
>
  <helix-option
    selected
    value="one"
  >Option One</helix-option>
  <helix-option
    data-active
    value="two"
  >Option Two</helix-option>
  <helix-option value="three">Option Three</helix-option>
  <helix-option
    disabled
    value="four"
  >Option Four</helix-option>
</div>
