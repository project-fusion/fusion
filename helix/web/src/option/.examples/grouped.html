<!-- The listbox is hand-written because `Listbox` is what will own these, and
     `role="option"` requires an owner. -->
<div role="listbox" aria-label="Label" class="listbox">
  <helix-option-group label="Group One">
    <helix-option selected value="one">Option One</helix-option>
    <helix-option value="two">Option Two</helix-option>
  </helix-option-group>
  <helix-option-group label="Group Two">
    <helix-option value="three">Option Three</helix-option>
    <helix-option value="four">Option Four</helix-option>
  </helix-option-group>
</div>
