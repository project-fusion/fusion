<!-- Preview frame: the submit is swallowed. -->
<form onsubmit="event.preventDefault()">
  <helix-flex direction="column" gap="sm">
    <helix-select hint="Closest to your readers" label="Region" name="region" required>
      <helix-icon name="caret-down" slot="indicator"></helix-icon>
      <helix-option value="us-east-1">us-east-1</helix-option>
      <helix-option value="eu-west-2">eu-west-2</helix-option>
    </helix-select>
    <helix-button appearance="primary" type="submit">Create</helix-button>
  </helix-flex>
</form>
