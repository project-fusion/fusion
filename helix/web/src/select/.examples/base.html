<!-- @summary The same select on the headless tier, with every rule written by hand. -->

<link
  href="styles.css"
  rel="stylesheet"
/>

<helix-base-select
  default-value="two"
  hint="Hint"
  label="Label"
  name="choice"
>
  <helix-base-icon
    name="caret-down"
    slot="indicator"
  ></helix-base-icon>
  <helix-base-option value="one">Option One</helix-base-option>
  <helix-base-option value="two">Option Two</helix-base-option>
  <helix-base-option value="three">Option Three</helix-base-option>
</helix-base-select>
