<!-- @summary The same video playlist on the headless tier, with every rule written by hand. -->

<link
  href="styles.css"
  rel="stylesheet"
/>

<helix-base-video-playlist
  default-active="sintel"
  label="Episodes"
>
  <helix-base-video
    label="One of several"
    slot="player"
  ></helix-base-video>

  <helix-base-video-playlist-item
    poster="/media/sintel-short.jpg"
    src="https://mdn.github.io/shared-assets/videos/sintel-short.mp4"
    value="sintel"
  >
    Sintel
    <span slot="meta">2:00</span>
  </helix-base-video-playlist-item>
  <helix-base-video-playlist-item
    poster="/media/tears-of-steel.jpg"
    src="https://mdn.github.io/shared-assets/videos/tears-of-steel-battle-clip-medium.mp4"
    value="tears"
  >
    Tears of Steel
    <span slot="meta">1:10</span>
  </helix-base-video-playlist-item>
  <helix-base-video-playlist-item
    disabled
    poster="/media/tears-of-steel.jpg"
    src="https://mdn.github.io/shared-assets/videos/tears-of-steel-battle-clip-medium.mp4"
    value="unavailable"
  >
    Not available in your region
    <span slot="meta">1:10</span>
  </helix-base-video-playlist-item>
</helix-base-video-playlist>
