<helix-accordion mode="single">
  <helix-accordion-item default-open>
    <span slot="summary">One at a time</span>
    With mode set to single, opening a section closes the one that was open.
  </helix-accordion-item>
  <helix-accordion-item>
    <span slot="summary">The last one stays open</span>
    Single refuses to close the last section. Use single-collapsible to allow
    it.
  </helix-accordion-item>
</helix-accordion>
