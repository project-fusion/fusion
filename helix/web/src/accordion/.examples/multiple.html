<helix-accordion multiple>
  <helix-accordion-item default-open>
    <span slot="summary">Both can be open</span>
    With multiple set, opening one leaves the others alone.
  </helix-accordion-item>
  <helix-accordion-item default-open>
    <span slot="summary">Second section</span>
    Server-rendered open, so it does not settle after hydration.
  </helix-accordion-item>
</helix-accordion>
