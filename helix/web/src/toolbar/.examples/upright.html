<!-- @summary A column of controls, where the arrow keys move up and down instead. -->

<helix-toolbar
  label="Drawing"
  orientation="vertical"
>
  <helix-icon-button label="Select">
    <helix-icon name="cursor"></helix-icon>
  </helix-icon-button>
  <helix-icon-button label="Draw">
    <helix-icon name="pencil"></helix-icon>
  </helix-icon-button>
  <helix-icon-button label="Erase">
    <helix-icon name="eraser"></helix-icon>
  </helix-icon-button>
</helix-toolbar>
