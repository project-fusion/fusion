<!-- @summary The tones an icon button carries, including the accent it gained with the shared surface. -->

<helix-flex
  align="center"
  gap="md"
>
  <helix-icon-button
    label="Download"
    tone="primary"
  >
    <helix-icon name="download"></helix-icon>
  </helix-icon-button>

  <helix-icon-button
    label="Open"
    tone="accent"
  >
    <helix-icon name="arrow-square-out"></helix-icon>
  </helix-icon-button>

  <helix-icon-button
    label="Delete"
    tone="danger"
  >
    <helix-icon name="trash"></helix-icon>
  </helix-icon-button>
</helix-flex>
