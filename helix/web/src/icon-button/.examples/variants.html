<!-- @summary The ranked forms, for a control bar that already had them before tone existed. -->

<helix-flex
  align="center"
  gap="md"
>
  <helix-icon-button
    label="Save"
    variant="primary"
  >
    <helix-icon name="floppy-disk"></helix-icon>
  </helix-icon-button>

  <helix-icon-button
    label="Delete"
    variant="danger"
  >
    <helix-icon name="trash"></helix-icon>
  </helix-icon-button>
</helix-flex>
