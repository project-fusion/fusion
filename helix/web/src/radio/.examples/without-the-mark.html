<!-- @summary The dot hidden, so the whole chip is the target rather than the mark beside it. -->

<helix-radio-group
  default-value="monthly"
  label="Billing"
  orientation="horizontal"
>
  <helix-radio
    appearance="chip"
    hide-control
    value="monthly"
  >Monthly</helix-radio
  >
  <helix-radio
    appearance="chip"
    hide-control
    value="yearly"
  >Yearly</helix-radio
  >
</helix-radio-group>
