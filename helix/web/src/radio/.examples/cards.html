<helix-radio-group
  default-value="team"
  hint="Hint"
  label="Label"
  name="plan"
>
  <helix-radio
    appearance="card"
    value="solo"
  >
    <helix-flex
      direction="column"
      gap="2xs"
    >
      <helix-text
        appearance="body-strong"
        as="span"
      >Solo</helix-text>
      <helix-text
        appearance="caption"
        as="span"
        tone="subtle"
      >
        One seat, and everything on it.
      </helix-text>
    </helix-flex>
  </helix-radio>
  <helix-radio
    appearance="card"
    value="team"
  >
    <helix-flex
      direction="column"
      gap="2xs"
    >
      <helix-text
        appearance="body-strong"
        as="span"
      >Team</helix-text>
      <helix-text
        appearance="caption"
        as="span"
        tone="subtle"
      >
        Up to ten seats, shared billing.
      </helix-text>
    </helix-flex>
  </helix-radio>
</helix-radio-group>
