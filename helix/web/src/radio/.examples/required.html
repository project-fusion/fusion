<!-- Press Submit without choosing. The group writes its own message, because a
     browser has nothing useful to say about a set it does not know is a set. -->
<form onsubmit="event.preventDefault()">
  <helix-flex direction="column" gap="sm">
    <helix-radio-group hint="Hint" label="Label" name="choice" required>
      <helix-radio value="one">Option One</helix-radio>
      <helix-radio value="two">Option Two</helix-radio>
    </helix-radio-group>
    <helix-button appearance="primary" type="submit">Submit</helix-button>
  </helix-flex>
</form>
