<link rel="stylesheet" href="disabled.css">

<helix-flex direction="column" gap="lg">
  <helix-radio-group disabled hint="Hint" label="Written off" name="a" default-value="one">
    <helix-radio value="one">Option One</helix-radio>
    <helix-radio value="two">Option Two</helix-radio>
  </helix-radio-group>

  <!-- And the same state arriving from above. A `<fieldset disabled>` switches
       every control inside it off, which the platform reports through
       `formDisabledCallback`: nothing writes an attribute onto anything here. -->
  <fieldset disabled>
    <helix-radio-group hint="Hint" label="Off from the fieldset" name="b" default-value="two">
      <helix-radio value="one">Option One</helix-radio>
      <helix-radio value="two">Option Two</helix-radio>
    </helix-radio-group>
  </fieldset>
</helix-flex>
