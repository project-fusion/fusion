<!-- @summary A group of icon buttons, for a toolbar-shaped choice. -->
<helix-button-group label="Label">
  <helix-button fill="standard">
    <helix-icon
      name="arrow-left"
      slot="start"
    ></helix-icon>
    Back
  </helix-button>
  <helix-button fill="standard">
    Forward
    <helix-icon
      name="arrow-right"
      slot="end"
    ></helix-icon>
  </helix-button>
</helix-button-group>
