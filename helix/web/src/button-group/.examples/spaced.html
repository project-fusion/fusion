<!-- The same group, spaced instead of joined. It keeps `role="group"` and its
     name, which is why this is an appearance rather than a `helix-flex`: a row
     of related actions is still a set, and a screen reader should hear it as
     one. Joined is for a set of alternatives that behave as one control; spaced
     is for actions that merely belong together. -->
<helix-button-group appearance="spaced" label="Record actions">
  <helix-button appearance="primary">Save</helix-button>
  <helix-button appearance="secondary">Duplicate</helix-button>
  <helix-button appearance="tertiary">Cancel</helix-button>
</helix-button-group>
