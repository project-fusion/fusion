<!-- @summary The same app header on the headless tier, with every rule written by hand. -->

<link
  href="styles.css"
  rel="stylesheet"
/>

<helix-base-app-header>
  <span slot="start">Logo</span>
  <helix-base-navigation label="Sections">
    <a
      aria-current="page"
      href="#one"
    >Item One</a>
    <a href="#two">Item Two</a>
  </helix-base-navigation>

  <helix-base-icon-button
    label="Search"
    slot="end"
  >
    <helix-base-icon name="magnifying-glass"></helix-base-icon>
  </helix-base-icon-button>
  <helix-base-icon-button
    label="Settings"
    slot="end"
  >
    <helix-base-icon name="gear"></helix-base-icon>
  </helix-base-icon-button>
</helix-base-app-header>
