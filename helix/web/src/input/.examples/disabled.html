<link
  href="styles.css"
  rel="stylesheet"
>

<helix-flex
  direction="column"
  gap="lg"
>
  <helix-input
    default-value="Cannot be edited"
    disabled
    hint="Hint"
    label="Written off"
  ></helix-input>

  <!-- The same state, arriving from an ancestor fieldset. -->

    <helix-input
      default-value="Also cannot be edited"
      hint="Hint"
      label="Off from the fieldset"
    ></helix-input>
  </fieldset>
</helix-flex>
