<helix-flex direction="column" gap="lg">
  <helix-input hint="Hint" label="Label" placeholder="Placeholder"></helix-input>
  <helix-input label="Label" default-value="Filled in"></helix-input>
  <helix-input hint="Hint" label="Label" required default-value="Required"></helix-input>

  <helix-input label="Label" read-only default-value="Read only"></helix-input>
  <helix-input disabled label="Label" default-value="Disabled"></helix-input>

  <helix-input
    feedback="Something is wrong with this"
    hint="Hint"
    label="Label"
    default-value="Invalid"
  ></helix-input>

  <helix-input aria-label="Search" placeholder="Hidden label"></helix-input>
</helix-flex>
