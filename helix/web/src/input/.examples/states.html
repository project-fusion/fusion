<helix-flex direction="column" gap="lg">
  <helix-input hint="Hint" label="Label" placeholder="Placeholder"></helix-input>
  <helix-input label="Label" value="Filled in"></helix-input>
  <helix-input hint="Hint" label="Label" required value="Required"></helix-input>

  <helix-input label="Label" read-only value="Read only"></helix-input>
  <helix-input disabled label="Label" value="Disabled"></helix-input>

  <helix-input
    feedback="Something is wrong with this"
    hint="Hint"
    label="Label"
    value="Invalid"
  ></helix-input>

  <helix-input aria-label="Search" placeholder="Hidden label"></helix-input>
</helix-flex>
