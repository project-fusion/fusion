<!-- @summary Required marked on the label, and what the browser says when it is skipped. -->
<!-- Preview frame: the submit is swallowed. -->
<form onsubmit="event.preventDefault()">
  <helix-flex
    direction="column"
    gap="sm"
  >
    <helix-input
      hint="We only use this to reply"
      label="Email"
      name="email"
      placeholder="name@example.com"
      required
      type="email"
    ></helix-input>
    <helix-button
      appearance="solid"
      tone="primary"
      type="submit"
    >Submit</helix-button>
  </helix-flex>
</form>
