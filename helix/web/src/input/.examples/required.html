<!-- Validity is the platform's. The browser decides what an email is, and the
     field turns only once the reader has had a go at it. -->
<form>
  <helix-flex direction="column" gap="sm">
    <helix-input
      label="Email"
      name="email"
      placeholder="name@example.com"
      required
      type="email"
    ></helix-input>
    <helix-button appearance="primary" type="submit">Submit</helix-button>
  </helix-flex>
</form>
