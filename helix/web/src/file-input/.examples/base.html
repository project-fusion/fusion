<!-- @summary The same file input on the headless tier, with every rule written by hand. -->

<link
  href="styles.css"
  rel="stylesheet"
/>

<helix-base-file-input
  hint="PNG or JPG, up to 10MB each"
  label="Attachments"
  multiple
  name="attachments"
>
  <helix-base-icon
    name="upload-simple"
    slot="trigger"
  ></helix-base-icon>
  <span slot="trigger">Choose files, or drop them here</span>
</helix-base-file-input>
