<!-- @summary The four edges a drawer can arrive from. -->
<helix-flex gap="sm">
  <helix-button
    command="--show"
    commandfor="start-drawer"
  >
    Start
  </helix-button>
  <helix-button
    command="--show"
    commandfor="end-drawer"
  >
    End
  </helix-button>
  <helix-button
    command="--show"
    commandfor="top-drawer"
  >
    Top
  </helix-button>
  <helix-button
    command="--show"
    commandfor="bottom-drawer"
  >
    Bottom
  </helix-button>
</helix-flex>

<helix-drawer
  id="start-drawer"
  label="Start"
  placement="start"
>
  <span slot="header">Start</span>
