<helix-button
  appearance="solid"
  command="--show"
  commandfor="panel"
  tone="primary"
>
  Open drawer
</helix-button>

<helix-drawer
  id="panel"
  label="Drawer Title"
  placement="end"
>
  <span slot="header">Drawer Title</span>
  <helix-flex
    direction="column"
    gap="md"
  >
    <helix-text appearance="body">
      Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod
      tempor incididunt ut labore.
    </helix-text>
    <helix-button
      appearance="solid"
      command="--close"
      commandfor="panel"
      tone="primary"
    >
      Close
    </helix-button>
  </helix-flex>
</helix-drawer>
