<!-- The inset is the consumer's. The drawer places the panel and does not
     decide what goes in it, which is what lets a nav drawer run its links to
     the edges while a settings panel holds its content off them. So an example
     has to bring its own, the same way the site's own drawers do. -->
<helix-drawer default-open label="Drawer Title" placement="end">
  <span class="inset" slot="header">Drawer Title</span>
  <helix-flex class="inset" direction="column" gap="md">
    <helix-text appearance="body">
      Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod
      tempor incididunt ut labore.
    </helix-text>
    <helix-button appearance="primary">Action</helix-button>
  </helix-flex>
</helix-drawer>
