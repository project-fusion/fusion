<!-- @summary The same drawer on the headless tier, with every rule written by hand. -->

<link
  href="styles.css"
  rel="stylesheet"
/>

<helix-base-button
  command="--show"
  commandfor="panel"
>
  Open drawer
</helix-base-button>

<helix-base-drawer
  id="panel"
  label="Drawer Title"
  placement="end"
>
  <span slot="header">Drawer Title</span>
  <div class="stack">
    <p>
      Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod
      tempor incididunt ut labore.
    </p>
    <helix-base-button
      command="--close"
      commandfor="panel"
    >
      Close
    </helix-base-button>
  </div>
</helix-base-drawer>
