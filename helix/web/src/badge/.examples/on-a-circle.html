<!-- The mark centres on the corner of the box, which sits outside a circle.
     `--badge-offset` pulls it back along both axes onto the shape. It is
     relative to the host, so both the mark and the offset scale with it. -->
<helix-badge label="Online" style="font-size: 2.5rem; --badge-offset: 0.15em">
  <helix-avatar name="Ross Sheppard"></helix-avatar>
</helix-badge>
