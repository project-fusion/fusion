<link
  href="columns.css"
  rel="stylesheet"
>

<helix-splitter default-position="25">
  <helix-card
    appearance="plain"
    slot="start"
  >
    <helix-text>Files</helix-text>
  </helix-card>
  <helix-splitter
    default-position="50"
    slot="end"
  >
    <helix-card
      appearance="plain"
      slot="start"
    >
      <helix-text>Source</helix-text>
    </helix-card>
    <helix-card
      appearance="plain"
      slot="end"
    >
      <helix-text>Outline</helix-text>
    </helix-card>
  </helix-splitter>
</helix-splitter>
