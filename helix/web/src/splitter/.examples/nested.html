<link
  href="nested.css"
  rel="stylesheet"
>

<helix-splitter default-position="30">
  <helix-card
    appearance="plain"
    slot="start"
  >
    <helix-text>Files</helix-text>
  </helix-card>
  <helix-splitter
    default-position="65"
    orientation="vertical"
    slot="end"
  >
    <helix-card
      appearance="plain"
      slot="start"
    >
      <helix-text>Source</helix-text>
    </helix-card>
    <helix-card
      appearance="plain"
      slot="end"
    >
      <helix-text>Terminal</helix-text>
    </helix-card>
  </helix-splitter>
</helix-splitter>
