<!-- `orientation` is a fact about the boxes, so it lays out the set rather
     than the whole field: the label stays above the row. -->
<helix-checkbox-group
  hint="Hint"
  label="Label"
  name="group"
  orientation="horizontal"
  value="one"
>
  <helix-checkbox value="one">Option One</helix-checkbox>
  <helix-checkbox value="two">Option Two</helix-checkbox>
</helix-checkbox-group>
