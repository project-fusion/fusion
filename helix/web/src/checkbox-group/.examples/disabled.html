<link rel="stylesheet" href="disabled.css">

<helix-flex direction="column" gap="lg">
  <helix-checkbox-group disabled hint="Hint" label="Written off" name="a" value="one">
    <helix-checkbox value="one">Option One</helix-checkbox>
    <helix-checkbox value="two">Option Two</helix-checkbox>
  </helix-checkbox-group>

  <!-- And the same state arriving from above. A `<fieldset disabled>` switches
       every control inside it off, which the platform reports through
       `formDisabledCallback`: nothing writes an attribute onto anything here. -->
  <fieldset disabled>
    <helix-checkbox-group hint="Hint" label="Off from the fieldset" name="b" value="two">
      <helix-checkbox value="one">Option One</helix-checkbox>
      <helix-checkbox value="two">Option Two</helix-checkbox>
    </helix-checkbox-group>
  </fieldset>
</helix-flex>
