<!-- `onsubmit` because a form that validates is a form that eventually submits,
     and this one is in a preview frame. -->
<form onsubmit="event.preventDefault()">
  <helix-flex direction="column" gap="sm">
    <helix-checkbox-group hint="Pick everything that applies" label="Notify me about" name="notify" required>
      <helix-checkbox value="deploys">Deploys</helix-checkbox>
      <helix-checkbox value="incidents">Incidents</helix-checkbox>
    </helix-checkbox-group>
    <helix-button appearance="primary" type="submit">Save</helix-button>
  </helix-flex>
</form>
