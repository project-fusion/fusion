<!-- @summary The same donut chart on the headless tier, with every rule written by hand. -->

<link
  href="styles.css"
  rel="stylesheet"
/>

<div class="stack">
  <table
    data-hidden-visually
    id="traffic"
  >
    <caption>Sessions by source</caption>
    <thead>
      <tr>
        <th scope="col">Source</th>
        <th scope="col">Share</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <th scope="row">Direct</th>
        <td data-value="4200">4,200</td>
      </tr>
      <tr>
        <th scope="row">Search</th>
        <td data-value="3100">3,100</td>
      </tr>
      <tr>
        <th scope="row">Referral</th>
        <td data-value="1800">1,800</td>
      </tr>
      <tr>
        <th scope="row">Social</th>
        <td data-value="900">900</td>
      </tr>
    </tbody>
  </table>

  <helix-base-donut-chart for="traffic"></helix-base-donut-chart>
</div>
