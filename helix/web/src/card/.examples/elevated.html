<!-- Lifted off the page by a shadow instead of framed by a line. For a card
     that sits on a coloured or busy background, where a border has to compete
     with whatever is behind it and a shadow does not. -->
<helix-card appearance="elevated" aria-labelledby="elevated-title">
  <h3 id="elevated-title" slot="header">Elevated</h3>
  The shadow does the separating, so the border is taken away rather than drawn
  on top of it: two edges around one card read as a mistake.
  <helix-button appearance="tertiary" slot="footer">Action</helix-button>
</helix-card>
