<!-- The default. A hairline is enough to separate a card from a plain page,
     and it costs less attention than a shadow: a screen of shadowed cards
     reads as a stack of things floating, none of them settled. -->
<helix-card appearance="outlined" aria-labelledby="outlined-title">
  <h3 id="outlined-title" slot="header">Outlined</h3>
  Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod
  tempor incididunt ut labore.
  <helix-button appearance="tertiary" slot="footer">Action</helix-button>
</helix-card>
