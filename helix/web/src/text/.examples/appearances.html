<!-- Every treatment the component has, in the order they descend. `as` is
     separate from `appearance`, so each of these can be any element: the size is
     the design and the tag is the document. -->
<helix-flex direction="column" gap="sm">
  <helix-text appearance="display" as="p">Display</helix-text>
  <helix-text appearance="heading" as="p">Heading</helix-text>
  <helix-text appearance="subheading" as="p">Subheading</helix-text>
  <helix-text appearance="title" as="p">Title</helix-text>
  <helix-text appearance="body" as="p">Body</helix-text>
  <helix-text appearance="body-strong" as="p">Body strong</helix-text>
  <helix-text appearance="caption" as="p">Caption</helix-text>
  <helix-text appearance="label" as="p">Label</helix-text>
  <helix-text appearance="code" as="p">Code</helix-text>
</helix-flex>
