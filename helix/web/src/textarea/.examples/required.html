<!-- `onsubmit` because a form that validates is a form that eventually submits,
     and this one is in a preview frame. -->
<form onsubmit="event.preventDefault()">
  <helix-flex direction="column" gap="sm">
    <helix-textarea
      hint="We read every one"
      label="What happened"
      name="report"
      placeholder="Start with what you expected"
      required
    ></helix-textarea>
    <helix-button appearance="primary" type="submit">Send</helix-button>
  </helix-flex>
</form>
