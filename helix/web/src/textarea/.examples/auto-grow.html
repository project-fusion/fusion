<!-- The box follows what is typed into it rather than scrolling, measured from
     the content rather than counted from the lines: a wrapped line, a pasted
     paragraph and a font that has not loaded yet all break the arithmetic and
     none of them break the measurement. -->
<helix-textarea
  auto-grow
  hint="Hint"
  label="Label"
  value="Lorem ipsum dolor sit amet, consectetur adipiscing elit."
></helix-textarea>
