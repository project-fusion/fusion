<!-- @summary The formatted timestamps on the headless tier, with every style written by hand. -->

<link
  href="styles.css"
  rel="stylesheet"
/>

<dl>
  <dt>Elapsed:</dt>
  <dd>
    <helix-headless-format-date
      class="stamp"
      elapsed
    ></helix-headless-format-date>
  </dd>

  <dt>Date:</dt>
  <dd>
    <helix-headless-format-date
      date="2026-03-14T15:09:00.000Z"
      day="numeric"
      month="short"
      time-zone="UTC"
      year="numeric"
    ></helix-headless-format-date>
  </dd>

  <dt>Time:</dt>
  <dd>
    <helix-headless-format-date
      date="2026-03-14T15:09:00.000Z"
      hour="numeric"
      minute="2-digit"
      time-zone="UTC"
    ></helix-headless-format-date>
  </dd>

  <dt>Weekday:</dt>
  <dd>
    <helix-headless-format-date
      date="2026-03-14T15:09:00.000Z"
      day="numeric"
      month="long"
      time-zone="UTC"
      weekday="long"
    ></helix-headless-format-date>
  </dd>
</dl>

<script>
  /* The elapsed time is set from script to 42 minutes ago, so it always reads
     "42m". The other dates are fixed and name a `time-zone`, so they look the
     same wherever the preview renders. */
  const at = new Date(Date.now() - 42 * 60_000).toISOString()
  for (const stamp of document.querySelectorAll('.stamp')) {
    stamp.date = at
  }
</script>
