<!-- @summary The same readings on the headless tier, with every rule written by hand. -->

<link
  href="styles.css"
  rel="stylesheet"
/>

<dl>
  <dt>Elapsed:</dt>
  <dd>
    <helix-headless-format-date
      class="stamp"
      elapsed
    ></helix-headless-format-date>
  </dd>

  <dt>Date:</dt>
  <dd>
    <helix-headless-format-date
      date="2026-03-14T15:09:00.000Z"
      day="numeric"
      month="short"
      time-zone="UTC"
      year="numeric"
    ></helix-headless-format-date>
  </dd>

  <dt>Time:</dt>
  <dd>
    <helix-headless-format-date
      date="2026-03-14T15:09:00.000Z"
      hour="numeric"
      minute="2-digit"
      time-zone="UTC"
    ></helix-headless-format-date>
  </dd>

  <dt>Weekday:</dt>
  <dd>
    <helix-headless-format-date
      date="2026-03-14T15:09:00.000Z"
      day="numeric"
      month="long"
      time-zone="UTC"
      weekday="long"
    ></helix-headless-format-date>
  </dd>
</dl>

<script>
  /* Only the elapsed reading is computed; the three absolute ones are pinned in
     the markup above. The styled twin carries the measurement that decided it. */
  const at = new Date(Date.now() - 42 * 60_000).toISOString()
  for (const stamp of document.querySelectorAll('.stamp')) {
    stamp.date = at
  }
</script>
