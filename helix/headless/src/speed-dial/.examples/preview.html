<!-- @summary The same speed dial on the headless tier, with every rule written by hand. -->
<!-- Generated from `preview.html` beside it by `bun run examples:headless`. Do not edit.
     It lives in the styled package because that is where it is derived from: the two
     examples show the same content on both tiers, which is only checkable while they
     sit together. `helix/headless` holds no examples of its own. See 275. -->

<link
  href="styles.css"
  rel="stylesheet"
/>

<div class="page">
  <helix-headless-speed-dial
    data-dock="bottom-end"
    data-dock-within
    label="Actions"
  >
    <helix-headless-icon-button
      label="Actions"
      slot="trigger"
    >
      <helix-headless-icon name="plus"></helix-headless-icon>
    </helix-headless-icon-button>

    <helix-headless-speed-dial-item value="share">
      Share
      <helix-headless-icon
        name="share-network"
        slot="icon"
      ></helix-headless-icon>
    </helix-headless-speed-dial-item>
    <helix-headless-speed-dial-item value="copy">
      Duplicate
      <helix-headless-icon
        name="copy"
        slot="icon"
      ></helix-headless-icon>
    </helix-headless-speed-dial-item>
    <helix-headless-speed-dial-item value="delete">
      Delete
      <helix-headless-icon
        name="trash"
        slot="icon"
      ></helix-headless-icon>
    </helix-headless-speed-dial-item>
  </helix-headless-speed-dial>
</div>
