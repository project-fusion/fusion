<!-- @summary A feed with unread items, with every style written by hand. -->

<link
  href="styles.css"
  rel="stylesheet"
/>

<helix-headless-notifications
  id="raw"
  label="Notifications"
  mark-all
>
  <h2 slot="header">Notifications</h2>

  <helix-headless-notification dismissible>
    <helix-headless-avatar
      name="Ada Okonjo"
      slot="media"
    ></helix-headless-avatar>
    <strong>Ada Okonjo</strong> approved your deploy to production.
    <button
      slot="actions"
      type="button"
    >View</button>
  </helix-headless-notification>

  <helix-headless-notification dismissible>
    <helix-headless-icon
      name="warning"
      slot="media"
    ></helix-headless-icon>
    Build <strong>#4821</strong> failed on <code>main</code>
    <button
      slot="actions"
      type="button"
    >Logs</button>
  </helix-headless-notification>

  <helix-headless-notification
    default-read
    dismissible
  >
    <helix-headless-avatar
      name="Platform Team"
      slot="media"
    ></helix-headless-avatar>
    Your invitation to the <strong>Platform</strong> team was accepted.
  </helix-headless-notification>

  <a
    href="#all"
    slot="footer"
  >See everything</a>
</helix-headless-notifications>

<script>
  const raw = document.getElementById('raw')
  const ago = (minutes) => new Date(Date.now() - minutes * 60000).toISOString()
  const items = raw.querySelectorAll('helix-headless-notification')
  items[0].at = ago(3)
  items[1].at = ago(42)
  items[2].at = ago(1500)
</script>
