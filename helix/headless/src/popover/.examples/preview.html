<!-- @summary The same popover on the headless tier, with every style written by hand. -->
<!-- @min 380 -->

<link
  href="styles.css"
  rel="stylesheet"
/>

<helix-headless-popover
  id="details"
  label="Project details"
>
  <helix-headless-button slot="trigger">Project details</helix-headless-button>
  <div class="stack">
    <p>
      The project has 12 members and 48 files. It was last updated on
      September 15, 2026.
    </p>
    <div class="actions">
      <helix-headless-button
        command="--close"
        commandfor="details"
      >
        Close
      </helix-headless-button>
    </div>
  </div>
</helix-headless-popover>
