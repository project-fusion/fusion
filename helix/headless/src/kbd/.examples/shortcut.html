<!-- @summary The chord on the headless tier, with every style written by hand. -->
<link
  href="styles.css"
  rel="stylesheet"
/>

<div class="stack">
  <p>
    Press
    <helix-headless-kbd keys="mod+k"></helix-headless-kbd>
    to search. The shortcut <code>mod+k</code> shows as ⌘K on a Mac and Ctrl+K on
    other computers.
  </p>

  <helix-headless-input
    aria-label="Filter"
    placeholder="Filter"
  >
    <helix-headless-kbd
      id="key"
      keys="/"
      slot="end"
      within="control"
    ></helix-headless-kbd>
  </helix-headless-input>

  <p
    class="caption"
    id="said"
  >
    Click the field and press / to filter the list.
  </p>
</div>

<script type="module">
  const key = document.getElementById('key')
  const said = document.getElementById('said')
  key.addEventListener('helix-shortcut', (event) => {
    said.textContent = `Heard ${event.detail.keys} inside the field.`
  })
</script>
