  href="styles.css"
  rel="stylesheet"
/>

  label="Filter rows"

    dismissible

    dismissible
    slot="tags"

    <span slot="prefix">Env</span>

  <helix-headless-tag
    dismissible
    slot="tags"
  >
    <span slot="prefix">Status</span>

  <helix-headless-tag
    dismissible
    slot="tags"

  </helix-headless-tag>
</helix-headless-filter-input>
