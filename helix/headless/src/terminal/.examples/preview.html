<!-- @summary The terminal frame on the headless tier, with every style written by hand. -->

<link
  href="styles.css"
  rel="stylesheet"
/>

<!-- Preview frame: data-preview-terminal has the frame connect xterm.js; on your page, connectTerminal does. -->
<helix-headless-terminal
  data-preview-terminal
  id="shell"
  label="~/fusion"
>
  <div data-preview-terminal-canvas></div>
</helix-headless-terminal>

<script type="module">
  document
    .getElementById('shell')
    .write('$ echo "Hello from the headless tier"\r\nHello from the headless tier\r\n$ ')
</script>
