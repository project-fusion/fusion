<!-- @summary The same command on the headless tier, with every rule written by hand. -->
<!-- @min 320 -->

<link
  href="styles.css"
  rel="stylesheet"
/>

<helix-headless-command
  default-open
  label="Commands"
>
  <helix-headless-option value="new">New file</helix-headless-option>
  <helix-headless-option value="open">Open folder</helix-headless-option>
  <helix-headless-option value="save">Save all</helix-headless-option>
  <p slot="footer">
    <helix-headless-kbd>Cmd</helix-headless-kbd>
    <helix-headless-kbd>K</helix-headless-kbd>
    to open,
    <helix-headless-kbd>Esc</helix-headless-kbd>
    to close
  </p>
</helix-headless-command>
