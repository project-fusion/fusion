<!-- @summary The same lightbox on the headless tier, with every style written by hand. -->
<!-- @min 420 -->

<link
  href="styles.css"
  rel="stylesheet"
/>

<helix-headless-button
  command="--show"
  commandfor="base-gallery"
>Open gallery</helix-headless-button>

<!-- The lightbox starts open, so the preview shows it. -->
<helix-headless-lightbox
  id="base-gallery"
  label="Beach photos"
  open
>
  <div slot="header">
    <helix-headless-icon-button
      command="--close"
      commandfor="base-gallery"
      label="Close"
    >
      <helix-headless-icon name="x"></helix-headless-icon>
    </helix-headless-icon-button>
  </div>

  <helix-headless-lightbox-item
    label="Seawater over pale sand"
    value="seawater"
  >
    <img
      alt="Seawater over pale sand"
      src="/media/scale/seawater-800.jpg"
    />
    <span slot="description">Shallow water at the beach in the morning.</span>
  </helix-headless-lightbox-item>

  <helix-headless-lightbox-item
    label="The sun low over open water"
    value="ocean-sun"
  >
    <img
      alt="The sun low over open water"
      src="/media/scale/ocean-sun.jpg"
    />
    <span slot="description">Sunset over the ocean the same day.</span>
  </helix-headless-lightbox-item>
</helix-headless-lightbox>
