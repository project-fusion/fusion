<!-- @summary The file input on the headless tier, with every style written by hand. -->

<link
  href="styles.css"
  rel="stylesheet"
/>

<helix-headless-file-input
  hint="PNG or JPG, up to 10MB each"
  label="Attachments"
  multiple
  name="attachments"
>
  <helix-headless-icon
    name="upload-simple"
    slot="trigger"
  ></helix-headless-icon>
  <span slot="trigger">Choose files, or drop them here</span>
</helix-headless-file-input>
