[package]
name = "fusion-helix-cli"
description = "The Helix command line: theme derivation, auditing and scaffolding."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
# Its own, never `workspace = true`. See the note in the root manifest.
version = "0.0.0-dev"

# **The binary drops the suffix**, per the naming rule: the crate is `fusion-helix-cli`
# and the command a reader types is `helix`.
[[bin]]
name = "helix"
path = "src/main.rs"

[dependencies]
# **The derivation is a library and this is a caller.** A binary that scaffolds
# projects is not the home of color math, so `fusion-helix-theme` stays its own crate
# and keeps its WASM wrapper buildable without dragging the command surface into
# `@fusion.dev/helix-theme`.
fusion-helix-theme = { path = "../theme", features = ["serde"] }
# **The visual tests, a library with this binary as its one caller.** Its own
# crate so the config, the codecs, the diff and the report keep the boundary
# they had as a command of their own, and `helix visual` is one noun here.
fusion-helix-visual = { path = "../visual" }
# **The host that runs a rule somebody else wrote**, through the rules world.
# It knows what a module is and not what a component is, so the payload a
# plugin receives is composed here and the sandbox is enforced there.
fusion-plugin-rules = { workspace = true }
# **What a rule is, and the runner that measures a set of them.** Shared with
# `fusion-cli` and owned by neither product, so this is not a dependency on the
# fusion domain: the crate's `lib.rs` carries the argument.
fusion-rules = { workspace = true }
clap = { version = "4", features = ["derive"] }
regex = { workspace = true }
# **Only the CLI takes this.** `fusion-helix-theme` computes and does not draw, and a
# library that pulled a terminal backend in would carry it into the WASM build.
ratatui = { workspace = true }
serde = { workspace = true }
# `preserve_order` is not optional here either. The manifest this crate writes
# is held byte for byte to the analyzer's, whose keys are in the order it wrote
# them rather than in alphabetical order, and a `BTreeMap` cannot say that. It
# also removes a hazard: another crate in the workspace asks for the feature, so
# without this the key order depended on what else was being built, and a test
# that read the printed text passed in `cargo test --workspace` and failed in
# `cargo test -p fusion-helix-cli`.
serde_json = { workspace = true, features = ["float_roundtrip", "preserve_order"] }
# **The intermediate form's types for TypeScript and its JSON Schema, both
# derived from the structs `helix system` writes.** The native runtime imports
# the generated types, so no hand-written copy of the contract can drift from
# it, and the schema is published beside the form for any other emitter.
schemars = "1.2"
ts-rs = "12.0"
oxc_parser = "0.156.0"
oxc_allocator = "0.156.0"
oxc_span = "0.156.0"
oxc_ast = "0.156.0"
oxc_ast_visit = "0.156.0"

[dev-dependencies]
# Encodes the example plugin into a component, which is what a plugin author's
# toolchain does for them: the end-to-end test takes the path an author takes
# rather than reading an artifact somebody committed. At the version the
# workspace pins, for the reason given there.
wit-component = { workspace = true }
# `helix visual compare`'s tests write their own pictures rather than reading
# committed ones.
png = "0.18"

# **On in every build here, and off in the binaries `binaries.yml` publishes**,
# which build with `--no-default-features`. It holds the rules Helix's own components
# are held to and `helix manifest build`: this repository's tooling, which serves nobody
# who installs the command. `helix component` itself stays, with the public rules.
[features]
default = ["internal"]
internal = []

[lints]
workspace = true
