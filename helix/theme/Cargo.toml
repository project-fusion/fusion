[package]
name = "helix-theme"
description = "Helix theme derivation: OKLCH color math and contrast-solved palettes."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
# Its own, never `workspace = true`. See the note in the root manifest: a version
# is a fact about a domain and this workspace holds two. `check:publishable`
# fails on a crate that inherits one.
version = "0.0.0-dev"

# **One folder, two source trees, and the lib path is what buys that.**
#
# `helix/theme` is one package in two distributions, the crate and the WASM
# wrapper built from it, which is why 142 puts them in one folder rather than
# two pretending otherwise. `src/` is already the TypeScript engine, so Cargo's
# default would drop `.rs` files beside `.ts` ones in a directory with two sets
# of conventions and two meanings for `mod`. `rust/` keeps them apart without
# splitting the package.
[lib]
path = "rust/lib.rs"
# **`cdylib` for the browser and `rlib` for everything else, and both are
# required.** `wasm-bindgen` reads a `cdylib`, and declaring only that would stop
# `helix-cli` linking against this crate at all: `crate-type` replaces the default
# rather than adding to it, so the day the wrapper was added would be the day the
# CLI stopped building, for a reason whose error message says nothing about WASM.
crate-type = ["cdylib", "rlib"]

[features]
# **Reading an intent out of JSON, which one of the two distributions needs.**
# The WASM wrapper takes a JavaScript object and has no JSON to parse; the CLI
# reads a file and does. Default-off keeps the library dependency-free for the
# consumer that ships to a browser.
serde = ["dep:serde"]
# **The browser distribution.** Pulls `serde` in rather than repeating its
# argument: the boundary is JSON, so a wrapper without a reader is a wrapper that
# cannot take an intent.
wasm = ["serde", "dep:serde_json", "dep:wasm-bindgen"]

[dependencies]
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true, features = ["float_roundtrip"] }
wasm-bindgen = { version = "0.2.126", optional = true }

[dev-dependencies]
# Only the oracle test reads JSON. The library stays dependency-free, which is
# what keeps the WASM wrapper small and its build boring.
#
# **`float_roundtrip` is not optional here, it is the whole point.** Without it
# serde_json takes a fast path that is not correctly rounded, and it parsed
# `-0.014142135623730949` out of the oracle as `-0.014142135623730947`: one ulp,
# in the file the port is being measured against. That is the harness corrupting
# its own reference, which reports as the port being wrong and had 53 of 240
# distances "differing" when the port was right and the reader was not.
serde_json = { workspace = true, features = ["float_roundtrip"] }

[lints]
workspace = true
