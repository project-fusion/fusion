[package]
name = "fusion-helix-theme"
description = "Helix theme derivation: OKLCH color math and contrast-solved palettes."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
# Its own, never `workspace = true`: a version is a fact about a domain and this
# workspace holds two. A crate that inherits one fails the build.
version = "0.0.0-dev"

# One package, two source trees: `src/` is the TypeScript engine, so Cargo's
# default would drop `.rs` beside `.ts` with two meanings for `mod`.
[lib]
path = "rust/lib.rs"
# Both are required. `crate-type` replaces the default rather than adding to it,
# so `cdylib` alone would stop `fusion-helix-cli` linking against this crate, with
# an error that says nothing about WASM.
crate-type = ["cdylib", "rlib"]

[features]
# Default-off, so the library stays dependency-free for the browser consumer.
serde = ["dep:serde"]
# The boundary is JSON, so the wrapper needs a reader.
wasm = ["serde", "dep:serde_json", "dep:wasm-bindgen"]

[dependencies]
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true, features = ["float_roundtrip"] }
wasm-bindgen = { version = "0.2.126", optional = true }

[dev-dependencies]
# `float_roundtrip` is not optional. Without it serde_json takes a fast path that
# is not correctly rounded and misreads the oracle by one ulp, which reported as
# 53 of 240 distances differing when the reader was wrong and the port was right.
serde_json = { workspace = true, features = ["float_roundtrip"] }

[lints]
workspace = true
