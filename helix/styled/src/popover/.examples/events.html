<!-- @summary A panel anchored to its trigger, which sends events before it opens or closes and after. -->
<!-- @min 380 -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-popover
    id="details"
    label="Details"
  >
    <helix-button slot="trigger">Details</helix-button>
    <helix-text>Last edited by Alex Kim on August 27.</helix-text>
  </helix-popover>


  <helix-list
    divided
    id="log"
    label="Events"
  >
    <helix-list-item>
      No events yet
      <span slot="description">Press Details, then press it again</span>
    </helix-list-item>
  </helix-list>
</helix-flex>

<script type="module">
  const details = document.getElementById('details')
  const log = document.getElementById('log')
  let empty = true

  // The log keeps the last six events.
  const KEEP = 6

  const say = (name, carried) => {
    if (empty) {
      log.replaceChildren()
      empty = false
    }
    const row = document.createElement('helix-list-item')
    row.textContent = name
    const under = document.createElement('span')
    under.slot = 'description'
    under.textContent = carried
    row.append(under)
    log.append(row)
    while (log.children.length > KEEP) {
      log.firstElementChild.remove()
    }
  }

  details.addEventListener('helix-before-open', () => {
    say('helix-before-open', 'About to open')
  })
  details.addEventListener('helix-before-close', () => {
    say('helix-before-close', 'About to close')
  })
  details.addEventListener('toggle', (event) => {
    say('toggle', `Changed from ${event.oldState} to ${event.newState}`)
  })
</script>
