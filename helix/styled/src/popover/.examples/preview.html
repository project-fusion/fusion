<!-- @summary A panel anchored to what opened it. -->
<!-- @min 380 -->
<link
  href="styles.css"
  rel="stylesheet"
/>

<helix-popover
  class="details"
  id="details"
  label="Project details"
>
  <helix-button slot="trigger">Project details</helix-button>
  <helix-flex
    direction="column"
    gap="md"
  >
    <helix-text variant="body">
      The project has 12 members and 48 files. It was last updated on
      September 15, 2026.
    </helix-text>
    <helix-flex justify-content="end">
      <helix-button
        command="--close"
        commandfor="details"
        emphasis="outlined"
      >Close</helix-button>
    </helix-flex>
  </helix-flex>
</helix-popover>
