<!-- @summary A dialog whose content sits centered, for a short confirmation. -->
<link
  href="styles.css"
  rel="stylesheet"
>

<helix-button
  command="--show"
  commandfor="discard"
  emphasis="solid"
  tone="danger"
>Discard changes</helix-button>

<helix-dialog
  id="discard"
  label="Discard changes"
  size="sm"
  text-align="center"
>
  <helix-icon
    name="x-circle-fill"
    slot="icon"
  ></helix-icon>
  <helix-text
    as="h2"
    slot="header"
  >Discard changes?</helix-text>
  <helix-text>Nine edits have not been saved. Closing now leaves them behind.</helix-text>
  <helix-button-group
    label="Dialog actions"
    slot="footer"
    variant="spaced"
  >
    <helix-button
      emphasis="solid"
      tone="danger"
    >Discard</helix-button>
    <helix-button
      command="--close"
      commandfor="discard"
    >Keep editing</helix-button>
  </helix-button-group>
</helix-dialog>
