<!-- @summary A `helix-before-close` listener cancels the first close and allows the second. -->
<!-- @min 420 -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-button
    command="--show"
    commandfor="unsaved"
    emphasis="solid"
    tone="primary"
  >Open dialog</helix-button>

  <helix-dialog
    id="unsaved"
    label="Unsaved changes"
  >
    <helix-text>You have changes that have not been saved.</helix-text>
    <helix-button
      command="--close"
      commandfor="unsaved"
      slot="footer"
    >Close</helix-button>
  </helix-dialog>

  <helix-list
    divided
    id="log"
    label="Events"
  >
    <helix-list-item>
      No events yet
      <span slot="description">Open the dialog, then close it twice</span>
    </helix-list-item>
  </helix-list>
</helix-flex>

<script type="module">
  const unsaved = document.getElementById('unsaved')
  const log = document.getElementById('log')
  let empty = true

  // The log keeps the last six events.
  const KEEP = 6
  let refused = false

  const say = (name, carried) => {
    if (empty) {
      log.replaceChildren()
      empty = false
    }
    const row = document.createElement('helix-list-item')
    row.textContent = name
    const under = document.createElement('span')
    under.slot = 'description'
    under.textContent = carried
    row.append(under)
    log.append(row)
    while (log.children.length > KEEP) {
      log.firstElementChild.remove()
    }
  }

  unsaved.addEventListener('helix-before-open', () => {
    say('helix-before-open', 'About to open')
  })
  unsaved.addEventListener('helix-before-close', (event) => {
    if (refused) {
      say('helix-before-close', 'Allowed the close')
      return
    }
    refused = true
    event.preventDefault()
    say('helix-before-close', 'Canceled the close')
  })
  unsaved.addEventListener('toggle', (event) => {
    say('toggle', `Changed from ${event.oldState} to ${event.newState}`)
  })
  unsaved.addEventListener('close', () => {
    say('close', 'Closed')
  })
</script>
