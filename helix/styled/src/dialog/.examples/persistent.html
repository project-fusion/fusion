<!-- @summary A dialog that Escape and a press outside do not close, for a required choice. -->

<helix-dialog
  default-open
  label="Unsaved changes"
  persistent
>
  <p>Two edits have not been saved. Closing now discards them.</p>
  <helix-button-group
    label="Dialog actions"
    slot="footer"
    variant="spaced"
  >
    <helix-button>Discard</helix-button>
    <helix-button
      emphasis="solid"
      tone="primary"
    >Save</helix-button
    >
  </helix-button-group>
</helix-dialog>
