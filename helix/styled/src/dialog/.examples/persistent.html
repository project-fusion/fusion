<!-- @summary A dialog that Escape and a press outside do not close, for a required choice. -->

<helix-dialog
  default-open
  id="unsaved"
  label="Unsaved changes"
  persistent
>
  <helix-text as="p">You have two unsaved changes. Save or discard them to continue.</helix-text>
  <helix-button-group
    label="Dialog actions"
    slot="footer"
    variant="spaced"
  >
    <helix-button
      command="--close"
      commandfor="unsaved"
    >Discard changes</helix-button>
    <helix-button
      command="--close"
      commandfor="unsaved"
      emphasis="solid"
      tone="primary"
    >Save changes</helix-button
    >
  </helix-button-group>
</helix-dialog>
