<!-- @summary A dialog opened by a button, with actions in its footer. -->
<!-- @min 420 -->
<helix-button
  command="--show"
  commandfor="confirm"
  emphasis="solid"
  tone="primary"
>Delete project</helix-button>

<helix-dialog
  id="confirm"
  label="Delete project"
>
  <helix-text
    as="h2"
    slot="header"
  >Delete project</helix-text>
  <helix-text>This removes the project and everything in it. It cannot be undone.</helix-text>
  <helix-flex
    gap="sm"
    slot="footer"
  >
    <helix-button
      command="--close"
      commandfor="confirm"
      emphasis="solid"
      tone="danger"
      width="standard"
    >Delete</helix-button>
    <helix-button
      command="--close"
      commandfor="confirm"
      width="standard"
    >Cancel</helix-button>
  </helix-flex>
</helix-dialog>
