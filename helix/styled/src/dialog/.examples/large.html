<!-- @summary A wider dialog, for a form that does not fit the default width. -->
<helix-button
  command="--show"
  commandfor="large-dialog"
  emphasis="solid"
  tone="primary"
>Open dialog</helix-button>

<helix-dialog
  id="large-dialog"
  label="Edit profile"
  size="lg"
>
  <helix-text
    as="h2"
    slot="header"
  >Edit profile</helix-text>
  <helix-text>Update your name, email address, and profile photo. Members of your workspace
  can see these details.</helix-text>
  <helix-button-group
    label="Dialog actions"
    slot="footer"
    variant="spaced"
  >
    <helix-button
      command="--close"
      commandfor="large-dialog"
      emphasis="solid"
      tone="primary"
    >Save changes</helix-button>
    <helix-button
      command="--close"
      commandfor="large-dialog"
    >Cancel</helix-button>
  </helix-button-group>
</helix-dialog>
