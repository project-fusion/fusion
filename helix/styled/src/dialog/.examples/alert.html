<!-- @summary An alert dialog with a close control, described by the sentence under its title. -->

<helix-dialog
  alert
  default-open
  dismissible
  id="delete-project"
>
  <helix-text
    as="h2"
    slot="header"
  >Delete project</helix-text>
  <helix-text as="p">The project and its history are deleted for everyone on your team.</helix-text>
  <helix-button-group
    label="Dialog actions"
    layout="spaced"
    slot="footer"
  >
    <helix-button
      command="--close"
      commandfor="delete-project"
    >Keep project</helix-button>
    <helix-button
      command="--close"
      commandfor="delete-project"
      emphasis="solid"
      tone="danger"
    >Delete project</helix-button
    >
  </helix-button-group>
</helix-dialog>
