<!-- @summary Typing sends `helix-before-change` and `input`, and leaving the field sends `change`. -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-textarea
    id="notes"
    label="Notes"
    placeholder="Add a note"
  ></helix-textarea>


  <helix-list
    divided
    id="log"
    label="Events"
  >
    <helix-list-item>
      No events yet
      <span slot="description">Type in the field</span>
    </helix-list-item>
  </helix-list>
</helix-flex>

<script type="module">
  const notes = document.getElementById('notes')
  const log = document.getElementById('log')
  let empty = true

  // The log keeps this many of the most recent rows.
  const KEEP = 6

  const say = (name, carried) => {
    if (empty) {
      log.replaceChildren()
      empty = false
    }
    const row = document.createElement('helix-list-item')
    row.textContent = name
    const under = document.createElement('span')
    under.slot = 'description'
    under.textContent = carried
    row.append(under)
    log.append(row)
    while (log.children.length > KEEP) {
      log.firstElementChild.remove()
    }
  }

  notes.addEventListener('helix-before-change', (event) => {
    say('helix-before-change', `about to change to ${event.detail.value.length} characters, can be canceled`)
  })
  notes.addEventListener('input', (event) => {
    say('input', `${event.currentTarget.value.length} characters so far`)
  })
  notes.addEventListener('change', (event) => {
    say('change', `${event.currentTarget.value.length} characters, sent when the field loses focus`)
  })
</script>
