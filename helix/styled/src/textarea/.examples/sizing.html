<!-- @summary The number of lines a textarea opens at, and the most characters it accepts. -->

<helix-flex
  direction="column"
  gap="md"
>
  <helix-textarea
    hint="Two hundred at most"
    label="Summary"
    maxlength="200"
    rows="2"
  ></helix-textarea>

  <helix-textarea
    hint="Forty at least, so there is something to review"
    label="Detail"
    minlength="40"
    rows="6"
  ></helix-textarea>
</helix-flex>
