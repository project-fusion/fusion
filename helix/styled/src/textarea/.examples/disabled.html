<!-- @summary A disabled textarea, set on the field and inherited from a disabled fieldset. -->
<helix-flex
  direction="column"
  gap="lg"
>
  <helix-textarea
    default-value="Cannot be edited"
    disabled
    hint="Locked after the order ships"
    label="Order notes"
  ></helix-textarea>

  <!-- The disabled fieldset around it disables this field. -->
  <fieldset disabled>
    <helix-textarea
      default-value="Also cannot be edited"
      hint="Locked after the order ships"
      label="Gift message"
    ></helix-textarea>
  </fieldset>
</helix-flex>
