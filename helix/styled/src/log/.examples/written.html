<!-- @summary A CI run written to the log as it arrives, with its colors, a progress bar that stays one line, and its steps read off markers. -->
<helix-log
  id="run"
  label="CI run"
  line-numbers
>
  <helix-flex
    data-density="sm"
    justify-content="end"
    slot="toolbar"
  >
    <helix-button id="again">Run again</helix-button>
  </helix-flex>
</helix-log>

<script type="module">
  const log = document.getElementById('run')

  const OUTPUT = [
    '::group::Install dependencies',
    '\x1b[2m$ bun install\x1b[0m',
    'Downloading 12%\rDownloading 48%\rDownloading 100%',
    'Resolved 1,214 packages in 2.1s',
    '\x1b[33mwarn\x1b[0m glob@7.2.3 is deprecated',
    '::endgroup::38s',
    '::group::Test',
    '\x1b[2m$ bun test\x1b[0m',
    '\x1b[32m✓\x1b[0m core \x1b[2m(412 specs)\x1b[0m',
    '\x1b[32m✓\x1b[0m headless \x1b[2m(634 specs)\x1b[0m',
    '\x1b[31m✗\x1b[0m styled/button \x1b[2m(1 failed)\x1b[0m',
    '::error::expected the label "Save changes" to stay on one line',
    '::endgroup::1m 31s',
  ]

  let groups = []
  let current

  // Reads the markers a CI runner writes: a group opens and closes a step, and
  // an error marks its line.
  log.parse = (text) => {
    if (text.startsWith('::group::')) {
      current = `step-${groups.length}`
      groups = [...groups, { heading: text.slice(9), id: current, open: true, status: 'running' }]
      log.groups = groups
      return null
    }
    if (text.startsWith('::endgroup::')) {
      groups = groups.map((group) =>
        group.id === current
          ? {
              ...group,
              duration: text.slice(12),
              open: group.status === 'failed',
              status: group.status === 'failed' ? 'failed' : 'done',
            }
          : group,
      )
      log.groups = groups
      current = undefined
      return null
    }
    if (text.startsWith('::error::')) {
      groups = groups.map((group) => (group.id === current ? { ...group, status: 'failed' } : group))
      log.groups = groups
      return { group: current, level: 'error', text: text.slice(9) }
    }
    return current ? { group: current } : undefined
  }

  let timer
  const start = () => {
    clearTimeout(timer)
    groups = []
    current = undefined
    log.groups = []
    log.clear()
    log.done = false
    // With reduced motion, the whole run is written at once.
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      log.write(`${OUTPUT.join('\n')}\n`)
      log.done = true
      return
    }
    let at = 0
    const next = () => {
      log.write(`${OUTPUT[at]}\n`)
      at += 1
      if (at < OUTPUT.length) {
        timer = setTimeout(next, 180)
      } else {
        log.done = true
      }
    }
    next()
  }

  log.write(`${OUTPUT.join('\n')}\n`)
  log.done = true
  document.getElementById('again').addEventListener('click', start)
</script>
