<!-- @summary A dev server's console, each repeat folded into one line with a count, and a level to show from. -->
<helix-log
  collapse
  id="server"
  label="Dev server"
  level="log"
  line-numbers
  wrap
>
  <helix-flex
    align-items="center"
    justify-content="between"
    slot="toolbar"
  >
    <helix-text variant="body-strong">Dev server</helix-text>
    <helix-select
      aria-label="Levels shown"
      default-value="log"
      emphasis="ghost"
      id="level"
    >
      <helix-option value="debug">All levels</helix-option>
      <helix-option value="log">Logs and above</helix-option>
      <helix-option value="info">Info and above</helix-option>
      <helix-option value="warn">Warnings and errors</helix-option>
      <helix-option value="error">Errors</helix-option>
    </helix-select>
  </helix-flex>
</helix-log>

<script type="module">
  const log = document.getElementById('server')

  // Four of these are the same line written again, which `collapse` folds.
  log.lines = [
    { level: 'info', text: 'Ready on http://localhost:5173 in 412 ms' },
    { level: 'debug', text: 'Watching 1,204 files under src' },
    { level: 'log', text: 'Page reload src/app.tsx' },
    { level: 'log', text: 'Page reload src/app.tsx' },
    { level: 'log', text: 'Page reload src/app.tsx' },
    { level: 'warn', text: 'Each child in a list should have a unique "key" prop. Check the render method of CartItems.' },
    { level: 'warn', text: 'Each child in a list should have a unique "key" prop. Check the render method of CartItems.' },
    { level: 'debug', text: 'Rebuilt 3 modules in 18 ms' },
    { level: 'log', text: 'Hot update src/cart.tsx' },
    { level: 'error', text: 'Failed to resolve import "./totals" from "src/cart.tsx". Does the file exist?' },
    { level: 'log', text: 'Hot update src/cart.tsx' },
  ]

  document.getElementById('level').addEventListener('change', (event) => {
    log.level = event.currentTarget.value
  })
</script>
