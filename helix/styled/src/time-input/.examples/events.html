<!-- @summary A typed time and a time chosen from the wheels send the same events. -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-time-input
    id="at"
    label="Starts"
    name="starts"
  ></helix-time-input>


  <helix-list
    divided
    id="log"
    label="Events"
  >
    <helix-list-item>
      No events yet
      <span slot="description">Type a time, or open the wheels</span>
    </helix-list-item>
  </helix-list>
</helix-flex>

<script type="module">
  const at = document.getElementById('at')
  const log = document.getElementById('log')
  let empty = true

  // The log keeps this many of the most recent rows.
  const KEEP = 8

  const say = (name, carried) => {
    if (empty) {
      log.replaceChildren()
      empty = false
    }
    const row = document.createElement('helix-list-item')
    row.textContent = name
    const under = document.createElement('span')
    under.slot = 'description'
    under.textContent = carried
    row.append(under)
    log.append(row)
    while (log.children.length > KEEP) {
      log.firstElementChild.remove()
    }
  }

  at.addEventListener('helix-before-open', () => {
    say('helix-before-open', 'the panel is about to open, can be canceled')
  })
  at.addEventListener('helix-before-close', () => {
    say('helix-before-close', 'the panel is about to close, can be canceled')
  })
  at.addEventListener('toggle', (event) => {
    say('toggle', `${event.oldState} to ${event.newState}, after the panel opened or closed`)
  })
  at.addEventListener('helix-before-change', (event) => {
    say('helix-before-change', `about to change to "${event.detail.value}", can be canceled`)
  })
  at.addEventListener('input', (event) => {
    say('input', `"${event.currentTarget.value}", sent once for the whole value`)
  })
  at.addEventListener('change', (event) => {
    say('change', `"${event.currentTarget.value}", sent when the value is committed`)
  })
</script>
