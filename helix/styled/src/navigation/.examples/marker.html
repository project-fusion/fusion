<!-- @summary The current page marked by the resting pill with nothing behind the row, by a bar on a rule under the row with `underlined`, and by a raised pill in a sunken track with `segmented`. -->
<helix-flex
  direction="column"
  gap="lg"
>
  <helix-navigation label="Sections">
    <a
      aria-current="page"
      href="#one"
    >Overview</a>
    <a href="#two">Activity</a>
    <a href="#three">Settings</a>
  </helix-navigation>

  <helix-navigation
    label="Sections"
    marker="underlined"
  >
    <a
      aria-current="page"
      href="#one"
    >Overview</a>
    <a href="#two">Activity</a>
    <a href="#three">Settings</a>
  </helix-navigation>

  <helix-navigation
    label="Sections"
    marker="segmented"
  >
    <a
      aria-current="page"
      href="#one"
    >Overview</a>
    <a href="#two">Activity</a>
    <a href="#three">Settings</a>
  </helix-navigation>
</helix-flex>
