<!-- @summary Columns that drop out as the table narrows, the least needed first. -->

<helix-data-table
  id="services"
  label="Services"
>
  <helix-table-column field="name">Service</helix-table-column>
  <helix-table-column
    field="status"
    min-table-width="20rem"
  >Status</helix-table-column>
  <helix-table-column
    field="region"
    min-table-width="32rem"
  >Region</helix-table-column>
  <helix-table-column
    field="owner"
    min-table-width="40rem"
  >Owner</helix-table-column>
</helix-data-table>
