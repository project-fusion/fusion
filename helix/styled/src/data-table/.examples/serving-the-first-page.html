<!-- @summary The first page written out as rows, so the HTML carries the values before the table draws its own. -->

<helix-data-table
  default-sort="name:asc"
  id="files"
  label="Files"
  page-size="4"
>
  <helix-table-column
    field="name"
    sortable
  >Name</helix-table-column>
  <helix-table-column
    field="region"
    sortable
  >Region</helix-table-column>
  <helix-table-column
    field="size"
    sortable
    text-align="end"
  >Size</helix-table-column>

  <!-- The first page, in the table's sort and page size, formatted as its
       columns draw it. A server writes these from the same rows. -->
  <helix-table-row>
    <helix-table-cell header>archive.tar.gz</helix-table-cell>
    <helix-table-cell>us-east-1</helix-table-cell>
    <helix-table-cell>4.8 MB</helix-table-cell>
  </helix-table-row>
  <helix-table-row>
    <helix-table-cell header>backup.sql</helix-table-cell>
    <helix-table-cell>eu-central-1</helix-table-cell>
    <helix-table-cell>918.4 kB</helix-table-cell>
  </helix-table-row>
  <helix-table-row>
    <helix-table-cell header>index.json</helix-table-cell>
    <helix-table-cell>us-east-1</helix-table-cell>
    <helix-table-cell>2.1 kB</helix-table-cell>
  </helix-table-row>
  <helix-table-row>
    <helix-table-cell header>manifest.yaml</helix-table-cell>
    <helix-table-cell>ap-south-1</helix-table-cell>
    <helix-table-cell>812 B</helix-table-cell>
  </helix-table-row>
</helix-data-table>

<script>
  /* The table shows the rows above until `rows` holds a row, then draws its
     own in their place. The size is formatted the same way on both sides, in
     one locale, so the two pages match. */
  const units = ['B', 'kB', 'MB', 'GB']

  const bytes = (value) => {
    const step = Math.min(units.length - 1, Math.floor(Math.log10(Math.max(value, 1)) / 3))
    const amount = new Intl.NumberFormat('en-US', {
      maximumFractionDigits: step === 0 ? 0 : 1,
    }).format(value / 1000 ** step)
    return `${amount} ${units[step]}`
  }

  const files = document.getElementById('files')
  const size = files.querySelector('[field="size"]')
  size.cell = (row) => bytes(row.size)
  size.compare = (row) => row.size

  files.rows = [
    { name: 'archive.tar.gz', region: 'us-east-1', size: 4_823_100 },
    { name: 'backup.sql', region: 'eu-central-1', size: 918_400 },
    { name: 'index.json', region: 'us-east-1', size: 2_100 },
    { name: 'manifest.yaml', region: 'ap-south-1', size: 812 },
    { name: 'profile.bin', region: 'eu-west-2', size: 61_440 },
    { name: 'report.pdf', region: 'us-west-1', size: 1_204_000 },
    { name: 'snapshot.img', region: 'eu-central-1', size: 9_800_000 },
    { name: 'trace.log', region: 'ap-south-1', size: 44_900 },
  ]
</script>
