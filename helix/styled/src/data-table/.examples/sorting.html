<!-- @summary Rows that slide to their new places when a heading sorts them, and columns that slide when you move one. -->

<helix-data-table
  id="releases"
  label="Releases"
  reorderable
  row-key="version"
>
  <helix-table-column
    field="version"
    menu
    sortable
  >Version</helix-table-column>
  <helix-table-column
    field="downloads"
    menu
    sortable
    text-align="end"
  >Downloads</helix-table-column>
  <helix-table-column
    field="owner"
    menu
    sortable
  >Owner</helix-table-column>
</helix-data-table>
