<!-- @summary A summary of the rows shown and a page size menu, on either side of the built-in pagination. -->
<!-- @min 520 -->

<helix-data-table
  id="files"
  label="Files"
  page-size="8"
>
  <helix-pagination-summary
    id="range"
    page="1"
    page-size="8"
    slot="footer"
    total="40"
  ></helix-pagination-summary>
  <helix-pagination-size
    default-value="8"
    id="size"
    sizes="8,16,40"
    slot="footer"
  ></helix-pagination-size>

  <helix-table-column
    field="name"
    sortable
    width="14rem"
  >File</helix-table-column>
  <helix-table-column
    field="size"
    sortable
    text-align="end"
  >Size</helix-table-column>
  <helix-table-column field="kind">Kind</helix-table-column>
</helix-data-table>

<script type="module">
  const table = document.getElementById('files')
  const range = document.getElementById('range')
  const size = document.getElementById('size')

  const TOTAL = 40
  table.rows = Array.from({ length: TOTAL }, (_, index) => ({
    kind: index % 4 === 0 ? 'font' : 'image',
    name: `asset-${String(index + 1).padStart(3, '0')}.webp`,
    size: 12000 + index * 837,
  }))

  /* The summary takes its own `page`, `page-size`, and `total`. This listener
     keeps them in step with the table. */
  const sync = () => {
    range.page = table.page
    range.pageSize = table.pageSize
  }

  table.addEventListener('helix-navigate', () => {
    /* The event is sent before the table changes page, so the sync waits for
       the next microtask. */
    queueMicrotask(sync)
  })

  size.addEventListener('helix-before-change', (event) => {
    table.pageSize = Number(event.detail.value)
    queueMicrotask(sync)
  })
</script>
