<!-- @summary A table under a heading and a divider, its words and headings on their column and the selected row's fill reaching past it. -->
<link
  href="styles.css"
  rel="stylesheet"
>

<div class="panel">
  <p class="heading">Services</p>
  <helix-divider></helix-divider>
  <helix-data-table
    bleed
    default-selected="web,worker"
    id="bleed-table"
    label="Services"
    row-key="name"
    selectable
  >
    <helix-table-column field="name">Name</helix-table-column>
    <helix-table-column field="region">Region</helix-table-column>
    <helix-table-column
      field="count"
      text-align="end"
    >Instances</helix-table-column>
  </helix-data-table>
</div>

<script>
  document.getElementById('bleed-table').rows = [
    { count: 12, name: 'api', region: 'eu-central-1' },
    { count: 3, name: 'web', region: 'us-east-1' },
    { count: 5, name: 'worker', region: 'us-west-2' },
  ]
</script>
