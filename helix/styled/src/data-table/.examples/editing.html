<!-- @summary An invoice table whose owner, amount, due date, and paid columns a reader can edit in place, with an amount that may not go under zero. -->

<helix-data-table
  id="editing"
  label="Invoices"
  row-key="id"
>
  <helix-table-column
    field="id"
    row-header
  >Invoice</helix-table-column>
  <helix-table-column
    editable
    field="owner"
    required
    type="enum"
  >Owner</helix-table-column>
  <helix-table-column
    editable
    field="amount"
    min="0"
    text-align="end"
    type="number"
  >Amount</helix-table-column>
  <helix-table-column
    editable
    field="due"
    type="date"
  >Due</helix-table-column>
  <helix-table-column
    editable
    field="paid"
    type="boolean"
  >Paid</helix-table-column>
</helix-data-table>
