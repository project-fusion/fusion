<!-- @summary Ten thousand entries, with only the rows in view drawn. Screen readers still announce each row's position in the whole value. -->
<helix-object-inspector
  id="events"
  label="events.json"
  windowed
></helix-object-inspector>

<script>
  document.getElementById('events').value = Array.from({ length: 10000 }, (_, at) => ({
    id: at + 1,
    ok: at % 7 !== 0,
    type: at % 3 === 0 ? 'deploy' : 'build',
  }))
</script>
