<!-- @summary A column of controls, where the arrow keys move up and down instead. -->

  label="Drawing"
  orientation="vertical"
>

    <helix-icon name="compass"></helix-icon>
  </helix-icon-button>

  </helix-icon-button>
</helix-toolbar>
