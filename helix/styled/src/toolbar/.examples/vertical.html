<!-- @summary A column of controls, where the Up and Down arrow keys move between them. -->

<helix-toolbar
  label="Drawing"
  orientation="vertical"
>
  <helix-icon-button label="Navigate">
    <helix-icon name="compass"></helix-icon>
  </helix-icon-button>
  <helix-icon-button label="Bold">
    <helix-icon name="text-b"></helix-icon>
  </helix-icon-button>
  <helix-icon-button label="Delete selection">
    <helix-icon name="trash"></helix-icon>
  </helix-icon-button>
</helix-toolbar>
