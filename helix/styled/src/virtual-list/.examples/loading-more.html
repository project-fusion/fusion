<!-- @summary Files given as an array and drawn from a row template with links, with more added as you near the end. -->

<helix-virtual-list
  id="files"
  label="Files"
>
  <template>
    <div class="fileRow">
      <a
        data-field="name"
        data-field-href="url"
        data-link
        href="#files"
      >File</a>
      <span data-field="size"></span>
    </div>
  </template>
</helix-virtual-list>

<script>
  /* `items` takes the array. `data-field` fills an element's text, and
     `data-field-href` writes its link over the one the template holds.

     `helix-load-more` fires when a reader is within one screen of the end.
     Adding the next page to `items` lets it fire again. */
  const files = document.getElementById('files')
  const page = (from) =>
    Array.from({ length: 200 }, (_, index) => ({
      name: `report-${from + index + 1}.pdf`,
      size: `${(from + index + 1) * 3} KB`,
      url: `#report-${from + index + 1}`,
    }))
  files.items = page(0)
  files.addEventListener('helix-load-more', () => {
    if (files.items.length < 1000) {
      files.items = [...files.items, ...page(files.items.length)]
    }
  })
</script>

<style>
  .fileRow {
    align-items: center;
    block-size: 32px;
    display: flex;
    justify-content: space-between;
    padding-inline: var(--helix-space-sm);
  }
</style>
