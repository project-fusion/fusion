<!-- @summary The `load` and `error` events, under their native names. -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-flex
    direction="column"
    gap="sm"
    id="pictures"
  >
    <helix-image
      alt="A road winding below highland cliffs at sunset"
      shape="rounded"
      src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=400"
    ></helix-image>
    <helix-image
      alt="Team photo"
      shape="rounded"
      src="https://example.invalid/missing.png"
    ></helix-image>
  </helix-flex>

  <helix-list
    divided
    id="log"
    label="Events"
  >
    <helix-list-item>
      No events yet
      <span slot="description">One image loads and one fails</span>
    </helix-list-item>
  </helix-list>
</helix-flex>

<script type="module">
  const pictures = document.getElementById('pictures')
  const log = document.getElementById('log')
  let empty = true

  // The log keeps the last six events.
  const KEEP = 6

  const say = (name, carried) => {
    if (empty) {
      log.replaceChildren()
      empty = false
    }
    const row = document.createElement('helix-list-item')
    row.textContent = name
    const under = document.createElement('span')
    under.slot = 'description'
    under.textContent = carried
    row.append(under)
    log.append(row)
    while (log.children.length > KEEP) {
      log.firstElementChild.remove()
    }
  }

  /* Listen in the capture phase, because `load` and `error` do not bubble, as
     on an `<img>`. */
  pictures.addEventListener('load', (event) => {
    say('load', `${event.target.naturalWidth} by ${event.target.naturalHeight}`)
  }, true)
  pictures.addEventListener('error', () => {
    say('error', 'Could not load the image')
  }, true)

  /* An image that settled before these listeners were added sent its event to
     no one, so check the status of each one. */
  for (const picture of pictures.querySelectorAll('helix-image')) {
    if (picture.status === 'loaded') {
      say('load', `${picture.naturalWidth} by ${picture.naturalHeight}`)
    } else if (picture.status === 'error') {
      say('error', 'Could not load the image')
    }
  }

</script>
