<!-- @summary Candidate widths for the browser to choose from, and a high fetch priority for the main image. -->

<helix-flex
  direction="column"
  gap="md"
>
  <!-- The three files are the same photo at 400, 800, and 1536 pixels wide, and
       weigh 17 KB, 61 KB, and 316 KB. The browser reads `sizes` before layout
       and picks the smallest file that fills 32rem, or the full viewport width
       on a narrow screen. -->
  <helix-image
    alt="Sunlight breaking through the surface of the sea, seen from below"
    fetchpriority="high"
    loading="eager"
    sizes="(min-width: 40rem) 32rem, 100vw"
    src="/media/scale/seawater-800.jpg"
    srcset="
      /media/scale/seawater-400.jpg  400w,
      /media/scale/seawater-800.jpg  800w,
      /media/scale/seawater.jpg     1536w
    "
  ></helix-image>
</helix-flex>
