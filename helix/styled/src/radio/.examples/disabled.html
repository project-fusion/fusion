<!-- @summary A disabled group, and a group disabled by the fieldset around it. -->
<helix-flex
  direction="column"
  gap="lg"
>
  <helix-radio-group
    default-value="one"
    disabled
    hint="Managed by your admin"
    label="Plan"
    name="a"
  >
    <helix-radio value="one">Free</helix-radio>
    <helix-radio value="two">Pro</helix-radio>
  </helix-radio-group>

  <!-- The fieldset around this group disables it. -->
  <fieldset disabled>
    <helix-radio-group
      default-value="two"
      hint="Managed by your admin"
      label="Billing cycle"
      name="b"
    >
      <helix-radio value="one">Monthly</helix-radio>
      <helix-radio value="two">Yearly</helix-radio>
    </helix-radio-group>
  </fieldset>
</helix-flex>
