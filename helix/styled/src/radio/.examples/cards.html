<!-- @summary Radios drawn as cards, for choices that need room to explain themselves. -->
<helix-radio-group
  default-value="team"
  hint="Hint"
  label="Label"
  name="plan"
>
  <helix-radio
    separation="outlined"
    value="solo"
  >
    <helix-flex
      direction="column"
      gap="2xs"
    >
      <helix-text
        as="span"
        variant="body-strong"
      >Solo</helix-text>
      <helix-text
        as="span"
        emphasis="subtle"
        variant="caption"
      >
        One seat, and everything on it.
      </helix-text>
    </helix-flex>
  </helix-radio>
  <helix-radio
    separation="outlined"
    value="team"
  >
    <helix-flex
      direction="column"
      gap="2xs"
    >
      <helix-text
        as="span"
        variant="body-strong"
      >Team</helix-text>
      <helix-text
        as="span"
        emphasis="subtle"
        variant="caption"
      >
        Up to ten seats, shared billing.
      </helix-text>
    </helix-flex>
  </helix-radio>
</helix-radio-group>
