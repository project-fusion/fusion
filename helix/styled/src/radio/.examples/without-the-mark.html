<!-- @summary The dot hidden, so the whole card is the target rather than the mark beside it. -->

<helix-radio-group
  default-value="monthly"
  label="Billing"
  orientation="horizontal"
>
  <helix-radio
    hide-control
    separation="outlined"
    value="monthly"
  >Monthly</helix-radio
  >
  <helix-radio
    hide-control
    separation="outlined"
    value="yearly"
  >Yearly</helix-radio
  >
</helix-radio-group>
