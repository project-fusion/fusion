<!-- @summary A group that needs a choice before the form submits. -->
<form onsubmit="event.preventDefault()">
  <helix-flex
    direction="column"
    gap="sm"
  >
    <helix-radio-group
      hint="You can change this later"
      label="Account type"
      name="choice"
      required
    >
      <helix-radio value="one">Personal</helix-radio>
      <helix-radio value="two">Business</helix-radio>
    </helix-radio-group>
    <helix-button
      emphasis="solid"
      tone="primary"
      type="submit"
    >Create account</helix-button>
  </helix-flex>
</form>
