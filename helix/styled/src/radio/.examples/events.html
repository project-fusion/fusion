<!-- @summary The group fires events for the set, and the radio that is pressed fires its own. -->
<!-- @layout hug -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-radio-group
    id="plan"
    label="Plan"
    name="plan"
  >
    <helix-radio value="free">Free</helix-radio>
    <helix-radio value="team">Team</helix-radio>
    <helix-radio value="scale">Scale</helix-radio>
  </helix-radio-group>


  <helix-list
    divided
    id="log"
    label="Events"
  >
    <helix-list-item>
      No events yet
      <span slot="description">Choose a plan</span>
    </helix-list-item>
  </helix-list>
</helix-flex>

<script type="module">
  const plan = document.getElementById('plan')
  const log = document.getElementById('log')
  let empty = true

  // The log keeps the last six events.
  const KEEP = 6

  const say = (name, carried) => {
    if (empty) {
      log.replaceChildren()
      empty = false
    }
    const row = document.createElement('helix-list-item')
    row.textContent = name
    const under = document.createElement('span')
    under.slot = 'description'
    under.textContent = carried
    row.append(under)
    log.append(row)
    while (log.children.length > KEEP) {
      log.firstElementChild.remove()
    }
  }

  plan.addEventListener('helix-before-change', (event) => {
    say('helix-before-change', `Proposed "${event.detail.value}"`)
  })
  plan.addEventListener('input', (event) => {
    say('input', `Value is "${event.currentTarget.value}"`)
  })
  plan.addEventListener('change', (event) => {
    say('change', `Chose "${event.currentTarget.value}"`)
  })
  plan.addEventListener('helix-select', (event) => {
    say('helix-select', `Pressed "${event.detail.value}"`)
  })
</script>
