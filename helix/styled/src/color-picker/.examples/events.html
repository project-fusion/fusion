<!-- @summary The events for a value change, a color sampled from the screen, and a color copied to the clipboard. -->
<!-- @layout hug -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-color-picker
    default-value="#3366ff"
    id="swatch"
  ></helix-color-picker>


  <helix-list
    divided
    id="log"
    label="Events"
  >
    <helix-list-item>
      No events yet
      <span slot="description">Pick a color, copy it, or use the eyedropper</span>
    </helix-list-item>
  </helix-list>
</helix-flex>

<script type="module">
  const swatch = document.getElementById('swatch')
  const log = document.getElementById('log')
  let empty = true

  // The log keeps the last seven events.
  const KEEP = 7

  const say = (name, carried) => {
    if (empty) {
      log.replaceChildren()
      empty = false
    }
    const row = document.createElement('helix-list-item')
    row.textContent = name
    const under = document.createElement('span')
    under.slot = 'description'
    under.textContent = carried
    row.append(under)
    log.append(row)
    while (log.children.length > KEEP) {
      log.firstElementChild.remove()
    }
  }

  swatch.addEventListener('helix-before-change', (event) => {
    say('helix-before-change', `Proposed ${event.detail.value}`)
  })
  swatch.addEventListener('input', (event) => {
    say('input', `Value is ${event.currentTarget.value}`)
  })
  swatch.addEventListener('change', (event) => {
    say('change', `Changed to ${event.currentTarget.value}`)
  })
  swatch.addEventListener('helix-copy', (event) => {
    say('helix-copy', `Copied ${event.detail.value}`)
  })
  swatch.addEventListener('helix-sample-start', () => {
    say('helix-sample-start', 'Eyedropper opened')
  })
  swatch.addEventListener('helix-sample-end', () => {
    say('helix-sample-end', 'Eyedropper closed')
  })
</script>
