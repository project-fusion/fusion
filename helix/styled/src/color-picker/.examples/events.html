<!-- @summary A value moving, a color taken off the screen, and one put on the clipboard. -->
<!-- @layout hug -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-color-picker
    default-value="#3366ff"
    id="swatch"
  ></helix-color-picker>


  <helix-list
    divided
    id="log"
    label="What arrived"
  >
    <helix-list-item>
      Nothing yet
      <span slot="description">Drag the area, then try the copy and the dropper</span>
    </helix-list-item>
  </helix-list>
</helix-flex>

<script type="module">
  const swatch = document.getElementById('swatch')
  const log = document.getElementById('log')
  let empty = true

  // How many rows the log holds, which is a choice about this preview's height.
  const KEEP = 7

  const say = (name, carried) => {
    if (empty) {
      log.replaceChildren()
      empty = false
    }
    const row = document.createElement('helix-list-item')
    row.textContent = name
    const under = document.createElement('span')
    under.slot = 'description'
    under.textContent = carried
    row.append(under)
    log.append(row)
    while (log.children.length > KEEP) {
      log.firstElementChild.remove()
    }
  }

  swatch.addEventListener('helix-before-change', (event) => {
    say('helix-before-change', `proposing ${event.detail.value}, refusable`)
  })
  swatch.addEventListener('input', (event) => {
    say('input', `${event.currentTarget.value} while the pointer is down`)
  })
  swatch.addEventListener('change', (event) => {
    say('change', `${event.currentTarget.value}, once it is let go`)
  })
  swatch.addEventListener('helix-copy', (event) => {
    say('helix-copy', `${event.detail.value} is on the clipboard`)
  })
  swatch.addEventListener('helix-sample-start', () => {
    say('helix-sample-start', 'the dropper is live, so the page is being read')
  })
  swatch.addEventListener('helix-sample-end', () => {
    say('helix-sample-end', 'the dropper is done, whether or not it took one')
  })
</script>
