<!-- @summary A picker with no syntax toggle, for when the format is already set, and a picker with no readout and no eyedropper, for a picker placed beside its own preview. -->
<helix-flex
  gap="lg"
  wrap
>
  <helix-color-picker
    default-value="rgb(51 102 255)"
    format="rgb"
    no-format
  ></helix-color-picker>
  <helix-color-picker
    default-value="#3b82f6"
    no-eyedropper
    no-value
  ></helix-color-picker>
</helix-flex>
