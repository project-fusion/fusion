<!-- @summary The same app header on the headless tier, with every rule written by hand. -->
<!-- Generated from `default.html` beside it by `bun run examples:headless`. Do not edit.
     It lives in the styled package because that is where it is derived from: the two
     examples show the same content on both tiers, which is only checkable while they
     sit together. `helix/headless` holds no examples of its own. See 275. -->

<link
  href="styles.css"
  rel="stylesheet"
/>

<helix-headless-app-header>
  <span slot="start">Logo</span>
  <helix-headless-navigation label="Sections">
    <a
      aria-current="page"
      href="#one"
    >Item One</a>
    <a href="#two">Item Two</a>
  </helix-headless-navigation>

  <helix-headless-icon-button
    label="Search"
    slot="end"
  >
    <helix-headless-icon name="magnifying-glass"></helix-headless-icon>
  </helix-headless-icon-button>
  <helix-headless-icon-button
    label="Settings"
    slot="end"
  >
    <helix-headless-icon name="gear"></helix-headless-icon>
  </helix-headless-icon-button>
</helix-headless-app-header>
