<!-- @summary The events the palette sends as it opens, runs a command, and closes. The palette holds no value. -->
<!-- @min 320 -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-command
    id="palette"
    label="Commands"
  >
    <helix-option value="new">New file</helix-option>
    <helix-option value="open">Open folder</helix-option>
    <helix-option value="save">Save all</helix-option>
  </helix-command>


  <helix-list
    divided
    id="log"
    label="Events"
  >
    <helix-list-item>
      No events yet
      <span slot="description">Open the palette and choose a command</span>
    </helix-list-item>
  </helix-list>
</helix-flex>

<script type="module">
  const palette = document.getElementById('palette')
  const log = document.getElementById('log')
  let empty = true

  // The log keeps the last six events.
  const KEEP = 6

  const say = (name, carried) => {
    if (empty) {
      log.replaceChildren()
      empty = false
    }
    const row = document.createElement('helix-list-item')
    row.textContent = name
    const under = document.createElement('span')
    under.slot = 'description'
    under.textContent = carried
    row.append(under)
    log.append(row)
    while (log.children.length > KEEP) {
      log.firstElementChild.remove()
    }
  }

  palette.addEventListener('helix-before-open', () => {
    say('helix-before-open', 'About to open')
  })
  palette.addEventListener('helix-before-close', () => {
    say('helix-before-close', 'About to close')
  })
  palette.addEventListener('toggle', (event) => {
    say('toggle', `Changed from ${event.oldState} to ${event.newState}`)
  })
  palette.addEventListener('helix-select', (event) => {
    say('helix-select', `Ran "${event.detail.value}"`)
  })
</script>
