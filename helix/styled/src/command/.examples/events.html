<!-- @summary A palette runs a command rather than holding a value, and says exactly that. -->
<!-- @min 320 -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-command
    id="palette"
    label="Commands"
  >
    <helix-option value="new">New file</helix-option>
    <helix-option value="open">Open folder</helix-option>
    <helix-option value="save">Save all</helix-option>
  </helix-command>


  <helix-list
    divided
    id="log"
    label="What arrived"
  >
    <helix-list-item>
      Nothing yet
      <span slot="description">Open it and choose a command</span>
    </helix-list-item>
  </helix-list>
</helix-flex>

<script type="module">
  const palette = document.getElementById('palette')
  const log = document.getElementById('log')
  let empty = true

  // How many rows the log holds, which is a choice about this preview's height.
  const KEEP = 6

  const say = (name, carried) => {
    if (empty) {
      log.replaceChildren()
      empty = false
    }
    const row = document.createElement('helix-list-item')
    row.textContent = name
    const under = document.createElement('span')
    under.slot = 'description'
    under.textContent = carried
    row.append(under)
    log.append(row)
    while (log.children.length > KEEP) {
      log.firstElementChild.remove()
    }
  }

  palette.addEventListener('helix-before-open', () => {
    say('helix-before-open', 'about to open, and refusable')
  })
  palette.addEventListener('helix-before-close', () => {
    say('helix-before-close', 'about to close, and refusable')
  })
  palette.addEventListener('toggle', (event) => {
    say('toggle', `${event.oldState} to ${event.newState}, after the state moved`)
  })
  palette.addEventListener('helix-select', (event) => {
    say('helix-select', `"${event.detail.value}" ran, and nothing here holds a value`)
  })
</script>
