<!-- @summary A palette that also finds every control on screen by its name once you type, here "export". -->
<!-- @min 360 -->
<helix-toolbar label="Report">
  <helix-button>Export report</helix-button>
  <helix-button>Share report</helix-button>
  <helix-switch label="Show totals"></helix-switch>
</helix-toolbar>

<helix-command
  controls
  inline
  label="Commands"
>
  <helix-option value="new">New report</helix-option>
  <helix-option value="open">Open recent</helix-option>
</helix-command>
