<!-- @summary How long ago a timestamp was, and one date in three formats. -->

<helix-flex
  direction="column"
  gap="sm"
>
  <helix-text>
    Elapsed:
    <helix-format-date
      class="stamp"
      elapsed
    ></helix-format-date>
  </helix-text>

  <helix-text>
    Date:
    <helix-format-date
      date="2026-03-14T15:09:00.000Z"
      day="numeric"
      month="short"
      time-zone="UTC"
      year="numeric"
    ></helix-format-date>
  </helix-text>

  <helix-text>
    Time:
    <helix-format-date
      date="2026-03-14T15:09:00.000Z"
      hour="numeric"
      minute="2-digit"
      time-zone="UTC"
    ></helix-format-date>
  </helix-text>

  <helix-text>
    Weekday:
    <helix-format-date
      date="2026-03-14T15:09:00.000Z"
      day="numeric"
      month="long"
      time-zone="UTC"
      weekday="long"
    ></helix-format-date>
  </helix-text>
</helix-flex>

<script>
  /* The elapsed time is set from script to 42 minutes ago, so it always reads
     "42m". The other dates are fixed and name a `time-zone`, so they look the
     same wherever the preview renders. */
  const at = new Date(Date.now() - 42 * 60_000).toISOString()
  for (const stamp of document.querySelectorAll('.stamp')) {
    stamp.date = at
  }
</script>
