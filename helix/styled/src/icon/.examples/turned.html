<!-- @summary One arrow turned with `rotate`, flipped with `flip`, and a refresh mark spinning with `animation`. -->
<helix-flex
  align-items="center"
  gap="md"
>
  <helix-icon name="arrow-right"></helix-icon>
  <helix-icon
    name="arrow-right"
    rotate="90"
  ></helix-icon>
  <helix-icon
    flip="x"
    name="arrow-right"
  ></helix-icon>
  <helix-icon
    animation="spin"
    name="arrow-clockwise"
  ></helix-icon>
</helix-flex>
