<!-- @summary Moving your own map in response to `helix-map-pan` and `helix-map-zoom`. -->
<link
  href="styles.css"
  rel="stylesheet"
/>

<helix-map
  id="wired"
  label="City map"
>
  <div
    class="stand-in"
    id="ground"
  >Pan and zoom with the buttons or the arrow keys</div>

  <helix-text slot="attribution">© OpenStreetMap contributors</helix-text>
</helix-map>

<script type="module">
  /* The frame sends events and your code moves the map. Call your library here,
     such as `map.panBy` or `map.zoomIn`. The preview moves a grid. */
  const frame = document.getElementById('wired')
  const ground = document.getElementById('ground')
  const at = { x: 0, y: 0, zoom: 1 }

  const draw = () => {
    ground.style.setProperty('--_shift-x', `${at.x}px`)
    ground.style.setProperty('--_shift-y', `${at.y}px`)
    ground.style.setProperty('--_zoom', `${at.zoom}`)
  }

  frame.addEventListener('helix-map-pan', (event) => {
    // `by` is a fraction of the viewport width.
    const step = ground.clientWidth * event.detail.by
    if (event.detail.to === 'up') {
      at.y += step
    }
    if (event.detail.to === 'down') {
      at.y -= step
    }
    if (event.detail.to === 'start') {
      at.x += step
    }
    if (event.detail.to === 'end') {
      at.x -= step
    }
    draw()
  })

  frame.addEventListener('helix-map-zoom', (event) => {
    // `by` gives the direction: above 0 zooms in, below 0 zooms out.
    at.zoom = Math.min(Math.max(at.zoom * (event.detail.by > 0 ? 1.25 : 0.8), 0.5), 4)
    draw()
  })
</script>
