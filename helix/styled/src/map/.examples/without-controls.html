<!-- @summary A frame with no pan or zoom buttons, for a map that has its own. -->
<link
  href="styles.css"
  rel="stylesheet"
/>

<helix-map
  controls="none"
  label="Edinburgh city center"
>
  <helix-text
    slot="header"
    variant="caption"
  >Edinburgh city center</helix-text>

  <div class="stand-in">Map with its own controls</div>

  <helix-text slot="attribution">© OpenStreetMap contributors</helix-text>
</helix-map>
