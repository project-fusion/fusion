<!-- @summary Pan and fullscreen buttons in the bottom corner, for a map library that draws its own zoom buttons. -->
<link
  href="styles.css"
  rel="stylesheet"
/>

<helix-map
  controls="pan fullscreen"
  controls-placement="bottom-end"
  label="Edinburgh city center"
>
  <!-- Your map library draws the zoom buttons, so the frame shows pan and
       fullscreen only. -->
  <div class="stand-in">Map with its own zoom buttons</div>

  <helix-text slot="attribution">© OpenStreetMap contributors</helix-text>
</helix-map>
