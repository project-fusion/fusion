<!-- @summary A map the consumer brings, in a frame that names it and can be driven from the keyboard. -->
<link
  href="styles.css"
  rel="stylesheet"
/>

<helix-map
  id="city"
  label="Edinburgh city center"
>
  <helix-text
    slot="header"
    variant="caption"
  >Edinburgh city center</helix-text>

  <!-- Whatever draws the map goes here: MapLibre, Leaflet, an image tile, or
       a canvas of your own. Nothing in Helix draws one. -->
  <div class="stand-in">Your map renders here</div>

  <helix-text slot="attribution">© OpenStreetMap contributors</helix-text>
</helix-map>
