<!-- @summary Opening the panel and changing the value, each with its own events. -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-select
    id="choice"
    label="Plan"
    name="plan"
  >
    <helix-option value="free">Free</helix-option>
    <helix-option value="team">Team</helix-option>
    <helix-option value="scale">Scale</helix-option>
  </helix-select>

  <helix-list
    divided
    id="log"
    label="Events"
  >
    <helix-list-item>
      No events yet
      <span slot="description">Open the list and choose a plan</span>
    </helix-list-item>
  </helix-list>
</helix-flex>

<script type="module">
  const choice = document.getElementById('choice')
  const log = document.getElementById('log')
  let empty = true

  // The log keeps the last eight events.
  const KEEP = 8

  const say = (name, carried) => {
    if (empty) {
      log.replaceChildren()
      empty = false
    }
    const row = document.createElement('helix-list-item')
    row.textContent = name
    const under = document.createElement('span')
    under.slot = 'description'
    under.textContent = carried
    row.append(under)
    log.append(row)
    while (log.children.length > KEEP) {
      log.firstElementChild.remove()
    }
  }

  choice.addEventListener('helix-before-open', () => {
    say('helix-before-open', 'About to open')
  })
  choice.addEventListener('helix-before-close', () => {
    say('helix-before-close', 'About to close')
  })
  choice.addEventListener('toggle', (event) => {
    say('toggle', `Changed from ${event.oldState} to ${event.newState}`)
  })
  choice.addEventListener('helix-before-change', (event) => {
    say('helix-before-change', `Proposed "${event.detail.value}"`)
  })
  choice.addEventListener('input', (event) => {
    say('input', `Value is "${event.currentTarget.value}"`)
  })
  choice.addEventListener('change', (event) => {
    say('change', `Chose "${event.currentTarget.value}"`)
  })
</script>
