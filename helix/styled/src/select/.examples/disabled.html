<!-- @summary A disabled select, and a select disabled by the fieldset around it. -->
<helix-flex
  direction="column"
  gap="lg"
>
  <helix-select
    default-value="two"
    disabled
    hint="Managed by your admin"
    label="Plan"
    name="a"
  >
    <helix-option value="one">Free</helix-option>
    <helix-option value="two">Pro</helix-option>
  </helix-select>

  <!-- The fieldset around this select disables it. -->
  <fieldset disabled>
    <helix-select
      default-value="one"
      hint="Managed by your admin"
      label="Billing cycle"
      name="b"
    >
      <helix-option value="one">Monthly</helix-option>
      <helix-option value="two">Yearly</helix-option>
    </helix-select>
  </fieldset>
</helix-flex>
