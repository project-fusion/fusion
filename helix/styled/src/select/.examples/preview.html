<!-- @summary A native select with a label and a hint. -->
<helix-select
  default-value="two"
  hint="Hint"
  label="Label"
  name="choice"
>
  <helix-icon
    name="caret-down"
    slot="indicator"
  ></helix-icon>
  <helix-option value="one">Option One</helix-option>
  <helix-option value="two">Option Two</helix-option>
  <helix-option value="three">Option Three</helix-option>
</helix-select>
