<!-- @summary The events the group sends for the whole set when you check or uncheck a box. -->
<!-- @min 240 -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-checkbox-group
    id="scopes"
    label="Scopes"
    name="scopes"
  >
    <helix-checkbox value="read">Read</helix-checkbox>
    <helix-checkbox value="write">Write</helix-checkbox>
    <helix-checkbox value="admin">Admin</helix-checkbox>
  </helix-checkbox-group>

  <helix-list
    divided
    id="log"
    label="Events"
  >
    <helix-list-item>
      No events yet
      <span slot="description">Select a scope</span>
    </helix-list-item>
  </helix-list>
</helix-flex>

<script type="module">
  const scopes = document.getElementById('scopes')
  const log = document.getElementById('log')
  let empty = true

  // The number of rows the log keeps.
  const KEEP = 6

  const say = (name, carried) => {
    if (empty) {
      log.replaceChildren()
      empty = false
    }
    const row = document.createElement('helix-list-item')
    row.textContent = name
    const under = document.createElement('span')
    under.slot = 'description'
    under.textContent = carried
    row.append(under)
    log.append(row)
    while (log.children.length > KEEP) {
      log.firstElementChild.remove()
    }
  }

  scopes.addEventListener('helix-before-change', (event) => {
    say('helix-before-change', `about to change to "${event.detail.value}" (cancelable)`)
  })
  scopes.addEventListener('input', (event) => {
    say('input', `value is now "${event.currentTarget.value || 'nothing'}"`)
  })
  scopes.addEventListener('change', (event) => {
    say('change', `value is now "${event.currentTarget.value || 'nothing'}"`)
  })
</script>
