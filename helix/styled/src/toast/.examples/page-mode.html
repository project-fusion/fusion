<!-- @summary Toasts over a dark page, taking their own color mode. -->
<helix-toast
  data-color-mode="light"
  label="Notifications"
  placement="bottom-end"
>
  <helix-toast-item
    dismissible
    tone="success"
  >Project saved.</helix-toast-item>
  <helix-toast-item
    dismissible
    tone="danger"
  >
    Could not reach the server.
    <helix-button slot="actions">Retry</helix-button>
  </helix-toast-item>
</helix-toast>
