<!-- @summary A message sends `helix-dismiss`, and your code decides whether it closes. -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-toast
    id="stack"
    label="Notifications"
    placement="bottom-end"
  >
    <helix-toast-item
      dismissible
      tone="success"
    >
      Project saved.
    </helix-toast-item>
    <helix-toast-item
      dismissible
      tone="danger"
    >
      The upload failed.
    </helix-toast-item>
  </helix-toast>


  <helix-list
    divided
    id="log"
    label="Events"
  >
    <helix-list-item>
      No events yet
      <span slot="description">Press a message's close control</span>
    </helix-list-item>
  </helix-list>
</helix-flex>

<script type="module">
  const stack = document.getElementById('stack')
  const log = document.getElementById('log')
  let empty = true

  // The log keeps this many of the most recent rows.
  const KEEP = 6

  const say = (name, carried) => {
    if (empty) {
      log.replaceChildren()
      empty = false
    }
    const row = document.createElement('helix-list-item')
    row.textContent = name
    const under = document.createElement('span')
    under.slot = 'description'
    under.textContent = carried
    row.append(under)
    log.append(row)
    while (log.children.length > KEEP) {
      log.firstElementChild.remove()
    }
  }

  stack.addEventListener('helix-dismiss', (event) => {
    say('helix-dismiss', `the close button on "${event.detail.label}" was pressed, and the event bubbles`)
  })
</script>
