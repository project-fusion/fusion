<!-- @summary A thousand rows written as markup, with only the rows in view drawn. -->

<helix-table
  id="requests"
  label="Requests"
  windowed
>
  <helix-table-column
    field="request"
    sortable
    width="8rem"
  >Request</helix-table-column>
  <helix-table-column
    field="path"
    sortable
  >Path</helix-table-column>
  <helix-table-column text-align="end">Time</helix-table-column>
</helix-table>

<script>
  /* `windowed` draws only the rows in view, and the scrollbar still measures
     all thousand. Every row stays in the page as markup, and the table picks
     the ones to draw. Sorting orders every row.

     `--table-block-size` sets the height of the scrolling box. It defaults to
     24em. */
  const paths = ['/api/orders', '/api/users', '/api/search', '/health']

  document.getElementById('requests').append(
    ...Array.from({ length: 1000 }, (_, index) => {
      const row = document.createElement('helix-table-row')
      const values = [
        `req-${String(index + 1).padStart(4, '0')}`,
        paths[index % paths.length],
        `${12 + ((index * 37) % 480)} ms`,
      ]
      for (const [at, value] of values.entries()) {
        const cell = document.createElement('helix-table-cell')
        cell.toggleAttribute('header', at === 0)
        cell.textContent = value
        row.append(cell)
      }
      return row
    }),
  )
</script>
