<!-- @summary A chord written once as `mod+k`, shown as ⌘K on Apple keyboards and Ctrl+K on others. -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-text variant="body">
    Press
    <helix-kbd keys="mod+k"></helix-kbd>
    to search. The shortcut <code>mod+k</code> shows as ⌘K on a Mac and Ctrl+K on
    other computers.
  </helix-text>

  <helix-input
    aria-label="Filter"
    placeholder="Filter"
  >
    <helix-kbd
      id="key"
      keys="/"
      slot="end"
      within="control"
    ></helix-kbd>
  </helix-input>

  <helix-text
    emphasis="subtle"
    id="said"
    variant="caption"
  >
    Click the field and press / to filter the list.
  </helix-text>
</helix-flex>

<script type="module">
  const key = document.getElementById('key')
  const said = document.getElementById('said')
  key.addEventListener('helix-shortcut', (event) => {
    said.textContent = `Heard ${event.detail.keys} inside the field.`
  })
</script>
