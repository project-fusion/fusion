<!-- @summary A key that listens for its shortcut inside a field and sends `helix-shortcut` when it is pressed. -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-input
    aria-label="Filter"
    placeholder="Filter"
  >
    <helix-kbd
      id="key"
      keys="/"
      slot="end"
      within="control"
    ></helix-kbd>
  </helix-input>


  <helix-list
    divided
    id="log"
    label="Events"
  >
    <helix-list-item>
      No events yet
      <span slot="description">Put the cursor in the field and press slash</span>
    </helix-list-item>
  </helix-list>
</helix-flex>

<script type="module">
  const key = document.getElementById('key')
  const log = document.getElementById('log')
  let empty = true

  // The log keeps the last six events.
  const KEEP = 6

  const say = (name, carried) => {
    if (empty) {
      log.replaceChildren()
      empty = false
    }
    const row = document.createElement('helix-list-item')
    row.textContent = name
    const under = document.createElement('span')
    under.slot = 'description'
    under.textContent = carried
    row.append(under)
    log.append(row)
    while (log.children.length > KEEP) {
      log.firstElementChild.remove()
    }
  }

  key.addEventListener('helix-shortcut', (event) => {
    say('helix-shortcut', `Pressed ${event.detail.keys}`)
  })
</script>
