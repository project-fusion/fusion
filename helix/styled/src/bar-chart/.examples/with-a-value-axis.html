<!-- @summary The numbers of the scale the columns are measured on, beside the plot, with one scale. -->

<helix-flex
  direction="column"
  gap="md"
>
  <table
    data-hidden-visually
    id="signups-axis"
  >
    <caption>Sign-ups a month</caption>
    <thead>
      <tr>
        <th scope="col">Month</th>
        <th scope="col">Sign-ups</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <th scope="row">Jan</th>
        <td data-value="1180">1180</td>
      </tr>
      <tr>
        <th scope="row">Feb</th>
        <td data-value="1240">1240</td>
      </tr>
      <tr>
        <th scope="row">Mar</th>
        <td data-value="1190">1190</td>
      </tr>
      <tr>
        <th scope="row">Apr</th>
        <td data-value="1320">1320</td>
      </tr>
      <tr>
        <th scope="row">May</th>
        <td data-value="1410">1410</td>
      </tr>
      <tr>
        <th scope="row">Jun</th>
        <td data-value="1380">1380</td>
      </tr>
    </tbody>
  </table>

  <helix-bar-chart
    for="signups-axis"
    value-axis
  ></helix-bar-chart>
</helix-flex>
