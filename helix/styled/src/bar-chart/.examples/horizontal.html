<!-- @summary Categories down the side, for long labels such as names, which would overlap or turn sideways in a row. -->

<helix-flex
  direction="column"
  gap="md"
>
  <table
    data-hidden-visually
    id="plans"
  >
    <caption>Accounts by plan</caption>
    <tbody>
      <tr>
        <th scope="row">Free</th>
        <td>1840</td>
      </tr>
      <tr>
        <th scope="row">Team</th>
        <td>612</td>
      </tr>
      <tr>
        <th scope="row">Enterprise</th>
        <td>78</td>
      </tr>
    </tbody>
  </table>
  <helix-bar-chart
    for="plans"
    orientation="horizontal"
  ></helix-bar-chart>
</helix-flex>
