<!-- @summary One ribbon down the whole page: a bend through the opening section, soft ribbon after it, and a wave above the last section. -->

<link
  href="styles.css"
  rel="stylesheet"
>

<helix-strands travel>
  <helix-strands-stop
    for="travel-opening"
    variant="bend"
  ></helix-strands-stop>
  <helix-strands-stop
    for="travel-closing"
    variant="waves"
  ></helix-strands-stop>
</helix-strands>

<section
  class="section"
  id="travel-opening"
>
  <helix-text
    as="h2"
    variant="title"
  >Automate the steps between your apps</helix-text>
</section>
<section class="section">
  <helix-text as="p">Between the stops, the ribbon fills the gap in its own variant.</helix-text>
</section>
<section
  class="section"
  id="travel-closing"
>
  <helix-text as="p">A wave crosses at the top of this section.</helix-text>
</section>
