<!-- @summary A flat ribbon that moves as one beside a deep one whose strands each move their own way. -->

<link
  href="styles.css"
  rel="stylesheet"
>

<div class="pair">
  <div class="stage">
    <helix-strands
      contrast="0"
      depth="0"
      drift="0"
    ></helix-strands>
  </div>
  <div class="stage">
    <helix-strands
      bloom="0.6"
      contrast="1"
      depth="1"
      drift="1"
    ></helix-strands>
  </div>
</div>
