<!-- @summary A checkbox whose `checked` your code sets in response to `helix-before-toggle`. -->
<helix-checkbox
  checked
  id="terms"
  label="I accept the terms of service"
></helix-checkbox>

<script>
  const terms = document.getElementById('terms')

  terms.addEventListener('helix-before-toggle', (event) => {
    terms.checked = event.detail.checked
  })
</script>
