<!-- @summary A numbered list, with the numbers in a rail to the side of the text. -->
<link
  href="styles.css"
  rel="stylesheet"
>
<helix-flex
  direction="column"
  gap="xl"
>
  <helix-list
    kind="ordered"
    label="Getting started"
    marker="rail"
  >
    <helix-list-item>
      Create your account
      <helix-text slot="description">
        Use your work email address so your team can find you.
      </helix-text>
    </helix-list-item>
    <helix-list-item>
      Set up your profile
      <helix-text slot="description">Add your name, photo, and time zone.</helix-text>
    </helix-list-item>
    <helix-list-item>
      Invite your team
      <helix-text slot="description">Send invitations to up to 10 people.</helix-text>
    </helix-list-item>
  </helix-list>

  <helix-list
    class="list"
    kind="ordered"
    label="Release checklist"
    marker="rail"
  >
    <helix-list-item>Draft the migration</helix-list-item>
    <helix-list-item>Test it on a copy</helix-list-item>
    <helix-list-item>Schedule the release</helix-list-item>
  </helix-list>
</helix-flex>
