<!-- @summary An interactive list you select several rows from. -->
<helix-list
  label="Files"
  selection-mode="multiple"
  value="report"
>
  <helix-list-item value="report">
    <helix-icon
      name="cube"
      slot="start"
    ></helix-icon>
    Quarterly report
    <helix-text slot="description">Edited today</helix-text>
  </helix-list-item>
  <helix-list-item value="budget">
    <helix-icon
      name="cube"
      slot="start"
    ></helix-icon>
    Budget
    <helix-text slot="description">Edited yesterday</helix-text>
  </helix-list-item>
  <helix-list-item
    disabled
    value="archive"
  >
    <helix-icon
      name="cube"
      slot="start"
    ></helix-icon>
    Archive
    <helix-text slot="description">Locked</helix-text>
  </helix-list-item>
</helix-list>
