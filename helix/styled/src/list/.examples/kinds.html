<!-- @summary An ordered list, an unordered list, and a description list whose rows each open a page, one for each `kind`. -->
<helix-flex
  direction="column"
  gap="lg"
>
  <helix-list
    kind="ordered"
    label="Steps"
  >
    <helix-list-item>Create a project</helix-list-item>
    <helix-list-item>Invite your team</helix-list-item>
    <helix-list-item>Share your first file</helix-list-item>
  </helix-list>

  <helix-list
    kind="unordered"
    label="Included in your plan"
  >
    <helix-list-item>Unlimited projects</helix-list-item>
    <helix-list-item>10 GB of storage</helix-list-item>
    <helix-list-item>Email support</helix-list-item>
  </helix-list>

  <helix-list
    kind="description"
    label="Account settings"
  >
    <helix-list-item href="#plan">
      Plan
      <helix-text slot="description">Team, billed yearly.</helix-text>
    </helix-list-item>
    <helix-list-item href="#storage">
      Storage
      <helix-text slot="description">4.2 GB of 10 GB used.</helix-text>
    </helix-list-item>
  </helix-list>
</helix-flex>
