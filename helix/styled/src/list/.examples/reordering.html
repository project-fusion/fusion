<!-- @summary Rows you move by dragging a grip, or with the arrow keys after you press it. -->
<!-- @react-native-summary Rows you move by dragging a grip, or one place at a time from the grip with a screen reader. -->
<helix-list
  divided
  id="steps"
  label="Release steps"
  reorderable
>
  <helix-list-item value="freeze">
    Freeze the branch
    <helix-text slot="description">Stop merging new work</helix-text>
  </helix-list-item>
  <helix-list-item value="notes">
    Write the release notes
    <helix-text slot="description">One line for each change</helix-text>
  </helix-list-item>
  <helix-list-item value="tag">
    Tag the release
    <helix-text slot="description">The version from the changelog</helix-text>
  </helix-list-item>
  <helix-list-item value="announce">
    Announce the release
    <helix-text slot="description">In the changelog and the newsletter</helix-text>
  </helix-list-item>
</helix-list>

<script type="module">
  const steps = document.getElementById('steps')

  // The list moves no row itself. Put the rows in the order the event carries.
  steps.addEventListener('helix-reorder', (event) => {
    const rows = new Map([...steps.children].map((row) => [row.getAttribute('value'), row]))
    steps.append(...event.detail.keys.map((key) => rows.get(key)))
  })
</script>
