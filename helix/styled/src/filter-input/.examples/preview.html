<!-- @summary A filter field that grows to hold the active filters. -->
<helix-filter-input
  label="Filter rows"
  placeholder="Add a filter"
>
  <helix-filter-chip
    dismiss-label="Remove the owner filter"
    dismissible
    label="Owner"
    name="owner"
    slot="tags"
  >Ada</helix-filter-chip>
  <helix-filter-chip
    dismiss-label="Remove the env filter"
    dismissible
    label="Env"
    name="env"
    slot="tags"
  >Staging</helix-filter-chip>
  <helix-filter-chip
    dismiss-label="Remove the status filter"
    dismissible
    label="Status"
    name="status"
    slot="tags"
  >Open</helix-filter-chip>
  <helix-filter-chip
    dismiss-label="Remove the area filter"
    dismissible
    label="Area"
    name="area"
    slot="tags"
  >Billing</helix-filter-chip>
</helix-filter-input>

<script type="module">
  /* **A token asks to go and does not go on its own**, so a page that renders
     `dismissible` tokens and binds nothing has drawn a control that answers
     nothing. The consumer owns the markup the tokens are in, which is the whole
     reason the field asks rather than takes: here that owner is this page.

     Bound on the field rather than on each token, since `helix-dismiss` bubbles
     and this is also the event Backspace on an empty field sends. One handler,
     both ways of asking. */
  document.querySelector('helix-filter-input').addEventListener('helix-dismiss', (event) => {
    event.target.remove()
  })
</script>
