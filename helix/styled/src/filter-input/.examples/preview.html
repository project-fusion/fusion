<!-- @summary A filter field that grows to hold the active filters. -->
<helix-filter-input
  label="Filter rows"
  placeholder="Add a filter"
>
  <helix-filter-chip
    dismiss-label="Remove the owner filter"
    dismissible
    label="Owner"
    name="owner"
    slot="tags"
  >Ada</helix-filter-chip>
  <helix-filter-chip
    dismiss-label="Remove the env filter"
    dismissible
    label="Env"
    name="env"
    slot="tags"
  >Staging</helix-filter-chip>
  <helix-filter-chip
    dismiss-label="Remove the status filter"
    dismissible
    label="Status"
    name="status"
    slot="tags"
  >Open</helix-filter-chip>
  <helix-filter-chip
    dismiss-label="Remove the area filter"
    dismissible
    label="Area"
    name="area"
    slot="tags"
  >Billing</helix-filter-chip>
</helix-filter-input>

<script type="module">
  /* A dismissible chip does not remove itself. One listener on the field
     removes the chip that sent `helix-dismiss`, which Backspace in an empty
     field also sends. */
  document.querySelector('helix-filter-input').addEventListener('helix-dismiss', (event) => {
    event.target.remove()
  })
</script>
