<!-- @summary Typing a filter and pressing Enter builds the same chip as the picker. -->
<!-- @min 520 -->

<helix-filter-input
  hint="Try disposition:refunded, -disposition:settled, or refund assignee:ada tuesday"
  id="filter"
  label="Filter the queue"
  placeholder="Search, or type a filter"
>
  <helix-filter-menu
    label="Filter"
    slot="start"
  >
    <helix-button
      emphasis="ghost"
      slot="trigger"
    >
      <helix-icon
        name="funnel-simple"
        slot="start"
      ></helix-icon>
      Filter
    </helix-button>

    <helix-filter-field
      label="Disposition"
      name="disposition"
    >
      <helix-option value="refunded">Refunded</helix-option>
      <helix-option value="chargeback">Chargeback</helix-option>
      <helix-option value="settled">Settled</helix-option>
    </helix-filter-field>

  </helix-filter-menu>

  <!-- A field with no values to list goes here, outside the picker. -->
  <helix-filter-field
    label="Assignee"
    name="assignee"
  ></helix-filter-field>
</helix-filter-input>

<script type="module">
  const filter = document.getElementById('filter')

  /* Typed text, a checked value, and a removed chip all send `helix-facet`.
     Typing also checks the value in the menu. */
  filter.addEventListener('helix-facet', (event) => {
    const { field, label, operatorLabel, values } = event.detail
    const held = filter.querySelector(`helix-filter-chip[name="${field}"]`)

    if (values.length === 0) {
      held?.remove()
      return
    }

    const chip = held ?? document.createElement('helix-filter-chip')
    chip.slot = 'tags'
    chip.dismissible = true
    chip.dismissLabel = `Remove the ${label.toLowerCase()} filter`
    chip.label = label
    /* Set the attribute so the lookup above finds a chip made moments earlier.
       A reflected property updates on the next render. */
    chip.setAttribute('name', field)
    chip.operatorLabel = operatorLabel
    chip.textContent = values.join(', ')
    if (!held) {
      filter.append(chip)
    }
  })
</script>
