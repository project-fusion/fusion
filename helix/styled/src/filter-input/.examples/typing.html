<!-- @summary Typing a filter and pressing Enter builds the chip the picker would have. -->
<!-- @min 520 -->

<helix-filter-input
  hint="Try disposition:refunded, -disposition:settled, or refund assignee:ada tuesday"
  id="filter"
  label="Filter the queue"
  placeholder="Search, or type a filter"
>
  <!-- The same declarations the picker reads, and the only ones. Neither field
       declares a comparison, so both are filtered by "is any of" and negated
       with a leading minus, which is what the punctuation can say. -->
  <helix-filter-menu
    label="Filter"
    slot="start"
  >
    <!-- The trigger is the consumer's, so the icon is too. `funnel-simple` is
         the three rules a reader already reads as "filter", and it sits in the
         button's own start slot rather than beside it. -->
    <helix-button
      emphasis="ghost"
      slot="trigger"
    >
      <helix-icon
        name="funnel-simple"
        slot="start"
      ></helix-icon>
      Filter
    </helix-button>

    <helix-filter-field
      label="Disposition"
      name="disposition"
    >
      <helix-option value="refunded">Refunded</helix-option>
      <helix-option value="chargeback">Chargeback</helix-option>
      <helix-option value="settled">Settled</helix-option>
    </helix-filter-field>

  </helix-filter-menu>

  <!-- Declared on the field rather than in the picker, which is what a field
       with no values wants: `assignee:ada` is a filter and nobody had to list
       every name in the company, but there is also nothing for a menu to
       offer. Written here it can be typed and is not a dead page to open. -->
  <helix-filter-field
    label="Assignee"
    name="assignee"
  ></helix-filter-field>
</helix-filter-input>

<script type="module">
  const filter = document.getElementById('filter')

  /* **One handler for every way a filter can change.** Enter over typed text, a
     tick in the menu and the X on a chip all arrive as `helix-facet` carrying
     the same detail, so nothing below knows or cares which of them the reader
     used. That is the whole reason the grammar produces the event the picker
     produces rather than one of its own, and it is why typing a filter also
     ticks it in the menu: there is one store, and the field writes to it. */
  filter.addEventListener('helix-facet', (event) => {
    const { field, label, operatorLabel, values } = event.detail
    const held = filter.querySelector(`helix-filter-chip[name="${field}"]`)

    if (values.length === 0) {
      held?.remove()
      return
    }

    const chip = held ?? document.createElement('helix-filter-chip')
    chip.slot = 'tags'
    chip.dismissible = true
    chip.dismissLabel = `Remove the ${label.toLowerCase()} filter`
    chip.label = label
    chip.name = field
    chip.operatorLabel = operatorLabel
    chip.textContent = values.join(', ')
    if (!held) {
      filter.append(chip)
    }
  })
</script>
