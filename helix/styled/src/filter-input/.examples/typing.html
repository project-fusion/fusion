<!-- @summary Typing a filter and pressing Enter builds the chip the picker would have. -->
<!-- @min 520 -->

<helix-filter-input
  hint="Try disposition:refunded, -disposition:settled, or refund assignee:ada tuesday"
  id="filter"
  label="Filter the queue"
  placeholder="Search, or type a filter"
>
  <helix-filter-menu
    label="Filter"
    slot="start"
  >
    <helix-button
      emphasis="ghost"
      slot="trigger"
    >
      <helix-icon
        name="funnel-simple"
        slot="start"
      ></helix-icon>
      Filter
    </helix-button>

    <helix-filter-field
      label="Disposition"
      name="disposition"
    >
      <helix-option value="refunded">Refunded</helix-option>
      <helix-option value="chargeback">Chargeback</helix-option>
      <helix-option value="settled">Settled</helix-option>
    </helix-filter-field>

  </helix-filter-menu>

  <!-- A field with no values to list belongs here rather than in the picker,
       where its page would have nothing on it to press. -->
  <helix-filter-field
    label="Assignee"
    name="assignee"
  ></helix-filter-field>
</helix-filter-input>

<script type="module">
  const filter = document.getElementById('filter')

  /* Typed text, a tick in the menu and the X on a chip all arrive as one
     `helix-facet`, so nothing below knows which the reader used. Typing also
     ticks the value in the menu: there is one store, and the field writes it. */
  filter.addEventListener('helix-facet', (event) => {
    const { field, label, operatorLabel, values } = event.detail
    const held = filter.querySelector(`helix-filter-chip[name="${field}"]`)

    if (values.length === 0) {
      held?.remove()
      return
    }

    const chip = held ?? document.createElement('helix-filter-chip')
    chip.slot = 'tags'
    chip.dismissible = true
    chip.dismissLabel = `Remove the ${label.toLowerCase()} filter`
    chip.label = label
    /* The attribute, not the property: a reflected property lands on the next
       update, so the lookup above would miss a chip built moments earlier. */
    chip.setAttribute('name', field)
    chip.operatorLabel = operatorLabel
    chip.textContent = values.join(', ')
    if (!held) {
      filter.append(chip)
    }
  })
</script>
