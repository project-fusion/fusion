<!-- @summary Controlling the text by preventing `helix-before-change` and writing the value yourself. -->

<helix-flex
  direction="column"
  gap="md"
>
  <!-- The page changes the text to uppercase as you type. -->
  <helix-filter-input
    hint="Text is changed to uppercase as you type"
    id="owned"
    label="Filter rows"
  ></helix-filter-input>

  <helix-list
    divided
    id="log"
    label="Events"
  >
    <helix-list-item>
      No events yet
      <span slot="description">Type into the field</span>
    </helix-list-item>
  </helix-list>
</helix-flex>

<script type="module">
  const field = document.getElementById('owned')
  const log = document.getElementById('log')
  let empty = true

  const KEEP = 5

  const say = (name, carried) => {
    if (empty) {
      log.replaceChildren()
      empty = false
    }
    const row = document.createElement('helix-list-item')
    row.textContent = name
    const under = document.createElement('span')
    under.slot = 'description'
    under.textContent = carried
    row.append(under)
    log.append(row)
    while (log.children.length > KEEP) {
      log.firstElementChild.remove()
    }
  }

  /* Refuse the change, then write the value. Writing `value` alone does not
     take control, because the element keeps applying what you type. */
  field.addEventListener('helix-before-change', (event) => {
    event.preventDefault()
    field.value = event.detail.value.toUpperCase()
    say('helix-before-change', `Refused "${event.detail.value}", wrote "${field.value}"`)
  })
</script>
