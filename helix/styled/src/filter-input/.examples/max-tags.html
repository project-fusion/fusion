<!-- @summary A cap for a field in a row, where the rest becomes a count. -->
<helix-filter-input
  hint="The two over the cap are hidden rather than dropped, and counted so the reader can see they are there"
  label="Filter rows"
  max-tags="3"
  placeholder="Add a filter"
>
  <helix-tag
    dismissible
    slot="tags"
  >design</helix-tag>
  <helix-tag
    dismissible
    slot="tags"
  >infra</helix-tag>
  <helix-tag
    dismissible
    slot="tags"
  >docs</helix-tag>
  <helix-tag
    dismissible
    slot="tags"
  >security</helix-tag>
  <helix-tag
    dismissible
    slot="tags"
  >billing</helix-tag>
</helix-filter-input>
