<!-- @summary Suggestions for keys before the colon and for values after it, in one panel. -->
<!-- @min 420 -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-filter-input
    hint="Type a letter, or press Down. Choosing a key offers its values next."
    id="filter"
    label="Filter rows"
    placeholder="owner:ada status:open"
  ></helix-filter-input>

  <helix-code-block
    id="query"
    label="Query"
  ></helix-code-block>
</helix-flex>

<script type="module">
  const filter = document.getElementById('filter')
  const query = document.getElementById('query')

  /* The page defines the keys and the values each one accepts. The field shows
     the list it is given. */
  const VOCABULARY = {
    area: ['billing', 'infra', 'docs'],
    owner: ['ada', 'grace', 'linus'],
    status: ['open', 'closed', 'draft'],
  }

  /* Everything after the last space is the term being typed. A term with no
     colon is a key, and a term with a colon is a value for that key. */
  const termAt = (text) => {
    const term = text.slice(0, filter.selectionStart).split(/\s+/).at(-1) ?? ''
    const colon = term.indexOf(':')
    return colon === -1
      ? { key: null, text: term }
      : { key: term.slice(0, colon), text: term.slice(colon + 1) }
  }

  const suggestionsFor = (text) => {
    const term = termAt(text)
    if (term.key === null) {
      return Object.keys(VOCABULARY).filter((key) => key.startsWith(term.text))
    }
    return (VOCABULARY[term.key] ?? []).filter((value) => value.startsWith(term.text))
  }

  /* The panel shows the options that are slotted. The field opens and closes it
     as the list changes. */
  const offer = () => {
    const values = suggestionsFor(filter.value)
    filter.replaceChildren(
      ...values.map((value) => {
        const option = document.createElement('helix-option')
        option.slot = 'suggestions'
        option.value = value
        option.textContent = value
        return option
      }),
    )
    query.textContent = filter.value === '' ? 'Everything' : filter.value
  }

  filter.addEventListener('input', offer)

  /* The option sends `helix-select` when it is pressed or chosen with Enter, so
     one handler covers both. */
  filter.addEventListener('helix-select', async (event) => {
    const term = termAt(filter.value)
    /* A key completes to `owner:` and the panel shows its values. A value
       completes to `owner:ada ` and the panel closes. */
    const insert = term.key === null ? `${event.detail.value}:` : `${event.detail.value} `
    const head = filter.value.slice(0, filter.selectionStart)
    const kept = head.slice(0, head.length - (term.key === null ? term.text.length : term.text.length + term.key.length + 1))
    const tail = filter.value.slice(filter.selectionStart)
    filter.value = kept + insert + tail
    /* Wait for the render before moving the caret. Until then, the input holds
       the old text, and `setSelectionRange` would clamp to its length. */
    await filter.updateComplete
    const at = kept.length + insert.length
    filter.setSelectionRange(at, at)
    offer()
  })

  offer()
</script>
