<!-- @summary Backspace in an empty field sends the same `helix-dismiss` as a tag's remove button. -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-filter-input
    hint="Press Backspace in the empty field to remove the last filter"
    id="filter"
    label="Filter rows"
    placeholder="Add a filter"
  >
    <helix-tag
      dismissible
      slot="tags"
    >design</helix-tag>
    <helix-tag
      dismissible
      slot="tags"
    >infra</helix-tag>
    <helix-tag
      dismissible
      slot="tags"
    >docs</helix-tag>
  </helix-filter-input>

  <helix-button id="replay">Replay</helix-button>
</helix-flex>

<script type="module">
  const filter = document.getElementById('filter')
  const replay = document.getElementById('replay')

  const START = ['design', 'infra', 'docs']

  /* Your code removes the tag. The remove button and Backspace both send
     `helix-dismiss`. */
  filter.addEventListener('helix-dismiss', (event) => {
    event.target.remove()
  })

  const run = () => {
    filter.replaceChildren(
      ...START.map((label) => {
        const tag = document.createElement('helix-tag')
        tag.slot = 'tags'
        tag.dismissible = true
        tag.textContent = label
        return tag
      }),
    )
  }

  replay.addEventListener('click', run)
</script>
