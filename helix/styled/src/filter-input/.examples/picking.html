<!-- @summary Picking values builds a chip, and the field's usual comparison is not shown. -->
<!-- @min 520 -->

<helix-filter-input
  hint="Choose a filter, then choose one or more values"
  id="filter"
  label="Filter the queue"
  placeholder="Search, or pick a filter"
>
  <helix-filter-menu
    label="Filter"
    slot="start"
  >
    <helix-button
      emphasis="ghost"
      slot="trigger"
    >
      <helix-icon
        name="funnel-simple"
        slot="start"
      ></helix-icon>
      Filter
    </helix-button>

    <helix-filter-field
      label="Disposition"
      name="disposition"
    >
      <helix-option value="refunded">Refunded</helix-option>
      <helix-option value="chargeback">Chargeback</helix-option>
      <helix-option value="settled">Settled</helix-option>
    </helix-filter-field>

    <helix-filter-field
      label="Created"
      name="created"
    >
      <helix-filter-operator
        label="after"
        name="after"
      ></helix-filter-operator>
      <helix-option value="today">Today</helix-option>
      <helix-option value="week">This week</helix-option>
    </helix-filter-field>
  </helix-filter-menu>
</helix-filter-input>

<script type="module">
  const filter = document.getElementById('filter')

  /* A checked value, a changed comparison, and a removed chip all send
     `helix-facet`, so no `helix-dismiss` handler is needed. */
  filter.addEventListener('helix-facet', (event) => {
    const { field, label, operatorLabel, values } = event.detail
    const held = filter.querySelector(`helix-filter-chip[name="${field}"]`)

    if (values.length === 0) {
      held?.remove()
      return
    }

    const chip = held ?? document.createElement('helix-filter-chip')
    chip.slot = 'tags'
    chip.dismissible = true
    chip.dismissLabel = `Remove the ${label.toLowerCase()} filter`
    chip.label = label
    /* Set the attribute so the lookup above finds a chip made moments earlier.
       A reflected property updates on the next render. */
    chip.setAttribute('name', field)
    chip.operatorLabel = operatorLabel
    chip.textContent = values.join(', ')
    if (!held) {
      filter.append(chip)
    }
  })
</script>
