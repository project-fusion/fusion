<!-- @summary Picking values builds a chip, and the usual comparison stays unwritten. -->
<!-- @min 520 -->

<helix-filter-input
  hint="Open the picker, tick a value, and change the comparison under the field"
  id="filter"
  label="Filter the queue"
  placeholder="Search, or pick a filter"
>
  <!-- The picker goes before the text, which is where the reference puts it: a
       reader either types or reaches for the list, and both narrow the same set. -->
  <helix-filter-menu
    label="Filter"
    slot="start"
  >
    <helix-button
      emphasis="ghost"
      slot="trigger"
    >Filter</helix-button>

    <!-- No comparisons declared, so it is offered "is any of" and "is none of":
         the two the typed grammar can say, and the two nearly every set filter
         wants. They sit on a page of their own under the field, because a
         comparison is one choice and the values are several. -->
    <helix-filter-field
      label="Disposition"
      name="disposition"
    >
      <helix-option value="refunded">Refunded</helix-option>
      <helix-option value="chargeback">Chargeback</helix-option>
      <helix-option value="settled">Settled</helix-option>
    </helix-filter-field>

    <!-- One comparison and no default, which is the scalar shape: there is
         nothing for a default to distinguish it from, so a chip built from this
         always says "after" and the field offers no comparison to change. -->
    <helix-filter-field
      label="Created"
      name="created"
    >
      <helix-filter-operator
        label="after"
        name="after"
      ></helix-filter-operator>
      <helix-option value="today">Today</helix-option>
      <helix-option value="week">This week</helix-option>
    </helix-filter-field>
  </helix-filter-menu>
</helix-filter-input>

<script type="module">
  const filter = document.getElementById('filter')

  /* **The chips are the consumer's own markup, which is why the picker
     announces rather than applies.** Everything that can change a filter
     arrives here as one `helix-facet`: a tick, a comparison, and the X on a
     chip, which the field turns into this field being filtered by nothing.
     There is no `helix-dismiss` handler below for that reason. */
  filter.addEventListener('helix-facet', (event) => {
    const { field, label, operatorLabel, values } = event.detail
    const held = filter.querySelector(`helix-filter-chip[name="${field}"]`)

    // An empty set is the filter going, which is what unticking the last value
    // means by it, and what the X on a chip is answered with.
    if (values.length === 0) {
      held?.remove()
      return
    }

    const chip = held ?? document.createElement('helix-filter-chip')
    chip.slot = 'tags'
    chip.dismissible = true
    chip.dismissLabel = `Remove the ${label.toLowerCase()} filter`
    chip.label = label
    chip.name = field
    chip.operatorLabel = operatorLabel
    chip.textContent = values.join(', ')
    if (!held) {
      filter.append(chip)
    }
  })
</script>
