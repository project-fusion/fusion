<!-- @summary Picking values builds a chip, and the field's usual comparison is not shown. -->
<!-- @min 520 -->

<helix-filter-input
  hint="Open the picker, tick a value, and change the comparison under the field"
  id="filter"
  label="Filter the queue"
  placeholder="Search, or pick a filter"
>
  <helix-filter-menu
    label="Filter"
    slot="start"
  >
    <helix-button
      emphasis="ghost"
      slot="trigger"
    >
      <helix-icon
        name="funnel-simple"
        slot="start"
      ></helix-icon>
      Filter
    </helix-button>

    <helix-filter-field
      label="Disposition"
      name="disposition"
    >
      <helix-option value="refunded">Refunded</helix-option>
      <helix-option value="chargeback">Chargeback</helix-option>
      <helix-option value="settled">Settled</helix-option>
    </helix-filter-field>

    <helix-filter-field
      label="Created"
      name="created"
    >
      <helix-filter-operator
        label="after"
        name="after"
      ></helix-filter-operator>
      <helix-option value="today">Today</helix-option>
      <helix-option value="week">This week</helix-option>
    </helix-filter-field>
  </helix-filter-menu>
</helix-filter-input>

<script type="module">
  const filter = document.getElementById('filter')

  /* Every way a filter can change arrives here as one `helix-facet`: a tick, a
     comparison, and the X on a chip, which the field turns into this field being
     filtered by nothing. That is why there is no `helix-dismiss` handler. */
  filter.addEventListener('helix-facet', (event) => {
    const { field, label, operatorLabel, values } = event.detail
    const held = filter.querySelector(`helix-filter-chip[name="${field}"]`)

    if (values.length === 0) {
      held?.remove()
      return
    }

    const chip = held ?? document.createElement('helix-filter-chip')
    chip.slot = 'tags'
    chip.dismissible = true
    chip.dismissLabel = `Remove the ${label.toLowerCase()} filter`
    chip.label = label
    /* The attribute, not the property: a reflected property lands on the next
       update, so the lookup above would miss a chip built moments earlier. */
    chip.setAttribute('name', field)
    chip.operatorLabel = operatorLabel
    chip.textContent = values.join(', ')
    if (!held) {
      filter.append(chip)
    }
  })
</script>
