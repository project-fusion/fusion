<!-- @summary A capped row whose count opens it, and closes it again. -->
<helix-filter-input
  expandable
  hint="The count is a button here, so the two over the cap are reachable without leaving the field"
  label="Filter rows"
  max-tags="3"
  placeholder="Add a filter"
>
  <helix-tag
    dismissible
    slot="tags"
  >design</helix-tag>
  <helix-tag
    dismissible
    slot="tags"
  >infra</helix-tag>
  <helix-tag
    dismissible
    slot="tags"
  >docs</helix-tag>
  <helix-tag
    dismissible
    slot="tags"
  >security</helix-tag>
  <helix-tag
    dismissible
    slot="tags"
  >billing</helix-tag>
</helix-filter-input>
