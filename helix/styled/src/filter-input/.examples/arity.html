<!-- @summary How many values a comparison takes decides what the picker offers. -->
<!-- @min 520 -->

<helix-filter-input
  hint="Assignee offers is empty, which takes no values at all"
  id="filter"
  label="Filter the queue"
  placeholder="Search, or pick a filter"
>
  <helix-filter-menu
    label="Filter"
    slot="start"
  >
    <helix-button
      emphasis="ghost"
      slot="trigger"
    >
      <helix-icon
        name="funnel-simple"
        slot="start"
      ></helix-icon>
      Filter
    </helix-button>

    <!-- The default pair, both `many`: tick as many as you like. -->
    <helix-filter-field
      label="Disposition"
      name="disposition"
    >
      <helix-option value="refunded">Refunded</helix-option>
      <helix-option value="chargeback">Chargeback</helix-option>
      <helix-option value="settled">Settled</helix-option>
    </helix-filter-field>

    <!-- `one`, so the values are a single choice: pressing another replaces it
         rather than adding, and the rows announce as radios. A date is after one
         date or it is after another; it is not after both. -->
    <helix-filter-field
      label="Created"
      name="created"
    >
      <helix-filter-operator
        arity="one"
        label="is after"
        name="after"
      ></helix-filter-operator>
      <helix-option value="today">Today</helix-option>
      <helix-option value="week">This week</helix-option>
      <helix-option value="month">This month</helix-option>
    </helix-filter-field>

    <!-- `none` beside `many`. Choosing "is empty" is the whole filter, so the
         picker stops offering names under it and the chip carries the word with
         no values after it. Choosing "is any of" again brings them back. -->
    <helix-filter-field
      label="Assignee"
      name="assignee"
    >
      <helix-filter-operator
        default
        label="is any of"
        name="any"
      ></helix-filter-operator>
      <helix-filter-operator
        arity="none"
        label="is empty"
        name="empty"
      ></helix-filter-operator>
      <helix-option value="ada">Ada</helix-option>
      <helix-option value="grace">Grace</helix-option>
    </helix-filter-field>
  </helix-filter-menu>
</helix-filter-input>

<script type="module">
  const filter = document.getElementById('filter')

  filter.addEventListener('helix-facet', (event) => {
    const { arity, field, label, operatorLabel, values } = event.detail
    const held = filter.querySelector(`helix-filter-chip[name="${field}"]`)

    /* **`arity` is what tells an empty filter from no filter.** Every other
       comparison with nothing chosen means the field is no longer narrowing
       anything; one that takes no values means it is, and always will have none
       to show. Without reading this the two arrive identical and "is empty"
       could never be drawn. */
    if (values.length === 0 && arity !== 'none') {
      held?.remove()
      return
    }

    const chip = held ?? document.createElement('helix-filter-chip')
    chip.slot = 'tags'
    chip.dismissible = true
    chip.dismissLabel = `Remove the ${label.toLowerCase()} filter`
    chip.label = label
    /* **The attribute, not the property.** `name` is what the lookup above keys
       on, and a reflected property is written on the element's next update
       rather than now: two facets for one field in the same frame both found
       nothing, both built a chip, and the row ended up with two. Worse, the
       lookup then removed whichever came first, so dismissing one chip took the
       other away. Setting it here makes it true before the next facet asks. */
    chip.setAttribute('name', field)
    chip.operatorLabel = operatorLabel
    chip.textContent = values.join(', ')
    if (!held) {
      filter.append(chip)
    }
  })
</script>
