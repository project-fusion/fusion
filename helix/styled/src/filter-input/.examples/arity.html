<!-- @summary The picker offers values based on how many a comparison takes. -->
<!-- @min 520 -->

<helix-filter-input
  hint="Filter by disposition, created date, or assignee"
  id="filter"
  label="Filter the queue"
  placeholder="Search, or pick a filter"
>
  <helix-filter-menu
    label="Filter"
    slot="start"
  >
    <helix-button
      emphasis="ghost"
      slot="trigger"
    >
      <helix-icon
        name="funnel-simple"
        slot="start"
      ></helix-icon>
      Filter
    </helix-button>

    <helix-filter-field
      label="Disposition"
      name="disposition"
    >
      <helix-option value="refunded">Refunded</helix-option>
      <helix-option value="chargeback">Chargeback</helix-option>
      <helix-option value="settled">Settled</helix-option>
    </helix-filter-field>

    <!-- `one`: choosing another value replaces the current one. -->
    <helix-filter-field
      label="Created"
      name="created"
    >
      <helix-filter-operator
        arity="one"
        label="is after"
        name="after"
      ></helix-filter-operator>
      <helix-option value="today">Today</helix-option>
      <helix-option value="week">This week</helix-option>
      <helix-option value="month">This month</helix-option>
    </helix-filter-field>

    <!-- `none`: the comparison is the whole filter, so no values are offered. -->
    <helix-filter-field
      label="Assignee"
      name="assignee"
    >
      <helix-filter-operator
        default
        label="is any of"
        name="any"
      ></helix-filter-operator>
      <helix-filter-operator
        arity="none"
        label="is empty"
        name="empty"
      ></helix-filter-operator>
      <helix-option value="ada">Ada</helix-option>
      <helix-option value="grace">Grace</helix-option>
    </helix-filter-field>
  </helix-filter-menu>
</helix-filter-input>

<script type="module">
  const filter = document.getElementById('filter')

  filter.addEventListener('helix-facet', (event) => {
    const { arity, field, label, operatorLabel, values } = event.detail
    const held = filter.querySelector(`helix-filter-chip[name="${field}"]`)

    /* `arity` tells an empty filter from no filter. A comparison that takes no
       values is still a filter. */
    if (values.length === 0 && arity !== 'none') {
      held?.remove()
      return
    }

    const chip = held ?? document.createElement('helix-filter-chip')
    chip.slot = 'tags'
    chip.dismissible = true
    chip.label = label
    /* Set the attribute so the lookup above finds a chip made moments earlier.
       A reflected property updates on the next render. */
    chip.setAttribute('name', field)
    chip.operatorLabel = operatorLabel
    chip.textContent = values.join(', ')
    if (!held) {
      filter.append(chip)
    }
  })
</script>
