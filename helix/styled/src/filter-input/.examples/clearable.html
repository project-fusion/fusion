<!-- @summary A button that empties the text and leaves the filters in place. -->
<helix-filter-input
  clearable
  hint="The tokens stay: they are the consumer’s markup, and the button is the text’s"
  label="Filter rows"
  value="deploy"
>
  <helix-filter-chip
    dismiss-label="Remove the env filter"
    dismissible
    label="Env"
    name="env"
    slot="tags"
  >Staging</helix-filter-chip>
</helix-filter-input>
