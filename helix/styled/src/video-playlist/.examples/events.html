<!-- @summary The events sent before and after the playlist changes the clip that plays. -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-video-playlist
    default-active="one"
    id="episodes"
    label="Episodes"
  >
    <helix-video
      extra-controls="previous next"
      label="Episode player"
      slot="player"
    ></helix-video>
    <helix-video-playlist-item value="one">Setting up your account</helix-video-playlist-item>
    <helix-video-playlist-item value="two">Inviting your team</helix-video-playlist-item>
  </helix-video-playlist>


  <helix-list
    divided
    id="log"
    label="Events"
  >
    <helix-list-item>
      No events yet
      <span slot="description">Choose another clip</span>
    </helix-list-item>
  </helix-list>
</helix-flex>

<script type="module">
  const episodes = document.getElementById('episodes')
  const log = document.getElementById('log')
  let empty = true

  // The log keeps this many of the most recent rows.
  const KEEP = 6

  const say = (name, carried) => {
    if (empty) {
      log.replaceChildren()
      empty = false
    }
    const row = document.createElement('helix-list-item')
    row.textContent = name
    const under = document.createElement('span')
    under.slot = 'description'
    under.textContent = carried
    row.append(under)
    log.append(row)
    while (log.children.length > KEEP) {
      log.firstElementChild.remove()
    }
  }

  episodes.addEventListener('helix-before-activate', (event) => {
    say('helix-before-activate', `about to change to "${event.detail.value}", can be canceled`)
  })
  /* The playlist stops each entry's `helix-select`, so listen for
     `helix-activate` on the playlist. */
  episodes.addEventListener('helix-activate', (event) => {
    say('helix-activate', `"${event.detail.value}" is now playing`)
  })
  episodes.addEventListener('helix-end', () => {
    say('helix-end', 'the last clip finished, and the playlist stopped there')
  })
</script>
