<!-- @summary The entries as a menu in the player's control bar, and no list beside it. -->
<link
  href="styles.css"
  rel="stylesheet"
/>

<helix-video-playlist
  default-active="sintel"
  label="Episodes"
>
  <helix-video
    label="One of several"
    slot="player"
  >
    <helix-video-playlist-menu slot="controls"></helix-video-playlist-menu>
  </helix-video>

  <helix-video-playlist-item
    poster="/media/sintel-short.jpg"
    src="https://mdn.github.io/shared-assets/videos/sintel-short.mp4"
    value="sintel"
  >
    Sintel
    <span slot="meta">2:00</span>
  </helix-video-playlist-item>
  <helix-video-playlist-item
    poster="/media/tears-of-steel.jpg"
    src="https://mdn.github.io/shared-assets/videos/tears-of-steel-battle-clip-medium.mp4"
    value="tears"
  >
    Tears of Steel
    <span slot="meta">1:10</span>
  </helix-video-playlist-item>
</helix-video-playlist>
