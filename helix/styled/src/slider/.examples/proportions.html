<link
  href="styles.css"
  rel="stylesheet"
>

<!-- @summary A thicker track, and a thumb with a different width and height. -->
<!-- @layout hug -->
<helix-flex
  direction="column"
  gap="2xl"
>
  <helix-slider
    default-value="60"
    label="Default"
    max="100"
    min="0"
    show-value
  ></helix-slider>

  <helix-flex
    class="thick"
    direction="column"
    gap="2xl"
  >
    <helix-slider
      default-value="60"
      label="Thick track"
      max="100"
      min="0"
      show-value
    ></helix-slider>

    <helix-slider
      default-value="35"
      label="Capsule handle"
      markers="5"
      max="100"
      min="0"
      show-value
    ></helix-slider>
  </helix-flex>

  <helix-flex
    align-items="end"
    class="thick"
    gap="2xl"
  >
    <helix-slider
      default-value="70"
      label="Upright"
      max="100"
      min="0"
      orientation="vertical"
      show-value
    ></helix-slider>

    <helix-slider
      default-value="30"
      label="Beside it"
      max="100"
      min="0"
      orientation="vertical"
      show-value
    ></helix-slider>
  </helix-flex>
</helix-flex>
