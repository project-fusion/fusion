<!-- @summary A drag fires `input` many times and `change` once, at the end. -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-slider
    default-value="40"
    id="quality"
    label="Quality"
    show-value
  ></helix-slider>


  <helix-list
    divided
    id="log"
    label="Events"
  >
    <helix-list-item>
      No events yet
      <span slot="description">Drag the thumb, then let go</span>
    </helix-list-item>
  </helix-list>
</helix-flex>

<script type="module">
  const quality = document.getElementById('quality')
  const log = document.getElementById('log')
  let empty = true

  // The log keeps the last six events.
  const KEEP = 6

  const say = (name, carried) => {
    if (empty) {
      log.replaceChildren()
      empty = false
    }
    const row = document.createElement('helix-list-item')
    row.textContent = name
    const under = document.createElement('span')
    under.slot = 'description'
    under.textContent = carried
    row.append(under)
    log.append(row)
    while (log.children.length > KEEP) {
      log.firstElementChild.remove()
    }
  }

  quality.addEventListener('helix-before-change', (event) => {
    say('helix-before-change', `Proposed ${event.detail.value}`)
  })
  quality.addEventListener('input', (event) => {
    say('input', `Value is ${event.currentTarget.value}`)
  })
  quality.addEventListener('change', (event) => {
    say('change', `Changed to ${event.currentTarget.value}`)
  })
</script>
