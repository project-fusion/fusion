<!-- @summary A drag fires `input` many times and `change` once, at the end. -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-slider
    default-value="40"
    id="quality"
    label="Quality"
    show-value
  ></helix-slider>


  <helix-list
    divided
    id="log"
    label="What arrived"
  >
    <helix-list-item>
      Nothing yet
      <span slot="description">Drag the thumb, then let go</span>
    </helix-list-item>
  </helix-list>
</helix-flex>

<script type="module">
  const quality = document.getElementById('quality')
  const log = document.getElementById('log')
  let empty = true

  // How many rows the log holds, which is a choice about this preview's height.
  const KEEP = 6

  const say = (name, carried) => {
    if (empty) {
      log.replaceChildren()
      empty = false
    }
    const row = document.createElement('helix-list-item')
    row.textContent = name
    const under = document.createElement('span')
    under.slot = 'description'
    under.textContent = carried
    row.append(under)
    log.append(row)
    while (log.children.length > KEEP) {
      log.firstElementChild.remove()
    }
  }

  quality.addEventListener('helix-before-change', (event) => {
    say('helix-before-change', `proposing ${event.detail.value}, refusable`)
  })
  quality.addEventListener('input', (event) => {
    say('input', `${event.currentTarget.value} while the thumb moves`)
  })
  quality.addEventListener('change', (event) => {
    say('change', `${event.currentTarget.value}, once it is let go`)
  })
</script>
