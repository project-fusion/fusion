<!-- @summary A board whose page holds the card positions. The page cancels each move and places the card on the nearest grid line. -->
<helix-canvas
  grid="lines"
  id="plan"
  label="Task board"
>
  <helix-canvas-node
    height="64"
    name="todo"
    width="160"
    x="0"
    y="0"
  >To do</helix-canvas-node>

  <helix-canvas-node
    height="64"
    name="doing"
    tone="accent"
    width="160"
    x="256"
    y="0"
  >Doing</helix-canvas-node>

  <helix-canvas-node
    height="64"
    name="done"
    tone="success"
    width="160"
    x="512"
    y="0"
  >Done</helix-canvas-node>

  <helix-canvas-edge
    from="todo"
    to="doing"
  ></helix-canvas-edge>

  <helix-canvas-edge
    from="doing"
    to="done"
  ></helix-canvas-edge>
</helix-canvas>

<script>
  const plan = document.getElementById('plan')

  // The grid spacing, so each card lands on a grid line.
  const STEP = 32

  // The nearest grid line, leaning the way the card moved, so a keyboard nudge
  // of half a step reaches the next line in every direction.
  const snap = (from, to) => Math.round(to / STEP + Math.sign(to - from) * 0.01) * STEP

  // Cancel the move, then place each card on the nearest grid line.
  plan.addEventListener('helix-before-move', (event) => {
    event.preventDefault()
    for (const { name, x, y } of event.detail.nodes) {
      const card = plan.querySelector(`[name="${name}"]`)
      card.x = snap(card.x, x)
      card.y = snap(card.y, y)
    }
  })
</script>
