<!-- @summary A board of cards and the arrows between them, drawn where its author placed each one. -->
<helix-canvas
  grid="dots"
  label="Document approval"
>
  <helix-canvas-node
    group
    height="112"
    label="Before publishing"
    name="flow"
    width="528"
    x="-24"
    y="-24"
  ></helix-canvas-node>

  <helix-canvas-node
    height="64"
    name="write"
    width="160"
    x="0"
    y="0"
  >Write the draft</helix-canvas-node>

  <helix-canvas-node
    height="64"
    name="review"
    tone="accent"
    width="160"
    x="320"
    y="0"
  >Review the draft</helix-canvas-node>

  <helix-canvas-node
    height="64"
    name="ship"
    tone="success"
    width="160"
    x="160"
    y="200"
  >Publish the draft</helix-canvas-node>

  <helix-canvas-edge
    from="write"
    label="when it is complete"
    to="review"
  ></helix-canvas-edge>

  <helix-canvas-edge
    from="review"
    label="when it is approved"
    to="ship"
  ></helix-canvas-edge>
</helix-canvas>
