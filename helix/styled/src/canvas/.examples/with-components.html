<!-- @summary Cards that hold your own components, such as an image and a stat. -->
<link
  href="styles.css"
  rel="stylesheet"
/>

<helix-canvas
  grid="lines"
  label="Weekly report"
>
  <helix-canvas-node
    height="150"
    label="New product photos"
    name="shot"
    width="220"
    x="0"
    y="0"
  >
    <helix-image
      alt="Seawater over pale sand"
      shape="rounded"
      src="/media/scale/seawater-400.jpg"
    ></helix-image>
    <helix-text slot="description">New product photos</helix-text>
  </helix-canvas-node>

  <helix-canvas-node
    height="150"
    label="Weekly visitors"
    name="numbers"
    width="220"
    x="320"
    y="0"
  >
    <helix-stat>
      <helix-text slot="label">Weekly visitors</helix-text>
      12,480
    </helix-stat>
    <helix-text slot="description">Up 20% from last week</helix-text>
  </helix-canvas-node>

  <helix-canvas-edge
    from="shot"
    label="increased"
    to="numbers"
  ></helix-canvas-edge>
</helix-canvas>
