<!-- @summary A read-only board for publishing. Every card stays where its author put it, and every connection turns at right angles. -->
<helix-canvas
  label="How a request reaches the database"
  path="step"
  readonly
>
  <helix-canvas-node
    height="64"
    name="edge"
    width="160"
    x="0"
    y="0"
  >Edge function</helix-canvas-node>

  <helix-canvas-node
    height="64"
    name="cache"
    tone="info"
    width="160"
    x="320"
    y="0"
  >Cache</helix-canvas-node>

  <helix-canvas-node
    height="64"
    name="db"
    tone="primary"
    width="160"
    x="320"
    y="160"
  >Database</helix-canvas-node>

  <helix-canvas-edge
    from="edge"
    label="checks first"
    to="cache"
  ></helix-canvas-edge>

  <helix-canvas-edge
    from="cache"
    label="if not cached"
    to="db"
  ></helix-canvas-edge>
</helix-canvas>
