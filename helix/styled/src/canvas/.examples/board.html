<!-- @summary A board written as markup, drawn where its author placed each card, with a reading order for anyone who cannot see the placement. -->
<helix-canvas label="How a release happens">
  <helix-canvas-node
    height="130"
    id="flow"
    label="Before the tag"
    type="group"
    width="360"
    x="-16"
    y="-16"
  ></helix-canvas-node>

  <helix-canvas-node
    height="90"
    id="write"
    width="150"
    x="0"
    y="0"
  >Write the change</helix-canvas-node>

  <helix-canvas-node
    color="3"
    height="90"
    id="review"
    width="150"
    x="194"
    y="0"
  >Review it</helix-canvas-node>

  <helix-canvas-node
    color="4"
    height="90"
    id="ship"
    width="150"
    x="97"
    y="180"
  >Tag and publish</helix-canvas-node>

  <helix-canvas-edge
    from="write"
    label="when it builds"
    to="review"
  ></helix-canvas-edge>

  <helix-canvas-edge
    from="review"
    label="when it is approved"
    to="ship"
  ></helix-canvas-edge>
</helix-canvas>
