<!-- @summary A board written as markup, with each card drawn where its author placed it. The arrow keys and screen readers move through the cards in reading order. -->
<helix-canvas
  grid="dots"
  label="How a release happens"
>
  <helix-canvas-node
    group
    height="112"
    label="Before the tag"
    name="flow"
    width="528"
    x="-24"
    y="-24"
  ></helix-canvas-node>

  <helix-canvas-node
    height="64"
    name="write"
    width="160"
    x="0"
    y="0"
  >Write the change</helix-canvas-node>

  <helix-canvas-node
    height="64"
    name="review"
    tone="accent"
    width="160"
    x="320"
    y="0"
  >Review it</helix-canvas-node>

  <helix-canvas-node
    height="64"
    name="ship"
    tone="success"
    width="160"
    x="160"
    y="200"
  >Tag and publish</helix-canvas-node>

  <helix-canvas-edge
    from="write"
    label="when it builds"
    to="review"
  ></helix-canvas-edge>

  <helix-canvas-edge
    from="review"
    label="when it is approved"
    to="ship"
  ></helix-canvas-edge>
</helix-canvas>
