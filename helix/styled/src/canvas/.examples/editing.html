<!-- @summary A board a reader rearranges: draw from a card's edge to another to join them, or press C on one and Enter on another, and Delete takes a card or a connection away. -->
<helix-canvas
  id="launch"
  label="Ideas for the launch"
>
  <helix-canvas-node
    height="64"
    name="post"
    width="160"
    x="0"
    y="0"
  >Write the post</helix-canvas-node>

  <helix-canvas-node
    color="3"
    height="64"
    name="demo"
    width="160"
    x="256"
    y="0"
  >Record a demo</helix-canvas-node>

  <helix-canvas-node
    color="4"
    height="64"
    name="ship"
    width="160"
    x="128"
    y="160"
  >Ship it</helix-canvas-node>

  <helix-canvas-edge
    from="post"
    name="post-ship"
    to="ship"
  ></helix-canvas-edge>
</helix-canvas>

<script>
  const launch = document.getElementById('launch')
  let made = 0

  // Asked rather than done: the board never adds to the page's markup, so the page does.
  launch.addEventListener('helix-connect', (event) => {
    const { from, fromSide, to } = event.detail
    made += 1
    const edge = document.createElement('helix-canvas-edge')
    edge.setAttribute('name', `made-${made}`)
    edge.setAttribute('from', from)
    edge.setAttribute('to', to)
    if (fromSide) {
      edge.setAttribute('from-side', fromSide)
    }
    launch.append(edge)
  })

  // The same for removal, which names every connection a removed card would strand.
  // Names are only unique on their board, so they are looked up inside it.
  launch.addEventListener('helix-remove', (event) => {
    for (const name of event.detail.nodes) {
      launch.querySelector(`helix-canvas-node[name="${name}"]`)?.remove()
    }
    for (const { name } of event.detail.edges) {
      launch.querySelector(`helix-canvas-edge[name="${name}"]`)?.remove()
    }
  })
</script>
