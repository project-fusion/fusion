<!-- @summary A board a reader rearranges: draw from a card's edge to another to join them, drag a connection's end to move it, double-click to edit, and Delete takes a card or a connection away. -->
<helix-canvas
  id="launch"
  label="Ideas for the launch"
>
  <helix-canvas-node
    height="64"
    name="post"
    width="160"
    x="0"
    y="0"
  ><span>Write the post</span></helix-canvas-node>

  <helix-canvas-node
    height="64"
    name="demo"
    tone="accent"
    width="160"
    x="256"
    y="0"
  ><span>Record a demo</span></helix-canvas-node>

  <helix-canvas-node
    height="64"
    name="ship"
    tone="success"
    width="160"
    x="128"
    y="160"
  ><span>Ship it</span></helix-canvas-node>

  <helix-canvas-edge
    from="post"
    name="post-ship"
    to="ship"
  ></helix-canvas-edge>
</helix-canvas>

<script>
  const launch = document.getElementById('launch')
  let made = 0

  // Asked rather than done: the board never adds to the page's markup, so the page does.
  launch.addEventListener('helix-connect', (event) => {
    const { from, fromSide, to, toSide } = event.detail
    made += 1
    const edge = document.createElement('helix-canvas-edge')
    edge.setAttribute('name', `made-${made}`)
    edge.setAttribute('from', from)
    edge.setAttribute('to', to)
    if (fromSide) {
      edge.setAttribute('from-side', fromSide)
    }
    if (toSide) {
      edge.setAttribute('to-side', toSide)
    }
    launch.append(edge)
  })

  // A card holds what the page put in it, so the page edits it: here, its text, in place.
  launch.addEventListener('helix-canvas-edit', (event) => {
    const card = launch.querySelector(`helix-canvas-node[name="${event.detail.name}"]`)
    const text = card?.querySelector('span')
    if (!text) {
      return
    }
    const field = document.createElement('input')
    field.setAttribute('aria-label', 'Card text')
    field.value = text.textContent
    const done = (keep) => {
      if (!field.isConnected) {
        return
      }
      if (keep && field.value.trim()) {
        text.textContent = field.value.trim()
      }
      field.replaceWith(text)
      card.focus()
    }
    field.addEventListener('blur', () => done(true))
    field.addEventListener('keydown', (key) => {
      if (key.key === 'Enter' || key.key === 'Escape') {
        key.preventDefault()
        done(key.key === 'Enter')
      }
    })
    text.replaceWith(field)
    field.focus()
    field.select()
  })

  // The same for removal, which names every connection a removed card would strand.
  // Names are only unique on their board, so they are looked up inside it.
  launch.addEventListener('helix-remove', (event) => {
    for (const name of event.detail.nodes) {
      launch.querySelector(`helix-canvas-node[name="${name}"]`)?.remove()
    }
    for (const { name } of event.detail.edges) {
      launch.querySelector(`helix-canvas-edge[name="${name}"]`)?.remove()
    }
  })
</script>
