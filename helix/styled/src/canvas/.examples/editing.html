<!-- @summary A board you can edit. Draw from a card's edge to another card to join them, drag a connection's end to move it, double-click a card to edit it, and press Delete to remove a card or a connection. -->
<link
  href="styles.css"
  rel="stylesheet"
/>

<helix-canvas
  id="launch"
  label="Launch plan"
>
  <helix-canvas-node
    height="64"
    name="post"
    width="160"
    x="0"
    y="0"
  ><span>Draft the email</span></helix-canvas-node>

  <helix-canvas-node
    height="64"
    name="demo"
    tone="accent"
    width="160"
    x="256"
    y="0"
  ><span>Record a demo</span></helix-canvas-node>

  <helix-canvas-node
    height="64"
    name="ship"
    tone="success"
    width="160"
    x="128"
    y="160"
  ><span>Publish the release</span></helix-canvas-node>

  <helix-canvas-edge
    from="post"
    name="post-ship"
    to="ship"
  ></helix-canvas-edge>
</helix-canvas>

<script>
  const launch = document.getElementById('launch')
  let made = 0

  // The board does not add connections itself, so the page adds each new edge.
  launch.addEventListener('helix-connect', (event) => {
    const { from, fromSide, to, toSide } = event.detail
    made += 1
    const edge = document.createElement('helix-canvas-edge')
    edge.setAttribute('name', `made-${made}`)
    edge.setAttribute('from', from)
    edge.setAttribute('to', to)
    if (fromSide) {
      edge.setAttribute('from-side', fromSide)
    }
    if (toSide) {
      edge.setAttribute('to-side', toSide)
    }
    launch.append(edge)
  })

  // The page edits a card's content. Here, a Helix input replaces the text.
  launch.addEventListener('helix-canvas-edit', (event) => {
    const card = launch.querySelector(`helix-canvas-node[name="${event.detail.name}"]`)
    const text = card?.querySelector('span')
    if (!text) {
      return
    }
    const field = document.createElement('helix-input')
    field.setAttribute('aria-label', 'Card text')
    field.value = text.textContent
    // Once: taking the field out of the page blurs it, which calls this again.
    let finished = false
    const done = (keep) => {
      if (finished || !field.isConnected) {
        return
      }
      finished = true
      if (keep && field.value.trim()) {
        text.textContent = field.value.trim()
      }
      field.replaceWith(text)
      card.focus()
    }
    field.addEventListener('blur', () => done(true))
    field.addEventListener('keydown', (key) => {
      if (key.key === 'Enter' || key.key === 'Escape') {
        key.preventDefault()
        done(key.key === 'Enter')
      }
    })
    text.replaceWith(field)
    // Its field renders once it is connected, so select the text after that.
    field.updateComplete.then(() => {
      field.focus()
      field.select()
    })
  })

  // The event names every card and connection to remove. Names are unique only
  // within a board, so look them up inside it.
  launch.addEventListener('helix-remove', (event) => {
    for (const name of event.detail.nodes) {
      launch.querySelector(`helix-canvas-node[name="${name}"]`)?.remove()
    }
    for (const { name } of event.detail.edges) {
      launch.querySelector(`helix-canvas-edge[name="${name}"]`)?.remove()
    }
  })
</script>
