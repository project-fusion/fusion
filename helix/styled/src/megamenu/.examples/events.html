<!-- @summary The events a megamenu sends before and after its panel opens or closes. -->
<!-- @layout padded -->
<!-- @min 360 -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-navigation label="Main">
    <a href="#overview">Overview</a>
    <helix-megamenu
      id="products"
      label="Products"
    >
      <div data-megamenu-group>
        <h3 data-megamenu-heading>Work</h3>
        <a
          data-megamenu-item
          href="#helix"
        >Projects</a>
      </div>
    </helix-megamenu>
  </helix-navigation>


  <helix-list
    divided
    id="log"
    label="Events"
  >
    <helix-list-item>
      No events yet
      <span slot="description">Open the panel, then close it</span>
    </helix-list-item>
  </helix-list>
</helix-flex>

<script type="module">
  const products = document.getElementById('products')
  const log = document.getElementById('log')
  let empty = true

  // The log keeps the last six events.
  const KEEP = 6

  const say = (name, carried) => {
    if (empty) {
      log.replaceChildren()
      empty = false
    }
    const row = document.createElement('helix-list-item')
    row.textContent = name
    const under = document.createElement('span')
    under.slot = 'description'
    under.textContent = carried
    row.append(under)
    log.append(row)
    while (log.children.length > KEEP) {
      log.firstElementChild.remove()
    }
  }

  products.addEventListener('helix-before-open', () => {
    say('helix-before-open', 'About to open')
  })
  products.addEventListener('helix-before-close', () => {
    say('helix-before-close', 'About to close')
  })
  products.addEventListener('toggle', (event) => {
    say('toggle', `Changed from ${event.oldState} to ${event.newState}`)
  })
</script>
