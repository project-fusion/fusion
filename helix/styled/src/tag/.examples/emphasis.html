<!-- @summary Each emphasis in the neutral, primary, and danger tones. -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-flex
    gap="sm"
    wrap
  >
    <helix-tag>Subtle</helix-tag>
    <helix-tag tone="primary">Subtle</helix-tag>
    <helix-tag tone="danger">Subtle</helix-tag>
  </helix-flex>

  <helix-flex
    gap="sm"
    wrap
  >
    <helix-tag emphasis="solid">Solid</helix-tag>
    <helix-tag
      emphasis="solid"
      tone="primary"
    >Solid</helix-tag>
    <helix-tag
      emphasis="solid"
      tone="danger"
    >Solid</helix-tag>
  </helix-flex>

  <helix-flex
    gap="sm"
    wrap
  >
    <helix-tag emphasis="outlined">Outlined</helix-tag>
    <helix-tag
      emphasis="outlined"
      tone="primary"
    >Outlined</helix-tag>
    <helix-tag
      emphasis="outlined"
      tone="danger"
    >Outlined</helix-tag>
  </helix-flex>
</helix-flex>
