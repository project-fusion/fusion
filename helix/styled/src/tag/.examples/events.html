<!-- @summary Pressing a tag's remove button sends `helix-dismiss`. The tag stays until your code removes it. -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-flex
    gap="xs"
    id="row"
  >
    <helix-tag dismissible>design</helix-tag>
    <helix-tag dismissible>billing</helix-tag>
    <helix-tag dismissible>urgent</helix-tag>
  </helix-flex>


  <helix-list
    divided
    id="log"
    label="Events"
  >
    <helix-list-item>No events yet<span slot="description">Press the tag’s close control</span>
    </helix-list-item>
  </helix-list>
</helix-flex>

<script type="module">
  const row = document.getElementById('row')
  const log = document.getElementById('log')
  let empty = true

  // The log keeps this many of the most recent rows.
  const KEEP = 6

  const say = (name, carried) => {
    if (empty) {
      log.replaceChildren()
      empty = false
    }
    const row = document.createElement('helix-list-item')
    row.textContent = name
    const under = document.createElement('span')
    under.slot = 'description'
    under.textContent = carried
    row.append(under)
    log.append(row)
    while (log.children.length > KEEP) {
      log.firstElementChild.remove()
    }
  }

  row.addEventListener('helix-dismiss', (event) => {
    say('helix-dismiss', `the remove button on "${event.detail.label}" was pressed`)
  })
</script>
