<!-- @summary Each tone at the resting emphasis and at `solid`. -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-flex
    gap="sm"
    wrap
  >
    <helix-tag tone="neutral">Neutral</helix-tag>
    <helix-tag tone="primary">Primary</helix-tag>
    <helix-tag tone="accent">Accent</helix-tag>
    <helix-tag tone="danger">Danger</helix-tag>
    <helix-tag tone="info">Info</helix-tag>
    <helix-tag tone="success">Success</helix-tag>
    <helix-tag tone="warning">Warning</helix-tag>
  </helix-flex>

  <helix-flex
    gap="sm"
    wrap
  >
    <helix-tag
      emphasis="solid"
      tone="neutral"
    >Neutral</helix-tag>
    <helix-tag
      emphasis="solid"
      tone="primary"
    >Primary</helix-tag>
    <helix-tag
      emphasis="solid"
      tone="accent"
    >Accent</helix-tag>
    <helix-tag
      emphasis="solid"
      tone="danger"
    >Danger</helix-tag>
    <helix-tag
      emphasis="solid"
      tone="info"
    >Info</helix-tag>
    <helix-tag
      emphasis="solid"
      tone="success"
    >Success</helix-tag>
    <helix-tag
      emphasis="solid"
      tone="warning"
    >Warning</helix-tag>
  </helix-flex>
</helix-flex>
