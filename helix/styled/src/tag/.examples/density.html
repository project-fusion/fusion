<!-- @summary Tags follow `data-density`, written on a region or on the tag itself. At each density a tag is shorter than a button: 24, 28, and 32px against 32, 40, and 48. -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-flex
    align-items="center"
    data-density="sm"
    gap="sm"
  >
    <helix-tag>Draft</helix-tag>
    <helix-tag
      dismissible
      tone="primary"
    >Design</helix-tag>
    <helix-button>Filter</helix-button>
  </helix-flex>

  <helix-flex
    align-items="center"
    gap="sm"
  >
    <helix-tag>Draft</helix-tag>
    <helix-tag
      dismissible
      tone="primary"
    >Design</helix-tag>
    <helix-button>Filter</helix-button>
  </helix-flex>

  <helix-flex
    align-items="center"
    data-density="lg"
    gap="sm"
  >
    <helix-tag>Draft</helix-tag>
    <helix-tag
      dismissible
      tone="primary"
    >Design</helix-tag>
    <helix-button>Filter</helix-button>
  </helix-flex>
</helix-flex>
