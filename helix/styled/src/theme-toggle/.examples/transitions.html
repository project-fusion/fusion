<!-- @summary The three ways a press can move the page to the other mode: spreading in a circle from the button, wiping across, and fading. -->

<helix-flex
  align-items="center"
  gap="md"
  justify-content="center"
>
  <helix-theme-toggle>Circle</helix-theme-toggle>
  <helix-theme-toggle transition="wipe">Wipe</helix-theme-toggle>
  <helix-theme-toggle transition="fade">Fade</helix-theme-toggle>
</helix-flex>
