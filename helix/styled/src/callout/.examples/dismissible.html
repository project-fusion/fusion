<!-- @summary A dismissible callout fades and folds away, and the controls under it rise into its place. Focus moves on to the next control, and Show tip brings it back. -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-callout
    dismissible
    id="tip"
    tone="neutral"
  >
    <helix-text slot="heading">Tip</helix-text>
    Press the slash key to search from anywhere.
  </helix-callout>
  <helix-flex gap="sm">
    <helix-button>Open settings</helix-button>
    <helix-button
      emphasis="ghost"
      id="show-tip"
    >Show tip</helix-button>
  </helix-flex>
</helix-flex>

<script type="module">
  document.getElementById('show-tip').addEventListener('click', () => {
    document.getElementById('tip').open = true
  })
</script>
