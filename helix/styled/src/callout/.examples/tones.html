<!-- @summary The callout in each tone, from a plain note to a danger. -->
<helix-flex
  direction="column"
  gap="sm"
>
  <helix-callout tone="neutral">
    <helix-text slot="heading">Note</helix-text>
    Drafts are saved every minute.
  </helix-callout>
  <helix-callout tone="info">
    <helix-text slot="heading">Information</helix-text>
    The next release ships on Tuesday.
  </helix-callout>
  <helix-callout tone="success">
    <helix-text slot="heading">Success</helix-text>
    Your workspace has been created.
  </helix-callout>
  <helix-callout tone="warning">
    <helix-text slot="heading">Warning</helix-text>
    Two of your API keys expire this month.
  </helix-callout>
  <helix-callout tone="danger">
    <helix-text slot="heading">Error</helix-text>
    Your payment could not be processed. Update your card details.
  </helix-callout>
</helix-flex>
