<!-- @summary A heading and a button over the field, which still follows the pointer across them, in colors set with the aura's own hooks. -->

<link
  href="styles.css"
  rel="stylesheet"
>

<div class="stage">
  <helix-aura
    class="hero"
    interactive
    variant="aurora"
  >
    <helix-text as="h2">Ship the release on Friday</helix-text>
    <helix-button
      emphasis="solid"
      tone="primary"
    >Plan the release</helix-button>
  </helix-aura>
</div>
