<!-- @summary One context menu for every row of a table: right-click a row, long-press it, or press Shift+F10 on it. -->
<!-- @react-native-summary One context menu for every row of a table. A table is drawn on the web only for now, so a phone marks where it goes. -->
<!-- @min 360 -->
<table id="context-files">
  <thead>
    <tr>
      <th scope="col">Name</th>
      <th scope="col">Size</th>
    </tr>
  </thead>
  <tbody>
    <tr tabindex="0">
      <td>Quarterly report.pdf</td>
      <td>2.4 MB</td>
    </tr>
    <tr tabindex="0">
      <td>Roadmap.key</td>
      <td>8.1 MB</td>
    </tr>
  </tbody>
</table>

<!-- `targets` says which things the menu is about; `contextTarget` is the one asked over. -->
<helix-menu
  context
  for="context-files"
  label="File"
  targets="tbody tr"
>
  <helix-menu-item value="open">Open</helix-menu-item>
  <helix-menu-item value="rename">Rename</helix-menu-item>
  <helix-menu-item value="archive">Archive</helix-menu-item>
</helix-menu>
