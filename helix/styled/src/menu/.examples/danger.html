<!-- @summary An action that cannot be undone, last in its menu after a divider, its words in the danger ink. -->
<!-- @min 300 -->
<helix-menu
  label="Token"
  open
>
  <helix-button slot="trigger">Token</helix-button>
  <helix-menu-item value="copy">Copy token</helix-menu-item>
  <helix-menu-item value="rename">Rename</helix-menu-item>
  <helix-divider></helix-divider>
  <helix-menu-item
    shortcut="⌘⌫"
    tone="danger"
    value="revoke"
  >Revoke token</helix-menu-item>
</helix-menu>
