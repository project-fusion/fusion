<!-- @summary The events a menu sends as it opens, as an item is chosen, and as it closes. -->
<!-- @min 300 -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-menu
    id="actions"
    label="Actions"
  >
    <helix-button slot="trigger">Actions</helix-button>
    <helix-menu-item value="rename">Rename</helix-menu-item>
    <helix-menu-item value="duplicate">Duplicate</helix-menu-item>
    <helix-menu-item value="archive">Archive</helix-menu-item>
  </helix-menu>


  <helix-list
    divided
    id="log"
    label="Events"
  >
    <helix-list-item>
      No events yet
      <span slot="description">Open the menu and choose an item</span>
    </helix-list-item>
  </helix-list>
</helix-flex>

<script type="module">
  const actions = document.getElementById('actions')
  const log = document.getElementById('log')
  let empty = true

  // The log keeps the last six events.
  const KEEP = 6

  const say = (name, carried) => {
    if (empty) {
      log.replaceChildren()
      empty = false
    }
    const row = document.createElement('helix-list-item')
    row.textContent = name
    const under = document.createElement('span')
    under.slot = 'description'
    under.textContent = carried
    row.append(under)
    log.append(row)
    while (log.children.length > KEEP) {
      log.firstElementChild.remove()
    }
  }

  actions.addEventListener('helix-before-open', () => {
    say('helix-before-open', 'About to open')
  })
  actions.addEventListener('helix-before-close', () => {
    say('helix-before-close', 'About to close')
  })
  actions.addEventListener('toggle', (event) => {
    say('toggle', `Changed from ${event.oldState} to ${event.newState}`)
  })
  actions.addEventListener('helix-select', (event) => {
    say('helix-select', `Chose "${event.detail.value}"`)
  })
</script>
