<!-- @summary A menu whose submenus open in a panel beside their rows. -->
<!-- @react-native-summary A menu whose submenus open beside their rows on the web. A phone shows each in place of the page, under the way back. -->
<!-- @min 300 -->
<helix-menu
  label="File"
  submenus="flyout"
>
  <helix-button slot="trigger">File</helix-button>

  <helix-menu-item value="new">New file</helix-menu-item>
  <helix-menu-item value="share">
    Share
    <helix-menu-item
      slot="submenu"
      value="mail"
    >Mail</helix-menu-item>
    <helix-menu-item
      slot="submenu"
      value="link"
    >Copy link</helix-menu-item>
  </helix-menu-item>
  <helix-menu-item value="export">
    Export as
    <helix-menu-item
      slot="submenu"
      value="pdf"
    >PDF</helix-menu-item>
    <helix-menu-item
      slot="submenu"
      value="png"
    >PNG</helix-menu-item>
  </helix-menu-item>
</helix-menu>
