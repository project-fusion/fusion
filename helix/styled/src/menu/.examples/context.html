<!-- @summary A context menu that opens where you right-click the field, or press Shift+F10 in it. -->
<!-- @react-native-summary A context menu that a long press on its area opens. The field is drawn on the web only for now, so a phone marks where it goes. -->
<!-- @min 300 -->
<helix-menu
  context
  label="Edit"
>
  <helix-textarea
    default-value="Right-click in this field."
    label="Notes"
    slot="trigger"
  ></helix-textarea>

  <helix-menu-item
    shortcut="mod+x"
    value="cut"
  >Cut</helix-menu-item>
  <helix-menu-item
    shortcut="mod+c"
    value="copy"
  >Copy</helix-menu-item>
  <helix-menu-item
    shortcut="mod+v"
    value="paste"
  >Paste</helix-menu-item>
</helix-menu>
