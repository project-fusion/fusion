<!-- @summary A menu whose rows are grouped under headings, with each command's keyboard shortcut. -->
<!-- @min 300 -->
<helix-menu label="Edit">
  <helix-button slot="trigger">Edit</helix-button>

  <helix-menu-section label="History">
    <helix-menu-item
      shortcut="mod+z"
      value="undo"
    >Undo</helix-menu-item>
    <helix-menu-item
      shortcut="mod+shift+z"
      value="redo"
    >Redo</helix-menu-item>
  </helix-menu-section>

  <helix-divider></helix-divider>

  <helix-menu-section label="Clipboard">
    <helix-menu-item
      shortcut="mod+x"
      value="cut"
    >Cut</helix-menu-item>
    <helix-menu-item
      shortcut="mod+c"
      value="copy"
    >Copy</helix-menu-item>
    <helix-menu-item
      shortcut="mod+v"
      value="paste"
    >Paste</helix-menu-item>
  </helix-menu-section>
</helix-menu>
