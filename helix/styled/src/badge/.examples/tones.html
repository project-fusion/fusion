<!-- @summary A count in each tone, the same tones a tag uses. -->
<!-- @min 520 -->

<!-- `accent` matches `primary` until the theme sets a second color. -->
<helix-flex
  align-items="center"
  gap="lg"
  wrap
>
  <helix-badge
    label="8 unread"
    tone="primary"
    value="8"
  >
    <helix-button>Inbox</helix-button>
  </helix-badge>

  <helix-badge
    label="8 drafts"
    tone="accent"
    value="8"
  >
    <helix-button>Drafts</helix-button>
  </helix-badge>

  <helix-badge
    label="4 updates"
    tone="info"
    value="4"
  >
    <helix-button>Updates</helix-button>
  </helix-badge>

  <helix-badge
    label="12 completed"
    tone="success"
    value="12"
  >
    <helix-button>Completed</helix-button>
  </helix-badge>

  <helix-badge
    label="2 pending"
    tone="warning"
    value="2"
  >
    <helix-button>Pending</helix-button>
  </helix-badge>

  <helix-badge
    label="3 errors"
    tone="danger"
    value="3"
  >
    <helix-button>Errors</helix-button>
  </helix-badge>

  <helix-badge
    label="8 archived"
    tone="neutral"
    value="8"
  >
    <helix-button>Archived</helix-button>
  </helix-badge>
</helix-flex>
