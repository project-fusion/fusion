<!-- @summary A count on three buttons, in the default, neutral, and danger tones, with each count in its button's name. -->
<helix-flex
  align-items="center"
  gap="lg"
>
  <helix-badge value="8">
    <helix-button aria-label="Inbox, 8 unread">Inbox</helix-button>
  </helix-badge>
  <helix-badge
    tone="neutral"
    value="8"
  >
    <helix-button aria-label="Drafts, 8 saved">Drafts</helix-button>
  </helix-badge>
  <helix-badge
    tone="danger"
    value="3"
  >
    <helix-button aria-label="Errors, 3 new">Errors</helix-button>
  </helix-badge>
</helix-flex>
