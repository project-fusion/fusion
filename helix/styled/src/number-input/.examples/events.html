<!-- @summary A step and a keystroke send the same events, and `change` is sent when you finish. -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-number-input
    default-value="3"
    id="guests"
    label="Guests"
    min="1"
  ></helix-number-input>


  <helix-list
    divided
    id="log"
    label="Events"
  >
    <helix-list-item>
      No events yet
      <span slot="description">Use the buttons, or type a number and click away</span>
    </helix-list-item>
  </helix-list>
</helix-flex>

<script type="module">
  const guests = document.getElementById('guests')
  const log = document.getElementById('log')
  let empty = true

  // The log keeps the last six events.
  const KEEP = 6

  const say = (name, carried) => {
    if (empty) {
      log.replaceChildren()
      empty = false
    }
    const row = document.createElement('helix-list-item')
    row.textContent = name
    const under = document.createElement('span')
    under.slot = 'description'
    under.textContent = carried
    row.append(under)
    log.append(row)
    while (log.children.length > KEEP) {
      log.firstElementChild.remove()
    }
  }

  guests.addEventListener('helix-before-change', (event) => {
    say('helix-before-change', `Proposed "${event.detail.value}"`)
  })
  guests.addEventListener('input', (event) => {
    say('input', `Value is ${event.currentTarget.valueAsNumber}`)
  })
  guests.addEventListener('change', (event) => {
    say('change', `Changed to ${event.currentTarget.valueAsNumber}`)
  })
</script>
