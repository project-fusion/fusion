<!-- @summary A step and a keystroke arrive the same way, and the commit is separate from both. -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-number-input
    default-value="3"
    id="it"
    label="Guests"
    min="1"
  ></helix-number-input>


  <helix-list
    divided
    id="log"
    label="What arrived"
  >
    <helix-list-item>
      Nothing yet
      <span slot="supporting">Step it, or type and click away</span>
    </helix-list-item>
  </helix-list>
</helix-flex>

<script type="module">
  const it = document.getElementById('it')
  const log = document.getElementById('log')
  let empty = true

  const say = (name, carried) => {
    if (empty) {
      log.replaceChildren()
      empty = false
    }
    const row = document.createElement('helix-list-item')
    row.textContent = name
    const under = document.createElement('span')
    under.slot = 'supporting'
    under.textContent = carried
    row.append(under)
    log.append(row)
    while (log.children.length > 6) {
      log.firstElementChild.remove()
    }
  }

  it.addEventListener('helix-before-change', (event) => {
    say('helix-before-change', `proposing "${event.detail.value}", refusable`)
  })
  it.addEventListener('input', (event) => {
    say('input', `${event.currentTarget.valueAsNumber} so far`)
  })
  it.addEventListener('change', (event) => {
    say('change', `${event.currentTarget.valueAsNumber}, the reader is done`)
  })
</script>
