<!-- @summary A field with focus, a disabled field, a field disabled by its `fieldset`, a read-only field, a field with a message about its value, and a required field in a form. -->
<helix-flex
  direction="column"
  gap="lg"
>
  <helix-input
    id="email"
    label="Email"
    placeholder="name@example.com"
    type="email"
  ></helix-input>

  <helix-input
    default-value="Cannot be edited"
    disabled
    hint="Only admins can edit this field"
    label="Company name"
  ></helix-input>

  <!-- A disabled `fieldset` disables the fields inside it. -->
  <fieldset disabled>
    <helix-input
      default-value="Also cannot be edited"
      hint="Only admins can edit this field"
      label="Billing email"
    ></helix-input>
  </fieldset>

  <helix-input
    default-value="fsn-3f9c21"
    hint="Ask an owner to change this"
    label="Workspace ID"
    name="workspace"
    readonly
  ></helix-input>

  <helix-input
    default-value="short"
    feedback="Too short"
    hint="At least 12 characters"
    label="Password"
    type="password"
  ></helix-input>

  <!-- The form does not submit in the preview. -->
  <form onsubmit="event.preventDefault()">
    <helix-flex
      direction="column"
      gap="sm"
    >
      <helix-input
        hint="We print this on your invoices"
        label="Full name"
        name="name"
        placeholder="Ada Lovelace"
        required
      ></helix-input>
      <helix-button
        emphasis="solid"
        tone="primary"
        type="submit"
      >Submit</helix-button>
    </helix-flex>
  </form>
</helix-flex>

<script type="module">
  const email = document.getElementById('email')

  await customElements.whenDefined('helix-input')
  await email.updateComplete
  email.focus()
</script>
