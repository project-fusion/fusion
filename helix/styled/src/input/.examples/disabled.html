<!-- @summary A disabled field, and a field disabled by the `fieldset` around it. -->
<helix-flex
  direction="column"
  gap="lg"
>
  <helix-input
    default-value="Cannot be edited"
    disabled
    hint="Only admins can edit this field"
    label="Company name"
  ></helix-input>

  <!-- A disabled `fieldset` disables the fields inside it. -->
  <fieldset disabled>
    <helix-input
      default-value="Also cannot be edited"
      hint="Only admins can edit this field"
      label="Billing email"
    ></helix-input>
  </fieldset>
</helix-flex>
