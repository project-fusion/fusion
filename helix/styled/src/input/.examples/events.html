<!-- @summary Every announcement a text field makes, in the order it makes them. -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-input
    id="field"
    label="Name"
    placeholder="Type, then click away"
  ></helix-input>

  <helix-list
    divided
    id="log"
    label="What arrived"
  >
    <helix-list-item>
      Nothing yet
      <span slot="supporting">Type in the field</span>
    </helix-list-item>
  </helix-list>
</helix-flex>

<script type="module">
  const field = document.getElementById('field')
  const log = document.getElementById('log')
  let empty = true

  // How many rows the log holds, which is a choice about this preview's height.
  const KEEP = 6

  const say = (name, carried) => {
    if (empty) {
      log.replaceChildren()
      empty = false
    }
    const row = document.createElement('helix-list-item')
    row.textContent = name
    const under = document.createElement('span')
    under.slot = 'supporting'
    under.textContent = carried
    row.append(under)
    log.append(row)
    while (log.children.length > KEEP) {
      log.firstElementChild.remove()
    }
  }

  field.addEventListener('helix-before-change', (event) => {
    say('helix-before-change', `proposing "${event.detail.value}", refusable`)
  })
  field.addEventListener('input', (event) => {
    say('input', `"${event.currentTarget.value}" so far`)
  })
  field.addEventListener('change', (event) => {
    say('change', `"${event.currentTarget.value}", the reader is done`)
  })
</script>
