<!-- @summary Every event a text field sends, in the order it sends them. -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-input
    id="field"
    label="Name"
    placeholder="Enter your name"
  ></helix-input>

  <helix-list
    divided
    id="log"
    label="Events"
  >
    <helix-list-item>
      No events yet
      <span slot="description">Type in the field, then click away</span>
    </helix-list-item>
  </helix-list>
</helix-flex>

<script type="module">
  const field = document.getElementById('field')
  const log = document.getElementById('log')
  let empty = true

  // The log keeps the last six events.
  const KEEP = 6

  const say = (name, carried) => {
    if (empty) {
      log.replaceChildren()
      empty = false
    }
    const row = document.createElement('helix-list-item')
    row.textContent = name
    const under = document.createElement('span')
    under.slot = 'description'
    under.textContent = carried
    row.append(under)
    log.append(row)
    while (log.children.length > KEEP) {
      log.firstElementChild.remove()
    }
  }

  field.addEventListener('helix-before-change', (event) => {
    say('helix-before-change', `Proposed "${event.detail.value}"`)
  })
  field.addEventListener('input', (event) => {
    say('input', `Value is "${event.currentTarget.value}"`)
  })
  field.addEventListener('change', (event) => {
    say('change', `Changed to "${event.currentTarget.value}"`)
  })
</script>
