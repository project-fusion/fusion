<!-- @summary A required field, marked on its label, and the browser's message when it is left empty. -->
<!-- The form does not submit in the preview. -->
<form onsubmit="event.preventDefault()">
  <helix-flex
    direction="column"
    gap="sm"
  >
    <helix-input
      hint="We only use this to reply"
      label="Email"
      name="email"
      placeholder="name@example.com"
      required
      type="email"
    ></helix-input>
    <helix-button
      emphasis="solid"
      tone="primary"
      type="submit"
    >Submit</helix-button>
  </helix-flex>
</form>
