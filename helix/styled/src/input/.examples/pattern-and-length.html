<!-- @summary A pattern and length limits on the value, checked by the browser. -->

<!-- The form does not submit in the preview. -->
<form onsubmit="event.preventDefault()">
  <helix-flex
    direction="column"
    gap="md"
  >
    <helix-input
      hint="At least 6 letters or numbers"
      label="Username"
      minlength="6"
      name="handle"
      pattern="[a-zA-Z0-9]+"
      required
    ></helix-input>

    <helix-input
      hint="Up to 140 characters"
      label="Headline"
      maxlength="140"
      name="headline"
    ></helix-input>

    <helix-button type="submit">Save</helix-button>
  </helix-flex>
</form>
