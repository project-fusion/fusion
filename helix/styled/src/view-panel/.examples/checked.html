<!-- @summary The panel opened to Sort, its orders a set of radios with the table's own sort chosen. -->
<link
  href="styles.css"
  rel="stylesheet"
/>

<div class="view-sheet">
  <helix-view-panel
    for="sorted-invoices"
    id="sort-panel"
  ></helix-view-panel>
</div>

<helix-data-table
  default-view='{"sort":"due:asc"}'
  id="sorted-invoices"
  label="Invoices"
  row-key="id"
>
  <helix-table-column
    field="customer"
    row-header
    sortable
  >Customer</helix-table-column>
  <helix-table-column
    field="due"
    sortable
  >Due</helix-table-column>
  <helix-table-column
    field="status"
    type="enum"
  >Status</helix-table-column>
</helix-data-table>

<script type="module">
  document.getElementById('sorted-invoices').rows = [
    { customer: 'Acme Corporation', due: '2026-10-12', id: 'INV-2041', status: 'Overdue' },
    { customer: 'Acme Logistics', due: '2026-10-18', id: 'INV-2047', status: 'Paid' },
    { customer: 'Acme Robotics', due: '2026-10-21', id: 'INV-2052', status: 'Overdue' },
  ]

  const panel = document.getElementById('sort-panel')
  await customElements.whenDefined('helix-view-panel')
  await panel.updateComplete
  panel.openSection('sort')
</script>
