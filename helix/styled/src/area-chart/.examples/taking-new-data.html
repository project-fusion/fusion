<!-- @summary The same bands given different numbers, each moving to its new shape. -->
<!-- @min 300 -->

<helix-flex
  direction="column"
  gap="md"
>
  <table
    data-hidden-visually
    id="sources"
  >
    <caption>Visits a month by source</caption>
    <thead>
      <tr>
        <th scope="col">Month</th>
        <th scope="col">Search</th>
        <th scope="col">Direct</th>
        <th scope="col">Referral</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <th scope="row">Jan</th>
        <td data-value="420">420</td>
        <td data-value="180">180</td>
        <td data-value="90">90</td>
      </tr>
      <tr>
        <th scope="row">Feb</th>
        <td data-value="460">460</td>
        <td data-value="190">190</td>
        <td data-value="95">95</td>
      </tr>
      <tr>
        <th scope="row">Mar</th>
        <td data-value="510">510</td>
        <td data-value="200">200</td>
        <td data-value="110">110</td>
      </tr>
      <tr>
        <th scope="row">Apr</th>
        <td data-value="540">540</td>
        <td data-value="205">205</td>
        <td data-value="120">120</td>
      </tr>
      <tr>
        <th scope="row">May</th>
        <td data-value="600">600</td>
        <td data-value="215">215</td>
        <td data-value="118">118</td>
      </tr>
      <tr>
        <th scope="row">Jun</th>
        <td data-value="650">650</td>
        <td data-value="220">220</td>
        <td data-value="125">125</td>
      </tr>
    </tbody>
  </table>

  <helix-area-chart for="sources"></helix-area-chart>

  <helix-button id="refresh">Refresh data</helix-button>
</helix-flex>

<!-- The script rewrites the numbers in the table. The chart reads the table and
     redraws. -->
<script type="module">
  document.getElementById('refresh').addEventListener('click', () => {
    for (const row of document.querySelectorAll('#sources tbody tr')) {
      const cells = row.querySelectorAll('td')
      const ranges = [[380, 700], [150, 260], [70, 150]]
      cells.forEach((cell, index) => {
        const [low, high] = ranges[index]
        const value = low + Math.round(Math.random() * (high - low))
        cell.dataset.value = String(value)
        cell.textContent = String(value)
      })
    }
  })
</script>
