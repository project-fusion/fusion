<!-- @summary A legend beside the bands, naming them in the order they are stacked and in the colors they are drawn. -->
<!-- @min 300 -->

<helix-flex
  direction="column"
  gap="md"
>
  <table
    data-hidden-visually
    id="areachartkeyed"
  >
    <caption>Support tickets a week by channel</caption>
    <thead>
      <tr>
        <th scope="col">Week</th>
        <th scope="col">Email</th>
        <th scope="col">Chat</th>
        <th scope="col">Phone</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <th scope="row">W1</th>
        <td data-value="140">140</td>
        <td data-value="90">90</td>
        <td data-value="40">40</td>
      </tr>
      <tr>
        <th scope="row">W2</th>
        <td data-value="160">160</td>
        <td data-value="110">110</td>
        <td data-value="45">45</td>
      </tr>
      <tr>
        <th scope="row">W3</th>
        <td data-value="150">150</td>
        <td data-value="140">140</td>
        <td data-value="38">38</td>
      </tr>
      <tr>
        <th scope="row">W4</th>
        <td data-value="180">180</td>
        <td data-value="170">170</td>
        <td data-value="42">42</td>
      </tr>
      <tr>
        <th scope="row">W5</th>
        <td data-value="175">175</td>
        <td data-value="210">210</td>
        <td data-value="36">36</td>
      </tr>
      <tr>
        <th scope="row">W6</th>
        <td data-value="190">190</td>
        <td data-value="250">250</td>
        <td data-value="33">33</td>
      </tr>
    </tbody>
  </table>

  <helix-area-chart for="areachartkeyed"></helix-area-chart>
  <helix-legend for="areachartkeyed"></helix-legend>
</helix-flex>
