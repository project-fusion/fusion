<!-- @summary Every state of a tree's check mark: a branch with all of its items checked, a branch with some, a checked leaf, an unchecked one, and one that cannot be checked. Checking a folder checks everything in it. -->

<helix-tree
  default-active="guide,reference,logo"
  label="Files to export"
  selection-mode="multiple"
>
  <helix-tree-item
    open
    value="docs"
  >
    Docs
    <helix-tree-item
      slot="children"
      value="guide"
    >Guide</helix-tree-item>
    <helix-tree-item
      slot="children"
      value="reference"
    >Reference</helix-tree-item>
  </helix-tree-item>
  <helix-tree-item
    open
    value="assets"
  >
    Assets
    <helix-tree-item
      slot="children"
      value="logo"
    >Logo</helix-tree-item>
    <helix-tree-item
      slot="children"
      value="fonts"
    >Fonts</helix-tree-item>
  </helix-tree-item>
  <helix-tree-item value="changelog">Changelog</helix-tree-item>
  <helix-tree-item
    disabled
    value="archive"
  >Archive</helix-tree-item>
</helix-tree>
