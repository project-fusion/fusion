<!-- @summary Items you move among their siblings by dragging a grip, or with Alt and an arrow key. -->
<helix-tree
  id="chapters"
  label="Chapters"
  reorderable
>
  <helix-tree-item
    open
    value="basics"
  >
    Basics
    <helix-tree-item
      slot="children"
      value="install"
    >
      Install
    </helix-tree-item>
    <helix-tree-item
      slot="children"
      value="first-page"
    >
      Your first page
    </helix-tree-item>
    <helix-tree-item
      slot="children"
      value="theming"
    >
      Theming
    </helix-tree-item>
  </helix-tree-item>
  <helix-tree-item value="forms">Forms</helix-tree-item>
  <helix-tree-item value="deploying">Deploying</helix-tree-item>
</helix-tree>

<script type="module">
  const chapters = document.getElementById('chapters')

  // The tree moves no item itself. Put the moved item and its siblings in the
  // order the event carries.
  chapters.addEventListener('helix-reorder', (event) => {
    const parent = chapters.querySelector(`[value="${event.detail.key}"]`).parentElement
    const items = new Map([...parent.children].map((item) => [item.getAttribute('value'), item]))
    parent.append(...event.detail.keys.map((key) => items.get(key)))
  })
</script>
