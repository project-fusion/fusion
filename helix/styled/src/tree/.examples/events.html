<!-- @summary Choosing bubbles to the tree and opening does not, which is why they are bound apart. -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-tree
    default-active="core"
    id="files"
    label="Packages"
  >
    <helix-tree-item value="helix">
      helix
      <helix-tree-item
        slot="children"
        value="core"
      >core</helix-tree-item>
      <helix-tree-item
        slot="children"
        value="styled"
      >styled</helix-tree-item>
    </helix-tree-item>
    <helix-tree-item value="cortex">cortex</helix-tree-item>
  </helix-tree>


  <helix-list
    divided
    id="log"
    label="What arrived"
  >
    <helix-list-item>
      Nothing yet
      <span slot="supporting">Open a node, then choose one</span>
    </helix-list-item>
  </helix-list>
</helix-flex>

<script type="module">
  const files = document.getElementById('files')
  const log = document.getElementById('log')
  let empty = true

  // How many rows the log holds, which is a choice about this preview's height.
  const KEEP = 8

  const say = (name, carried) => {
    if (empty) {
      log.replaceChildren()
      empty = false
    }
    const row = document.createElement('helix-list-item')
    row.textContent = name
    const under = document.createElement('span')
    under.slot = 'supporting'
    under.textContent = carried
    row.append(under)
    log.append(row)
    while (log.children.length > KEEP) {
      log.firstElementChild.remove()
    }
  }

  /* Two bindings and not one, because the two halves travel differently.
     `helix-select` and `helix-before-activate` bubble and are composed, so the
     tree hears them from any depth; the open and close of a node do not, so a
     listener here would never run and each node has to be asked itself. */
  files.addEventListener('helix-before-activate', (event) => {
    say('helix-before-activate', `proposing "${event.detail.value}", refusable`)
  })
  files.addEventListener('helix-select', (event) => {
    say('helix-select', `"${event.detail.value}" was chosen, from whatever depth`)
  })

  for (const node of files.querySelectorAll('helix-tree-item')) {
    node.addEventListener('helix-before-open', () => {
      say('helix-before-open', `${node.value} is about to open, and this does not bubble`)
    })
    node.addEventListener('helix-before-close', () => {
      say('helix-before-close', `${node.value} is about to close, and nor does this`)
    })
    node.addEventListener('toggle', (event) => {
      say('toggle', `${node.value} went ${event.oldState} to ${event.newState}`)
    })
  }
</script>
