<!-- @summary `helix-select` bubbles to the tree and the open and close events do not, so each has its own listener. -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-tree
    default-active="core"
    id="files"
    label="Folders"
  >
    <helix-tree-item value="helix">
      Projects
      <helix-tree-item
        slot="children"
        value="core"
      >Website</helix-tree-item>
      <helix-tree-item
        slot="children"
        value="styled"
      >Mobile app</helix-tree-item>
    </helix-tree-item>
    <helix-tree-item value="cortex">Archive</helix-tree-item>
  </helix-tree>


  <helix-list
    divided
    id="log"
    label="Events"
  >
    <helix-list-item>
      No events yet
      <span slot="description">Open a node, then choose one</span>
    </helix-list-item>
  </helix-list>
</helix-flex>

<script type="module">
  const files = document.getElementById('files')
  const log = document.getElementById('log')
  let empty = true

  // The log keeps this many of the most recent rows.
  const KEEP = 8

  const say = (name, carried) => {
    if (empty) {
      log.replaceChildren()
      empty = false
    }
    const row = document.createElement('helix-list-item')
    row.textContent = name
    const under = document.createElement('span')
    under.slot = 'description'
    under.textContent = carried
    row.append(under)
    log.append(row)
    while (log.children.length > KEEP) {
      log.firstElementChild.remove()
    }
  }

  /* `helix-select` and `helix-before-activate` bubble, so one listener on the
     tree hears them. The open and close events do not bubble, so each node has
     its own listeners. */
  files.addEventListener('helix-before-activate', (event) => {
    say('helix-before-activate', `about to change to "${event.detail.value}", can be canceled`)
  })
  files.addEventListener('helix-select', (event) => {
    say('helix-select', `"${event.detail.value}" was chosen, and the event bubbles`)
  })

  for (const node of files.querySelectorAll('helix-tree-item')) {
    node.addEventListener('helix-before-open', () => {
      say('helix-before-open', `${node.value} is about to open, and the event does not bubble`)
    })
    node.addEventListener('helix-before-close', () => {
      say('helix-before-close', `${node.value} is about to close, and the event does not bubble`)
    })
    node.addEventListener('toggle', (event) => {
      say('toggle', `${node.value} went ${event.oldState} to ${event.newState}`)
    })
  }
</script>
