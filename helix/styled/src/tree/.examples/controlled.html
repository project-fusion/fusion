<!-- @summary A tree whose current node is set by your code, as a router needs. -->

<helix-tree
  active="engram"
  id="packages"
  label="Mailboxes"
>
  <helix-tree-item value="core">Inbox</helix-tree-item>
  <helix-tree-item value="engram">Drafts</helix-tree-item>
  <helix-tree-item value="trace">Sent</helix-tree-item>
</helix-tree>

<script>
  const packages = document.getElementById('packages')

  packages.addEventListener('helix-before-activate', (event) => {
    packages.active = event.detail.value
  })
</script>
