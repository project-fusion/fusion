<!-- @summary The events a speed dial sends as it opens, as an action is chosen, and as it closes. -->
<link
  href="styles.css"
  rel="stylesheet"
>
<helix-flex
  direction="column"
  gap="md"
>
  <div class="stage">
    <helix-speed-dial
      data-dock="bottom-end"
      data-dock-within
      id="dial"
      label="Actions"
    >
      <helix-speed-dial-item value="new">
        New file
        <helix-icon
          name="plus"
          slot="icon"
        ></helix-icon>
      </helix-speed-dial-item>
      <helix-speed-dial-item value="upload">
        Upload file
        <helix-icon
          name="upload-simple"
          slot="icon"
        ></helix-icon>
      </helix-speed-dial-item>
    </helix-speed-dial>
  </div>


  <helix-list
    divided
    id="log"
    label="Events"
  >
    <helix-list-item>
      No events yet
      <span slot="description">Open the dial, then choose an action</span>
    </helix-list-item>
  </helix-list>
</helix-flex>

<script type="module">
  const dial = document.getElementById('dial')
  const log = document.getElementById('log')
  let empty = true

  // The log keeps this many of the most recent rows.
  const KEEP = 7

  const say = (name, carried) => {
    if (empty) {
      log.replaceChildren()
      empty = false
    }
    const row = document.createElement('helix-list-item')
    row.textContent = name
    const under = document.createElement('span')
    under.slot = 'description'
    under.textContent = carried
    row.append(under)
    log.append(row)
    while (log.children.length > KEEP) {
      log.firstElementChild.remove()
    }
  }

  dial.addEventListener('helix-before-open', () => {
    say('helix-before-open', 'about to open, can be canceled')
  })
  dial.addEventListener('helix-before-close', () => {
    say('helix-before-close', 'about to close, can be canceled')
  })
  dial.addEventListener('toggle', (event) => {
    say('toggle', `${event.oldState} to ${event.newState}, after the state moved`)
  })
  dial.addEventListener('helix-select', (event) => {
    say('helix-select', `"${event.detail.value}" was chosen, and the event bubbles`)
  })
</script>
