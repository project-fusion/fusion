<!-- @summary A group with `separation` set to `outlined`, which frames the track with a border. -->
<helix-toggle-group
  default-value="one"
  hint="Hint"
  label="Label"
  separation="outlined"
>
  <helix-toggle value="one">Option One</helix-toggle>
  <helix-toggle value="two">Option Two</helix-toggle>
  <helix-toggle value="three">Option Three</helix-toggle>
</helix-toggle-group>
