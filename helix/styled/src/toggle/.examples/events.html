<!-- @summary Buttons where one stays pressed, which fire the same events as a form value. -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-toggle-group
    id="density"
    label="Density"
  >
    <helix-toggle value="sm">Compact</helix-toggle>
    <helix-toggle value="md">Default</helix-toggle>
    <helix-toggle value="lg">Comfortable</helix-toggle>
  </helix-toggle-group>


  <helix-list
    divided
    id="log"
    label="Events"
  >
    <helix-list-item>
      No events yet
      <span slot="description">Press one option, then another</span>
    </helix-list-item>
  </helix-list>
</helix-flex>

<script type="module">
  const density = document.getElementById('density')
  const log = document.getElementById('log')
  let empty = true

  // The log keeps this many of the most recent rows.
  const KEEP = 6

  const say = (name, carried) => {
    if (empty) {
      log.replaceChildren()
      empty = false
    }
    const row = document.createElement('helix-list-item')
    row.textContent = name
    const under = document.createElement('span')
    under.slot = 'description'
    under.textContent = carried
    row.append(under)
    log.append(row)
    while (log.children.length > KEEP) {
      log.firstElementChild.remove()
    }
  }

  density.addEventListener('helix-before-change', (event) => {
    say('helix-before-change', `about to change to "${event.detail.value}", can be canceled`)
  })
  density.addEventListener('input', (event) => {
    say('input', `"${event.currentTarget.value}", sent once for the group`)
  })
  density.addEventListener('change', (event) => {
    say('change', `"${event.currentTarget.value}", sent when the value is committed`)
  })
  density.addEventListener('helix-select', (event) => {
    say('helix-select', `"${event.detail.value}" was pressed`)
  })
</script>
