<!-- @summary Filters where any number can be chosen at once, set with `selection-mode`. -->
<helix-toggle-group
  label="Status"
  name="status"
  selection-mode="multiple"
  value="open"
>
  <helix-toggle value="open">Open</helix-toggle>
  <helix-toggle value="review">In review</helix-toggle>
  <helix-toggle value="closed">Closed</helix-toggle>
</helix-toggle-group>
