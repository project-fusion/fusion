<!-- @summary Each emphasis in the neutral, primary, and danger tones, and a disabled icon button. -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-flex gap="sm">
    <helix-icon-button label="Copy">
      <helix-icon name="copy"></helix-icon>
    </helix-icon-button>
    <helix-icon-button
      label="Confirm"
      tone="primary"
    >
      <helix-icon name="check"></helix-icon>
    </helix-icon-button>
    <helix-icon-button
      label="Delete"
      tone="danger"
    >
      <helix-icon name="trash"></helix-icon>
    </helix-icon-button>
  </helix-flex>

  <helix-flex gap="sm">
    <helix-icon-button
      emphasis="solid"
      label="Copy"
    >
      <helix-icon name="copy"></helix-icon>
    </helix-icon-button>
    <helix-icon-button
      emphasis="solid"
      label="Confirm"
      tone="primary"
    >
      <helix-icon name="check"></helix-icon>
    </helix-icon-button>
    <helix-icon-button
      emphasis="solid"
      label="Delete"
      tone="danger"
    >
      <helix-icon name="trash"></helix-icon>
    </helix-icon-button>
  </helix-flex>

  <helix-flex gap="sm">
    <helix-icon-button
      emphasis="subtle"
      label="Copy"
    >
      <helix-icon name="copy"></helix-icon>
    </helix-icon-button>
    <helix-icon-button
      emphasis="subtle"
      label="Confirm"
      tone="primary"
    >
      <helix-icon name="check"></helix-icon>
    </helix-icon-button>
    <helix-icon-button
      emphasis="subtle"
      label="Delete"
      tone="danger"
    >
      <helix-icon name="trash"></helix-icon>
    </helix-icon-button>
  </helix-flex>

  <helix-flex gap="sm">
    <helix-icon-button
      emphasis="outlined"
      label="Copy"
    >
      <helix-icon name="copy"></helix-icon>
    </helix-icon-button>
    <helix-icon-button
      emphasis="outlined"
      label="Confirm"
      tone="primary"
    >
      <helix-icon name="check"></helix-icon>
    </helix-icon-button>
    <helix-icon-button
      emphasis="outlined"
      label="Delete"
      tone="danger"
    >
      <helix-icon name="trash"></helix-icon>
    </helix-icon-button>
  </helix-flex>

  <helix-icon-button
    disabled
    label="Close"
  >
    <helix-icon name="x"></helix-icon>
  </helix-icon-button>
</helix-flex>
