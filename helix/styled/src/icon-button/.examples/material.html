<!-- @summary Raised icon buttons over a striped background, one with no material and one each in `glass`, `frosted`, and `transparent`. -->
<link
  href="styles.css"
  rel="stylesheet"
>

<div class="band">
  <helix-icon-button
    label="Zoom in"
    raised
  >
    <helix-icon name="plus"></helix-icon>
  </helix-icon-button>

  <helix-icon-button
    label="Zoom out"
    material="glass"
    raised
  >
    <helix-icon name="minus"></helix-icon>
  </helix-icon-button>

  <helix-icon-button
    label="Layers"
    material="frosted"
    raised
  >
    <helix-icon name="stack"></helix-icon>
  </helix-icon-button>

  <helix-icon-button
    label="Full screen"
    material="transparent"
    raised
  >
    <helix-icon name="corners-out"></helix-icon>
  </helix-icon-button>
</div>
