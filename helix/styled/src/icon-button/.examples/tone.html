<!-- @summary Each tone at the resting emphasis and at `solid`. -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-flex
    gap="sm"
    wrap
  >
    <helix-icon-button
      label="Copy"
      tone="neutral"
    >
      <helix-icon name="copy"></helix-icon>
    </helix-icon-button>
    <helix-icon-button
      label="Confirm"
      tone="primary"
    >
      <helix-icon name="check"></helix-icon>
    </helix-icon-button>
    <helix-icon-button
      label="Share"
      tone="accent"
    >
      <helix-icon name="share-network"></helix-icon>
    </helix-icon-button>
    <helix-icon-button
      label="Delete"
      tone="danger"
    >
      <helix-icon name="trash"></helix-icon>
    </helix-icon-button>
    <helix-icon-button
      label="Details"
      tone="info"
    >
      <helix-icon name="info"></helix-icon>
    </helix-icon-button>
    <helix-icon-button
      label="Approve"
      tone="success"
    >
      <helix-icon name="check-circle"></helix-icon>
    </helix-icon-button>
    <helix-icon-button
      label="Report"
      tone="warning"
    >
      <helix-icon name="warning"></helix-icon>
    </helix-icon-button>
  </helix-flex>

  <helix-flex
    gap="sm"
    wrap
  >
    <helix-icon-button
      emphasis="solid"
      label="Copy"
      tone="neutral"
    >
      <helix-icon name="copy"></helix-icon>
    </helix-icon-button>
    <helix-icon-button
      emphasis="solid"
      label="Confirm"
      tone="primary"
    >
      <helix-icon name="check"></helix-icon>
    </helix-icon-button>
    <helix-icon-button
      emphasis="solid"
      label="Share"
      tone="accent"
    >
      <helix-icon name="share-network"></helix-icon>
    </helix-icon-button>
    <helix-icon-button
      emphasis="solid"
      label="Delete"
      tone="danger"
    >
      <helix-icon name="trash"></helix-icon>
    </helix-icon-button>
    <helix-icon-button
      emphasis="solid"
      label="Details"
      tone="info"
    >
      <helix-icon name="info"></helix-icon>
    </helix-icon-button>
    <helix-icon-button
      emphasis="solid"
      label="Approve"
      tone="success"
    >
      <helix-icon name="check-circle"></helix-icon>
    </helix-icon-button>
    <helix-icon-button
      emphasis="solid"
      label="Report"
      tone="warning"
    >
      <helix-icon name="warning"></helix-icon>
    </helix-icon-button>
  </helix-flex>
</helix-flex>
