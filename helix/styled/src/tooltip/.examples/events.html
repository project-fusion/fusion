<!-- @summary The events a tooltip sends when it opens on hover or on focus. -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-button
    aria-describedby="hint"
    id="events-deploy"
  >Publish page</helix-button>
  <helix-tooltip
    content="Make the page visible to everyone"
    for="events-deploy"
    id="hint"
  ></helix-tooltip>


  <helix-list
    divided
    id="log"
    label="Events"
  >
    <helix-list-item>
      No events yet
      <span slot="description">Hover the button, then tab to it</span>
    </helix-list-item>
  </helix-list>
</helix-flex>

<script type="module">
  const hint = document.getElementById('hint')
  const log = document.getElementById('log')
  let empty = true

  // The log keeps this many of the most recent rows.
  const KEEP = 6

  const say = (name, carried) => {
    if (empty) {
      log.replaceChildren()
      empty = false
    }
    const row = document.createElement('helix-list-item')
    row.textContent = name
    const under = document.createElement('span')
    under.slot = 'description'
    under.textContent = carried
    row.append(under)
    log.append(row)
    while (log.children.length > KEEP) {
      log.firstElementChild.remove()
    }
  }

  hint.addEventListener('helix-before-open', () => {
    say('helix-before-open', 'about to open, can be canceled')
  })
  hint.addEventListener('helix-before-close', () => {
    say('helix-before-close', 'about to close, can be canceled')
  })
  hint.addEventListener('toggle', (event) => {
    say('toggle', `${event.oldState} to ${event.newState}, after the state moved`)
  })
</script>
