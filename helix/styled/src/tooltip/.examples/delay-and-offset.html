<!-- @summary The delay before the bubble appears, the delay before it hides, and its distance from the trigger. -->

<helix-flex
  align-items="center"
  gap="lg"
  wrap
>
  <helix-button
    aria-describedby="timing-eager-tip"
    id="timing-eager"
  >Eager</helix-button>
  <helix-tooltip
    content="Opens at once, and forgives a wobble"
    delay="0"
    delay-out="600"
    for="timing-eager"
    id="timing-eager-tip"
  ></helix-tooltip>

  <helix-button
    aria-describedby="timing-patient-tip"
    id="timing-patient"
  >Patient</helix-button>
  <helix-tooltip
    content="Waits, so a sweep across the row shows nothing"
    delay="700"
    for="timing-patient"
    id="timing-patient-tip"
  ></helix-tooltip>

  <helix-button
    aria-describedby="timing-roomy-tip"
    id="timing-roomy"
  >Roomy</helix-button>
  <helix-tooltip
    content="Further off, for a trigger with its own outline"
    for="timing-roomy"
    id="timing-roomy-tip"
    offset="16"
  ></helix-tooltip>
</helix-flex>
