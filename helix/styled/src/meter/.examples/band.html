<!-- @summary A temperature in its good band, one above it, and the same high reading set to poor with `band`. -->
<helix-flex
  direction="column"
  gap="lg"
>
  <helix-meter
    high="25"
    label="Temperature"
    low="15"
    optimum="20"
    show-value
    value="22"
  ></helix-meter>
  <helix-meter
    high="25"
    label="Temperature"
    low="15"
    optimum="20"
    show-value
    value="34"
  ></helix-meter>
  <helix-meter
    band="poor"
    high="25"
    label="Temperature"
    low="15"
    optimum="20"
    show-value
    value="34"
  ></helix-meter>
</helix-flex>
