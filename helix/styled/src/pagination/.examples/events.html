<!-- @summary Paging sends `helix-navigate` with the page it is going to, because it changes the view and chooses nothing. -->
<!-- @layout hug -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-pagination
    default-page="4"
    id="pages"
    pages="12"
  ></helix-pagination>


  <helix-list
    divided
    id="log"
    label="What arrived"
  >
    <helix-list-item>
      Nothing yet
      <span slot="description">Move between pages</span>
    </helix-list-item>
  </helix-list>
</helix-flex>

<script type="module">
  const pages = document.getElementById('pages')
  const log = document.getElementById('log')
  let empty = true

  // How many rows the log holds, which is a choice about this preview's height.
  const KEEP = 6

  const say = (name, carried) => {
    if (empty) {
      log.replaceChildren()
      empty = false
    }
    const row = document.createElement('helix-list-item')
    row.textContent = name
    const under = document.createElement('span')
    under.slot = 'description'
    under.textContent = carried
    row.append(under)
    log.append(row)
    while (log.children.length > KEEP) {
      log.firstElementChild.remove()
    }
  }

  /* One event, and it is the request: refusing it is the only way to keep
     the page where it is. There is no `helix-before-change` here, because the
     page is not a value a form holds. */
  pages.addEventListener('helix-navigate', (event) => {
    say('helix-navigate', `page ${event.detail.value}, a move and not a choice, and refusable`)
  })
</script>
