<!-- @summary Paging sends `helix-navigate` with the page it is going to, because it changes the view and chooses nothing. -->
<!-- @layout hug -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-pagination
    default-page="4"
    id="pages"
    pages="12"
  ></helix-pagination>


  <helix-list
    divided
    id="log"
    label="Events"
  >
    <helix-list-item>
      No events yet
      <span slot="description">Move between pages</span>
    </helix-list-item>
  </helix-list>
</helix-flex>

<script type="module">
  const pages = document.getElementById('pages')
  const log = document.getElementById('log')
  let empty = true

  // The log keeps the last six events.
  const KEEP = 6

  const say = (name, carried) => {
    if (empty) {
      log.replaceChildren()
      empty = false
    }
    const row = document.createElement('helix-list-item')
    row.textContent = name
    const under = document.createElement('span')
    under.slot = 'description'
    under.textContent = carried
    row.append(under)
    log.append(row)
    while (log.children.length > KEEP) {
      log.firstElementChild.remove()
    }
  }

  /* `helix-navigate` is the only event. Cancel it to stay on the current page. */
  pages.addEventListener('helix-navigate', (event) => {
    say('helix-navigate', `Go to page ${event.detail.value}`)
  })
</script>
