<!-- @summary How many page numbers show on each side of the current page. -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-pagination
    boundaries="0"
    default-page="24"
    pages="50"
    siblings="0"
  ></helix-pagination>
  <helix-pagination
    default-page="24"
    pages="50"
  ></helix-pagination>
  <helix-pagination
    boundaries="2"
    default-page="24"
    pages="50"
    siblings="3"
  ></helix-pagination>
</helix-flex>
