<!-- @summary Your own controls, with a count of the current stop. -->
<link
  href="styles.css"
  rel="stylesheet"
>
<div class="bar">
  <helix-button
    emphasis="solid"
    id="compose"
    tone="primary"
  >Compose</helix-button>
  <helix-button
    emphasis="outlined"
    id="filter"
  >Filter</helix-button>
  <helix-icon-button
    id="refresh"
    label="Refresh"
  >
    <helix-icon name="arrow-clockwise"></helix-icon>
  </helix-icon-button>
</div>

<helix-button id="begin">Take the tour</helix-button>

<helix-tour
  id="tour"
  label="Inbox tour"
>
  <helix-tour-stop
    for="compose"
    placement="bottom-start"
  >
    <helix-text as="h3">Write a message</helix-text>
    <helix-text emphasis="muted">Start a new email.</helix-text>
    <helix-flex
      align-items="center"
      gap="xs"
      slot="actions"
    >
      <helix-text
        class="count"
        emphasis="subtle"
        variant="caption"
      ></helix-text>
      <helix-button
        class="on"
        emphasis="solid"
        tone="primary"
      >Next</helix-button>
    </helix-flex>
  </helix-tour-stop>

  <helix-tour-stop
    for="filter"
    placement="bottom"
  >
    <helix-text as="h3">Filter your inbox</helix-text>
    <helix-text emphasis="muted">Show only unread, flagged, or starred messages.</helix-text>
    <helix-flex
      align-items="center"
      gap="xs"
      slot="actions"
    >
      <helix-text
        class="count"
        emphasis="subtle"
        variant="caption"
      ></helix-text>
      <helix-button
        class="off"
        emphasis="ghost"
      >Back</helix-button>
      <helix-button
        class="on"
        emphasis="solid"
        tone="primary"
      >Next</helix-button>
    </helix-flex>
  </helix-tour-stop>

  <helix-tour-stop
    for="refresh"
    placement="bottom-end"
  >
    <helix-text as="h3">Refresh your inbox</helix-text>
    <helix-text emphasis="muted">Check for new messages.</helix-text>
    <helix-flex
      align-items="center"
      gap="xs"
      slot="actions"
    >
      <helix-text
        class="count"
        emphasis="subtle"
        variant="caption"
      ></helix-text>
      <helix-button
        class="off"
        emphasis="ghost"
      >Back</helix-button>
      <helix-button
        class="on"
        emphasis="solid"
        tone="primary"
      >Got it</helix-button>
    </helix-flex>
  </helix-tour-stop>
</helix-tour>

<script type="module">
  /* Controls in the `actions` slot replace the ones the stop draws, so they call
     `next()` and `back()` themselves. The count uses `index` and `length`. */
  const tour = document.querySelector('#tour')
  const label = () => {
    for (const one of tour.querySelectorAll('.count')) {
      one.textContent = `${tour.index + 1} of ${tour.length}`
    }
  }

  tour.addEventListener('click', (event) => {
    const on = event.target.closest?.('.on')
    const off = event.target.closest?.('.off')
    if (on) {
      tour.next()
    } else if (off) {
      tour.back()
    }
  })

  tour.addEventListener('helix-before-activate', (event) => {
    tour.index = Number(event.detail.value)
    label()
  })

  document.querySelector('#begin').addEventListener('click', () => {
    tour.index = 0
    tour.open = true
    label()
  })
</script>
