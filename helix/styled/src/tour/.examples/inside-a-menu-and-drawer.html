<!-- @summary A path that opens a menu and a drawer to point at what is inside them. -->
<link
  href="styles.css"
  rel="stylesheet"
>
<div class="bar">
  <helix-menu
    id="actions"
    label="Actions"
  >
    <helix-button
      id="actions-trigger"
      slot="trigger"
    >Actions</helix-button>
    <helix-menu-item value="duplicate">Duplicate</helix-menu-item>
    <helix-menu-item
      id="export"
      value="export"
    >Export</helix-menu-item>
    <helix-menu-item value="delete">Delete</helix-menu-item>
  </helix-menu>

  <helix-button
    command="--show"
    commandfor="settings"
    emphasis="outlined"
  >Settings</helix-button>
</div>

<helix-drawer
  id="settings"
  label="Settings"
  placement="end"
>
  <helix-flex
    direction="column"
    gap="md"
  >
    <helix-switch id="autosave">Autosave</helix-switch>
    <helix-switch>Send me a weekly digest</helix-switch>
  </helix-flex>
</helix-drawer>

<helix-button id="begin">Take the tour</helix-button>

<helix-tour
  id="tour"
  label="Getting started"
>
  <helix-tour-stop
    for="actions-trigger"
    placement="bottom-start"
  >
    <helix-card separation="plain">
      <helix-text as="h3">File actions</helix-text>
      <helix-text emphasis="muted">Duplicate, export, or delete the file.</helix-text>
    </helix-card>
  </helix-tour-stop>

  <helix-tour-stop
    for="export"
    placement="right"
  >
    <helix-card separation="plain">
      <helix-text as="h3">Export a file</helix-text>
      <helix-text emphasis="muted">Download the file as a PDF or a spreadsheet.</helix-text>
    </helix-card>
  </helix-tour-stop>

  <helix-tour-stop
    for="autosave"
    placement="left"
  >
    <helix-card separation="plain">
      <helix-text as="h3">Autosave is on</helix-text>
      <helix-text emphasis="muted">Your changes are saved as you work.</helix-text>
    </helix-card>
  </helix-tour-stop>
</helix-tour>

<script type="module">
  /* Stop two is inside the menu and stop three is inside the drawer.
     `arrange` sets what is open for each index, so it stays correct when the
     tour goes backward. */
  const tour = document.querySelector('#tour')
  const menu = document.querySelector('#actions')
  const drawer = document.querySelector('#settings')

  /* A modal drawer makes the rest of the page inert, so the tour could not
     reach it. `modal` is a boolean attribute that defaults to true, so set the
     property to `false`. */
  drawer.modal = false

  const arrange = (index) => {
    menu.open = index === 1
    drawer.open = index === 2
  }

  document.querySelector('#begin').addEventListener('click', () => {
    tour.index = 0
    arrange(0)
    tour.open = true
  })

  tour.addEventListener('helix-before-activate', (event) => {
    const index = Number(event.detail.value)
    tour.index = index
    arrange(index)
  })

  /* Leaving puts the page back the way it was found. */
  const shut = () => {
    menu.open = false
    drawer.open = false
  }
  tour.addEventListener('helix-before-close', shut)
  tour.addEventListener('helix-complete', shut)
</script>
