<!-- @summary A stop asks to move, the tour decides, and finishing fires a different event from leaving. -->
<link
  href="styles.css"
  rel="stylesheet"
>
<!-- @min 420 -->
<helix-flex
  direction="column"
  gap="md"
>
  <div class="stage">
    <helix-button id="anchor">Create project</helix-button>
  </div>

  <helix-tour
    id="run"
    open
  >
    <helix-tour-stop for="anchor">
      Create a project to get started.
    </helix-tour-stop>
    <helix-tour-stop for="anchor">
      Name the project and invite your team.
    </helix-tour-stop>
  </helix-tour>


  <helix-list
    divided
    id="log"
    label="Events"
  >
    <helix-list-item>
      No events yet
      <span slot="description">Go through the tour, then skip it</span>
    </helix-list-item>
  </helix-list>
</helix-flex>

<script type="module">
  const run = document.getElementById('run')
  const log = document.getElementById('log')
  let empty = true

  // The log keeps this many of the most recent rows.
  const KEEP = 8

  const say = (name, carried) => {
    if (empty) {
      log.replaceChildren()
      empty = false
    }
    const row = document.createElement('helix-list-item')
    row.textContent = name
    const under = document.createElement('span')
    under.slot = 'description'
    under.textContent = carried
    row.append(under)
    log.append(row)
    while (log.children.length > KEEP) {
      log.firstElementChild.remove()
    }
  }

  run.addEventListener('helix-tour-ask', (event) => {
    say('helix-tour-ask', `a stop requested ${event.detail.what}`)
  })
  run.addEventListener('helix-before-activate', (event) => {
    say('helix-before-activate', `about to change to stop ${event.detail.value}, can be canceled`)
  })
  run.addEventListener('helix-before-close', () => {
    say('helix-before-close', 'closing early, can be canceled')
  })
  run.addEventListener('helix-complete', () => {
    say('helix-complete', 'the tour was finished, cannot be canceled')
  })
</script>
