<!-- @summary A field that grows to six lines and scrolls past them. -->
<helix-code-input
  label="Custom styles"
  language="css"
  max-rows="6"
  value=".banner {
  background: var(--helix-color-surface-raised);
  border-radius: var(--helix-radii-md);
  padding: var(--helix-space-md);
}

.banner h2 {
  font-size: var(--helix-text-lg);
  margin: 0;
}"
></helix-code-input>
