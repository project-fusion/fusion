<!-- @summary The chevron before the summary, so nested sections read as a tree. -->

<helix-accordion>
  <helix-accordion-item
    chevron-placement="start"
    default-open
  >
    <helix-text slot="summary">Delivery</helix-text>
    Orders arrive in two to four business days.
  </helix-accordion-item>
  <helix-accordion-item chevron-placement="start">
    <helix-text slot="summary">Returns</helix-text>
    Return unopened items within 30 days.
  </helix-accordion-item>
</helix-accordion>
