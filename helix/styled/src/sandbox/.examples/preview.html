<!-- @summary Source beside a preview, with a toolbar over both and a status bar under them. -->

<helix-sandbox>
  <helix-sandbox-toolbar slot="toolbar">
    <helix-tag>index.html</helix-tag>
    <helix-button
      emphasis="ghost"
      slot="end"
    >Reset code</helix-button>
  </helix-sandbox-toolbar>

  <helix-sandbox-source
    name="html"
    slot="source"
    value="&lt;helix-button emphasis=&quot;solid&quot; tone=&quot;primary&quot;&gt;Save&lt;/helix-button&gt;"
  ></helix-sandbox-source>

  <!-- The preview here is a plain element. `Sandbox.Preview` renders an
       iframe, which needs a document to load. -->
  <div slot="preview">
    <helix-button
      emphasis="solid"
      tone="primary"
    >Save</helix-button>
  </div>

  <helix-sandbox-status-bar slot="status">
    <helix-text variant="caption">HTML</helix-text>
  </helix-sandbox-status-bar>
</helix-sandbox>
