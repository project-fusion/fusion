<!-- @summary The preview first, stacked above the source pane, which takes the smaller share. -->

<link
  href="styles.css"
  rel="stylesheet"
>

<div class="stage">
  <!-- `split` sets where the panes open. `default-split` is where a double
       click on the divider puts them back. -->
  <helix-sandbox
    default-split="60"
    lead="preview"
    orientation="vertical"
    split="60"
  >
    <helix-sandbox-toolbar slot="toolbar">
      <helix-tag>card.html</helix-tag>
    </helix-sandbox-toolbar>

    <!-- The preview here is a plain element. `Sandbox.Preview` renders an
         iframe, which needs a document to load. -->
    <div slot="preview">
      <helix-card>
        <h3>Quarterly review</h3>
        <p>Due on September 9.</p>
      </helix-card>
    </div>

    <helix-sandbox-source
      field-label="Markup"
      name="html"
      slot="source"
      tab-indents
      value="&lt;helix-card&gt;&lt;h3&gt;Quarterly review&lt;/h3&gt;&lt;/helix-card&gt;"
    ></helix-sandbox-source>

    <helix-sandbox-status-bar
      column="18"
      language="HTML"
      line="1"
      slot="status"
    ></helix-sandbox-status-bar>
  </helix-sandbox>
</div>
