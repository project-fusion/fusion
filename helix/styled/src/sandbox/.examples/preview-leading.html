<!-- @summary The preview leading, stacked, with the source pane taking the smaller share. -->

<link
  href="styles.css"
  rel="stylesheet"
>

<div class="stage">
  <!-- `split` and not `default-split` alone, which is only where a double click
       puts it back to: the panes open at the component default until the live
       property says otherwise, and the share this example is about would show
       up for the first time on a reset. `sized-panes` is where the pair is the
       subject. -->
  <helix-sandbox
    default-split="60"
    lead="preview"
    orientation="vertical"
    split="60"
  >
    <helix-sandbox-toolbar slot="toolbar">
      <helix-tag>card.html</helix-tag>
    </helix-sandbox-toolbar>

    <!-- A plain element, not `Sandbox.Preview`. The preview renders an iframe
         and an example has no document to point one at. -->
    <div slot="preview">
      <helix-card>
        <h3>Quarterly review</h3>
        <p>Due on the ninth.</p>
      </helix-card>
    </div>

    <helix-sandbox-source
      field-label="Markup"
      name="html"
      slot="source"
      tab-indents
      value="&lt;helix-card&gt;&lt;h3&gt;Quarterly review&lt;/h3&gt;&lt;/helix-card&gt;"
    ></helix-sandbox-source>

    <helix-sandbox-status-bar
      column="18"
      language="HTML"
      line="1"
      slot="status"
    ></helix-sandbox-status-bar>
  </helix-sandbox>
</div>
