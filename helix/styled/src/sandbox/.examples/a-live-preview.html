<!-- @summary The preview frame, which runs its source inside a sandboxed document. -->

<link
  href="styles.css"
  rel="stylesheet"
>

<div class="stage">
  <helix-sandbox>
    <helix-sandbox-source
      name="html"
      slot="source"
      value="&lt;p&gt;Edited here, drawn beside it.&lt;/p&gt;"
    ></helix-sandbox-source>

    <!-- The frame runs with `allow-scripts` and without `allow-same-origin`, so
         code in it cannot reach your page. `src` is the document the frame
         loads and `styles` is the CSS it adds. The sandbox hands it the source
         pane's value as the code it runs. -->
    <helix-sandbox-preview
      label="Live preview"
      layout="padded"
      slot="preview"
      src="/sandbox/frame.html"
      styles="p { font: inherit }"
    ></helix-sandbox-preview>
  </helix-sandbox>
</div>
