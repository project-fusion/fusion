<!-- @summary The events for an edit, a cursor move, two dividers, and a console log. -->
<!-- @min 420 -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-sandbox id="pad">
    <helix-sandbox-source
      name="html"
      slot="source"
      value="<p>Hello</p>"
    ></helix-sandbox-source>
    <helix-sandbox-preview slot="preview"></helix-sandbox-preview>
    <helix-sandbox-terminal slot="panel"></helix-sandbox-terminal>
  </helix-sandbox>

  <helix-list
    divided
    id="log"
    label="Events"
  >
    <helix-list-item>No events yet<span slot="description">Type in the source, then drag either divider</span>
    </helix-list-item>
  </helix-list>
</helix-flex>

<script type="module">
  const pad = document.getElementById('pad')
  const log = document.getElementById('log')
  let empty = true

  // The log keeps the last seven events.
  const KEEP = 7

  const say = (name, carried) => {
    if (empty) {
      log.replaceChildren()
      empty = false
    }
    const row = document.createElement('helix-list-item')
    row.textContent = name
    const under = document.createElement('span')
    under.slot = 'description'
    under.textContent = carried
    row.append(under)
    log.append(row)
    while (log.children.length > KEEP) {
      log.firstElementChild.remove()
    }
  }

  pad.addEventListener('helix-before-edit', (event) => {
    say('helix-before-edit', `Source is ${event.detail.value.length} characters`)
  })
  pad.addEventListener('helix-caret', (event) => {
    say('helix-caret', `line ${event.detail.line}, column ${event.detail.column}`)
  })
  pad.addEventListener('helix-before-split', (event) => {
    say('helix-before-split', `Split at ${event.detail.value} percent`)
  })
  pad.addEventListener('helix-before-panel-resize', (event) => {
    say('helix-before-panel-resize', `Panel is ${event.detail.value} pixels`)
  })
  pad.addEventListener('helix-resize', (event) => {
    say('helix-resize', `Preview is ${event.detail.size} pixels`)
  })
  pad.addEventListener('helix-console', (event) => {
    say('helix-console', `${event.detail.level}: ${event.detail.text}`)
  })
</script>
