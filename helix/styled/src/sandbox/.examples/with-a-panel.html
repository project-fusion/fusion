<!-- @summary A third pane under both, sized and collapsible, with every separator named. -->

<link
  href="styles.css"
  rel="stylesheet"
>

<div class="stage">
  <!-- `panel-size` beside `default-panel-size`, because the panel opens at the
       first and goes back to the second on a double click. Stated alone, the
       120 below was where a reset put the panel and never where it started, so
       the panel this example calls sized opened at the component's own 160. -->
  <helix-sandbox
    corner-label="Resize both"
    default-panel-size="120"
    panel-collapsed-size="36"
    panel-label="Files"
    panel-size="120"
    separator-label="Resize the source pane"
  >
    <helix-sandbox-toolbar slot="toolbar">
      <helix-tag>index.html</helix-tag>
    </helix-sandbox-toolbar>

    <helix-tree
      label="Files"
      slot="panel"
    >
      <helix-tree-item value="index">index.html</helix-tree-item>
      <helix-tree-item value="styles">styles.css</helix-tree-item>
    </helix-tree>

    <helix-sandbox-source
      name="html"
      slot="source"
      value="&lt;helix-button&gt;Save&lt;/helix-button&gt;"
    ></helix-sandbox-source>

    <div slot="preview">
      <helix-button
        emphasis="solid"
        tone="primary"
      >Save</helix-button
      >
    </div>
  </helix-sandbox>
</div>
