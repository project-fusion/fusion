<!-- @summary A drawer from each of the four edges. -->
<helix-flex gap="sm">
  <helix-button
    command="--show"
    commandfor="start-drawer"
  >
    Start
  </helix-button>
  <helix-button
    command="--show"
    commandfor="end-drawer"
  >
    End
  </helix-button>
  <helix-button
    command="--show"
    commandfor="top-drawer"
  >
    Top
  </helix-button>
  <helix-button
    command="--show"
    commandfor="bottom-drawer"
  >
    Bottom
  </helix-button>
</helix-flex>

<helix-drawer
  id="start-drawer"
  label="Menu"
  placement="start"
>
  <span slot="header">Menu</span>
  <helix-text variant="body">
    Browse your projects, files, and settings.
  </helix-text>
</helix-drawer>

<helix-drawer
  id="end-drawer"
  label="Details"
  placement="end"
>
  <span slot="header">Details</span>
  <helix-text variant="body">
    Review the details of the selected file.
  </helix-text>
</helix-drawer>

<helix-drawer
  id="top-drawer"
  label="Search"
  placement="top"
>
  <span slot="header">Search</span>
  <helix-text variant="body">
    Search projects, files, and people.
  </helix-text>
</helix-drawer>

<helix-drawer
  id="bottom-drawer"
  label="Share"
  placement="bottom"
>
  <span slot="header">Share</span>
  <helix-text variant="body">
    Share a link to the project with your team.
  </helix-text>
</helix-drawer>
