<!-- @summary The four events a drawer sends: `helix-before-open`, `helix-before-close`, `toggle`, and the native `close`. -->
<!-- @min 420 -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-button
    command="--show"
    commandfor="panel"
    emphasis="solid"
    tone="primary"
  >Open drawer</helix-button>

  <helix-drawer
    id="panel"
    label="Filters"
  >
    <helix-text>Filter the list by status, owner, and date.</helix-text>
    <helix-button
      command="--close"
      commandfor="panel"
    >Done</helix-button>
  </helix-drawer>


  <helix-list
    divided
    id="log"
    label="Events"
  >
    <helix-list-item>
      No events yet
      <span slot="description">Open the drawer, then close it</span>
    </helix-list-item>
  </helix-list>
</helix-flex>

<script type="module">
  const panel = document.getElementById('panel')
  const log = document.getElementById('log')
  let empty = true

  // The log keeps the last six events.
  const KEEP = 6

  const say = (name, carried) => {
    if (empty) {
      log.replaceChildren()
      empty = false
    }
    const row = document.createElement('helix-list-item')
    row.textContent = name
    const under = document.createElement('span')
    under.slot = 'description'
    under.textContent = carried
    row.append(under)
    log.append(row)
    while (log.children.length > KEEP) {
      log.firstElementChild.remove()
    }
  }

  panel.addEventListener('helix-before-open', () => {
    say('helix-before-open', 'About to open')
  })
  panel.addEventListener('helix-before-close', () => {
    say('helix-before-close', 'About to close')
  })
  panel.addEventListener('toggle', (event) => {
    say('toggle', `Changed from ${event.oldState} to ${event.newState}`)
  })
  panel.addEventListener('close', () => {
    say('close', 'Closed')
  })
</script>
