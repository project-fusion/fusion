<!-- @summary A sheet holding a list that scrolls, which hands its drag to the sheet once it stands at its top. -->
<helix-drawer
  default-open
  label="Recent files"
  placement="bottom"
  snap-points="0.5 1"
>
  <span slot="header">Recent files</span>
  <helix-list label="Recent files">
    <helix-list-item>Quarterly report</helix-list-item>
    <helix-list-item>Launch plan</helix-list-item>
    <helix-list-item>Hiring tracker</helix-list-item>
    <helix-list-item>Brand guidelines</helix-list-item>
    <helix-list-item>Budget for next year</helix-list-item>
    <helix-list-item>Customer interviews</helix-list-item>
    <helix-list-item>Release notes</helix-list-item>
    <helix-list-item>Team offsite</helix-list-item>
    <helix-list-item>Support playbook</helix-list-item>
    <helix-list-item>Pricing study</helix-list-item>
    <helix-list-item>Roadmap</helix-list-item>
    <helix-list-item>Onboarding checklist</helix-list-item>
  </helix-list>
</helix-drawer>
