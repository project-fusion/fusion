<!-- @summary A panel beside the page rather than over it, with the page still usable behind it. -->

<helix-drawer
  default-open
  label="Filters"
  modal="false"
>
  <helix-flex
    direction="column"
    gap="sm"
  >
    <helix-checkbox>Open</helix-checkbox>
    <helix-checkbox>In review</helix-checkbox>
    <helix-checkbox>Closed</helix-checkbox>
  </helix-flex>
</helix-drawer>
