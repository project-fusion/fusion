<!-- @summary A typed date and a date picked from the calendar fire the same events. -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-date-input
    id="starts"
    label="Starts"
    name="starts"
  ></helix-date-input>


  <helix-list
    divided
    id="log"
    label="Events"
  >
    <helix-list-item>
      No events yet
      <span slot="description">Type a date or open the calendar</span>
    </helix-list-item>
  </helix-list>
</helix-flex>

<script type="module">
  const starts = document.getElementById('starts')
  const log = document.getElementById('log')
  let empty = true

  // The log keeps the last eight events.
  const KEEP = 8

  const say = (name, carried) => {
    if (empty) {
      log.replaceChildren()
      empty = false
    }
    const row = document.createElement('helix-list-item')
    row.textContent = name
    const under = document.createElement('span')
    under.slot = 'description'
    under.textContent = carried
    row.append(under)
    log.append(row)
    while (log.children.length > KEEP) {
      log.firstElementChild.remove()
    }
  }

  starts.addEventListener('helix-before-open', () => {
    say('helix-before-open', 'About to open')
  })
  starts.addEventListener('helix-before-close', () => {
    say('helix-before-close', 'About to close')
  })
  starts.addEventListener('toggle', (event) => {
    say('toggle', `Changed from ${event.oldState} to ${event.newState}`)
  })
  starts.addEventListener('helix-before-change', (event) => {
    say('helix-before-change', `Proposed "${event.detail.value}"`)
  })
  starts.addEventListener('input', (event) => {
    say('input', `Value is "${event.currentTarget.value}"`)
  })
  starts.addEventListener('change', (event) => {
    say('change', `Chose "${event.currentTarget.value}"`)
  })
</script>
