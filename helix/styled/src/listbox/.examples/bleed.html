<!-- @summary A listbox with `bleed`: its words stay on the field's column, and the fill under a pointer or the keyboard is a rounded inset around them. -->
<helix-listbox
  bleed
  default-value="two"
  label="Notifications"
>
  <helix-option value="one">Email</helix-option>
  <helix-option value="two">Text message</helix-option>
  <helix-option value="three">Push notification</helix-option>
</helix-listbox>
