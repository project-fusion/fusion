<!-- @summary A required list, which must have an option chosen before the form submits. -->
<!-- Preview frame: the submit is swallowed. -->
<form onsubmit="event.preventDefault()">
  <helix-flex
    direction="column"
    gap="sm"
  >
    <helix-listbox
      hint="What they will be able to do"
      label="Role"
      name="role"
      required
    >
      <helix-option value="viewer">Viewer</helix-option>
      <helix-option value="editor">Editor</helix-option>
    </helix-listbox>
    <helix-button
      emphasis="solid"
      tone="primary"
      type="submit"
    >Invite</helix-button>
  </helix-flex>
</form>
