<!-- @summary Filtering sends `helix-filter`, and choosing an option sends `helix-before-change`, `input`, and `change`. -->
<!-- @min 300 -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-listbox
    filterable
    id="regions"
    label="Region"
    name="region"
  >
    <helix-option value="lhr">London</helix-option>
    <helix-option value="fra">Frankfurt</helix-option>
    <helix-option value="iad">Virginia</helix-option>
  </helix-listbox>


  <helix-list
    divided
    id="log"
    label="Events"
  >
    <helix-list-item>
      No events yet
      <span slot="description">Type to filter, then choose a region</span>
    </helix-list-item>
  </helix-list>
</helix-flex>

<script type="module">
  const regions = document.getElementById('regions')
  const log = document.getElementById('log')
  let empty = true

  // The log keeps the last six events.
  const KEEP = 6

  const say = (name, carried) => {
    if (empty) {
      log.replaceChildren()
      empty = false
    }
    const row = document.createElement('helix-list-item')
    row.textContent = name
    const under = document.createElement('span')
    under.slot = 'description'
    under.textContent = carried
    row.append(under)
    log.append(row)
    while (log.children.length > KEEP) {
      log.firstElementChild.remove()
    }
  }

  regions.addEventListener('helix-before-change', (event) => {
    say('helix-before-change', `Proposed "${event.detail.value}"`)
  })
  regions.addEventListener('input', (event) => {
    say('input', `Value is "${event.currentTarget.value}"`)
  })
  regions.addEventListener('change', (event) => {
    say('change', `Chose "${event.currentTarget.value}"`)
  })
  regions.addEventListener('helix-filter', (event) => {
    say('helix-filter', `Filter text is "${event.detail.value}"`)
  })
</script>
