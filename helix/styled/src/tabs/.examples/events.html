<!-- @summary An event sent before the active tab changes, and one tab your code blocks by canceling that event. -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-tabs
    default-active="usage"
    id="strip"
    label="Account"
  >
    <helix-tab value="usage">Usage</helix-tab>
    <helix-tab value="billing">Billing</helix-tab>
    <helix-tab value="danger">Danger</helix-tab>
    <helix-tab-panel
      slot="panels"
      value="usage"
    >Requests, storage and egress.</helix-tab-panel>
    <helix-tab-panel
      slot="panels"
      value="billing"
    >Invoices and the card on file.</helix-tab-panel>
    <helix-tab-panel
      slot="panels"
      value="danger"
    >Nothing reaches here.</helix-tab-panel>
  </helix-tabs>

  <helix-list
    divided
    id="log"
    label="What arrived"
  >
    <helix-list-item>
      Nothing yet
      <span slot="description">Move between the tabs</span>
    </helix-list-item>
  </helix-list>
</helix-flex>

<script type="module">
  const strip = document.getElementById('strip')
  const log = document.getElementById('log')
  let empty = true

  // How many rows the log holds, which is a choice about this preview's height.
  const KEEP = 6

  const say = (name, carried) => {
    if (empty) {
      log.replaceChildren()
      empty = false
    }
    const row = document.createElement('helix-list-item')
    row.textContent = name
    const under = document.createElement('span')
    under.slot = 'description'
    under.textContent = carried
    row.append(under)
    log.append(row)
    while (log.children.length > KEEP) {
      log.firstElementChild.remove()
    }
  }

  strip.addEventListener('helix-before-activate', (event) => {
    if (event.detail.value === 'danger') {
      event.preventDefault()
      say('helix-before-activate', 'refused, so the strip did not move')
      return
    }
    say('helix-before-activate', `moving to "${event.detail.value}"`)
  })
  strip.addEventListener('helix-select', (event) => {
    say('helix-select', `"${event.detail.value}" was chosen, which a container can catch`)
  })
</script>
