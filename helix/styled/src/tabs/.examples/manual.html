<!-- @summary Arrow keys move between tabs without opening them, so you can look before choosing. -->

<helix-tabs
  default-active="overview"
  manual
>
  <helix-tab value="overview">Overview</helix-tab>
  <helix-tab value="usage">Usage</helix-tab>
  <helix-tab value="billing">Billing</helix-tab>

  <helix-tab-panel
    slot="panels"
    value="overview"
  >What the account is doing this month.</helix-tab-panel>
  <helix-tab-panel
    slot="panels"
    value="usage"
  >Requests, storage and egress.</helix-tab-panel>
  <helix-tab-panel
    slot="panels"
    value="billing"
  >Invoices and the payment method on file.</helix-tab-panel>
</helix-tabs>
