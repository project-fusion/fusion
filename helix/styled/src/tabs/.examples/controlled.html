<!-- @summary A strip the page owns, answering the event and assigning `active`. -->

<helix-tabs
  active="usage"
  id="strip"
>
  <helix-tab value="overview">Overview</helix-tab>
  <helix-tab value="usage">Usage</helix-tab>

  <helix-tab-panel
    slot="panels"
    value="overview"
  >What the account is doing.</helix-tab-panel>
  <helix-tab-panel
    slot="panels"
    value="usage"
  >Requests, storage and egress.</helix-tab-panel>
</helix-tabs>

<script>
  const strip = document.getElementById('strip')

  strip.addEventListener('helix-before-activate', (event) => {
    strip.active = event.detail.value
  })
</script>
