<!-- @summary Tabs controlled by your code, which handles the event and sets `active`. -->

<helix-tabs
  active="usage"
  id="strip"
>
  <helix-tab value="overview">Overview</helix-tab>
  <helix-tab value="usage">Usage</helix-tab>

  <helix-tab-panel
    slot="panels"
    value="overview"
  >A summary of your account activity.</helix-tab-panel>
  <helix-tab-panel
    slot="panels"
    value="usage"
  >Requests, storage, and bandwidth.</helix-tab-panel>
</helix-tabs>

<script>
  const strip = document.getElementById('strip')

  strip.addEventListener('helix-before-activate', (event) => {
    strip.active = event.detail.value
  })
</script>
