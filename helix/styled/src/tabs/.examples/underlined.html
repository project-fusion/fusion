<!-- @summary A rule under the active tab rather than a filled one. -->
<helix-tabs
  default-active="one"
  label="Label"
  variant="underlined"
>
  <helix-tabs-tab value="one">Tab One</helix-tabs-tab>
  <helix-tabs-tab value="two">Tab Two</helix-tabs-tab>
  <helix-tabs-panel
    slot="panels"
    value="one"
  >
    Lorem ipsum dolor sit amet, consectetur adipiscing elit.
  </helix-tabs-panel>
  <helix-tabs-panel
    slot="panels"
    value="two"
  >
    Lorem ipsum dolor sit amet, consectetur adipiscing elit.
  </helix-tabs-panel>
</helix-tabs>
