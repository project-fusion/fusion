<!-- @summary Panels behind tabs, with a mark that travels between them. -->
<helix-tabs
  default-active="one"
  label="Label"
>
  <helix-tab value="one">Tab One</helix-tab>
  <helix-tab value="two">Tab Two</helix-tab>
  <helix-tab-panel
    slot="panels"
    value="one"
  >
    Lorem ipsum dolor sit amet, consectetur adipiscing elit.
  </helix-tab-panel>
  <helix-tab-panel
    slot="panels"
    value="two"
  >
    Lorem ipsum dolor sit amet, consectetur adipiscing elit.
  </helix-tab-panel>
</helix-tabs>
