<!-- @summary Each tone at the resting emphasis and at `solid`. -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-flex
    gap="sm"
    wrap
  >
    <helix-copy-button
      tone="neutral"
      value="bun add @fusion.dev/helix"
    ></helix-copy-button>
    <helix-copy-button
      tone="primary"
      value="bun add @fusion.dev/helix"
    ></helix-copy-button>
    <helix-copy-button
      tone="accent"
      value="bun add @fusion.dev/helix"
    ></helix-copy-button>
    <helix-copy-button
      tone="danger"
      value="bun add @fusion.dev/helix"
    ></helix-copy-button>
    <helix-copy-button
      tone="info"
      value="bun add @fusion.dev/helix"
    ></helix-copy-button>
    <helix-copy-button
      tone="success"
      value="bun add @fusion.dev/helix"
    ></helix-copy-button>
    <helix-copy-button
      tone="warning"
      value="bun add @fusion.dev/helix"
    ></helix-copy-button>
  </helix-flex>

  <helix-flex
    gap="sm"
    wrap
  >
    <helix-copy-button
      emphasis="solid"
      tone="neutral"
      value="bun add @fusion.dev/helix"
    ></helix-copy-button>
    <helix-copy-button
      emphasis="solid"
      tone="primary"
      value="bun add @fusion.dev/helix"
    ></helix-copy-button>
    <helix-copy-button
      emphasis="solid"
      tone="accent"
      value="bun add @fusion.dev/helix"
    ></helix-copy-button>
    <helix-copy-button
      emphasis="solid"
      tone="danger"
      value="bun add @fusion.dev/helix"
    ></helix-copy-button>
    <helix-copy-button
      emphasis="solid"
      tone="info"
      value="bun add @fusion.dev/helix"
    ></helix-copy-button>
    <helix-copy-button
      emphasis="solid"
      tone="success"
      value="bun add @fusion.dev/helix"
    ></helix-copy-button>
    <helix-copy-button
      emphasis="solid"
      tone="warning"
      value="bun add @fusion.dev/helix"
    ></helix-copy-button>
  </helix-flex>
</helix-flex>
