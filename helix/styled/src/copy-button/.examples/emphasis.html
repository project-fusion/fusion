<!-- @summary Each emphasis in the neutral, primary, and danger tones. -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-flex gap="sm">
    <helix-copy-button value="bun add @fusion.dev/helix"></helix-copy-button>
    <helix-copy-button
      tone="primary"
      value="bun add @fusion.dev/helix"
    ></helix-copy-button>
    <helix-copy-button
      tone="danger"
      value="bun add @fusion.dev/helix"

  <helix-flex gap="sm">

      emphasis="solid"
      value="bun add @fusion.dev/helix"

      emphasis="solid"

      emphasis="solid"

  <helix-flex gap="sm">
    <helix-copy-button
      emphasis="subtle"
      value="bun add @fusion.dev/helix"
    ></helix-copy-button>

      emphasis="subtle"
      tone="primary"
      value="bun add @fusion.dev/helix"
    ></helix-copy-button>
    <helix-copy-button
      emphasis="subtle"
      tone="danger"
      value="bun add @fusion.dev/helix"
    ></helix-copy-button>
  </helix-flex>

  <helix-flex gap="sm">
    <helix-copy-button
      emphasis="outlined"
      value="bun add @fusion.dev/helix"
    ></helix-copy-button>
    <helix-copy-button
      emphasis="outlined"
      tone="primary"
      value="bun add @fusion.dev/helix"
    ></helix-copy-button>
    <helix-copy-button
      emphasis="outlined"
      tone="danger"
      value="bun add @fusion.dev/helix"
    ></helix-copy-button>
  </helix-flex>
</helix-flex>
