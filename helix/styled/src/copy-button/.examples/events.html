<!-- @summary The `helix-copy` event, sent after the text is on the clipboard. -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-copy-button
    id="copier"
    value="bun add @fusion.dev/helix"
  ></helix-copy-button>


  <helix-list
    divided
    id="log"
    label="Events"
  >
    <helix-list-item>
      No events yet
      <span slot="description">Press the button</span>
    </helix-list-item>
  </helix-list>
</helix-flex>

<script type="module">
  const copier = document.getElementById('copier')
  const log = document.getElementById('log')
  let empty = true

  // The log keeps the last six events.
  const KEEP = 6

  const say = (name, carried) => {
    if (empty) {
      log.replaceChildren()
      empty = false
    }
    const row = document.createElement('helix-list-item')
    row.textContent = name
    const under = document.createElement('span')
    under.slot = 'description'
    under.textContent = carried
    row.append(under)
    log.append(row)
    while (log.children.length > KEEP) {
      log.firstElementChild.remove()
    }
  }

  copier.addEventListener('helix-copy', (event) => {
    say('helix-copy', `Copied "${event.detail.value}"`)
  })
</script>
