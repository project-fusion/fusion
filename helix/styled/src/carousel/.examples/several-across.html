<!-- @summary More than one slide in view, for a shelf of cards, and a shelf that moves three at a time with one indicator for each stop. -->
<helix-flex
  direction="column"
  gap="lg"
>
  <helix-carousel
    label="Folders"
    per-view="3"
  >
    <helix-card separation="outlined">Reports</helix-card>
    <helix-card separation="outlined">Invoices</helix-card>
    <helix-card separation="outlined">Contracts</helix-card>
    <helix-card separation="outlined">Receipts</helix-card>
    <helix-card separation="outlined">Proposals</helix-card>
  </helix-carousel>

  <helix-carousel
    label="Shared folders"
    per-view="3"
    slides-per-move="3"
  >
    <helix-card separation="outlined">Reports</helix-card>
    <helix-card separation="outlined">Invoices</helix-card>
    <helix-card separation="outlined">Contracts</helix-card>
    <helix-card separation="outlined">Receipts</helix-card>
    <helix-card separation="outlined">Proposals</helix-card>
    <helix-card separation="outlined">Statements</helix-card>
    <helix-card separation="outlined">Budgets</helix-card>
  </helix-carousel>
</helix-flex>
