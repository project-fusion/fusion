<!-- @summary The indicators moved to each of the places they can sit. -->
<helix-flex
  direction="column"
  gap="xl"
>
  <helix-carousel
    indicator-placement="top"
    label="Above"
  >
  <helix-callout tone="info">Slide One</helix-callout>
  <helix-callout tone="success">Slide Two</helix-callout>
  <helix-callout tone="warning">Slide Three</helix-callout>
  </helix-carousel>

  <helix-carousel
    indicator-placement="start"
    label="Beside, near"
  >
  <helix-callout tone="info">Slide One</helix-callout>
  <helix-callout tone="success">Slide Two</helix-callout>
  <helix-callout tone="warning">Slide Three</helix-callout>
  </helix-carousel>

  <helix-carousel
    indicator-placement="end"
    label="Beside, far"
  >
  <helix-callout tone="info">Slide One</helix-callout>
  <helix-callout tone="success">Slide Two</helix-callout>
  <helix-callout tone="warning">Slide Three</helix-callout>
  </helix-carousel>
</helix-flex>
