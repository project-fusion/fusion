<!-- @summary A controlled carousel, with the slide in view set by your own code. -->

<helix-carousel
  id="reel"
  index="1"
  label="Screens"
>
  <div>First</div>
  <div>Second</div>
  <div>Third</div>
</helix-carousel>

<script>
  const reel = document.getElementById('reel')

  reel.addEventListener('helix-select', (event) => {
    reel.index = Number(event.detail.value)
  })
</script>
