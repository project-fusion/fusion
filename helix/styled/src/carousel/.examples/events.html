<!-- @summary The slide in view, announced as it changes and not as it is dragged. -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-carousel
    id="slides"
    label="Screens"
  >
    <helix-card separation="outlined">Overview</helix-card>
    <helix-card separation="outlined">Usage</helix-card>
    <helix-card separation="outlined">Billing</helix-card>
  </helix-carousel>


  <helix-list
    divided
    id="log"
    label="What arrived"
  >
    <helix-list-item>
      Nothing yet
      <span slot="supporting">Move between the slides</span>
    </helix-list-item>
  </helix-list>
</helix-flex>

<script type="module">
  const slides = document.getElementById('slides')
  const log = document.getElementById('log')
  let empty = true

  // How many rows the log holds, which is a choice about this preview's height.
  const KEEP = 6

  const say = (name, carried) => {
    if (empty) {
      log.replaceChildren()
      empty = false
    }
    const row = document.createElement('helix-list-item')
    row.textContent = name
    const under = document.createElement('span')
    under.slot = 'supporting'
    under.textContent = carried
    row.append(under)
    log.append(row)
    while (log.children.length > KEEP) {
      log.firstElementChild.remove()
    }
  }

  slides.addEventListener('helix-select', (event) => {
    say('helix-select', `slide ${event.detail.value} is the one in view`)
  })
</script>
