<!-- @summary The slide in view, reported each time it changes, with nothing sent during a drag. -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-carousel
    id="slides"
    label="Dashboard pages"
  >
    <helix-card separation="outlined">Overview</helix-card>
    <helix-card separation="outlined">Usage</helix-card>
    <helix-card separation="outlined">Billing</helix-card>
  </helix-carousel>


  <helix-list
    divided
    id="log"
    label="Events"
  >
    <helix-list-item>
      No events yet
      <span slot="description">Move between the slides</span>
    </helix-list-item>
  </helix-list>
</helix-flex>

<script type="module">
  const slides = document.getElementById('slides')
  const log = document.getElementById('log')
  let empty = true

  // The number of rows the log keeps.
  const KEEP = 6

  const say = (name, carried) => {
    if (empty) {
      log.replaceChildren()
      empty = false
    }
    const row = document.createElement('helix-list-item')
    row.textContent = name
    const under = document.createElement('span')
    under.slot = 'description'
    under.textContent = carried
    row.append(under)
    log.append(row)
    while (log.children.length > KEEP) {
      log.firstElementChild.remove()
    }
  }

  slides.addEventListener('helix-select', (event) => {
    say('helix-select', `Slide ${event.detail.value} is in view`)
  })
</script>
