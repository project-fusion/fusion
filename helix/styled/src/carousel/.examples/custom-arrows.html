<!-- @summary Arrows of your own on the previous and next controls, and a track a mouse can drag from slide to slide. -->
<helix-carousel
  label="Folders"
  mouse-drag
>
  <helix-card separation="outlined">Reports</helix-card>
  <helix-card separation="outlined">Invoices</helix-card>
  <helix-card separation="outlined">Contracts</helix-card>
  <helix-icon
    name="arrow-left"
    slot="previous-icon"
  ></helix-icon>
  <helix-icon
    name="arrow-right"
    slot="next-icon"
  ></helix-icon>
</helix-carousel>
