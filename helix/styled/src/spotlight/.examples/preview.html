<!-- @summary A soft light follows the mouse across each plan and lights the edge nearest it. -->
<helix-grid
  columns="3"
  gap="sm"
>
  <helix-spotlight>
    <helix-card separation="outlined">
      <helix-text
        as="h3"
        scale="title"
        slot="header"
      >Free</helix-text>
      One workspace and a week of history.
    </helix-card>
  </helix-spotlight>
  <helix-spotlight>
    <helix-card separation="outlined">
      <helix-text
        as="h3"
        scale="title"
        slot="header"
      >Pro</helix-text>
      Unlimited workspaces, shared memory, and a year of history.
    </helix-card>
  </helix-spotlight>
  <helix-spotlight>
    <helix-card separation="outlined">
      <helix-text
        as="h3"
        scale="title"
        slot="header"
      >Team</helix-text>
      Everything in Pro, with roles, audit logs, and single sign-on.
    </helix-card>
  </helix-spotlight>
</helix-grid>
