<!-- @summary Rises and falls judged as good and bad, in all four combinations. -->
<link
  href="styles.css"
  rel="stylesheet"
>

<helix-flex
  gap="xl"
  wrap
>
  <helix-trend
    good="up"
    movement="up"
  >
    12.4%
    <span slot="label">Revenue</span>
  </helix-trend>
  <helix-trend
    good="down"
    movement="down"
  >
    0.4pt
    <span slot="label">Churn</span>
  </helix-trend>
  <helix-trend
    good="up"
    movement="down"
  >
    0.6pt
    <span slot="label">Conversion</span>
  </helix-trend>
  <helix-trend
    good="down"
    movement="up"
  >
    40ms
    <span slot="label">Response time</span>
  </helix-trend>
  <helix-trend movement="neutral">
    0
    <span slot="label">Open incidents</span>
  </helix-trend>
</helix-flex>
