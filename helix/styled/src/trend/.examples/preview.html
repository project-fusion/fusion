<!-- @summary All four ways a movement can land, two of them down. -->
<link
  href="styles.css"
  rel="stylesheet"
>

<helix-flex
  gap="xl"
  wrap
>
  <helix-trend
    direction="up"
    good="up"
  >
    12.4%
    <span slot="label">Revenue</span>
  </helix-trend>
  <helix-trend
    direction="down"
    good="down"
  >
    0.4pt
    <span slot="label">Churn</span>
  </helix-trend>
  <helix-trend
    direction="down"
    good="up"
  >
    0.6pt
    <span slot="label">Conversion</span>
  </helix-trend>
  <helix-trend
    direction="up"
    good="down"
  >
    40ms
    <span slot="label">p99 latency</span>
  </helix-trend>
  <helix-trend direction="neutral">
    0
    <span slot="label">Open incidents</span>
  </helix-trend>
</helix-flex>
