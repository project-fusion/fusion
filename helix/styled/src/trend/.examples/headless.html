<!-- @summary The same trend on the headless tier, with every rule written by hand. -->

<link
  href="styles.css"
  rel="stylesheet"
/>

<div class="row">
  <div class="stack">
    <helix-headless-stat>
      $48.2k
      <span slot="label">Revenue</span>
    </helix-headless-stat>
    <helix-headless-trend
      direction="up"
      good="up"
    >
      12.4%
      <span slot="label">month over month</span>
    </helix-headless-trend>
  </div>
  <div class="stack">
    <helix-headless-stat>
      2.1
      <span slot="label">Churn</span>
      <span slot="unit">%</span>
    </helix-headless-stat>
    <helix-headless-trend
      direction="down"
      good="down"
    >
      0.4pt
      <span slot="label">month over month</span>
    </helix-headless-trend>
  </div>
  <div class="stack">
    <helix-headless-stat>
      3.8
      <span slot="label">Conversion</span>
      <span slot="unit">%</span>
    </helix-headless-stat>
    <helix-headless-trend
      direction="down"
      good="up"
    >
      0.6pt
      <span slot="label">month over month</span>
    </helix-headless-trend>
  </div>
  <div class="stack">
    <helix-headless-stat>
      212
      <span slot="label">p99 latency</span>
      <span slot="unit">ms</span>
    </helix-headless-stat>
    <helix-headless-trend
      direction="up"
      good="down"
    >
      40ms
      <span slot="label">week over week</span>
    </helix-headless-trend>
  </div>
  <div class="stack">
    <helix-headless-stat>
      3
      <span slot="label">Open incidents</span>
    </helix-headless-stat>
    <helix-headless-trend direction="neutral">
      0
      <span slot="label">since Friday</span>
    </helix-headless-trend>
  </div>
</div>
