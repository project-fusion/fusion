<!-- @summary A block drawn by a highlighter of your own, whose copy is still the code as written. -->
<helix-code-block
  id="highlighted"
  label="save.ts"
>const save = document.querySelector('helix-button')
save?.addEventListener('click', () => console.log('Saved'))</helix-code-block>

<script type="module">
  const block = document.getElementById('highlighted')

  // A stand-in for Shiki or Prism: it escapes the code and sets the keywords in bold.
  const KEYWORDS = /\b(const|let|function|return|import|from)\b/g

  block.highlight = (code) =>
    code
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(KEYWORDS, '<b>$1</b>')
</script>
