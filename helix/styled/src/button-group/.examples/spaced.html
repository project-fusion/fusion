<!-- @summary Three buttons in a group with space between them, set with `layout`. -->
<helix-button-group
  label="Record actions"
  layout="spaced"
>
  <helix-button
    emphasis="solid"
    tone="primary"
  >Save</helix-button>
  <helix-button>Duplicate</helix-button>
  <helix-button emphasis="ghost">Cancel</helix-button>
</helix-button-group>
