<!-- @summary Button groups at the `sm`, `md`, and `lg` sizes. -->
<helix-flex
  align-items="start"
  direction="column"
  gap="md"
>
  <helix-button-group
    label="Calendar view"
    size="sm"
  >
    <helix-button>Day</helix-button>
    <helix-button>Week</helix-button>
    <helix-button>Month</helix-button>
  </helix-button-group>

  <helix-button-group
    label="Calendar view"
    size="md"
  >
    <helix-button>Day</helix-button>
    <helix-button>Week</helix-button>
    <helix-button>Month</helix-button>
  </helix-button-group>

  <helix-button-group
    label="Calendar view"
    size="lg"
  >
    <helix-button>Day</helix-button>
    <helix-button>Week</helix-button>
    <helix-button>Month</helix-button>
  </helix-button-group>
</helix-flex>
