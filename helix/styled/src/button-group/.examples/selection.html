<!-- @summary Text styles that stay pressed, any number at once, set with `selection-mode`. -->
<helix-button-group
  label="Text style"
  selection-mode="multiple"
  value="bold"
>
  <helix-button value="bold">Bold</helix-button>
  <helix-button value="italic">Italic</helix-button>
  <helix-button value="underline">Underline</helix-button>
</helix-button-group>
