<!-- @summary A group switched off as a whole with `disabled`, which disables every button in it. -->
<helix-button-group
  disabled
  label="Calendar view"
  selection-mode="single"
  value="week"
>
  <helix-button value="day">Day</helix-button>
  <helix-button value="week">Week</helix-button>
  <helix-button value="month">Month</helix-button>
</helix-button-group>
