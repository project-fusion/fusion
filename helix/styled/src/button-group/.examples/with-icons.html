<!-- @summary Two buttons, each with an arrow icon beside its label. -->
<helix-button-group label="Page navigation">
  <helix-button>
    <helix-icon
      mirror
      name="arrow-left"
      slot="start"
    ></helix-icon>
    Back
  </helix-button>
  <helix-button>
    Forward
    <helix-icon
      mirror
      name="arrow-right"
      slot="end"
    ></helix-icon>
  </helix-button>
</helix-button-group>
