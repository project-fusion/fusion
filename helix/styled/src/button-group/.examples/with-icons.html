<!-- @summary A group of icon buttons, laid out like a toolbar. -->
<helix-button-group label="Label">
  <helix-button>
    <helix-icon
      mirror
      name="arrow-left"
      slot="start"
    ></helix-icon>
    Back
  </helix-button>
  <helix-button>
    Forward
    <helix-icon
      mirror
      name="arrow-right"
      slot="end"
    ></helix-icon>
  </helix-button>
</helix-button-group>
