<!-- @summary Switching sends `helix-before-toggle`, `input`, and `change`. -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-switch
    id="setting"
    label="Automatic updates"
    name="autodeploy"
  ></helix-switch>


  <helix-list
    divided
    id="log"
    label="Events"
  >
    <helix-list-item>
      No events yet
      <span slot="description">Flip the switch</span>
    </helix-list-item>
  </helix-list>
</helix-flex>

<script type="module">
  const setting = document.getElementById('setting')
  const log = document.getElementById('log')
  let empty = true

  // The log keeps this many of the most recent rows.
  const KEEP = 6

  const say = (name, carried) => {
    if (empty) {
      log.replaceChildren()
      empty = false
    }
    const row = document.createElement('helix-list-item')
    row.textContent = name
    const under = document.createElement('span')
    under.slot = 'description'
    under.textContent = carried
    row.append(under)
    log.append(row)
    while (log.children.length > KEEP) {
      log.firstElementChild.remove()
    }
  }

  setting.addEventListener('helix-before-toggle', (event) => {
    say('helix-before-toggle', `about to change to ${event.detail.checked}, can be canceled`)
  })
  setting.addEventListener('input', (event) => {
    say('input', `${event.currentTarget.checked}, sent as the value changes`)
  })
  setting.addEventListener('change', (event) => {
    say('change', `${event.currentTarget.checked}, sent when the change is committed`)
  })
</script>
