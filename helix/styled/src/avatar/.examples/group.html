<!-- @summary Overlapping avatars with a count for the rest, on the page and on a sunken panel, where the gap between avatars shows the panel. -->
<link
  href="styles.css"
  rel="stylesheet"
>

<helix-flex
  direction="column"
  gap="lg"
>
  <helix-avatar-group
    label="Editors"
    max="4"
  >
    <helix-avatar name="Alex Kim"></helix-avatar>
    <helix-avatar name="Maria Lopez"></helix-avatar>
    <helix-avatar name="Sam Patel"></helix-avatar>
    <helix-avatar name="Jordan Lee"></helix-avatar>
    <helix-avatar name="Priya Shah"></helix-avatar>
    <helix-avatar name="Tom Walsh"></helix-avatar>
  </helix-avatar-group>

  <div class="panel">
    <helix-avatar-group
      label="Reviewers"
      max="3"
    >
      <helix-avatar name="Alex Kim"></helix-avatar>
      <helix-avatar name="Maria Lopez"></helix-avatar>
      <helix-avatar name="Sam Patel"></helix-avatar>
      <helix-avatar name="Jordan Lee"></helix-avatar>
      <helix-avatar name="Priya Shah"></helix-avatar>
    </helix-avatar-group>
    <helix-button>Request review</helix-button>
  </div>
</helix-flex>
