<!-- @summary The image's `load` and `error` events, relayed from inside the shadow root and heard in the capture phase. -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-flex
    gap="sm"
    id="people"
  >
    <helix-avatar
      name="Ada Okonjo"
      src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=96"
    ></helix-avatar>
    <helix-avatar
      name="Grace Hopper"
      src="https://example.invalid/missing.png"
    ></helix-avatar>
  </helix-flex>

  <helix-list
    divided
    id="log"
    label="Events"
  >
    <helix-list-item>
      No events yet
      <span slot="description">One image loads and one fails</span>
    </helix-list-item>
  </helix-list>
</helix-flex>

<script type="module">
  const people = document.getElementById('people')
  const log = document.getElementById('log')
  let empty = true

  // The number of rows the log keeps.
  const KEEP = 6

  const say = (name, carried) => {
    if (empty) {
      log.replaceChildren()
      empty = false
    }
    const row = document.createElement('helix-list-item')
    row.textContent = name
    const under = document.createElement('span')
    under.slot = 'description'
    under.textContent = carried
    row.append(under)
    log.append(row)
    while (log.children.length > KEEP) {
      log.firstElementChild.remove()
    }
  }

  /* `load` and `error` do not bubble, so these listeners use the capture phase. */
  people.addEventListener('load', (event) => {
    say('load', `${event.target.name} loaded`)
  }, true)
  people.addEventListener('error', (event) => {
    say('error', `${event.target.name} failed to load, so the initials are shown`)
  }, true)

  /* An image can finish loading before these listeners are added, so check
     each avatar's status too. */
  for (const avatar of people.querySelectorAll('helix-avatar')) {
    if (avatar.status === 'loaded') {
      say('load', `${avatar.name} loaded`)
    } else if (avatar.status === 'error') {
      say('error', `${avatar.name} failed to load, so the initials are shown`)
    }
  }

</script>
