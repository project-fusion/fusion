<!-- @summary A drop and a click send the same events, and the value is the file names. -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-file-input
    hint="PNG or JPG"
    id="files"
    label="Attachments"
    multiple
    name="attachments"
  ></helix-file-input>


  <helix-list
    divided
    id="log"
    label="Events"
  >
    <helix-list-item>
      No events yet
      <span slot="description">Drop a file or choose one</span>
    </helix-list-item>
  </helix-list>
</helix-flex>

<script type="module">
  const files = document.getElementById('files')
  const log = document.getElementById('log')
  let empty = true

  // The log keeps the last six events.
  const KEEP = 6

  const say = (name, carried) => {
    if (empty) {
      log.replaceChildren()
      empty = false
    }
    const row = document.createElement('helix-list-item')
    row.textContent = name
    const under = document.createElement('span')
    under.slot = 'description'
    under.textContent = carried
    row.append(under)
    log.append(row)
    while (log.children.length > KEEP) {
      log.firstElementChild.remove()
    }
  }

  const chosen = (field) => field.files.map((file) => file.name).join(', ') || 'nothing'

  files.addEventListener('helix-before-change', (event) => {
    say('helix-before-change', `Proposed "${event.detail.value}"`)
  })
  files.addEventListener('input', (event) => {
    say('input', `Value is ${chosen(event.currentTarget)}`)
  })
  files.addEventListener('change', (event) => {
    say('change', `Chose ${chosen(event.currentTarget)}`)
  })
</script>
