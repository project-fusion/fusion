<!-- @summary Twenty thousand notes, laid out and drawn on the GPU by cosmos.gl, with messages passing between them. -->

<!-- Preview frame: data-preview-graph="cosmos" has the frame connect cosmos.gl; on your page, connectGraph does. -->
<helix-graph
  data-preview-graph="cosmos"
  id="knowledge"
  label="Company knowledge base"
>
  <div data-preview-graph-canvas></div>
</helix-graph>

<script>
  const knowledge = document.getElementById('knowledge')

  const subjects = [
    'Sales',
    'Product',
    'People',
    'Finance',
    'Support',
    'Legal',
    'Marketing',
    'Research',
    'Design',
    'Operations',
    'Security',
    'Partners',
  ]

  /* The same graph on every load. */
  let seed = 7
  const random = () => {
    seed = (seed * 1664525 + 1013904223) % 4294967296
    return seed / 4294967296
  }
  const pick = (list) => list[Math.floor(random() * list.length)]

  /* Notes in each subject, a few hubs most of them link to, and links across
     subjects now and then. */
  const nodes = []
  const links = []
  const each = 20000 / subjects.length
  for (const group of subjects) {
    const hubs = Array.from({ length: 8 }, (_, at) => `${group} hub ${at + 1}`)
    for (const id of hubs) {
      nodes.push({ group, id, label: id, shape: 'square' })
    }
    for (let at = 1; at <= each - hubs.length; at++) {
      const id = `${group} note ${at}`
      nodes.push({ group, id, label: id })
      links.push({ source: id, target: pick(hubs) })
      if (random() < 0.4) {
        links.push({ source: id, target: `${group} note ${1 + Math.floor(random() * at)}` })
      }
      if (random() < 0.02) {
        links.push({ source: id, target: `${pick(subjects)} hub ${1 + Math.floor(random() * 8)}` })
      }
    }
  }
  knowledge.nodes = nodes
  knowledge.links = links

  /* Messages passing along the links, ten a second. */
  setInterval(() => {
    const link = pick(knowledge.links)
    knowledge.signal(link.source, link.target, { tone: random() < 0.05 ? 'danger' : undefined })
  }, 100)
</script>
