<!-- @summary Three thousand services on the surface of a 3D model, a knot, each team a stretch of it, with requests passing between them. -->

<!-- Preview frame: data-preview-graph="three" has the frame connect three.js, and data-preview-graph-model names the model the notes are drawn on; on your page, in a module script, connectGraph(frame, threeDriver(box), { stencil: { ...(await shapeFromModel(url)), place: 'surface' } }) does. -->
<helix-graph
  data-preview-graph="three"
  data-preview-graph-model="/media/models/torus-knot.glb"
  data-preview-graph-place="surface"
  id="services"
  label="Services"
>
  <div data-preview-graph-canvas></div>
</helix-graph>

<script>
  const services = document.getElementById('services')

  const teams = ['Accounts', 'Billing', 'Catalog', 'Delivery', 'Identity', 'Search']

  /* The same services on every load. */
  let seed = 3
  const random = () => {
    seed = (seed * 1664525 + 1013904223) % 4294967296
    return seed / 4294967296
  }
  const pick = (list) => list[Math.floor(random() * list.length)]

  /* Each team's services, a few gateways most of them answer to, and calls
     to other teams' gateways now and then. */
  const nodes = []
  const links = []
  for (const team of teams) {
    const gateways = Array.from({ length: 5 }, (_, at) => `${team} gateway ${at + 1}`)
    for (const id of gateways) {
      nodes.push({ group: team, id, label: id, shape: 'square' })
    }
    for (let at = 1; at <= 500 - gateways.length; at++) {
      const id = `${team} service ${at}`
      nodes.push({ group: team, id, label: id })
      links.push({ source: id, target: pick(gateways) })
      if (random() < 0.3) {
        links.push({ source: id, target: `${team} service ${1 + Math.floor(random() * at)}` })
      }
      if (random() < 0.03) {
        links.push({ source: id, target: `${pick(teams)} gateway ${1 + Math.floor(random() * 5)}` })
      }
    }
  }
  services.nodes = nodes
  services.links = links

  /* Requests passing along the calls, ten a second, a few of them failing, until the graph leaves the page. */
  const sending = setInterval(() => {
    if (!services.isConnected) {
      clearInterval(sending)
      return
    }
    const link = pick(services.links)
    services.signal(link.source, link.target, { tone: random() < 0.05 ? 'danger' : undefined })
  }, 100)
</script>
