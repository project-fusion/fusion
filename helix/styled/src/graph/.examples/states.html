<!-- @summary A graph while its notes load, and a graph with no notes, each with its own words in the panel. -->
<link
  href="styles.css"
  rel="stylesheet"
>

<helix-flex
  direction="column"
  gap="lg"
>
  <helix-graph
    label="Company notes"
    loading
    loading-text="Loading company notes"
  ></helix-graph>

  <helix-graph
    empty-text="No research notes yet"
    label="Research notes"
  ></helix-graph>
</helix-flex>
