<!-- @summary Two panes and a divider that you move with a pointer or the arrow keys. -->
<link
  href="styles.css"
  rel="stylesheet"
>

<helix-splitter default-position="40">
  <helix-card
    separation="plain"
    slot="start"
  >
    <helix-text>Files</helix-text>
  </helix-card>
  <helix-card
    separation="plain"
    slot="end"
  >
    <helix-text>Editor</helix-text>
  </helix-card>
</helix-splitter>
