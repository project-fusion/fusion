<!-- @summary Splitters inside the panes of other splitters, for an editor layout: files beside two panes side by side above a full-width terminal. -->
<link
  href="styles.css"
  rel="stylesheet"
>

<helix-splitter default-position="25">
  <helix-card
    separation="plain"
    slot="start"
  >
    <helix-text>Files</helix-text>
  </helix-card>
  <helix-splitter
    default-position="65"
    orientation="vertical"
    slot="end"
  >
    <helix-splitter
      default-position="60"
      slot="start"
    >
      <helix-card
        separation="plain"
        slot="start"
      >
        <helix-text>Source</helix-text>
      </helix-card>
      <helix-card
        separation="plain"
        slot="end"
      >
        <helix-text>Outline</helix-text>
      </helix-card>
    </helix-splitter>
    <helix-card
      separation="plain"
      slot="end"
    >
      <helix-text>Terminal</helix-text>
    </helix-card>
  </helix-splitter>
</helix-splitter>
