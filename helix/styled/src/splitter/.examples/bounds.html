<!-- @summary Limits on where the divider can go, the step each key press moves it, and a collapsed pane. -->

<helix-flex
  direction="column"
  gap="lg"
>
  <helix-splitter
    default-position="40"
    max="70"
    min="20"
    step="5"
  >
    <div slot="start">Between a fifth and seven tenths, five at a time.</div>
    <div slot="end">The other side.</div>
  </helix-splitter>

  <helix-splitter default-collapsed="start">
    <div slot="start">Folded away until the divider is moved.</div>
    <div slot="end">The whole width, for now.</div>
  </helix-splitter>
</helix-flex>
