<!-- @summary A divider controlled by your code, which handles the events and sets `position` and `collapsed`. -->

<helix-splitter
  collapsed="start"
  id="panes"
  position="35"
>
  <div slot="start">Inbox, Drafts, Sent, and Archive</div>
  <div slot="end">Select a message to read it.</div>
</helix-splitter>

<script>
  const panes = document.getElementById('panes')

  panes.addEventListener('helix-before-resize', (event) => {
    panes.position = Number(event.detail.value)
  })
  panes.addEventListener('helix-before-collapse', (event) => {
    panes.collapsed = event.detail.value || undefined
  })
</script>
