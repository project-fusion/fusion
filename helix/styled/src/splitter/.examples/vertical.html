<!-- @summary Panes stacked, with the divider between them. -->
<link
  href="styles.css"
  rel="stylesheet"
>

<helix-splitter
  default-position="60"
  orientation="vertical"
>
  <helix-card
    separation="plain"
    slot="start"
  >
    <helix-text>Preview</helix-text>
  </helix-card>
  <helix-card
    separation="plain"
    slot="end"
  >
    <helix-text>Console</helix-text>
  </helix-card>
</helix-splitter>
