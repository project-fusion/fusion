<!-- @summary A list of an invoice table's columns beside the table, with one column pinned and one hidden. -->
<link
  href="styles.css"
  rel="stylesheet"
/>

<div class="columns-pane">
  <helix-column-manager for="invoices"></helix-column-manager>
  <helix-data-table
    default-view='{"columns":{"hidden":["terms"],"pinned":{"id":"start"}}}'
    id="invoices"
    label="Invoices"
    row-key="id"
  >
    <helix-table-column
      field="id"
      row-header
    >Invoice</helix-table-column>
    <helix-table-column field="customer">Customer</helix-table-column>
    <helix-table-column field="status">Status</helix-table-column>
    <helix-table-column
      field="amount"
      text-align="end"
    >Amount</helix-table-column>
    <helix-table-column field="terms">Terms</helix-table-column>
  </helix-data-table>
</div>

<script>
  document.getElementById('invoices').rows = [
    { amount: '$12,400.00', customer: 'Acme Corporation', id: 'INV-2041', status: 'Overdue', terms: 'Net 30' },
    { amount: '$8,250.00', customer: 'Acme Logistics', id: 'INV-2047', status: 'Paid', terms: 'Net 15' },
    { amount: '$6,980.00', customer: 'Acme Robotics', id: 'INV-2052', status: 'Draft', terms: 'Net 30' },
  ]
</script>
