<!-- @summary Three cards below the view that rise and fade in, one after another, as the box is scrolled to them. -->
<link
  href="styles.css"
  rel="stylesheet"
/>

<div class="page">
  <helix-text class="lead">Scroll this box. The three cards below come in as they reach the view.</helix-text>
  <helix-reveal>
    <helix-card>Plan the release</helix-card>
  </helix-reveal>
  <helix-reveal class="second">
    <helix-card>Write the notes</helix-card>
  </helix-reveal>
  <helix-reveal class="third">
    <helix-card>Ship it</helix-card>
  </helix-reveal>
</div>
