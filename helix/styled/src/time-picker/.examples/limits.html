<!-- @summary Working hours only, at half-hour steps, and a range of times with some times blocked from being chosen. -->
<helix-flex
  gap="lg"
  wrap
>
  <helix-time-picker
    default-value="09:00"
    max="17:00"
    min="09:00"
    step="30"
  ></helix-time-picker>
  <helix-time-picker
    disable-times="09:30,10:00,11:15,13:00,14:30"
    max="16:00"
    min="09:00"
  ></helix-time-picker>
</helix-flex>
