<!-- @summary An answer that is a document: a heading, a table, a list and a block of code, each the Helix component for it. -->
<!-- @min 480 -->
<link
  href="styles.css"
  rel="stylesheet"
>

<helix-chat
  class="markdown"
  label="Assistant"
>
  <helix-text
    as="strong"
    slot="header"
    variant="body-strong"
  >Assistant</helix-text>

  <helix-chat-message
    author="me"
    state="sent"
  >What changed in 0.16?</helix-chat-message>

  <!-- A turn holds whatever it is given, so an answer can be built from the
       library's own parts. Markdown rendered to plain HTML is the other way in:
       mark the turn `data-prose` and the base layer sets its headings, lists,
       tables and code. -->
  <helix-chat-message
    author="them"
    separation="plain"
    state="sent"
  >
    <helix-flex
      direction="column"
      gap="sm"
    >
      <helix-text
        as="h3"
        variant="title"
      >What changed</helix-text>
      <helix-text as="p">Three things landed, and one of them moves a default.</helix-text>

      <helix-table label="Versions">
        <helix-table-column>Package</helix-table-column>
        <helix-table-column>Version</helix-table-column>
        <helix-table-row>
          <helix-table-cell header>helix</helix-table-cell>
          <helix-table-cell>0.16.3</helix-table-cell>
        </helix-table-row>
        <helix-table-row>
          <helix-table-cell header>helix-core</helix-table-cell>
          <helix-table-cell>0.16.3</helix-table-cell>
        </helix-table-row>
      </helix-table>

      <helix-list
        kind="unordered"
        label="Changes"
      >
        <helix-list-item><helix-code>Button</helix-code> lost its width axis</helix-list-item>
        <helix-list-item>The small dialog footer fits again</helix-list-item>
        <helix-list-item>Nothing generated is tracked any more</helix-list-item>
      </helix-list>

      <helix-text as="p">Upgrade with:</helix-text>
      <helix-code-block label="Terminal">bun add @fusion.dev/helix</helix-code-block>
    </helix-flex>
  </helix-chat-message>
</helix-chat>
