<!-- @summary An agent reply that shows each step of its work, then streams the answer. -->
<!-- @min 420 -->
<link
  href="styles.css"
  rel="stylesheet"
>

<helix-flex
  direction="column"
  gap="md"
>
  <helix-chat
    class="agent"
    id="agent"
    label="Assistant"
  >
    <strong slot="header">Assistant</strong>
    <helix-chat-message
      author="me"
      state="sent"
    >What went out in the last deploy?</helix-chat-message>
    <helix-chat-message
      author="them"
      id="reply"
      separation="plain"
      state="streaming"
    >
      <helix-flex
        align-items="center"
        gap="xs"
        slot="indicator"
      >
        <helix-orb
          id="orb"
          size="sm"
          state="connecting"
        ></helix-orb>
        <span id="doing">Connecting</span>
      </helix-flex>
    </helix-chat-message>
  </helix-chat>

  <helix-button id="replay">Replay</helix-button>
</helix-flex>

<script type="module">
  const orb = document.getElementById('orb')
  const doing = document.getElementById('doing')
  /* The whole indicator, because `textContent` below wipes the turn's children
     and the orb is inside it. */
  const waiting = orb.closest('[slot="indicator"]')
  const reply = document.getElementById('reply')
  const replay = document.getElementById('replay')

  const WORDS =
    'Three things. Button lost its width axis, the small dialog footer fits again, and nothing generated is tracked any more.'.split(
      ' ',
    )

  /* What the agent is doing, and how long each takes. The orb carries one into
     the next rather than cutting between them, which is the whole reason to
     spend a canvas on this instead of swapping an icon. */
  const RUN = [
    ['connecting', 'Connecting', 700],
    ['fetching', 'Reading the release', 1100],
    ['thinking', 'Working out what changed', 1100],
  ]

  const still = window.matchMedia('(prefers-reduced-motion: reduce)')
  let timer = 0

  const say = (state, said) => {
    orb.state = state
    doing.textContent = said
  }

  /* **The finished answer is the resting state.** These pages are photographed
     with reduced motion forced, so an example still mid-sentence when the
     shutter opens is a different picture every run. */
  const settle = () => {
    clearTimeout(timer)
    say('done', 'Done')
    reply.textContent = WORDS.join(' ')
    reply.append(waiting)
    reply.setAttribute('state', 'sent')
  }

  const stream = () => {
    let at = 0
    const next = () => {
      /* **The orb goes out as the first word lands, and the component is what
         decides that.** It sits in the turn's `indicator` slot, which is shown
         while the turn is streaming and empty and hidden the moment it is not,
         so nothing here has to hide it: the text arriving is the signal, and it
         is the same signal that used to stop the three dots. */
      reply.textContent = WORDS.slice(0, at + 1).join(' ')
      reply.append(waiting)
      at += 1
      if (at < WORDS.length) {
        timer = setTimeout(next, 55)
        return
      }
      say('done', 'Done')
      reply.setAttribute('state', 'sent')
    }
    next()
  }

  const run = () => {
    clearTimeout(timer)
    if (still.matches) {
      settle()
      return
    }
    reply.textContent = ''
    reply.append(waiting)
    reply.setAttribute('state', 'streaming')
    let step = 0
    const advance = () => {
      if (step === RUN.length) {
        say('working', 'Writing')
        stream()
        return
      }
      const [state, said, held] = RUN[step]
      say(state, said)
      step += 1
      timer = setTimeout(advance, held)
    }
    advance()
  }

  replay.addEventListener('click', run)
  still.addEventListener('change', run)
  run()
</script>
