<!-- @summary An agent reply that shows each step of its work, then streams the answer. -->
<!-- @min 420 -->
<link
  href="styles.css"
  rel="stylesheet"
>

<helix-flex
  direction="column"
  gap="md"
>
  <helix-chat
    class="agent"
    id="agent"
    label="Assistant"
  >
    <strong slot="header">Assistant</strong>
    <helix-chat-message
      author="me"
      state="sent"
    >What changed in the last release?</helix-chat-message>
    <helix-chat-message
      author="them"
      id="reply"
      separation="plain"
      state="streaming"
    >
      <helix-flex
        align-items="center"
        gap="xs"
        slot="indicator"
      >
        <helix-orb
          id="orb"
          size="sm"
          state="connecting"
        ></helix-orb>
        <span id="doing">Connecting</span>
      </helix-flex>
    </helix-chat-message>
  </helix-chat>

  <helix-button id="replay">Replay</helix-button>
</helix-flex>

<script type="module">
  const orb = document.getElementById('orb')
  const doing = document.getElementById('doing')
  /* The whole indicator, so it can be appended again after `textContent` clears
     the turn. */
  const waiting = orb.closest('[slot="indicator"]')
  const reply = document.getElementById('reply')
  const replay = document.getElementById('replay')

  const WORDS =
    'Three things. The settings page loads faster, invoices export as CSV, and deleted projects are not tracked any more.'.split(
      ' ',
    )

  /* Each step's orb state, label, and duration in milliseconds. */
  const RUN = [
    ['connecting', 'Connecting', 700],
    ['fetching', 'Reading the release notes', 1100],
    ['thinking', 'Comparing versions', 1100],
  ]

  const still = window.matchMedia('(prefers-reduced-motion: reduce)')
  let timer = 0

  const say = (state, said) => {
    orb.state = state
    doing.textContent = said
  }

  /* With reduced motion, the finished answer is shown at once. */
  const settle = () => {
    clearTimeout(timer)
    say('done', 'Done')
    reply.textContent = WORDS.join(' ')
    reply.append(waiting)
    reply.setAttribute('state', 'sent')
  }

  const stream = () => {
    let at = 0
    const next = () => {
      /* The turn hides its `indicator` slot as soon as it has content. */
      reply.textContent = WORDS.slice(0, at + 1).join(' ')
      reply.append(waiting)
      at += 1
      if (at < WORDS.length) {
        timer = setTimeout(next, 55)
        return
      }
      say('done', 'Done')
      reply.setAttribute('state', 'sent')
    }
    next()
  }

  const run = () => {
    clearTimeout(timer)
    if (still.matches) {
      settle()
      return
    }
    reply.textContent = ''
    reply.append(waiting)
    reply.setAttribute('state', 'streaming')
    let step = 0
    const advance = () => {
      if (step === RUN.length) {
        say('working', 'Writing')
        stream()
        return
      }
      const [state, said, held] = RUN[step]
      say(state, said)
      step += 1
      timer = setTimeout(advance, held)
    }
    advance()
  }

  replay.addEventListener('click', run)
  still.addEventListener('change', run)
  run()
</script>
