<!-- @summary A conversation with the four states a turn can be in, and a composer under it. -->

<helix-chat
  id="support"
  label="Support"
>
  <strong slot="header">Support</strong>

  <helix-chat-message
    author="them"
    author-label="Support"
    state="sent"
  >
    How can I help?
  </helix-chat-message>

  <helix-chat-message
    author="me"
    state="sent"
  >
    The deploy is stuck on the migration step.
  </helix-chat-message>

  <helix-chat-message
    author="them"
    author-label="Support"
    state="streaming"
  >
    I am checking the migration now
  </helix-chat-message>

  <helix-chat-message
    author="me"
    state="failed"
  >
    Thanks
  </helix-chat-message>

  <span slot="status">Support is typing</span>

  <helix-chat-composer
    placeholder="Write a message"
    slot="composer"
  ></helix-chat-composer>
</helix-chat>

<script>
  /* The timestamps are set from script, so they are always a few minutes old. */
  const support = document.getElementById('support')
  const ago = (minutes) => new Date(Date.now() - minutes * 60000).toISOString()

  const turns = support.querySelectorAll('helix-chat-message')
  turns[0].at = ago(6)
  turns[1].at = ago(4)
  turns[2].at = ago(1)

  /* Each message you send is added to the end of the transcript. */
  support.addEventListener('helix-send', (event) => {
    const turn = document.createElement('helix-chat-message')
    turn.setAttribute('author', 'me')
    turn.setAttribute('state', 'sent')
    turn.at = new Date().toISOString()
    turn.textContent = event.detail.value
    support.append(turn)
  })
</script>
