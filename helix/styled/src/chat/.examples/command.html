<!-- @summary The command palette: summoned from anywhere, anchored near the top, and gone when it is answered. -->
<!-- @min 420 -->
<link
  href="styles.css"
  rel="stylesheet"
>

<helix-button
  command="--show"
  commandfor="command-chat"
  emphasis="outlined"
>
  <helix-icon
    name="magnifying-glass"
    slot="start"
  ></helix-icon>
  Ask
  <helix-kbd
    keys="mod+k"
    slot="end"
  ></helix-kbd>
</helix-button>

<helix-dialog
  class="command"
  default-open
  id="command-chat"
  label="Ask"
  size="lg"
>
  <helix-chat
    class="command-chat"
    label="Ask"
  >
    <helix-chat-message
      author="me"
      state="sent"
    >
      Which packages does the release touch?
    </helix-chat-message>
    <helix-chat-message
      author="them"
      separation="plain"
      state="sent"
    >
      Eight, and two of them publish for the first time.
    </helix-chat-message>

    <helix-chat-composer
      placeholder="Ask anything"
      slot="composer"
    ></helix-chat-composer>
  </helix-chat>

  <helix-text
    slot="footer"
    tone="muted"
    variant="caption"
  >
    <helix-kbd>Esc</helix-kbd>
    to dismiss
  </helix-text>
</helix-dialog>
