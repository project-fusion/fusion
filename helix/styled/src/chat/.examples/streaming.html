<!-- @summary An answer that arrives a word at a time, from the wait to the last word. -->
<!-- @min 420 -->
<link
  href="styles.css"
  rel="stylesheet"
>

<helix-flex
  direction="column"
  gap="md"
>
  <helix-chat
    class="streaming"
    id="stream"
    label="Assistant"
  >
    <strong slot="header">Assistant</strong>
    <helix-chat-message
      author="me"
      state="sent"
    >What changed in the last release?</helix-chat-message>
    <helix-chat-message
      author="them"
      id="answer"
      separation="plain"
      state="streaming"
    ></helix-chat-message>
  </helix-chat>

  <helix-button id="replay">Replay</helix-button>
</helix-flex>

<script type="module">
  const answer = document.getElementById('answer')
  const replay = document.getElementById('replay')

  const WORDS =
    'Three things. The settings page loads faster, invoices export as CSV, and deleted projects are not tracked any more.'.split(
      ' ',
    )

  /* The wait before the first word, and the gap between the rest. */
  const FIRST = 620
  const EACH = 55

  const still = window.matchMedia('(prefers-reduced-motion: reduce)')
  let timer = 0

  /* With reduced motion, the finished answer is shown at once. */
  const settle = () => {
    clearTimeout(timer)
    answer.textContent = WORDS.join(' ')
    answer.setAttribute('state', 'sent')
  }

  const run = () => {
    clearTimeout(timer)
    if (still.matches) {
      settle()
      return
    }
    /* An empty turn with `state="streaming"` shows the typing indicator. */
    answer.textContent = ''
    answer.setAttribute('state', 'streaming')
    let at = 0
    const next = () => {
      /* The indicator stops when the first word arrives. */
      answer.textContent = WORDS.slice(0, at + 1).join(' ')
      at += 1
      if (at < WORDS.length) {
        timer = setTimeout(next, EACH)
        return
      }
      answer.setAttribute('state', 'sent')
    }
    timer = setTimeout(next, FIRST)
  }

  replay.addEventListener('click', run)
  still.addEventListener('change', run)
  run()
</script>
