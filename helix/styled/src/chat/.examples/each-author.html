<!-- @summary Turns set as data, each author's drawn in a fill of their own through author-styles. -->
<!-- @min 420 -->
<link
  href="styles.css"
  rel="stylesheet"
>

<helix-chat
  author-styles='{"Ada": "--chat-message-background-color: color-mix(in oklab, var(--helix-color-success) 24%, transparent)", "Grace": "--chat-message-background-color: color-mix(in oklab, var(--helix-color-warning) 24%, transparent)"}'
  class="authors"
  id="release"
  label="Release"
>
  <strong slot="header">Release</strong>
</helix-chat>

<script>
  /* Ada's and Grace's turns take the fill `author-styles` names for them, and
     the reader's own keep theirs. */
  document.getElementById('release').turns = [
    { author: 'Ada', authorLabel: 'Ada', key: '1', text: 'The build for 4.2 is green.' },
    { author: 'Grace', authorLabel: 'Grace', key: '2', text: 'Release notes are in review.' },
    { author: 'me', key: '3', text: 'Then we ship at three.' },
    { author: 'Ada', authorLabel: 'Ada', key: '4', text: 'Tagging it now.' },
  ]
</script>
