<!-- @summary A draft with a photo and a file attached, shown inside the composer above the text. -->
<link
  href="styles.css"
  rel="stylesheet"
>

<helix-chat-composer
  attached
  class="attachments"
  id="draft"
  placeholder="Write a message"
  value="Here are the photo and the notes."
>
  <span
    class="thumbnail"
    slot="attachments"
  >
    <helix-image
      alt="harbor.jpg"
      src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'%3E%3Crect width='96' height='96' fill='%23f2b45c'/%3E%3Ccircle cx='66' cy='30' r='12' fill='%23fff1d0'/%3E%3Cpath d='M0 70 30 44 52 62 70 50 96 72V96H0Z' fill='%232f6b5a'/%3E%3C/svg%3E"
    ></helix-image>
    <helix-icon-button
      class="remove"
      label="Remove harbor.jpg"
      shape="circle"
    >
      <helix-icon name="x"></helix-icon>
    </helix-icon-button>
  </span>
  <helix-tag
    dismissible
    slot="attachments"
  >
    <helix-icon
      name="file-text"
      slot="start"
    ></helix-icon>
    notes.md
  </helix-tag>
</helix-chat-composer>

<script type="module">
  const draft = document.getElementById('draft')

  // Each attachment leaves when its remove button is pressed, and the draft
  // counts as one while anything is attached.
  const detach = (attachment) => {
    attachment.remove()
    draft.attached = draft.querySelector('[slot="attachments"]') !== null
  }

  draft.querySelector('.remove').addEventListener('click', (event) => {
    detach(event.currentTarget.closest('[slot="attachments"]'))
  })
  draft.querySelector('helix-tag').addEventListener('helix-dismiss', (event) => {
    detach(event.currentTarget)
  })
</script>
