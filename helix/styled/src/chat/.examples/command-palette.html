<!-- @summary A command palette that opens with a shortcut from anywhere, sits near the top of the screen, and closes with Esc. -->
<!-- @min 420 -->
<link
  href="styles.css"
  rel="stylesheet"
>

<helix-button
  command="--show"
  commandfor="command-chat"
  emphasis="outlined"
>
  <helix-icon
    name="magnifying-glass"
    slot="start"
  ></helix-icon>
  Ask
  <helix-kbd
    keys="mod+k"
    slot="end"
  ></helix-kbd>
</helix-button>

<helix-dialog
  class="command"
  default-open
  id="command-chat"
  label="Ask"
  size="lg"
>
  <helix-chat
    class="command-chat"
    label="Ask"
  >
    <helix-chat-message
      author="me"
      state="sent"
    >
      Which invoices are overdue?
    </helix-chat-message>
    <helix-chat-message
      author="them"
      separation="plain"
      state="sent"
    >
      Two, both from August. The total is $1,240.
    </helix-chat-message>

    <helix-chat-composer
      placeholder="Ask anything"
      slot="composer"
    >
      <helix-text
        emphasis="subtle"
        slot="start"
        variant="caption"
      >
        <helix-kbd>Esc</helix-kbd>
        to dismiss
      </helix-text>
    </helix-chat-composer>
  </helix-chat>
</helix-dialog>
