<!-- @summary The sidebar: a drawer from the trailing edge, with the conversation filling the panel. -->
<!-- @min 420 -->
<link
  href="styles.css"
  rel="stylesheet"
>

<helix-button
  command="--show"
  commandfor="sidebar-chat"
  emphasis="solid"
  tone="primary"
>
  Ask the assistant
</helix-button>

<!-- The drawer's own header is left empty and the conversation carries the
     title, so there is one header at one inset rather than two stacked. -->
<helix-drawer
  class="sidebar"
  id="sidebar-chat"
  label="Assistant"
  placement="end"
>
  <helix-chat
    class="sidebar-chat"
    label="Assistant"
  >
    <helix-text
      as="strong"
      slot="header"
      variant="body-strong"
    >Assistant</helix-text>

    <helix-icon-button
      command="--close"
      commandfor="sidebar-chat"
      emphasis="ghost"
      label="Close"
      slot="actions"
    >
      <helix-icon name="x"></helix-icon>
    </helix-icon-button>

    <helix-chat-message
      author="me"
      state="sent"
    >
      Summarize what changed in this release.
    </helix-chat-message>
    <helix-chat-message
      author="them"
      separation="plain"
      state="sent"
    >
      <helix-avatar
        name="AI"
        shape="circle"
        size="sm"
        slot="avatar"
      ></helix-avatar>
      Eleven components changed. The largest is the date picker, which now reads its own value as
      a date rather than a string.
    </helix-chat-message>
    <helix-chat-message
      author="them"
      separation="plain"
      state="streaming"
    >
      <helix-avatar
        name="AI"
        shape="circle"
        size="sm"
        slot="avatar"
      ></helix-avatar>
    </helix-chat-message>

    <helix-chat-composer
      placeholder="Ask about the release"
      slot="composer"
    >
      <helix-icon-button
        emphasis="ghost"
        label="Stop answering"
        slot="end"
      >
        <helix-icon name="stop"></helix-icon>
      </helix-icon-button>
    </helix-chat-composer>
  </helix-chat>
</helix-drawer>
