<!-- @summary An icon button in the corner that opens the conversation in a popover over the page. -->
<!-- @layout fullscreen -->
<!-- @min 380 -->
<link
  href="styles.css"
  rel="stylesheet"
>

<!-- The example's stylesheet places the trigger in the corner. -->
<helix-popover
  class="launcher"
  id="launcher"
  label="Support"
  placement="top-end"
>
  <helix-icon-button
    class="launcher-trigger"
    emphasis="solid"
    label="Ask support"
    raised
    shape="circle"
    slot="trigger"
    tone="primary"
  >
    <helix-icon name="dots-three"></helix-icon>
  </helix-icon-button>

  <helix-chat
    class="launcher-chat"
    label="Support"
  >
    <helix-text
      as="strong"
      slot="header"
      variant="body-strong"
    >Support</helix-text>

    <helix-icon-button
      command="--close"
      commandfor="launcher"
      emphasis="ghost"
      label="Close"
      slot="actions"
    >
      <helix-icon name="x"></helix-icon>
    </helix-icon-button>

    <helix-chat-message
      author="them"
      state="sent"
    >
      We are here. What is going wrong?
    </helix-chat-message>
    <helix-chat-message
      author="me"
      state="sent"
    >
      The deploy is stuck on the migration step.
    </helix-chat-message>
    <helix-chat-message
      author="them"
      state="sent"
    >
      Looking at the run now. Give us a minute.
    </helix-chat-message>

    <helix-chat-composer
      placeholder="Write a message"
      slot="composer"
    ></helix-chat-composer>
  </helix-chat>
</helix-popover>
