<!-- @summary Three bodies: a phone with a Home button, a round watch, and a tablet on its side. -->
<link
  href="styles.css"
  rel="stylesheet"
/>

<div class="row">
  <helix-device-screen
    class="home-button"
    label="iPhone SE"
    screen-height="667"
    screen-width="375"
    shape="square"
  >
    <div class="stand-in">9:41</div>
  </helix-device-screen>

  <helix-device-screen
    class="watch"
    controls="none"
    label="Pixel Watch"
    screen-height="384"
    screen-width="384"
    shape="circle"
  >
    <div class="stand-in">9:41</div>
  </helix-device-screen>

  <helix-device-screen
    class="tablet"
    controls="home rotate screenshot"
    label="iPad Air"
    screen-height="820"
    screen-width="1180"
  >
    <div class="stand-in">9:41</div>
  </helix-device-screen>
</div>
