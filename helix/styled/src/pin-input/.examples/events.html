<!-- @summary The events a pin input sends as you type, including `helix-complete` when the last box is filled. -->
<!-- @layout hug -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-pin-input
    hint="Sent to your phone"
    id="code"
    label="Verification code"
  ></helix-pin-input>


  <helix-list
    divided
    id="log"
    label="Events"
  >
    <helix-list-item>
      No events yet
      <span slot="description">Type the six-digit code</span>
    </helix-list-item>
  </helix-list>
</helix-flex>

<script type="module">
  const code = document.getElementById('code')
  const log = document.getElementById('log')
  let empty = true

  // The log keeps the last six events.
  const KEEP = 6

  const say = (name, carried) => {
    if (empty) {
      log.replaceChildren()
      empty = false
    }
    const row = document.createElement('helix-list-item')
    row.textContent = name
    const under = document.createElement('span')
    under.slot = 'description'
    under.textContent = carried
    row.append(under)
    log.append(row)
    while (log.children.length > KEEP) {
      log.firstElementChild.remove()
    }
  }

  code.addEventListener('helix-before-change', (event) => {
    say('helix-before-change', `Proposed "${event.detail.value}"`)
  })
  code.addEventListener('input', (event) => {
    say('input', `Value is "${event.currentTarget.value}"`)
  })
  code.addEventListener('helix-complete', (event) => {
    say('helix-complete', `Entered "${event.detail.value}"`)
  })
  code.addEventListener('change', (event) => {
    say('change', `Changed to "${event.currentTarget.value}"`)
  })
</script>
