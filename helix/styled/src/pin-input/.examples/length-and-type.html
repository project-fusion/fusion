<!-- @summary A four-digit code, and a six-character code of letters and digits. -->
<helix-flex
  direction="column"
  gap="lg"
>
  <helix-pin-input
    label="Four digits"
    length="4"
  ></helix-pin-input>
  <helix-pin-input
    default-value="A1B2C3"
    label="Letters and digits"
    type="text"
  ></helix-pin-input>
</helix-flex>
