<!-- @summary The boxes advance as you type, and the last one completes the code. -->
<helix-pin-input
  hint="Sent to your phone"
  id="code"
  label="Verification code"
></helix-pin-input>

<script type="module">
  /* Preview frame: your page would send the code to your server here.
     `helix-complete` is sent when the last box is filled. */
  const code = document.querySelector('#code')
  code.addEventListener('helix-complete', (event) => {
    code.hint = `Checking ${event.detail.value}`
  })
</script>
