<!-- @summary An empty state with a heading, an explanation, and an action. -->

<link
  href="styles.css"
  rel="stylesheet"
>

<helix-empty>
  <helix-icon
    name="folder-open"
    slot="icon"

    slot="actions"
    tone="primary"
  >New project</helix-button>
</helix-empty>
