<!-- @summary Both drawings fed readings 30 times a second: a phrase, then a pause, so each settles at rest. -->
<!-- @layout hug -->
<helix-flex
  align-items="center"
  gap="xl"
  wrap
>
  <helix-voice-level
    id="spectrum"
    label="Your voice"
  ></helix-voice-level>
  <helix-voice-level
    id="waves"
    label="Your voice"
    variant="waves"
  ></helix-voice-level>
</helix-flex>

<script type="module">
  const spectrum = document.getElementById('spectrum')
  const waves = document.getElementById('waves')

  /* Made-up readings with the shape of speech: syllables about five times a
     second for two seconds, then a second of silence. Real readings come from
     your audio, such as an `AnalyserNode`'s frequency data grouped into bands. */
  const BANDS = 24
  const reading = (time) => {
    const at = time % 3
    const syllable = at < 2 ? Math.max(0, Math.sin(at * Math.PI * 5)) ** 0.6 : 0
    const level = syllable * (0.55 + 0.25 * Math.sin(time * 1.7))
    const peak = 6 + 3 * Math.sin(time * 2.3)
    const bands = Array.from({ length: BANDS }, (_, band) =>
      Math.min(1, level * Math.exp(-(((band - peak) / 7) ** 2)) * 1.3),
    )
    return { bands, level }
  }

  const show = (time) => {
    const { bands, level } = reading(time)
    spectrum.bands = bands
    waves.level = level
  }

  /* With reduced motion on, both show one moment of the phrase and stop. */
  const MOMENT = 0.1
  const still = window.matchMedia('(prefers-reduced-motion: reduce)')
  let timer = 0
  const run = () => {
    clearInterval(timer)
    if (still.matches) {
      show(MOMENT)
      return
    }
    const started = performance.now()
    timer = setInterval(() => show((performance.now() - started) / 1000), 1000 / 30)
  }
  still.addEventListener('change', run)
  run()
</script>
