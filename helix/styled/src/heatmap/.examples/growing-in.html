<!-- @summary Four weeks of commits that grow in a week at a time the first time they are seen. Adding a day grows the new day in. -->

  direction="column"
  gap="md"
>

    for="commits"
    grow
    label="Commits, last four weeks"
    rows="7"
    thresholds="1 3 5 7 9"
    tones="1 2 3 4 5"

      data-hidden-visually
      id="commits"
    >

      <tbody>
      <tr>

      </tr>
      <tr>
        <th scope="row">Day 2</th>

        <th scope="row">Day 4</th>

      </tr>
      <tr>
        <th scope="row">Day 5</th>
        <td>8</td>
      </tr>
      <tr>
        <th scope="row">Day 6</th>
        <td>5</td>
      </tr>
      <tr>
        <th scope="row">Day 7</th>
        <td>2</td>
      </tr>
      <tr>
        <th scope="row">Day 8</th>
        <td>9</td>
      </tr>
      <tr>
        <th scope="row">Day 9</th>
        <td>6</td>
      </tr>
      <tr>
        <th scope="row">Day 10</th>
        <td>3</td>
      </tr>
      <tr>
        <th scope="row">Day 11</th>
        <td>0</td>
      </tr>
      <tr>
        <th scope="row">Day 12</th>
        <td>7</td>
      </tr>
      <tr>
        <th scope="row">Day 13</th>
        <td>4</td>
      </tr>
      <tr>
        <th scope="row">Day 14</th>
        <td>1</td>
      </tr>
      <tr>
        <th scope="row">Day 15</th>
        <td>8</td>
      </tr>
      <tr>
        <th scope="row">Day 16</th>
        <td>5</td>
      </tr>
      <tr>
        <th scope="row">Day 17</th>

      </tbody>
    </table>
  </helix-heatmap>

  <helix-button id="add">Add a day</helix-button>
</helix-flex>

<!-- The script adds the next day to the table and drops the oldest, so the
     strip keeps four weeks. The new day grows in. -->
<script type="module">
  let next = 29
  document.getElementById('add').addEventListener('click', () => {
    const body = document.querySelector('#commits tbody')
    const row = document.createElement('tr')
    const value = (next * 7 + 3) % 10
    row.innerHTML = `<th scope="row">Day ${next}</th><td>${value}</td>`
    next += 1
    body.append(row)
    body.rows[0]?.remove()
  })
</script>
