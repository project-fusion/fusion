<!-- @summary Read state that your own code controls, so marking an item read can wait for a server round trip. -->

<link
  href="styles.css"
  rel="stylesheet"
>

<helix-notifications
  class="feed"
  id="owned"
  label="Activity"
  mark-all
>
  <helix-notification>
    <strong>Invoice #1042</strong> was paid.
  </helix-notification>

  <helix-notification>
    <strong>Quarterly report</strong> is ready to download.
  </helix-notification>
</helix-notifications>

<script>
  const owned = document.getElementById('owned')

  /* `read` is a boolean attribute, so markup cannot set it to false. To control
     read state, cancel `helix-read`, save the change on your server, and then
     set `read`. */
  owned.addEventListener('helix-read', async (event) => {
    if (event.target === owned) {
      return
    }

    const item = event.target
    event.preventDefault()

    const accepted = await Promise.resolve(true)

    if (accepted) {
      item.read = event.detail.read
    }
  })

  for (const item of owned.querySelectorAll('helix-notification')) {
    item.at = new Date(Date.now() - 9 * 60000).toISOString()
    item.addEventListener('click', () => item.markRead(true))
  }
</script>
