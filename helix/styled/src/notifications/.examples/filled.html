<!-- @summary Rows drawn as boxes, each holding a different kind of content. -->
<!-- @min 420 -->

<link
  href="styles.css"
  rel="stylesheet"
>

<helix-notifications
  class="feed"
  label="Notifications"
>
  <h2 slot="header">Notifications</h2>

  <helix-notification
    at="2026-09-09T03:00:00Z"
    dismissible
    separation="filled"
  >
    <helix-avatar
      name="Boyd Larkin"
      slot="media"
    ></helix-avatar>
    <span><strong>Boyd Larkin</strong> has sent you a reminder</span>
    <helix-button
      emphasis="outlined"
      slot="actions"
    >Ignore</helix-button>
    <helix-button
      emphasis="solid"
      slot="actions"
      tone="primary"
    >Respond</helix-button>
  </helix-notification>

  <!-- Put a block such as a status change in the `detail` slot. -->
  <helix-notification
    at="2026-09-08T03:00:00Z"
    dismissible
    separation="filled"
  >
    <helix-avatar
      name="Jordan Lee"
      slot="media"
    ></helix-avatar>
    <span><strong>Jordan Lee</strong> changed the status of <strong>Website redesign</strong></span>
    <helix-flex
      align-items="center"
      gap="xs"
      slot="detail"
    >
      <helix-tag>In progress</helix-tag>
      <helix-icon
        mirror
        name="arrow-right"
      ></helix-icon>
      <helix-tag tone="success">Completed</helix-tag>
    </helix-flex>
  </helix-notification>

  <!-- The `detail` slot sets no size or color, so style its content yourself. -->
  <helix-notification
    at="2026-09-07T03:00:00Z"
    read
    separation="filled"
  >
    <helix-avatar
      name="Santos Kling"
      slot="media"
    ></helix-avatar>
    <span><strong>Santos Kling</strong> left a comment on <strong>Q4 planning</strong></span>
    <p
      class="quote"
      slot="detail"
    >Where can I find the process for submitting invoices and for reviewing a contract?</p>
  </helix-notification>
</helix-notifications>
