<!-- @summary A feed cut into named groups, one of them folded to its first row. -->
<!-- @min 460 -->

<link
  href="styles.css"
  rel="stylesheet"
>

<helix-notifications
  class="feed"
  label="Notifications"
>
  <h2 slot="header">Notifications</h2>

  <!-- Notifications are grouped by day here. Your code decides the groups and
       their labels. -->
  <helix-notification-group
    count="5"
    label="Today"
  >
    <helix-button
      emphasis="ghost"
      slot="actions"
    >See all</helix-button>
    <helix-notification
      at="2026-09-09T03:00:00Z"
      separation="filled"
    >
      <helix-avatar
        name="Boyd Larkin"
        slot="media"
      ></helix-avatar>
      <span><strong>Boyd Larkin</strong> has sent you a reminder</span>
      <helix-button
        emphasis="outlined"
        slot="actions"
      >Ignore</helix-button>
      <helix-button
        emphasis="solid"
        slot="actions"
        tone="primary"
      >Respond</helix-button>
    </helix-notification>
  </helix-notification-group>

  <!-- A collapsible group shows only its first row. Press the heading to show
       the rest. -->
  <helix-notification-group
    collapsible
    count="7"
    label="Yesterday"
  >
    <helix-button
      emphasis="ghost"
      slot="actions"
    >See all</helix-button>
    <helix-notification
      at="2026-09-08T03:00:00Z"
      separation="filled"
    >
      <helix-avatar
        name="Jordan Lee"
        slot="media"
      ></helix-avatar>
      <span><strong>Jordan Lee</strong> changed the status of <strong>Website redesign</strong></span>
      <helix-flex
        align-items="center"
        gap="xs"
        slot="detail"
      >
        <helix-tag>In progress</helix-tag>
        <helix-icon
          mirror
          name="arrow-right"
        ></helix-icon>
        <helix-tag tone="success">Completed</helix-tag>
      </helix-flex>
    </helix-notification>
    <helix-notification
      at="2026-09-08T01:00:00Z"
      separation="filled"
    >
      <helix-avatar
        name="Ada Reyes"
        slot="media"
      ></helix-avatar>
      <span><strong>Ada Reyes</strong> approved <strong>Q3 budget</strong></span>
    </helix-notification>
    <helix-notification
      at="2026-09-08T00:20:00Z"
      separation="filled"
    >
      <helix-avatar
        name="Ken Ito"
        slot="media"
      ></helix-avatar>
      <span><strong>Ken Ito</strong> mentioned you in <strong>Roadmap</strong></span>
    </helix-notification>
  </helix-notification-group>
</helix-notifications>
