<!-- @summary A bell in the header, a count on it, and the feed in a drawer behind it. -->
<!-- @min 420 -->

<helix-badge
  id="count"
  label="2 unread"
  value="2"
>
  <helix-icon-button
    command="--show"
    commandfor="panel"
    label="Notifications"
  >
    <helix-icon name="bell"></helix-icon>
  </helix-icon-button>
</helix-badge>

<helix-drawer
  id="panel"
  label="Notifications"
  placement="end"
>
  <span slot="header">Notifications</span>

  <helix-notifications
    id="feed"
    label="Notifications"
    mark-all
  >
    <helix-notification dismissible>
      <strong>Ada Okonjo</strong> approved your deploy to production.
      <helix-button
        emphasis="ghost"
        slot="actions"
      >View</helix-button>
    </helix-notification>

    <helix-notification dismissible>
      Build <strong>#4821</strong> failed on <code>main</code>
      <helix-button
        emphasis="ghost"
        slot="actions"
      >Logs</helix-button>
    </helix-notification>

    <helix-notification
      default-read
      dismissible
    >
      Your invitation to the <strong>Platform</strong> team was accepted.
    </helix-notification>
  </helix-notifications>
</helix-drawer>

<script type="module">
  const feed = document.getElementById('feed')
  const count = document.getElementById('count')

  /* Set from script rather than written into the markup, because a timestamp in
     an example is stale the moment it is committed. */
  const ago = (minutes) => new Date(Date.now() - minutes * 60000).toISOString()
  const items = feed.querySelectorAll('helix-notification')
  items[0].at = ago(3)
  items[1].at = ago(42)
  items[2].at = ago(1500)

  /* **The badge is the page's, not the feed's.** A count of what is unread is a
     fact about the reader's account, which a page usually knows before it has
     rendered a single notification and keeps knowing while the drawer is shut.
     So the feed reports and this recounts, rather than the two being one
     element that has to be open to be right. */
  const recount = () => {
    const unread = [...feed.querySelectorAll('helix-notification')].filter(
      (one) => !one.read,
    ).length
    count.value = unread
    count.label = `${unread} unread`
  }

  feed.addEventListener('helix-read', () => queueMicrotask(recount))
  feed.addEventListener('helix-dismiss', () => queueMicrotask(recount))
</script>
