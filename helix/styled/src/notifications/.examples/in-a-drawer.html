<!-- @summary A bell in the header, a count on it, and the feed in a drawer behind it. -->
<!-- @min 420 -->

<helix-badge
  id="count"
  label="2 unread"
  value="2"
>
  <helix-icon-button
    command="--show"
    commandfor="panel"
    label="Notifications"
  >
    <helix-icon name="bell"></helix-icon>
  </helix-icon-button>
</helix-badge>

<helix-drawer
  id="panel"
  label="Notifications"
  placement="end"
>
  <span slot="header">Notifications</span>

  <helix-notifications
    id="feed"
    label="Notifications"
    mark-all
  >
    <helix-notification dismissible>
      <strong>Ada Okonjo</strong> approved your deploy to production.
      <helix-button
        emphasis="ghost"
        slot="actions"
      >View</helix-button>
    </helix-notification>

    <helix-notification dismissible>
      Build <strong>#4821</strong> failed on <code>main</code>
      <helix-button
        emphasis="ghost"
        slot="actions"
      >Logs</helix-button>
    </helix-notification>

    <helix-notification
      default-read
      dismissible
    >
      Your invitation to the <strong>Platform</strong> team was accepted.
    </helix-notification>
  </helix-notifications>
</helix-drawer>

<script type="module">
  const feed = document.getElementById('feed')
  const count = document.getElementById('count')

  /* The script sets the timestamps so they stay recent. */
  const ago = (minutes) => new Date(Date.now() - minutes * 60000).toISOString()
  const items = feed.querySelectorAll('helix-notification')
  items[0].at = ago(3)
  items[1].at = ago(42)
  items[2].at = ago(1500)

  /* Your page owns the unread count. It updates the badge when the feed reports
     a change. */
  const recount = () => {
    const unread = [...feed.querySelectorAll('helix-notification')].filter(
      (one) => !one.read,
    ).length
    count.value = unread
    count.label = `${unread} unread`
  }

  feed.addEventListener('helix-read', () => queueMicrotask(recount))
  feed.addEventListener('helix-dismiss', () => queueMicrotask(recount))
</script>
