<!-- @summary A feed with unread items, a mark-all control, and timestamps that stay correct. -->

<link
  href="styles.css"
  rel="stylesheet"
>

<helix-notifications
  class="feed"
  id="feed"
  label="Notifications"
  mark-all
>
  <h2 slot="header">Notifications</h2>

  <helix-notification dismissible>
    <helix-avatar
      name="Ada Okonjo"
      slot="media"
    ></helix-avatar>
    <strong>Ada Okonjo</strong> approved your deploy to production.
    <helix-button
      emphasis="subtle"
      slot="actions"
    >View</helix-button>
  </helix-notification>

  <!-- Not everything in a feed is a person, and the column takes either: the
       row asks only that something is there to sit in it. -->
  <helix-notification dismissible>
    <helix-icon
      name="warning"
      slot="media"
    ></helix-icon>
    Build <strong>#4821</strong> failed on <code>main</code>
    <helix-button
      emphasis="subtle"
      slot="actions"
    >Logs</helix-button>
  </helix-notification>

  <helix-notification
    default-read
    dismissible
  >
    <helix-avatar
      name="Platform Team"
      slot="media"
    ></helix-avatar>
    Your invitation to the <strong>Platform</strong> team was accepted.
  </helix-notification>

  <a
    data-link="quiet"
    href="#all"
    slot="footer"
  >See everything</a>
</helix-notifications>

<script>
  /* Set from script rather than written into the markup, because a timestamp in
     an example is stale the moment it is committed: written as a literal, the
     feed reads "8 months ago" by the time anybody looks at it. */
  const feed = document.getElementById('feed')
  const ago = (minutes) => new Date(Date.now() - minutes * 60_000).toISOString()

  const items = feed.querySelectorAll('helix-notification')
  items[0].at = ago(3)
  items[1].at = ago(42)
  items[2].at = ago(1500)
</script>
