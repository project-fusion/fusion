<!-- @summary Pressing the dismiss button sends `helix-dismiss`. The announcement stays in the page until your code removes it. -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-announcement
    dismissible
    id="bar"
    tone="info"
  >
    A new version is available.
  </helix-announcement>


  <helix-list
    divided
    id="log"
    label="Events"
  >
    <helix-list-item>
      No events yet
      <span slot="description">Press the close control</span>
    </helix-list-item>
  </helix-list>
</helix-flex>

<script type="module">
  const bar = document.getElementById('bar')
  const log = document.getElementById('log')
  let empty = true

  // The number of rows the log keeps.
  const KEEP = 6

  const say = (name, carried) => {
    if (empty) {
      log.replaceChildren()
      empty = false
    }
    const row = document.createElement('helix-list-item')
    row.textContent = name
    const under = document.createElement('span')
    under.slot = 'description'
    under.textContent = carried
    row.append(under)
    log.append(row)
    while (log.children.length > KEEP) {
      log.firstElementChild.remove()
    }
  }

  bar.addEventListener('helix-dismiss', (event) => {
    say('helix-dismiss', `"${event.detail.label}" was dismissed`)
  })
</script>
