<!-- @summary A loader that names the region it loads with `for`, which is marked `aria-busy` while the loader is on the page. -->
<!-- @react-native-summary A loader above the region it loads. `for` is the web's, so a phone marks no region busy. -->
<helix-flex
  direction="column"
  gap="sm"
>
  <helix-loader
    for="orders"
    label="Loading orders"
  ></helix-loader>
  <section
    aria-label="Orders"
    id="orders"
  >
    <helix-text scale="body">Orders appear here once they load.</helix-text>
  </section>
</helix-flex>
