<!-- @summary The resting star, and `dots`, plain circles for a level such as how spicy a dish is. -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-rating
    default-value="3"
    label="Star"
    show-value
  ></helix-rating>
  <helix-rating
    default-value="2"
    label="Dots"
    max="4"
    shape="dots"
    show-value
  ></helix-rating>
</helix-flex>
