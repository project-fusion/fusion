<!-- @summary One set of events per chosen score. A drag sends nothing until it is released. -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-rating
    default-value="3"
    id="score"
    label="Rate this release"
  ></helix-rating>


  <helix-list
    divided
    id="log"
    label="What arrived"
  >
    <helix-list-item>
      Nothing yet
      <span slot="description">Choose a score</span>
    </helix-list-item>
  </helix-list>
</helix-flex>

<script type="module">
  const score = document.getElementById('score')
  const log = document.getElementById('log')
  let empty = true

  // How many rows the log holds, which is a choice about this preview's height.
  const KEEP = 6

  const say = (name, carried) => {
    if (empty) {
      log.replaceChildren()
      empty = false
    }
    const row = document.createElement('helix-list-item')
    row.textContent = name
    const under = document.createElement('span')
    under.slot = 'description'
    under.textContent = carried
    row.append(under)
    log.append(row)
    while (log.children.length > KEEP) {
      log.firstElementChild.remove()
    }
  }

  score.addEventListener('helix-before-change', (event) => {
    say('helix-before-change', `proposing "${event.detail.value}", refusable`)
  })
  score.addEventListener('input', (event) => {
    say('input', `"${event.currentTarget.value}" as it is chosen`)
  })
  score.addEventListener('change', (event) => {
    say('change', `"${event.currentTarget.value}", the reader is done`)
  })
</script>
