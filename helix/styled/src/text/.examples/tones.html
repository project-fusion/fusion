<!-- @summary Each tone at full strength and at its one quieter step. -->
<helix-flex
  direction="column"
  gap="sm"
>
  <helix-flex gap="lg">
    <helix-text as="p">Default</helix-text>
    <helix-text
      as="p"
      emphasis="muted"
    >Muted</helix-text>
    <helix-text
      as="p"
      emphasis="subtle"
    >Subtle</helix-text>
  </helix-flex>
  <helix-flex gap="lg">
    <helix-text
      as="p"
      tone="primary"
    >Primary</helix-text>
    <helix-text
      as="p"
      emphasis="muted"
      tone="primary"
    >Muted primary</helix-text>
  </helix-flex>
  <helix-flex gap="lg">
    <helix-text
      as="p"
      tone="accent"
    >Accent</helix-text>
    <helix-text
      as="p"
      emphasis="muted"
      tone="accent"
    >Muted accent</helix-text>
  </helix-flex>
  <helix-flex gap="lg">
    <helix-text
      as="p"
      tone="info"
    >Info</helix-text>
    <helix-text
      as="p"
      emphasis="muted"
      tone="info"
    >Muted info</helix-text>
  </helix-flex>
  <helix-flex gap="lg">
    <helix-text
      as="p"
      tone="success"
    >Success</helix-text>
    <helix-text
      as="p"
      emphasis="muted"
      tone="success"
    >Muted success</helix-text>
  </helix-flex>
  <helix-flex gap="lg">
    <helix-text
      as="p"
      tone="warning"
    >Warning</helix-text>
    <helix-text
      as="p"
      emphasis="muted"
      tone="warning"
    >Muted warning</helix-text>
  </helix-flex>
  <helix-flex gap="lg">
    <helix-text
      as="p"
      tone="danger"
    >Danger</helix-text>
    <helix-text
      as="p"
      emphasis="muted"
      tone="danger"
    >Muted danger</helix-text>
  </helix-flex>
</helix-flex>
