<!-- @summary The text scale from the largest display size down to the smallest. -->
<helix-flex
  direction="column"
  gap="sm"
>
  <helix-text
    as="p"
    scale="display"
  >Display</helix-text>
  <helix-text
    as="p"
    scale="heading"
  >Heading</helix-text>
  <helix-text
    as="p"
    scale="subheading"
  >Subheading</helix-text>
  <helix-text
    as="p"
    scale="title"
  >Title</helix-text>
  <helix-text
    as="p"
    scale="body"
  >Body</helix-text>
  <helix-text
    as="p"
    scale="body-strong"
  >Body strong</helix-text>
  <helix-text
    as="p"
    scale="caption"
  >Caption</helix-text>
  <helix-text
    as="p"
    scale="label"
  >Label</helix-text>
  <helix-text
    as="p"
    scale="code"
  >Code</helix-text>
</helix-flex>
