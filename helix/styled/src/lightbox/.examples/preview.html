<!-- @summary A set of pictures shown over the page, moved through with the arrow keys. -->
<!-- @min 420 -->
<link
  href="styles.css"
  rel="stylesheet"
/>

<helix-button
  command="--show"
  commandfor="gallery"
>Open gallery</helix-button>

<!-- The lightbox starts open, so the preview shows it. -->
<helix-lightbox
  id="gallery"
  label="Beach photos"
  loop
  open
>
  <helix-button-group
    label="Lightbox actions"
    slot="header"
  >
    <helix-icon-button
      command="--previous"
      commandfor="gallery"
      label="Previous picture"
    >
      <helix-icon name="caret-left"></helix-icon>
    </helix-icon-button>
    <helix-icon-button
      command="--next"
      commandfor="gallery"
      label="Next picture"
    >
      <helix-icon name="caret-right"></helix-icon>
    </helix-icon-button>
    <helix-icon-button
      command="--close"
      commandfor="gallery"
      label="Close"
    >
      <helix-icon name="x"></helix-icon>
    </helix-icon-button>
  </helix-button-group>

  <helix-lightbox-item
    label="Seawater over pale sand"
    value="seawater"
  >
    <img
      alt="Seawater over pale sand"
      src="/media/scale/seawater-800.jpg"
    />
    <helix-text slot="description">Shallow water at the beach in the morning.</helix-text>
  </helix-lightbox-item>

  <helix-lightbox-item
    label="The sun low over open water"
    value="ocean-sun"
  >
    <img
      alt="The sun low over open water"
      src="/media/scale/ocean-sun.jpg"
    />
    <helix-text slot="description">Sunset over the ocean the same day.</helix-text>
  </helix-lightbox-item>
</helix-lightbox>
