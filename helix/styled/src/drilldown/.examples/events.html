<!-- @summary The `helix-select` event, sent when you choose a row at any level of the menu. -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-drilldown
    id="settings"
    label="Settings"
  >
    <helix-drilldown-item value="appearance">
      Appearance
      <helix-drilldown-item
        slot="page"
        value="theme"
      >Theme</helix-drilldown-item>
      <helix-drilldown-item
        slot="page"
        value="density"
      >Density</helix-drilldown-item>
    </helix-drilldown-item>
    <helix-drilldown-item value="account">Account</helix-drilldown-item>
  </helix-drilldown>


  <helix-list
    divided
    id="log"
    label="Events"
  >
    <helix-list-item>
      No events yet
      <span slot="description">Choose a setting, or open Appearance</span>
    </helix-list-item>
  </helix-list>
</helix-flex>

<script type="module">
  const settings = document.getElementById('settings')
  const log = document.getElementById('log')
  let empty = true

  // The log keeps the last six events.
  const KEEP = 6

  const say = (name, carried) => {
    if (empty) {
      log.replaceChildren()
      empty = false
    }
    const row = document.createElement('helix-list-item')
    row.textContent = name
    const under = document.createElement('span')
    under.slot = 'description'
    under.textContent = carried
    row.append(under)
    log.append(row)
    while (log.children.length > KEEP) {
      log.firstElementChild.remove()
    }
  }

  settings.addEventListener('helix-select', (event) => {
    say('helix-select', `Chose "${event.detail.value}"`)
  })
</script>
