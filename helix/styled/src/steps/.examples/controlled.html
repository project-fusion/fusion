<!-- @summary A sequence controlled by your code, which handles the event and sets `active`. -->

<helix-steps
  active="details"
  id="flow"
>
  <helix-step value="account">Account</helix-step>
  <helix-step value="details">Details</helix-step>
  <helix-step value="review">Review</helix-step>
</helix-steps>

<script>
  const flow = document.getElementById('flow')

  flow.addEventListener('helix-before-activate', (event) => {
    flow.active = event.detail.value
  })
</script>
