<!-- @summary A step asks to be the current one, and the sequence decides. -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-steps
    id="flow"
    label="Checkout"
  >
    <helix-step value="details">Details</helix-step>
    <helix-step value="payment">Payment</helix-step>
    <helix-step value="review">Review</helix-step>
  </helix-steps>


  <helix-list
    divided
    id="log"
    label="What arrived"
  >
    <helix-list-item>
      Nothing yet
      <span slot="description">Press a step</span>
    </helix-list-item>
  </helix-list>
</helix-flex>

<script type="module">
  const flow = document.getElementById('flow')
  const log = document.getElementById('log')
  let empty = true

  // How many rows the log holds, which is a choice about this preview's height.
  const KEEP = 6

  const say = (name, carried) => {
    if (empty) {
      log.replaceChildren()
      empty = false
    }
    const row = document.createElement('helix-list-item')
    row.textContent = name
    const under = document.createElement('span')
    under.slot = 'description'
    under.textContent = carried
    row.append(under)
    log.append(row)
    while (log.children.length > KEEP) {
      log.firstElementChild.remove()
    }
  }

  flow.addEventListener('helix-before-activate', (event) => {
    say('helix-before-activate', `proposing "${event.detail.value}", refusable`)
  })
  flow.addEventListener('helix-select', (event) => {
    say('helix-select', `"${event.detail.value}" was pressed, which is the step speaking`)
  })
</script>
