<!-- @summary The month shown is set by your code, so your own controls can page it. -->

<helix-date-picker
  id="calendar"
  month="2026-12"
></helix-date-picker>

<script>
  const calendar = document.getElementById('calendar')

  calendar.addEventListener('helix-navigate', (event) => {
    calendar.month = event.detail.value
  })
</script>
