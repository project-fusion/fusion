<!-- @summary Paging the month sends `helix-navigate`, and choosing a day sends `helix-before-change`, `input`, and `change`. -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-date-picker
    default-month="2026-08"
    id="calendar"
    label="Delivery date"
  ></helix-date-picker>


  <helix-list
    divided
    id="log"
    label="Events"
  >
    <helix-list-item>
      No events yet
      <span slot="description">Change the month, then choose a day</span>
    </helix-list-item>
  </helix-list>
</helix-flex>

<script type="module">
  const calendar = document.getElementById('calendar')
  const log = document.getElementById('log')
  let empty = true

  // The log keeps the last six events.
  const KEEP = 6

  const say = (name, carried) => {
    if (empty) {
      log.replaceChildren()
      empty = false
    }
    const row = document.createElement('helix-list-item')
    row.textContent = name
    const under = document.createElement('span')
    under.slot = 'description'
    under.textContent = carried
    row.append(under)
    log.append(row)
    while (log.children.length > KEEP) {
      log.firstElementChild.remove()
    }
  }

  calendar.addEventListener('helix-before-change', (event) => {
    say('helix-before-change', `Proposed "${event.detail.value}"`)
  })
  calendar.addEventListener('input', (event) => {
    say('input', `Value is "${event.currentTarget.value}"`)
  })
  calendar.addEventListener('change', (event) => {
    say('change', `Chose "${event.currentTarget.value}"`)
  })
  calendar.addEventListener('helix-navigate', (event) => {
    say('helix-navigate', `Showing ${event.detail.value}`)
  })
</script>
