<!-- @summary Two people's pointers on a shared board, gliding to each new place a collaboration service reports. -->
<link
  href="styles.css"
  rel="stylesheet"
/>

<helix-flex
  direction="column"
  gap="md"
>
  <div class="board">
    <helix-cursor
      id="ada"
      name="Ada"
      series="1"
      x="40"
      y="40"
    ></helix-cursor>
    <helix-cursor
      id="grace"
      name="Grace"
      series="4"
      x="220"
      y="120"
    ></helix-cursor>
  </div>

  <helix-button id="report">Report new places</helix-button>
</helix-flex>

<script type="module">
  const ada = document.getElementById('ada')
  const grace = document.getElementById('grace')
  const places = [
    [40, 40, 220, 120],
    [180, 90, 60, 150],
    [260, 30, 140, 60],
  ]
  let turn = 0

  // Stands in for a collaboration service reporting where each person points.
  document.getElementById('report').addEventListener('click', () => {
    turn = (turn + 1) % places.length
    ;[ada.x, ada.y, grace.x, grace.y] = places[turn]
  })
</script>
