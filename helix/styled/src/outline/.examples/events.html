<!-- @summary The section in view, reported by `helix-activate` as the page scrolls. -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-outline
    id="rail"
    label="On this page"
  ></helix-outline>

  <helix-scroll-area
    label="Reading"
    max-block-size="sm"
  >
    <helix-flex
      direction="column"
      gap="3xl"
    >
      <helix-outline-section
        anchor="install"
        label="Install"
      >
        <helix-text
          as="h2"
          scale="title"
        >
          Install
        </helix-text>
        <helix-text as="p">Add the package to your project.</helix-text>
      </helix-outline-section>
      <helix-outline-section
        anchor="usage"
        label="Usage"
      >
        <helix-text
          as="h2"
          scale="title"
        >
          Usage
        </helix-text>
        <helix-text as="p">Create a client with your API key.</helix-text>
      </helix-outline-section>
      <helix-outline-section
        anchor="api"
        label="API"
      >
        <helix-text
          as="h2"
          scale="title"
        >
          API
        </helix-text>
        <helix-text as="p">Each method lists its parameters.</helix-text>
      </helix-outline-section>
    </helix-flex>
  </helix-scroll-area>

  <helix-list
    divided
    id="log"
    label="Events"
  >
    <helix-list-item>No events yet<helix-text slot="description">Scroll the panel, or press a heading</helix-text>
    </helix-list-item>
  </helix-list>
</helix-flex>

<script type="module">
  const rail = document.getElementById('rail')
  const log = document.getElementById('log')
  let empty = true

  // The log keeps the last six events.
  const KEEP = 6

  const say = (name, carried) => {
    if (empty) {
      log.replaceChildren()
      empty = false
    }
    const row = document.createElement('helix-list-item')
    row.textContent = name
    const under = document.createElement('span')
    under.slot = 'description'
    under.textContent = carried
    row.append(under)
    log.append(row)
    while (log.children.length > KEEP) {
      log.firstElementChild.remove()
    }
  }

  rail.addEventListener('helix-activate', (event) => {
    say('helix-activate', `Section "${event.detail.value}" is in view`)
  })
</script>
