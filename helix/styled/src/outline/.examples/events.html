<!-- @summary The section in view, reported by `helix-activate` as the page scrolls. -->
<link
  href="styles.css"
  rel="stylesheet"
>
<helix-flex
  direction="column"
  gap="md"
>
  <helix-outline
    id="rail"
    label="On this page"
  >
    <a href="#install">Install</a>
    <a href="#usage">Usage</a>
    <a href="#api">API</a>
  </helix-outline>

  <div class="reading">
    <section id="install"><h2>Install</h2>Add the package to your project.</section>
    <section id="usage"><h2>Usage</h2>Create a client with your API key.</section>
    <section id="api"><h2>API</h2>Each method lists its parameters.</section>
  </div>


  <helix-list
    divided
    id="log"
    label="Events"
  >
    <helix-list-item>No events yet<span slot="description">Scroll the panel, or press a heading</span>
    </helix-list-item>
  </helix-list>
</helix-flex>

<script type="module">
  const rail = document.getElementById('rail')
  const log = document.getElementById('log')
  let empty = true

  // The log keeps the last six events.
  const KEEP = 6

  const say = (name, carried) => {
    if (empty) {
      log.replaceChildren()
      empty = false
    }
    const row = document.createElement('helix-list-item')
    row.textContent = name
    const under = document.createElement('span')
    under.slot = 'description'
    under.textContent = carried
    row.append(under)
    log.append(row)
    while (log.children.length > KEEP) {
      log.firstElementChild.remove()
    }
  }

  rail.addEventListener('helix-activate', (event) => {
    say('helix-activate', `Section "${event.detail.value}" is in view`)
  })
</script>
