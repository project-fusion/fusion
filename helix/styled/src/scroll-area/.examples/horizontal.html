<!-- @summary A row wider than its box, with fades on the edges that have more content. -->
<link
  href="styles.css"
  rel="stylesheet"
>
<helix-grid
  class="frame"
>
  <helix-scroll-area
    label="Sections"
  >
    <helix-grid
      class="cards"
      gap="sm"
    >
      <helix-card separation="outlined">
        <helix-text
          as="h3"
          slot="header"
        >Overview</helix-text>
        Everything at a glance, updated live.
      </helix-card>
      <helix-card separation="outlined">
        <helix-text
          as="h3"
          slot="header"
        >Reports</helix-text>
        Build, schedule, and share reports.
      </helix-card>
      <helix-card separation="outlined">
        <helix-text
          as="h3"
          slot="header"
        >Billing</helix-text>
        Invoices, proration, and receipts.
      </helix-card>
      <helix-card separation="outlined">
        <helix-text
          as="h3"
          slot="header"
        >Members</helix-text>
        Manage who has access.
      </helix-card>
      <helix-card separation="outlined">
        <helix-text
          as="h3"
          slot="header"
        >Settings</helix-text>
        Defaults for the whole workspace.
      </helix-card>
    </helix-grid>
  </helix-scroll-area>
</helix-grid>
