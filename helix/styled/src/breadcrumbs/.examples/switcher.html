<!-- @summary Switcher crumbs, whose name goes to its page and whose chevron opens a menu of its sibling pages, at the resting `plain` separation and at `outlined`, which draws a line between the two halves while the crumb is in use. -->
<!-- @min 380 -->

<helix-flex
  direction="column"
  gap="lg"
>
  <helix-breadcrumbs aria-label="Breadcrumb">
    <helix-breadcrumb href="#acme">acme</helix-breadcrumb>
    <helix-breadcrumb href="#design-system">
      design-system
      <helix-menu
        label="Switch project"
        slot="end"
      >
        <helix-icon-button
          emphasis="ghost"
          label="Switch project"
          slot="trigger"
        >
          <helix-icon name="caret-down"></helix-icon>
        </helix-icon-button>
        <helix-menu-item href="#design-system">design-system</helix-menu-item>
        <helix-menu-item href="#marketing-site">marketing-site</helix-menu-item>
        <helix-menu-item href="#docs">docs</helix-menu-item>
      </helix-menu>
    </helix-breadcrumb>
    <helix-breadcrumb current>Settings</helix-breadcrumb>
  </helix-breadcrumbs>

  <helix-breadcrumbs
    aria-label="Breadcrumb"
    separation="outlined"
  >
    <helix-breadcrumb href="#acme">acme</helix-breadcrumb>
    <helix-breadcrumb href="#design-system">
      design-system
      <helix-menu
        label="Switch project"
        slot="end"
      >
        <helix-icon-button
          emphasis="ghost"
          label="Switch project"
          slot="trigger"
        >
          <helix-icon name="caret-down"></helix-icon>
        </helix-icon-button>
        <helix-menu-item href="#design-system">design-system</helix-menu-item>
        <helix-menu-item href="#marketing-site">marketing-site</helix-menu-item>
        <helix-menu-item href="#docs">docs</helix-menu-item>
      </helix-menu>
    </helix-breadcrumb>
    <helix-breadcrumb current>Settings</helix-breadcrumb>
  </helix-breadcrumbs>
</helix-flex>
