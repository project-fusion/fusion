<!-- @summary Options in a listbox, with one selected and one disabled. -->
<link
  href="styles.css"
  rel="stylesheet"
/>

<!-- An option needs a parent with `role="listbox"`. -->
<div
  aria-label="Assignee"
  class="listbox"
  role="listbox"
>
  <helix-option
    selected
    value="one"
  >Alex Kim</helix-option>
  <helix-option
    data-active
    value="two"
  >Sam Patel</helix-option>
  <helix-option value="three">Jordan Lee</helix-option>
  <helix-option
    disabled
    value="four"
  >Priya Shah</helix-option>
</div>
