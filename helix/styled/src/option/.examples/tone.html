<!-- @summary Options in the `neutral` tone, and a last option in the `danger` tone for an action that cannot be undone. -->
<link

  rel="stylesheet"
/>

<helix-listbox
  class="listbox"
  label="Token actions"
>
  <helix-option
    tone="neutral"

  <helix-option

  <helix-option

</helix-listbox>
