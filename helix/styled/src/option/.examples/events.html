<!-- @summary Choosing an option sends `helix-select`, which bubbles to the listbox around it. -->
<!-- @min 300 -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-listbox
    id="owner"
    label="Assignee"
  >
    <helix-option value="ada">Ada Okonjo</helix-option>
    <helix-option value="grace">Sam Patel</helix-option>
    <helix-option value="alan">Alex Kim</helix-option>
  </helix-listbox>


  <helix-list
    divided
    id="log"
    label="Events"
  >
    <helix-list-item>
      No events yet
      <span slot="description">Choose an option</span>
    </helix-list-item>
  </helix-list>
</helix-flex>

<script type="module">
  const owner = document.getElementById('owner')
  const log = document.getElementById('log')
  let empty = true

  // The log keeps the last six events.
  const KEEP = 6

  const say = (name, carried) => {
    if (empty) {
      log.replaceChildren()
      empty = false
    }
    const row = document.createElement('helix-list-item')
    row.textContent = name
    const under = document.createElement('span')
    under.slot = 'description'
    under.textContent = carried
    row.append(under)
    log.append(row)
    while (log.children.length > KEEP) {
      log.firstElementChild.remove()
    }
  }

  /* `helix-select` bubbles, so the listbox hears it from every option.
     `composedPath()[0]` is the option that sent it. */
  owner.addEventListener('helix-select', (event) => {
    say('helix-select', `"${event.detail.value}" from <${event.composedPath()[0].localName}>`)
  })
</script>
