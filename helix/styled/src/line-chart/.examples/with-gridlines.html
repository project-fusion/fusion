<!-- @summary Rules at the levels a reader would infer, so a reading can be placed against one. -->

<table
  data-hidden-visually
  id="linechartgrid"
>
  <caption>Response time</caption>
  <thead>
    <tr>
      <th scope="col">Week</th>
      <th scope="col">p50</th>
      <th scope="col">p99</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <th scope="row">W1</th>
      <td data-value="120">120</td>
      <td data-value="410">410</td>
    </tr>
    <tr>
      <th scope="row">W2</th>
      <td data-value="140">140</td>
      <td data-value="620">620</td>
    </tr>
    <tr>
      <th scope="row">W3</th>
      <td data-value="115">115</td>
      <td data-value="380">380</td>
    </tr>
    <tr>
      <th scope="row">W4</th>
      <td data-value="180">180</td>
      <td data-value="840">840</td>
    </tr>
    <tr>
      <th scope="row">W5</th>
      <td data-value="150">150</td>
      <td data-value="520">520</td>
    </tr>
  </tbody>
</table>

<helix-line-chart
  for="linechartgrid"
  gridlines="both"
  zero
></helix-line-chart>
