<!-- @summary A sliding window of readings: each new reading pushes out the oldest, and the line moves along. -->
<!-- @min 420 -->

<helix-flex
  direction="column"
  gap="md"
>
  <!-- Each new reading adds a row to the table and removes the oldest one. The
       chart redraws from the table. -->
  <table
    data-hidden-visually
    id="feed"
  >
    <caption>Requests a second</caption>
    <thead>
      <tr>
        <th scope="col">Second</th>
        <th scope="col">Requests</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <helix-line-chart
    curve="smooth"
    for="feed"
  ></helix-line-chart>

  <helix-button id="restart">Restart feed</helix-button>
</helix-flex>

<script>
  const body = document.querySelector('#feed tbody')
  const restart = document.getElementById('restart')

  /* The number of readings shown at once. */
  const WINDOW = 24
  const still = window.matchMedia('(prefers-reduced-motion: reduce)')

  let at = 0
  let timer = 0

  const reading = () => {
    at += 1
    const row = document.createElement('tr')
    const when = document.createElement('th')
    when.scope = 'row'
    when.textContent = `${at}s`
    /* Two sine waves give the HTML and React versions the same data, so their
       screenshots match. */
    const value = 220 + Math.round(Math.sin(at / 3) * 60 + Math.sin(at / 1.7) * 22)
    const cell = document.createElement('td')
    cell.dataset.value = String(value)
    cell.textContent = value.toLocaleString()
    row.append(when, cell)
    body.append(row)
    while (body.children.length > WINDOW) {
      body.firstElementChild.remove()
    }
  }

  const fill = () => {
    body.replaceChildren()
    at = 0
    for (let i = 0; i < WINDOW; i += 1) {
      reading()
    }
  }

  const run = () => {
    clearInterval(timer)
    fill()
    /* With reduced motion on, the chart shows one full window and stops. */
    if (still.matches) {
      return
    }
    timer = setInterval(reading, 600)
  }

  restart.addEventListener('click', run)
  still.addEventListener('change', run)
  run()
</script>
