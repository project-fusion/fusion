<!-- @summary A terminal that fills one pane of a Splitter, flush with its edges, under a session, with a button of your own in its header. -->
<link
  href="styles.css"
  rel="stylesheet"
/>

<helix-splitter
  default-position="45"
  orientation="vertical"
>
  <helix-card
    separation="plain"
    slot="start"
  >
    <helix-text>Session</helix-text>
  </helix-card>
  <div
    class="pane"
    slot="end"
  >
    <!-- Preview frame: data-preview-terminal has the frame connect xterm.js; on your page, connectTerminal does. -->
    <helix-terminal
      controls="find clear fullscreen"
      data-preview-terminal
      fill
      id="pane"
      label="zsh"
      separation="plain"
    >
      <helix-icon-button
        label="New terminal"
        slot="actions"
      >
        <helix-icon name="plus"></helix-icon>
      </helix-icon-button>
      <div data-preview-terminal-canvas></div>
    </helix-terminal>
  </div>
</helix-splitter>

<script type="module">
  document
    .getElementById('pane')
    .write('\x1b[36m~\x1b[0m \x1b[32m❯\x1b[0m ls\r\nDesktop  Development  Documents  Downloads\r\n\x1b[36m~\x1b[0m \x1b[32m❯\x1b[0m ')
</script>
