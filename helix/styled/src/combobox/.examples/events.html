<!-- @summary The seven events fired for one choice, each reporting a different change. -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-combobox
    creatable
    id="language"
    label="Language"
    name="language"
    placeholder="Search languages"
  >
    <helix-option value="rust">Rust</helix-option>
    <helix-option value="ts">TypeScript</helix-option>
    <helix-option value="go">Go</helix-option>
  </helix-combobox>


  <helix-list
    divided
    id="log"
    label="Events"
  >
    <helix-list-item>
      No events yet
      <span slot="description">Type to filter, then choose a language</span>
    </helix-list-item>
  </helix-list>
</helix-flex>

<script type="module">
  const language = document.getElementById('language')
  const log = document.getElementById('log')
  let empty = true

  // The log keeps the last nine events.
  const KEEP = 9

  const say = (name, carried) => {
    if (empty) {
      log.replaceChildren()
      empty = false
    }
    const row = document.createElement('helix-list-item')
    row.textContent = name
    const under = document.createElement('span')
    under.slot = 'description'
    under.textContent = carried
    row.append(under)
    log.append(row)
    while (log.children.length > KEEP) {
      log.firstElementChild.remove()
    }
  }

  language.addEventListener('helix-before-open', () => {
    say('helix-before-open', 'About to open')
  })
  language.addEventListener('helix-before-close', () => {
    say('helix-before-close', 'About to close')
  })
  language.addEventListener('toggle', (event) => {
    say('toggle', `Changed from ${event.oldState} to ${event.newState}`)
  })
  language.addEventListener('helix-filter', (event) => {
    say('helix-filter', `Filter text is "${event.detail.value}"`)
  })
  language.addEventListener('helix-before-change', (event) => {
    say('helix-before-change', `Proposed "${event.detail.value}"`)
  })
  language.addEventListener('input', (event) => {
    say('input', `Value is "${event.currentTarget.value}"`)
  })
  language.addEventListener('change', (event) => {
    say('change', `Chose "${event.currentTarget.value}"`)
  })
  language.addEventListener('helix-create', (event) => {
    say('helix-create', `Created "${event.detail.value}"`)
  })
</script>
