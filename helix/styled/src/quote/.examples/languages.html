<!-- @summary A quotation's marks follow the `lang` written on it, so a German and a French quotation take their own marks inside English text. -->
<!-- @layout hug -->
<helix-flex
  direction="column"
  gap="sm"
>
  <helix-text variant="body">
    The sign said
    <helix-quote lang="de">Bitte nicht berühren</helix-quote>
    in German.
  </helix-text>
  <helix-text variant="body">
    The menu called it
    <helix-quote lang="fr">la spécialité de la maison</helix-quote>
    in French.
  </helix-text>
</helix-flex>
