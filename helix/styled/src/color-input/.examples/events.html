<!-- @summary The events the field sends as its panel opens and closes and its value changes. -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-color-input
    id="brand"
    label="Brand color"
    name="brand"
  ></helix-color-input>


  <helix-list
    divided
    id="log"
    label="Events"
  >
    <helix-list-item>
      No events yet
      <span slot="description">Open the swatch, then choose a color</span>
    </helix-list-item>
  </helix-list>
</helix-flex>

<script type="module">
  const brand = document.getElementById('brand')
  const log = document.getElementById('log')
  let empty = true

  // The number of rows the log keeps.
  const KEEP = 8

  const say = (name, carried) => {
    if (empty) {
      log.replaceChildren()
      empty = false
    }
    const row = document.createElement('helix-list-item')
    row.textContent = name
    const under = document.createElement('span')
    under.slot = 'description'
    under.textContent = carried
    row.append(under)
    log.append(row)
    while (log.children.length > KEEP) {
      log.firstElementChild.remove()
    }
  }

  brand.addEventListener('helix-before-open', () => {
    say('helix-before-open', 'the panel is about to open (cancelable)')
  })
  brand.addEventListener('helix-before-close', () => {
    say('helix-before-close', 'the panel is about to close (cancelable)')
  })
  brand.addEventListener('toggle', (event) => {
    say('toggle', `${event.oldState} to ${event.newState}`)
  })
  brand.addEventListener('helix-before-change', (event) => {
    say('helix-before-change', `about to change to "${event.detail.value}" (cancelable)`)
  })
  brand.addEventListener('input', (event) => {
    say('input', `value is now "${event.currentTarget.value}"`)
  })
  brand.addEventListener('change', (event) => {
    say('change', `value is now "${event.currentTarget.value}"`)
  })
</script>
