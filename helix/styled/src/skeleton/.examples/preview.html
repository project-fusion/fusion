<!-- @summary A circle and two lines of text, shown in place of a profile that is still loading. -->
<!-- @layout hug -->
<link
  href="styles.css"
  rel="stylesheet"
/>

<helix-flex
  align-items="center"
  gap="md"
>
  <helix-skeleton
    class="avatar"
    shape="circle"
  ></helix-skeleton>
  <helix-flex
    class="lines"
    direction="column"
    gap="2xs"
  >
    <helix-skeleton
      class="line-name"
      shape="text"
    ></helix-skeleton>
    <helix-skeleton
      class="line-detail"
      shape="text"
    ></helix-skeleton>
  </helix-flex>
</helix-flex>
