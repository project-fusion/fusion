<!-- @summary A light runs around the edge of a card while the work inside it goes on. -->
<helix-border-beam>
  <helix-card
    aria-labelledby="beam-title"
    separation="outlined"
  >
    <helix-text
      as="h3"
      id="beam-title"
      scale="title"
      slot="header"
    >Writing a reply</helix-text>

  </helix-card>
</helix-border-beam>
