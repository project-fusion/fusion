<!-- @summary A card lifted off the page with a shadow. -->
<helix-card
  aria-labelledby="elevated-title"
  separation="elevated"
>
  <helix-text
    as="h3"
    id="elevated-title"
    slot="header"
    variant="title"
  >Team plan</helix-text>
  Invite up to 10 people and share projects with your team.
  <helix-button
    emphasis="ghost"
    slot="footer"
  >Upgrade plan</helix-button>
</helix-card>
