  aria-labelledby="card-title"
  separation="outlined"
>

    id="card-title"
    slot="header"
  >Card Title</h3>
  Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod
  tempor incididunt ut labore.

    emphasis="ghost"
    slot="footer"
  >Action</helix-button>
</helix-card>
