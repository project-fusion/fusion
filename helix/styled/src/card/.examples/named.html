<!-- @summary A card named with `label`, which makes it a group a screen reader announces by that name. -->
<helix-card
  label="Storage"
  separation="outlined"
>
  <helix-text
    as="h3"
    slot="header"
  >Storage</helix-text>
  You have used 8 GB of the 10 GB in your plan.
  <helix-button
    emphasis="ghost"
    slot="footer"
  >Manage storage</helix-button>
</helix-card>
