<!-- @summary Media against the bottom edge, for a chart that sums up the card. -->
<link
  href="styles.css"
  rel="stylesheet"
>

<helix-card
  aria-labelledby="sessions-title"
  class="metric"
  media-placement="end"
  separation="outlined"
>
  <h3
    id="sessions-title"
    slot="header"
  >Sessions</h3>
  <helix-text
    as="p"
    variant="display"
  >12,481</helix-text>
  <helix-sparkline
    label="Sessions over the last seven days"
    plot="area"
    slot="media"
    values="1240 1318 1102 1291 1244 1180 1102"
  ></helix-sparkline>
</helix-card>
