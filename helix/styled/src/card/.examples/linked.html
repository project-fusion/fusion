<!-- @summary A card that navigates as a whole, with the link on its heading. -->
<helix-flex gap="md">
  <a
    data-card
    href="#one"
  >
    <helix-card aria-labelledby="redesign-title">
      <helix-text
        as="h3"
        id="redesign-title"
        slot="header"
      >Website redesign</helix-text>
      <p>Updated 2 hours ago by Alex Kim.</p>
    </helix-card>
  </a>
  <a
    aria-current="page"
    data-card
    href="#two"
  >
    <helix-card aria-labelledby="app-title">
      <helix-text
        as="h3"
        id="app-title"
        slot="header"
      >Mobile app</helix-text>
      <p>Updated yesterday by Maria Lopez.</p>
    </helix-card>
  </a>
</helix-flex>
