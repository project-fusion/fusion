<!-- @summary The three materials over one background, each a translucent fill paired with a backdrop filter. -->
<!-- @min 520 -->
<link
  href="styles.css"
  rel="stylesheet"
>

<div class="band">
  <helix-card
    aria-labelledby="glass-title"
    material="glass"
  >
    <h3
      id="glass-title"
      slot="header"
    >Storage</h3>
    You have used 8 GB of your 10 GB of storage.
  </helix-card>

  <helix-card
    aria-labelledby="frosted-title"
    material="frosted"
  >
    <h3
      id="frosted-title"
      slot="header"
    >Team members</h3>
    Six people have access to this project.
  </helix-card>

  <helix-card
    aria-labelledby="transparent-title"
    material="transparent"
  >
    <h3
      id="transparent-title"
      slot="header"
    >Next invoice</h3>
    Your next invoice is due on October 1, 2026.
  </helix-card>

  <helix-card
    aria-labelledby="opaque-title"
    separation="elevated"
  >
    <h3
      id="opaque-title"
      slot="header"
    >Notifications</h3>
    You have three unread messages.
  </helix-card>
</div>
