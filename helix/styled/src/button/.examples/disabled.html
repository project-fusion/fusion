<!-- @summary Disabled buttons in several appearances, including one disabled by its fieldset. -->
<helix-flex gap="sm">
  <helix-button
    disabled
    emphasis="solid"
    tone="primary"
  >Save changes</helix-button>
  <helix-button disabled>Cancel</helix-button>

  <!-- The disabled fieldset disables this button. -->
  <fieldset disabled>
    <helix-button emphasis="ghost">Reset</helix-button>
  </fieldset>
</helix-flex>
