<!-- @summary Each emphasis in the neutral, primary, and danger tones. -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-flex gap="sm">
    <helix-button>Cancel</helix-button>
    <helix-button tone="primary">Save</helix-button>
    <helix-button tone="danger">Delete</helix-button>
  </helix-flex>

  <helix-flex gap="sm">
    <helix-button emphasis="solid">Cancel</helix-button>
    <helix-button
      emphasis="solid"
      tone="primary"
    >Save</helix-button>
    <helix-button
      emphasis="solid"
      tone="danger"
    >Delete</helix-button>
  </helix-flex>

  <helix-flex gap="sm">
    <helix-button emphasis="subtle">Cancel</helix-button>
    <helix-button
      emphasis="subtle"
      tone="primary"
    >Save</helix-button>
    <helix-button
      emphasis="subtle"
      tone="danger"
    >Delete</helix-button>
  </helix-flex>

  <helix-flex gap="sm">
    <helix-button emphasis="ghost">Cancel</helix-button>
    <helix-button
      emphasis="ghost"
      tone="primary"
    >Save</helix-button>
    <helix-button
      emphasis="ghost"
      tone="danger"
    >Delete</helix-button>
  </helix-flex>
</helix-flex>
