<!-- @summary The four tones, which mark what an action means. -->
<!-- `accent` matches `primary` until the theme sets a second color. -->
<helix-flex gap="sm">
  <helix-button
    emphasis="solid"
    tone="primary"
  >Save</helix-button>
  <helix-button
    emphasis="solid"
    tone="accent"
  >Share</helix-button>
  <helix-button tone="neutral">Cancel</helix-button>
  <helix-button
    emphasis="solid"
    tone="danger"
  >Delete</helix-button>
</helix-flex>
