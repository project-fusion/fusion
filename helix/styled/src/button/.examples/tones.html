<!-- @summary The seven tones, which mark what an action means. A status reads the same on a button as on a tag. -->
<!-- `accent` matches `primary` until the theme sets a second color. -->
<helix-flex gap="sm">
  <helix-button
    emphasis="solid"
    tone="primary"
  >Save</helix-button>
  <helix-button
    emphasis="solid"
    tone="accent"
  >Share</helix-button>
  <helix-button tone="neutral">Cancel</helix-button>
  <helix-button
    emphasis="solid"
    tone="danger"
  >Delete</helix-button>
  <helix-button tone="info">Details</helix-button>
  <helix-button tone="success">Approve</helix-button>
  <helix-button tone="warning">Review</helix-button>
</helix-flex>
