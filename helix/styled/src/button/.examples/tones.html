<!-- @summary The four tones, each saying what the action means rather than how loud it is. -->
<helix-flex gap="sm">
  <helix-button
    emphasis="solid"
    tone="primary"
  >Button</helix-button>
  <helix-button
    emphasis="solid"
    tone="accent"
  >Button</helix-button>
  <helix-button tone="neutral">Button</helix-button>
  <helix-button
    emphasis="solid"
    tone="danger"
  >Button</helix-button>
</helix-flex>
