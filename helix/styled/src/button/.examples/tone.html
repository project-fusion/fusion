<!-- @summary Each tone at the resting emphasis and at `solid`. -->
<helix-flex
  direction="column"
  gap="md"
>
  <helix-flex
    gap="sm"
    wrap
  >
    <helix-button tone="neutral">Cancel</helix-button>
    <helix-button tone="primary">Save</helix-button>
    <helix-button tone="accent">Share</helix-button>
    <helix-button tone="danger">Delete</helix-button>
    <helix-button tone="info">Details</helix-button>
    <helix-button tone="success">Approve</helix-button>
    <helix-button tone="warning">Review</helix-button>
  </helix-flex>

  <helix-flex
    gap="sm"
    wrap
  >
    <helix-button
      emphasis="solid"
      tone="neutral"
    >Cancel</helix-button>
    <helix-button
      emphasis="solid"
      tone="primary"
    >Save</helix-button>
    <helix-button
      emphasis="solid"
      tone="accent"
    >Share</helix-button>
    <helix-button
      emphasis="solid"
      tone="danger"
    >Delete</helix-button>
    <helix-button
      emphasis="solid"
      tone="info"
    >Details</helix-button>
    <helix-button
      emphasis="solid"
      tone="success"
    >Approve</helix-button>
    <helix-button
      emphasis="solid"
      tone="warning"
    >Review</helix-button>
  </helix-flex>
</helix-flex>
