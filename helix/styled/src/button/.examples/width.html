<!-- @summary Buttons at their own width, at a standard width set by `--button-inline-size`, and at full width with `width`, then a narrow column with one button as wide as the column and one as wide as its label. -->
<link
  href="styles.css"
  rel="stylesheet"
>

<helix-flex
  direction="column"
  gap="md"
>
  <helix-flex gap="sm">
    <helix-button
      emphasis="solid"
      tone="primary"
    >Save</helix-button>
    <helix-button>Cancel</helix-button>
  </helix-flex>

  <helix-flex
    class="standard"
    gap="sm"
    wrap
  >
    <helix-button
      emphasis="solid"
      tone="primary"
    >Save</helix-button>
    <helix-button>Cancel</helix-button>
  </helix-flex>

  <helix-flex
    class="standard"
    gap="sm"
    wrap
  >
    <helix-button
      emphasis="solid"
      tone="primary"
    >Save</helix-button>
    <a
      data-button=""
      href="#cancel"
    >Cancel</a>
  </helix-flex>

  <helix-button
    emphasis="solid"
    tone="primary"
    width="full"
  >Continue</helix-button>

  <helix-flex
    class="column"
    direction="column"
    gap="sm"
  >
    <helix-button
      emphasis="solid"
      tone="primary"
    >Save changes</helix-button>
    <helix-button class="hug">Cancel</helix-button>
  </helix-flex>
</helix-flex>
