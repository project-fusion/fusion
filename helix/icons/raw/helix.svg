<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" fill="none" role="img" aria-label="Helix">
  <title>Helix</title>
  <!-- Two strands winding a common axis at x=128, crossing twice. Stroked
       rather than filled: a ribbon's outline at this size is two paths that
       have to stay a constant distance apart through four bends, and a stroke
       is that constraint stated once. -->
  <path
    d="M72 44C72 88 184 88 184 128C184 168 72 168 72 212"
    stroke="url(#helix-grad-front)"
    stroke-linecap="round"
    stroke-width="28"
  />
  <path
    d="M184 44C184 88 72 88 72 128C72 168 184 168 184 212"
    stroke="url(#helix-grad-back)"
    stroke-linecap="round"
    stroke-width="28"
  />
  <defs>
    <linearGradient gradientUnits="userSpaceOnUse" id="helix-grad-front"
      x1="128" x2="128" y1="44" y2="212">
      <stop stop-color="var(--logo-color-from, var(--helix-color-primary))" />
      <stop offset="1" stop-color="var(--logo-color-to, var(--helix-color-primary-active))" />
    </linearGradient>
    <linearGradient gradientUnits="userSpaceOnUse" id="helix-grad-back"
      x1="128" x2="128" y1="44" y2="212">
      <stop stop-color="var(--logo-color-to, var(--helix-color-primary-active))" />
      <stop offset="1" stop-color="var(--logo-color-mid, var(--helix-color-primary-hover))" />
    </linearGradient>
  </defs>
</svg>
