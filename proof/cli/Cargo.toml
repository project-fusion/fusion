[package]
name = "fusion-proof-cli"
description = "The Fusion Proof command line: visual regression testing with baselines kept in git."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
# Its own, never `workspace = true`. See the note in the root manifest.
version = "0.0.0-dev"

# **The binary drops the suffix**, per the naming rule: the crate is
# `fusion-proof-cli` and the command a reader types is `proof`.
[[bin]]
name = "proof"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
# **The version a release installs, read beside the binary.** Shared with the
# other two command lines and owned by none of them, so this is no dependency on
# the fusion domain: the crate's `lib.rs` carries the argument.
fusion-rules = { workspace = true }
# **The PNG codec, in Rust and with no system library.** It decodes about twice
# as fast as `pngjs` and encodes a diff image about eighty times as fast,
# measured in the proposal on an 8.1 megapixel page, and it cross-compiles to
# every platform package with nothing to link.
png = "0.18"

[dev-dependencies]
# The contract tests write their own pictures rather than reading committed ones.
png = "0.18"

[lints]
workspace = true
