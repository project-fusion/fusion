# Fusion Locus in a GitHub workflow: `check` compares, `retake` writes the
# baselines and opens a pull request with them.
#
# **`check`** installs Chromium from the cache, runs `locus test`, writes the
# run's summary to the job's summary page, and on a failure uploads the report
# and every diff image. The upload asks for hidden files, because baselines
# kept in a dot directory such as `.examples` are dropped otherwise, and an
# upload that collected nothing says nothing.
#
# **`retake`** runs `locus update` and opens a pull request with what it
# wrote, on a branch named for the ref it ran on. Give it a token from a
# GitHub App or a person: a pull request opened with `GITHUB_TOKEN` gets no
# `pull_request` run, so a required check on it never starts.
#
# **Run a retake on request only, and never cancel one.** A baseline retaken on
# push agrees with whatever just landed, and a retake killed halfway leaves its
# branch holding part of a set. A composite action cannot set either, so the
# workflow does:
#
#     on: workflow_dispatch
#     concurrency:
#       cancel-in-progress: false
#       group: ${{ github.workflow }}-${{ github.ref }}
#
# **The commit message releases nothing by default.** `test(visual)` is a
# conventional commit type that release tooling reads as no release.
name: Fusion Locus
description: Visual regression testing with baselines kept in git. Compares on every run, and retakes the baselines into a pull request on request.

inputs:
  args:
    description: Arguments after `locus test` or `locus update`, such as `--config site/locus.config.ts` or `--shard 0 --of 4`.
    default: ''
  branch:
    description: The branch a retake pushes to. One per ref unless you set it.
    default: locus-baselines-${{ github.ref_name }}
  browser:
    description: Whether to install Chromium and its system packages from the cache first.
    default: 'true'
  commit-message:
    description: The retake's commit message and pull request title.
    default: 'test(visual): retake the baselines'
  mode:
    description: '`check` to compare, or `retake` to write the baselines and open a pull request.'
    required: true
  paths:
    description: What a retake commits, as git pathspecs, where `*` crosses directories. Every picture and every fingerprint at its default name unless you set it. Ignored files stay out.
    default: |
      *.png
      *locus.fingerprint.json
  playwright:
    description: The command that runs Playwright's command line, for installing the browser.
    default: npx --no-install playwright
  locus:
    description: The command that runs Locus.
    default: npx --no-install locus
  report:
    description: The config's `report` directory, relative to `working-directory`.
    default: .locus/report
  token:
    description: The token a retake opens its pull request with. A GitHub App's or a person's, so the pull request's checks run.
    default: ''
  working-directory:
    description: Where `locus` runs, beside its config.
    default: .

runs:
  using: composite
  steps:
    - name: Refuse an unknown mode
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        TOKEN: ${{ inputs.token }}
      run: |
        case "$MODE" in
          check) ;;
          retake)
            if [ -z "$TOKEN" ]; then
              echo "::error::A retake opens a pull request, and needs \`token\` to do it."
              exit 1
            fi
            ;;
          *)
            echo "::error::\`mode\` is \`check\` or \`retake\`, and was \`$MODE\`."
            exit 1
            ;;
        esac

    - name: Read the Playwright version and the runner image
      if: inputs.browser == 'true'
      id: version
      shell: bash
      env:
        PLAYWRIGHT: ${{ inputs.playwright }}
      run: |
        set -euo pipefail
        version=$($PLAYWRIGHT --version | awk '{ print $2 }')
        [ -n "$version" ] || { echo "::error::No Playwright version: install playwright first."; exit 1; }
        echo "version=$version" >> "$GITHUB_OUTPUT"
        # Every GitHub-hosted runner sets `ImageOS` and `ImageVersion`. Without
        # them nothing names the packages the machine already holds, and the
        # packages come from the mirror.
        if [ -n "${ImageOS:-}" ] && [ -n "${ImageVersion:-}" ]; then
          echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
        fi

    - name: Restore the browser
      if: inputs.browser == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: playwright-${{ runner.os }}-${{ steps.version.outputs.version }}
        path: ~/.cache/ms-playwright

    - name: Restore the system packages
      if: inputs.browser == 'true' && steps.version.outputs.image != ''
      id: packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: playwright-deps-${{ steps.version.outputs.image }}-${{ steps.version.outputs.version }}
        path: ~/.cache/playwright-deps

    - name: Install the system packages and Chromium
      if: inputs.browser == 'true'
      shell: bash
      env:
        HIT: ${{ steps.packages.outputs.cache-hit }}
        IMAGE: ${{ steps.version.outputs.image }}
        PLAYWRIGHT: ${{ inputs.playwright }}
      run: bash "$GITHUB_ACTION_PATH/browser/install.sh"

    - name: Compare every shot
      id: check
      if: inputs.mode == 'check'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ARGS: ${{ inputs.args }}
        LOCUS: ${{ inputs.locus }}
      run: $LOCUS test $ARGS

    - name: Retake the baselines
      if: inputs.mode == 'retake'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ARGS: ${{ inputs.args }}
        LOCUS: ${{ inputs.locus }}
      run: $LOCUS update $ARGS

    # The config is read again for where its report is, so this names it the
    # way the run did. A run that wrote no report has nothing to summarize.
    - name: Summarize the run
      if: always() && inputs.mode == 'check'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ARGS: ${{ inputs.args }}
        LOCUS: ${{ inputs.locus }}
        REPORT: ${{ inputs.report }}
      run: |
        if [ -f "$REPORT/run.json" ]; then
          config=$(printf '%s\n' $ARGS | grep -A1 -x -- '--config' | tail -1 || true)
          if [ -n "$config" ] && [ "$config" != "--config" ]; then
            $LOCUS report --markdown --config "$config" >> "$GITHUB_STEP_SUMMARY" || true
          else
            $LOCUS report --markdown >> "$GITHUB_STEP_SUMMARY" || true
          fi
        fi

    - name: Upload the report and the diff images
      if: failure() && inputs.mode == 'check'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        if-no-files-found: ignore
        include-hidden-files: true
        name: locus-report-${{ github.job }}-${{ strategy.job-index }}
        path: |
          ${{ inputs.working-directory }}/${{ inputs.report }}
          ${{ inputs.working-directory }}/**/*.diff.png
          !**/node_modules/**
        retention-days: 14

    - name: Open the pull request
      if: inputs.mode == 'retake'
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        add-paths: ${{ inputs.paths }}
        body: |
          Taken by Fusion Locus's `retake` on `${{ github.ref_name }}`.

          **Look at each changed picture before approving.** A baseline is what every later run is compared to, so approving a regression here makes it the expected result. A change to `locus.fingerprint.json` is a change to the environment the baselines are compared in.
        branch: ${{ inputs.branch }}
        commit-message: ${{ inputs.commit-message }}
        title: ${{ inputs.commit-message }}
        token: ${{ inputs.token }}
